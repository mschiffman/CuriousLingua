<script>const AUD_DIR="https://languages.rmlives.com/kor/expressions/likes_dislikes/";const AUD_EXT="mp3?v=2611241406";const categories=[{"en":"I like it","fr":"좋아해요","desc":"Liking, really liking, and showing you like an idea.","cards":[["Hanguk yeonghwareul joahaeyo.","I like Korean films.","한국 영화를 좋아해요.\n\nA thing + -reul or -eul joahaeyo: I like…","Eumageul joahaeyo.\n음악을 좋아해요.","I like music.",{"my":["ကိုရီးယားရုပ်ရှင် ကြိုက်တယ်။","한국 영화를 좋아해요.\n\nပစ္စည်း + -reul ဒါမှမဟုတ် -eul joahaeyo: …ကြိုက်တယ်။","သီချင်း ကြိုက်တယ်။"]}],["Bibimbabeul jeongmal joahaeyo.","I really like bibimbap.","비빔밥을 정말 좋아해요.\n\nJeongmal: really.","Jeoneun keopireul jeongmal joahaeyo.\n저는 커피를 정말 좋아해요.","I really like coffee.",{"my":["ဘီဘင်ဘပ် တကယ်ကြိုက်တယ်။","비빔밥을 정말 좋아해요.\n\nJeongmal: တကယ်။","ကော်ဖီ တကယ်ကြိုက်တယ်။"]}],["Joayo!","That's nice! / Good!","좋아요!\n\nFor an idea, a plan or a thing.","Jumare badae gayo. — Joayo!\n주말에 바다에 가요. — 좋아요!","I'm going to the sea at the weekend. — Nice!",{"my":["ကောင်းတယ်။","좋아요!\n\nအကြံတစ်ခု၊ အစီအစဉ်တစ်ခု၊ ပစ္စည်းတစ်ခုအတွက် သုံးတယ်။","ပိတ်ရက်မှာ ပင်လယ်သွားမယ်။ — ကောင်းတယ်။"]}],["Jaemiisseoyo.","It's fun. / It's interesting.","재미있어요.\n\nFor books, films, people and ideas.","I chaek jaemiisseoyo.\n이 책 재미있어요.","This book is interesting.",{"my":["ပျော်စရာကောင်းတယ်။ / စိတ်ဝင်စားစရာကောင်းတယ်။","재미있어요.\n\nစာအုပ်၊ ရုပ်ရှင်၊ လူ၊ အတွေးအခေါ်တွေအတွက် သုံးတယ်။","ဒီစာအုပ် စိတ်ဝင်စားစရာကောင်းတယ်။"]}]],"tr":{"my":"ကြိုက်တယ်"}},{"en":"I don't like it","fr":"안 좋아해요","desc":"Korean dislikes are usually softened.","cards":[["Maeun eumsigeun byeollo an joahaeyo.","I don't really like spicy food.","매운 음식은 별로 안 좋아해요.\n\nByeollo + a negative: not really. The polite way to dislike.","Saengseoneun byeollo an joahaeyo.\n생선은 별로 안 좋아해요.","I don't really like fish.",{"my":["အစပ် သိပ်မကြိုက်ဘူး။","매운 음식은 별로 안 좋아해요.\n\nByeollo + အငြင်း: သိပ်မ…ဘူး။ မကြိုက်ကြောင်း ယဉ်ယဉ်ကျေးကျေး ပြောတဲ့နည်းပါ။","ငါး သိပ်မကြိုက်ဘူး။"]}],["Jal mon meogeoyo.","I can't really eat it.","잘 못 먹어요.\n\nA soft way to turn food down.","Maeun geon jal mon meogeoyo.\n매운 건 잘 못 먹어요.","I can't really eat spicy things.",{"my":["သိပ်မစားနိုင်ဘူး။","잘 못 먹어요.\n\nအစားအစာကို နူးနူးညံ့ညံ့ ငြင်းတဲ့နည်းပါ။","အစပ် သိပ်မစားနိုင်ဘူး။"]}],["Beollereul sireohaeyo.","I hate insects.","벌레를 싫어해요.\n\nSireohaeyo is strong. Fine for insects or rain; too blunt for someone's cooking.","Bireul sireohaeyo.\n비를 싫어해요.","I hate rain.",{"my":["ပိုးကောင်တွေ မုန်းတယ်။","벌레를 싫어해요.\n\nSireohaeyo က ပြင်းတယ်။ ပိုးကောင်၊ မိုးရွာတာမျိုးအတွက် ရတယ်။ တစ်ယောက်ယောက် ချက်ထားတဲ့ ဟင်းအတွက်တော့ ရိုင်းလွန်းတယ်။","မိုးရွာတာ မုန်းတယ်။"]}],["Geujeo geuraeyo.","It's so-so.","그저 그래요.\n\nNeither good nor bad.","Geu yeonghwa eottaesseoyo? — Geujeo geuraesseoyo.\n그 영화 어땠어요? — 그저 그랬어요.","How was the film? — So-so.",{"my":["သာမန်ပါပဲ။","그저 그래요.\n\nကောင်းလည်းမကောင်း၊ ဆိုးလည်းမဆိုးပါ။","ရုပ်ရှင် ဘယ်လိုလဲ။ — သာမန်ပါပဲ။"]}]],"tr":{"my":"မကြိုက်ဘူး"}},{"en":"Asking and choosing","fr":"어느 쪽","desc":"Asking what people like, and saying which you prefer.","cards":[["Gimchi joahaeyo?","Do you like kimchi?","김치 좋아해요?\n\nA thing + joahaeyo?: do you like…?","Gimchi joahaeyo? — Ne, jeongmal joahaeyo.\n김치 좋아해요? — 네, 정말 좋아해요.","Do you like kimchi? — Yes, I really like it.",{"my":["ကင်မ်ချီ ကြိုက်လား။","김치 좋아해요?\n\nပစ္စည်း + joahaeyo?: …ကြိုက်လား။","ကင်မ်ချီ ကြိုက်လား။ — ဟုတ်ကဲ့၊ တကယ်ကြိုက်တယ်။"]}],["Eotteon eumageul joahaeyo?","What kind of music do you like?","어떤 음악을 좋아해요?\n\nEotteon: what kind of.","Eotteon eumsigeul joahaeyo?\n어떤 음식을 좋아해요?","What kind of food do you like?",{"my":["ဘယ်လို သီချင်းမျိုး ကြိုက်လဲ။","어떤 음악을 좋아해요?\n\nEotteon: ဘယ်လိုမျိုး။","ဘယ်လို အစားအစာမျိုး ကြိုက်လဲ။"]}],["Eoneu jjogi deo joayo?","Which do you prefer?","어느 쪽이 더 좋아요?\n\nOf two things: 'which side is better?'","Keopirang cha junge eoneu jjogi deo joayo?\n커피랑 차 중에 어느 쪽이 더 좋아요?","Which do you prefer, coffee or tea?",{"my":["ဘယ်ဟာ ပိုကြိုက်လဲ။","어느 쪽이 더 좋아요?\n\nနှစ်ခုထဲက တစ်ခုကို ရွေးခိုင်းတာပါ။ 'ဘယ်ဘက်က ပိုကောင်းလဲ' လို့ အဓိပ္ပာယ်ရတယ်။","ကော်ဖီနဲ့ လက်ဖက်ရည် ဘယ်ဟာ ပိုကြိုက်လဲ။"]}],["Chaga deo joayo.","I prefer tea.","차가 더 좋아요.\n\nDeo: more.","Jeoneun yeoreumboda gyeouri deo joayo.\n저는 여름보다 겨울이 더 좋아요.","I prefer winter to summer.",{"my":["လက်ဖက်ရည် ပိုကြိုက်တယ်။","차가 더 좋아요.\n\nDeo: ပို။","နွေရာသီထက် ဆောင်းရာသီကို ပိုကြိုက်တယ်။"]}]],"tr":{"my":"မေးခြင်းနှင့် ရွေးခြင်း"}}];const langs=["en","my"];const COURSE="kor";</script>
