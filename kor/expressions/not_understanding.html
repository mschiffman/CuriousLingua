<script>const AUD_DIR="https://languages.rmlives.com/kor/expressions/not_understanding/";const AUD_EXT="mp3?v=2611241405";const categories=[{"en":"I don't understand","fr":"모르겠어요","desc":"Saying so early saves everyone trouble.","cards":[["Jal moreugesseoyo.","I don't understand. / I'm not sure.","잘 모르겠어요.\n\nOne phrase for both meanings.","Joesonghamnida, jal moreugesseoyo.\n죄송합니다, 잘 모르겠어요.","I'm sorry, I don't understand.",{"my":["နားမလည်ဘူး။ / မသေချာဘူး။","잘 모르겠어요.\n\nအဓိပ္ပာယ်နှစ်မျိုးလုံးအတွက် စကားစုတစ်ခုတည်း သုံးတယ်။","တောင်းပန်ပါတယ်၊ နားမလည်ဘူး။"]}],["Hangugeoreul jal motaeyo.","I don't speak Korean well.","한국어를 잘 못해요.\n\nJal motaeyo: I can't do it well.","Joesonghamnida, hangugeoreul jal motaeyo.\n죄송합니다, 한국어를 잘 못해요.","I'm sorry, I don't speak Korean well.",{"my":["ကိုရီးယားစကား ကောင်းကောင်း မပြောတတ်ဘူး။","한국어를 잘 못해요.\n\nJal motaeyo: ကောင်းကောင်း မလုပ်တတ်ဘူး။","တောင်းပန်ပါတယ်၊ ကိုရီးယားစကား ကောင်းကောင်း မပြောတတ်ဘူး။"]}],["Hangugeoneun jogeumman haeyo.","I speak only a little Korean.","한국어는 조금만 해요.\n\nJogeum: a little. -man: only.","Hangugeo haseyo? — Jogeumman haeyo.\n한국어 하세요? — 조금만 해요.","Do you speak Korean? — Just a little.",{"my":["ကိုရီးယားစကား နည်းနည်းပဲ ပြောတတ်တယ်။","한국어는 조금만 해요.\n\nJogeum: နည်းနည်း။ -man: …ပဲ။","ကိုရီးယားစကား ပြောတတ်လား။ — နည်းနည်းပါ။"]}],["Algetseumnida.","I understand. / Got it.","알겠습니다.\n\nPolite. Softer: Algesseoyo.","Naeil ahop siyeyo. — Ne, algetseumnida.\n내일 아홉 시예요. — 네, 알겠습니다.","Tomorrow at nine. — Yes, understood.",{"my":["နားလည်ပါပြီ။","알겠습니다.\n\nယဉ်ကျေးတယ်။ ပိုနူးညံ့ချင်ရင်: Algesseoyo။","မနက်ဖြန် ကိုးနာရီနော်။ — ဟုတ်ကဲ့၊ နားလည်ပါပြီ။"]}]],"tr":{"my":"နားမလည်ဘူး"}},{"en":"Say it again","fr":"다시 한번","desc":"Asking people to repeat, slow down or write it.","cards":[["Dasi hanbeon malsseumhae juseyo.","Please say it once more.","다시 한번 말씀해 주세요.\n\nDasi hanbeon: one more time.","Joesonghamnida, dasi hanbeon malsseumhae juseyo.\n죄송합니다, 다시 한번 말씀해 주세요.","Sorry, please say it once more.",{"my":["နောက်တစ်ခါ ပြောပေးပါ။","다시 한번 말씀해 주세요.\n\nDasi hanbeon: နောက်တစ်ခါ။","တောင်းပန်ပါတယ်၊ နောက်တစ်ခါ ပြောပေးပါ။"]}],["Cheoncheonhi malsseumhae juseyo.","Please speak slowly.","천천히 말씀해 주세요.\n\nCheoncheonhi: slowly.","Jom deo cheoncheonhi malsseumhae juseyo.\n좀 더 천천히 말씀해 주세요.","Please speak a little more slowly.",{"my":["ဖြည်းဖြည်း ပြောပေးပါ။","천천히 말씀해 주세요.\n\nCheoncheonhi: ဖြည်းဖြည်း။","နည်းနည်း ပိုဖြည်းဖြည်း ပြောပေးပါ။"]}],["Sseo juseyo.","Please write it down.","써 주세요.\n\nUseful for names, prices and addresses.","Yeogie sseo juseyo.\n여기에 써 주세요.","Please write it here.",{"my":["ရေးပြပေးပါ။","써 주세요.\n\nနာမည်၊ ဈေးနှုန်း၊ လိပ်စာတွေအတွက် အသုံးဝင်တယ်။","ဒီမှာ ရေးပြပေးပါ။"]}],["Ne?","Sorry?","네?\n\nWith a rising voice: 'pardon?' It is the same word as 'yes'.","Ne? Mworagoyo?\n네? 뭐라고요?","Sorry? What did you say?",{"my":["ဗျာ။ / ရှင်။","네?\n\nအသံမြှင့်ပြီး ပြောရင် 'ဗျာ၊ ရှင်' လို့ အဓိပ္ပာယ်ရတယ်။ 'ဟုတ်ကဲ့' ဆိုတဲ့ စကားလုံးနဲ့ အတူတူပါပဲ။","ဗျာ။ ဘာပြောလိုက်တာလဲ။"]}]],"tr":{"my":"ထပ်ပြောပေးပါ"}},{"en":"Asking about words","fr":"단어","desc":"Finding the word you need, and falling back on English.","cards":[["Igeon hangugeoro mwoyeyo?","What is this in Korean?","이건 한국어로 뭐예요?\n\nHangugeoro: in Korean.","Igeon hangugeoro mwoyeyo? — 'Usan'ieyo.\n이건 한국어로 뭐예요? — '우산'이에요.","What is this in Korean? — It's 'usan' (umbrella).",{"my":["ဒါကို ကိုရီးယားလို ဘယ်လိုခေါ်လဲ။","이건 한국어로 뭐예요?\n\nHangugeoro: ကိုရီးယားလို။","ဒါကို ကိုရီးယားလို ဘယ်လိုခေါ်လဲ။ — 'usan' (ထီး) လို့ ခေါ်တယ်။"]}],["Museun tteusieyo?","What does it mean?","무슨 뜻이에요?\n\nTteut: meaning.","'Gwaenchanayo'ga museun tteusieyo?\n'괜찮아요'가 무슨 뜻이에요?","What does 'gwaenchanayo' mean?",{"my":["ဘာအဓိပ္ပာယ်လဲ။","무슨 뜻이에요?\n\nTteut: အဓိပ္ပာယ်။","'gwaenchanayo' ဆိုတာ ဘာအဓိပ္ပာယ်လဲ။"]}],["Yeongeo hal su isseoyo?","Can you speak English?","영어 할 수 있어요?\n\nHal su isseoyo: can do.","Jeogiyo, yeongeo hal su isseoyo? — Jogeum haeyo.\n저기요, 영어 할 수 있어요? — 조금 해요.","Excuse me, can you speak English? — A little.",{"my":["အင်္ဂလိပ်စကား ပြောနိုင်လား။","영어 할 수 있어요?\n\nHal su isseoyo: လုပ်နိုင်တယ်။","တဆိတ်လောက်၊ အင်္ဂလိပ်စကား ပြောနိုင်လား။ — နည်းနည်းပါ။"]}],["Yeongeoro haedo dwaeyo?","Is English all right?","영어로 해도 돼요?\n\nYeongeoro: in English.","Joesonghamnida, yeongeoro haedo dwaeyo?\n죄송합니다, 영어로 해도 돼요?","Sorry, is English all right?",{"my":["အင်္ဂလိပ်လို ပြောလို့ရမလား။","영어로 해도 돼요?\n\nYeongeoro: အင်္ဂလိပ်လို။","တောင်းပန်ပါတယ်၊ အင်္ဂလိပ်လို ပြောလို့ရမလား။"]}]],"tr":{"my":"စကားလုံးအကြောင်း မေးခြင်း"}}];const langs=["en","my"];const COURSE="kor";</script>
