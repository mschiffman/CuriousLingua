<script>const AUD_DIR="https://languages.rmlives.com/kor/expressions/thank/";const AUD_EXT="mp3?v=2611241401";const categories=[{"en":"Saying thank you","fr":"감사합니다","desc":"Two polite standards and a friendlier form.","cards":[["Gamsahamnida.","Thank you.","감사합니다.\n\nThe safe, polite thank you, for anyone.","Dowajusyeoseo gamsahamnida.\n도와주셔서 감사합니다.","Thank you for helping me.",{"my":["ကျေးဇူးတင်ပါတယ်။","감사합니다.\n\nဘယ်သူ့ကိုမဆို သုံးလို့ရတဲ့ စိတ်ချရပြီး ယဉ်ကျေးတဲ့ ကျေးဇူးတင်စကားပါ။","ကူညီပေးတဲ့အတွက် ကျေးဇူးတင်ပါတယ်။"]}],["Gomapseumnida.","Thank you.","고맙습니다.\n\nJust as polite. A native Korean word, and a little warmer.","Seonmul gomapseumnida.\n선물 고맙습니다.","Thank you for the present.",{"my":["ကျေးဇူးတင်ပါတယ်။","고맙습니다.\n\nယဉ်ကျေးမှု အတူတူပါပဲ။ ကိုရီးယားဘာသာစကား အစစ်ဖြစ်ပြီး နည်းနည်း ပိုနွေးထွေးတယ်။","လက်ဆောင်အတွက် ကျေးဇူးတင်ပါတယ်။"]}],["Gomawoyo.","Thanks.","고마워요.\n\nPolite but friendly. To close friends: Gomawo.","Jeongmal gomawoyo.\n정말 고마워요.","Thank you so much.",{"my":["ကျေးဇူးပဲ။","고마워요.\n\nယဉ်ကျေးပေမဲ့ ဖော်ရွေတယ်။ ရင်းနှီးတဲ့ သူငယ်ချင်းတွေကိုတော့ Gomawo လို့ ပြောတယ်။","ကျေးဇူးအများကြီး တင်ပါတယ်။"]}],["Jeongmal gamsahamnida.","Thank you very much.","정말 감사합니다.\n\nJeongmal: really.","Oneul jeongmal gamsahaetseumnida.\n오늘 정말 감사했습니다.","Thank you very much for today.",{"my":["ကျေးဇူးအများကြီး တင်ပါတယ်။","정말 감사합니다.\n\nJeongmal: တကယ်။","ဒီနေ့အတွက် ကျေးဇူးအများကြီး တင်ပါတယ်။"]}]],"tr":{"my":"ကျေးဇူးတင်ခြင်း"}},{"en":"Answering thanks","fr":"아니에요","desc":"Korean answers to thanks are modest: mostly a way of saying no.","cards":[["Cheonmaneyo.","You're welcome.","천만에요.\n\nThe textbook answer. Rare in daily speech, where people say Anieyo.","Gomapseumnida. — Cheonmaneyo.\n고맙습니다. — 천만에요.","Thank you. — You're welcome.",{"my":["ရပါတယ်။","천만에요.\n\nစာအုပ်ထဲက အဖြေပါ။ နေ့စဉ်စကားပြောမှာ သုံးခဲတယ်၊ Anieyo လို့ပဲ ပြောကြတယ်။","ကျေးဇူးတင်ပါတယ်။ — ရပါတယ်။"]}],["Byeolmalsseumeullyo.","Don't mention it.","별말씀을요.\n\nPolite and modest: 'what a thing to say'.","Jeongmal gamsahamnida. — Byeolmalsseumeullyo.\n정말 감사합니다. — 별말씀을요.","Thank you very much. — Don't mention it.",{"my":["ပြောစရာ မလိုပါဘူး။","별말씀을요.\n\nယဉ်ကျေးပြီး နှိမ့်ချတဲ့ စကားပါ။ 'ဒီလို ပြောစရာ မလိုပါဘူး' လို့ အဓိပ္ပာယ်ရတယ်။","ကျေးဇူးအများကြီး တင်ပါတယ်။ — ပြောစရာ မလိုပါဘူး။"]}],["Mwollyo.","It's nothing.","뭘요.\n\nShort and friendly: 'what for?'","Dowajwoseo gomawoyo. — Mwollyo.\n도와줘서 고마워요. — 뭘요.","Thanks for helping. — It's nothing.",{"my":["ဘာမှ မဟုတ်ပါဘူး။","뭘요.\n\nတိုတိုနဲ့ ဖော်ရွေတယ်။ 'ဘာအတွက်လဲ' လို့ အဓိပ္ပာယ်ရတယ်။","ကူညီပေးတာ ကျေးဇူးပဲ။ — ဘာမှ မဟုတ်ပါဘူး။"]}],["Jeoyamallo gamsahamnida.","I'm the one who should thank you.","저야말로 감사합니다.\n\nJeoyamallo: 'I, rather than you'. It hands the thanks back.","Oneul gamsahaetseumnida. — Jeoyamallo gamsahamnida.\n오늘 감사했습니다. — 저야말로 감사합니다.","Thank you for today. — Thank you.",{"my":["ကျွန်တော်/ကျွန်မကသာ ကျေးဇူးတင်ရမှာပါ။","저야말로 감사합니다.\n\nJeoyamallo: 'ခင်ဗျား/ရှင် မဟုတ်ဘဲ ကျွန်တော်/ကျွန်မကသာ'။ ကျေးဇူးတင်စကားကို ပြန်ပေးတာပါ။","ဒီနေ့အတွက် ကျေးဇူးတင်ပါတယ်။ — ကျွန်တော်ကသာ ကျေးဇူးတင်ရမှာပါ။"]}]],"tr":{"my":"ကျေးဇူးတင်စကားကို ပြန်ဖြေခြင်း"}},{"en":"Thanks in daily life","fr":"일상","desc":"Set phrases that carry thanks: for food, for work, for help.","cards":[["Jal meokgetseumnida.","(said before eating)","잘 먹겠습니다.\n\n'I will eat well.' Thanks to whoever cooked or is paying.","Masitgetda! Jal meokgetseumnida.\n맛있겠다! 잘 먹겠습니다.","That looks delicious! Thank you for the meal.",{"my":["(မစားခင် ပြောတဲ့စကား)","잘 먹겠습니다.\n\n'ကောင်းကောင်း စားပါမယ်' လို့ အဓိပ္ပာယ်ရတယ်။ ချက်ပေးတဲ့သူ၊ ဒကာခံတဲ့သူကို ကျေးဇူးတင်တာပါ။","စားချင်စရာလေး။ ကျွေးတာ ကျေးဇူးတင်ပါတယ်။"]}],["Jal meogeotseumnida.","Thank you for the meal.","잘 먹었습니다.\n\nAfter eating: 'I ate well.'","Jal meogeotseumnida. Jeongmal masisseosseoyo.\n잘 먹었습니다. 정말 맛있었어요.","Thank you for the meal. It was really delicious.",{"my":["ကျွေးတာ ကျေးဇူးတင်ပါတယ်။","잘 먹었습니다.\n\nစားပြီးတဲ့အခါ: 'ကောင်းကောင်း စားခဲ့ပါတယ်'။","ကျွေးတာ ကျေးဇူးတင်ပါတယ်။ တကယ် အရသာရှိတယ်။"]}],["Sugohaseyo.","Keep up the good work.","수고하세요.\n\nSaid as you leave a shop or a taxi: thanks to someone who is still working.","Gamsahamnida. Sugohaseyo.\n감사합니다. 수고하세요.","Thank you. Goodbye.",{"my":["အလုပ်ကြိုးစားပါနော်။","수고하세요.\n\nဆိုင်က ထွက်တဲ့အခါ၊ တက္ကစီပေါ်က ဆင်းတဲ့အခါ ပြောတယ်။ အလုပ်ဆက်လုပ်နေရတဲ့သူကို ကျေးဇူးတင်တာပါ။","ကျေးဇူးတင်ပါတယ်။ သွားပါဦးမယ်။"]}],["Deokbune jal dwaesseoyo.","Thanks to you, it went well.","덕분에 잘 됐어요.\n\nDeokbune: thanks to you.","Siheom eottaesseoyo? — Deokbune jal dwaesseoyo.\n시험 어땠어요? — 덕분에 잘 됐어요.","How was the exam? — Thanks to you, it went well.",{"my":["ခင်ဗျား/ရှင့်ကျေးဇူးကြောင့် အဆင်ပြေသွားတယ်။","덕분에 잘 됐어요.\n\nDeokbune: …ကျေးဇူးကြောင့်။","စာမေးပွဲ ဘယ်လိုလဲ။ — ခင်ဗျားကျေးဇူးကြောင့် အဆင်ပြေသွားတယ်။"]}]],"tr":{"my":"နေ့စဉ်ဘဝထဲက ကျေးဇူးတင်စကား"}}];const langs=["en","my"];const COURSE="kor";</script>
