<script>const AUD_DIR="https://languages.rmlives.com/kor/expressions/directions/";const AUD_EXT="mp3?v=2611241406";const categories=[{"en":"Where is it?","fr":"어디예요?","desc":"Finding a place, and finding out where you are.","cards":[["Hwajangsiri eodiyeyo?","Where is the toilet?","화장실이 어디예요?\n\nA place + -i or -ga eodiyeyo?: where is…?","Jeogiyo, jihacheollyeogi eodiyeyo?\n저기요, 지하철역이 어디예요?","Excuse me, where is the subway station?"],["I geuncheoe pyeonuijeom isseoyo?","Is there a convenience store near here?","이 근처에 편의점 있어요?\n\nI geuncheoe: near here.","I geuncheoe eunhaeng isseoyo?\n이 근처에 은행 있어요?","Is there a bank near here?"],["Yeogiga eodiyeyo?","Where am I?","여기가 어디예요?\n\n'Where is here?' Show your map as you ask.","Jeogiyo, yeogiga eodiyeyo? Gireul ireosseoyo.\n저기요, 여기가 어디예요? 길을 잃었어요.","Excuse me, where am I? I'm lost."],["Meoreoyo?","Is it far?","멀어요?\n\nNear: gakkawoyo.","Yeogiseo meoreoyo? — Anieyo, georeoseo o bunieyo.\n여기서 멀어요? — 아니에요, 걸어서 오 분이에요.","Is it far from here? — No, five minutes on foot."]]},{"en":"Understanding the answer","fr":"오른쪽·왼쪽","desc":"The four things you are most likely to be told.","cards":[["Jjuk gaseyo.","Go straight ahead.","쭉 가세요.\n\nAlso: Ttokbaro gaseyo.","I gillo jjuk gaseyo.\n이 길로 쭉 가세요.","Go straight along this street."],["Oreunjjogeuro gaseyo.","Go right.","오른쪽으로 가세요.\n\nLeft: oenjjok.","Daeum sageorieseo oenjjogeuro gaseyo.\n다음 사거리에서 왼쪽으로 가세요.","Go left at the next crossroads."],["Hoengdanbodoreul geonneoseyo.","Cross at the crossing.","횡단보도를 건너세요.\n\nHoengdanbodo: pedestrian crossing.","Jeo hoengdanbodoreul geonneoseyo.\n저 횡단보도를 건너세요.","Cross at that crossing."],["Baro jeogiyeyo.","It's right there.","바로 저기예요.\n\nBaro: right, just.","Ucheguk baro jeogiyeyo. Eunhaeng yeopieyo.\n우체국 바로 저기예요. 은행 옆이에요.","The post office is right there. It's next to the bank."]]},{"en":"Subway and taxis","fr":"지하철·택시","desc":"The right train, a ticket, and a taxi.","cards":[["I jihacheol Gangnam gayo?","Does this train go to Gangnam?","이 지하철 강남 가요?\n\nAsk before you get on.","I beoseu gonghang gayo?\n이 버스 공항 가요?","Does this bus go to the airport?"],["Pyo eodiseo sayo?","Where do I buy a ticket?","표 어디서 사요?\n\nPyo: ticket.","Jeogiyo, pyo eodiseo sayo? — Jeogiyeyo.\n저기요, 표 어디서 사요? — 저기예요.","Excuse me, where do I buy a ticket? — Over there."],["Daeum yeogi eodiyeyo?","What is the next station?","다음 역이 어디예요?\n\nDaeum: next. Yeok: station.","Daeum yeogi eodiyeyo? — Sicheongieyo.\n다음 역이 어디예요? — 시청이에요.","What is the next station? — City Hall."],["Yeogiro ga juseyo.","To this place, please.","여기로 가 주세요.\n\nIn a taxi: show the address on your phone.","I jusoro ga juseyo.\n이 주소로 가 주세요.","To this address, please."]]}];</script>
