<script>const AUD_DIR="https://languages.rmlives.com/kor/expressions/ask/";const AUD_EXT="mp3?v=2611241402";const categories=[{"en":"Please","fr":"주세요","desc":"Asking for a thing, and asking someone to do something.","cards":[["Igeo juseyo.","This one, please.","이거 주세요.\n\nA thing + juseyo: please give me…","Mul juseyo.\n물 주세요.","Water, please.",{"my":["ဒါ ပေးပါ။","이거 주세요.\n\nပစ္စည်း + juseyo: …ပေးပါ။","ရေ ပေးပါ။"]}],["Butakamnida.","Please.","부탁합니다.\n\n'I ask this of you.' After a request. More formal: Butakdeurimnida.","Keopi han jan butakamnida.\n커피 한 잔 부탁합니다.","A cup of coffee, please.",{"my":["ကျေးဇူးပြုပြီး။","부탁합니다.\n\n'တောင်းဆိုပါတယ်' လို့ အဓိပ္ပာယ်ရတယ်။ တစ်ခုခု တောင်းပြီးတဲ့နောက် ပြောတယ်။ ပိုတရားဝင်ချင်ရင်: Butakdeurimnida။","ကော်ဖီတစ်ခွက် ပေးပါ။"]}],["Jamkkanman gidaryeo juseyo.","Please wait a moment.","잠깐만 기다려 주세요.\n\nA verb + -a or -eo juseyo: please do…","Joesonghamnida, jamkkanman gidaryeo juseyo.\n죄송합니다, 잠깐만 기다려 주세요.","Sorry, please wait a moment.",{"my":["ခဏစောင့်ပါ။","잠깐만 기다려 주세요.\n\nကြိယာ + -a ဒါမှမဟုတ် -eo juseyo: …လုပ်ပေးပါ။","တောင်းပန်ပါတယ်၊ ခဏစောင့်ပါ။"]}],["Boyeo juseyo.","Please show me.","보여 주세요.\n\nJom, 'a little', makes any request softer.","Jeogeo jom boyeo juseyo.\n저거 좀 보여 주세요.","Please show me that one.",{"my":["ပြပေးပါ။","보여 주세요.\n\nJom ('နည်းနည်း') ထည့်ရင် ဘယ်တောင်းဆိုမှုမဆို ပိုနူးညံ့သွားတယ်။","အဲဒါ ပြပေးပါ။"]}]],"tr":{"my":"ကျေးဇူးပြု၍"}},{"en":"Asking for help","fr":"도와주세요","desc":"Stopping someone politely, then saying what you need.","cards":[["Jeogiyo, jamkkanmanyo.","Excuse me, just a moment.","저기요, 잠깐만요.\n\nThe polite way to stop someone before you ask.","Jeogiyo, jamkkanmanyo. — Ne, malsseumhaseyo.\n저기요, 잠깐만요. — 네, 말씀하세요.","Excuse me, just a moment. — Yes, go ahead.",{"my":["တဆိတ်လောက်၊ ခဏလေးပါ။","저기요, 잠깐만요.\n\nတစ်ခုခု မမေးခင် တစ်ယောက်ယောက်ကို ယဉ်ယဉ်ကျေးကျေး ရပ်ခိုင်းတဲ့ စကားပါ။","တဆိတ်လောက်၊ ခဏလေးပါ။ — ဟုတ်ကဲ့၊ ပြောပါ။"]}],["Dowajuseyo.","Please help me.","도와주세요.\n\nFor help with a task, and in an emergency too.","Jeogiyo, jom dowajuseyo.\n저기요, 좀 도와주세요.","Excuse me, please help me.",{"my":["ကူညီပေးပါ။","도와주세요.\n\nအလုပ်တစ်ခုမှာ အကူအညီတောင်းတဲ့အခါရော၊ အရေးပေါ်အခြေအနေမှာပါ သုံးတယ်။","တဆိတ်လောက်၊ ကူညီပေးပါ။"]}],["Gareuchyeo juseyo.","Please tell me.","가르쳐 주세요.\n\nGareuchida: to tell, to teach. For information of any kind.","Jeonhwabeonho jom gareuchyeo juseyo.\n전화번호 좀 가르쳐 주세요.","Please tell me your phone number.",{"my":["ပြောပြပေးပါ။","가르쳐 주세요.\n\nGareuchida: ပြောပြတယ်၊ သင်ပေးတယ်။ ဘယ်လို အချက်အလက်မျိုးအတွက်မဆို သုံးလို့ရတယ်။","ဖုန်းနံပါတ် ပြောပြပေးပါ။"]}],["Sajin jom jjigeo juseyo.","Please take a photo for me.","사진 좀 찍어 주세요.\n\nFor asking a passer-by to photograph you.","Jeogiyo, sajin jom jjigeo juseyo. — Ne, joayo.\n저기요, 사진 좀 찍어 주세요. — 네, 좋아요.","Excuse me, could you take a photo? — Sure.",{"my":["ဓာတ်ပုံ ရိုက်ပေးပါ။","사진 좀 찍어 주세요.\n\nလမ်းသွားလမ်းလာ တစ်ယောက်ကို ကိုယ့်ဓာတ်ပုံ ရိုက်ပေးဖို့ တောင်းတဲ့အခါ သုံးတယ်။","တဆိတ်လောက်၊ ဓာတ်ပုံ ရိုက်ပေးနိုင်မလား။ — ရပါတယ်။"]}]],"tr":{"my":"အကူအညီတောင်းခြင်း"}},{"en":"May I?","fr":"-아도/어도 돼요?","desc":"Asking permission, and the two answers you will hear.","cards":[["Gwaenchanayo?","Is it all right?","괜찮아요?\n\nPoint at a seat, or hold up your camera, and ask.","Yeogi gwaenchanayo? — Ne, anjeuseyo.\n여기 괜찮아요? — 네, 앉으세요.","Is this seat free? — Yes, have a seat.",{"my":["အဆင်ပြေလား။","괜찮아요?\n\nခုံကို လက်ညှိုးထိုးပြပြီး၊ ဒါမှမဟုတ် ကင်မရာကို မြှောက်ပြပြီး မေးပါ။","ဒီခုံ လွတ်လား။ — ဟုတ်ကဲ့၊ ထိုင်ပါ။"]}],["Sajin jjigeodo dwaeyo?","May I take a photo?","사진 찍어도 돼요?\n\nA verb + -ado or -eodo dwaeyo?: may I…?","Yeogiseo sajin jjigeodo dwaeyo?\n여기서 사진 찍어도 돼요?","May I take a photo here?",{"my":["ဓာတ်ပုံ ရိုက်လို့ရမလား။","사진 찍어도 돼요?\n\nကြိယာ + -ado ဒါမှမဟုတ် -eodo dwaeyo?: …လို့ရမလား။","ဒီမှာ ဓာတ်ပုံ ရိုက်လို့ရမလား။"]}],["Ne, geureoseyo.","Yes, go ahead.","네, 그러세요.\n\n'Yes, do so.'","Anjado dwaeyo? — Ne, geureoseyo.\n앉아도 돼요? — 네, 그러세요.","May I sit down? — Yes, go ahead.",{"my":["ဟုတ်ကဲ့၊ ရပါတယ်။","네, 그러세요.\n\n'ဟုတ်ကဲ့၊ အဲဒီလို လုပ်ပါ' လို့ အဓိပ္ပာယ်ရတယ်။","ထိုင်လို့ရမလား။ — ဟုတ်ကဲ့၊ ထိုင်ပါ။"]}],["Joesonghajiman an dwaeyo.","I'm sorry, but you can't.","죄송하지만 안 돼요.\n\nAn dwaeyo: it's not allowed.","Yeogiseo meogeodo dwaeyo? — Joesonghajiman an dwaeyo.\n여기서 먹어도 돼요? — 죄송하지만 안 돼요.","May I eat here? — I'm sorry, but you can't.",{"my":["တောင်းပန်ပါတယ်၊ မရပါဘူး။","죄송하지만 안 돼요.\n\nAn dwaeyo: ခွင့်မပြုဘူး၊ မရဘူး။","ဒီမှာ စားလို့ရမလား။ — တောင်းပန်ပါတယ်၊ မရပါဘူး။"]}]],"tr":{"my":"ခွင့်တောင်းခြင်း"}}];const langs=["en","my"];const COURSE="kor";</script>
