<script>const AUD_DIR="https://languages.rmlives.com/kor/expressions/greetings/";const AUD_EXT="mp3?v=2611190616";const categories=[{"en":"Saying hello","fr":"안녕하세요","desc":"Hello at any time of day, meeting someone new, and catching up.","cards":[["Annyeonghaseyo.","Hello.","안녕하세요.\nမင်္ဂလာပါ။\n\nMorning, afternoon or evening. To friends: Annyeong."],["Mannaseo bangapseumnida.","Nice to meet you.","만나서 반갑습니다.\nတွေ့ရတာ ဝမ်းသာပါတယ်။\n\nOnly the first time you meet someone."],["Jal butakdeurimnida.","Pleased to meet you. / I'm in your care.","잘 부탁드립니다.\nခင်ခင်မင်မင် ဆက်ဆံပေးပါ။"],["Oraenmanieyo.","Long time no see.","오랜만이에요.\nမတွေ့တာ ကြာပြီနော်။"],["Jal jinaeyo?","How are you?","잘 지내요?\nနေကောင်းလား။"]]},{"en":"Thanks and sorry","fr":"감사합니다, 죄송합니다","desc":"Thank you, you're welcome, sorry, and how to call a waiter.","cards":[["Gamsahamnida.","Thank you.","감사합니다.\nကျေးဇူးတင်ပါတယ်။\n\nA little softer and friendlier: Gomawoyo."],["Anieyo.","You're welcome. / It's nothing.","아니에요.\nရပါတယ်။\n\nLiterally 'no': the usual modest answer to thanks."],["Joesonghamnida.","I'm sorry.","죄송합니다.\nတောင်းပန်ပါတယ်။"],["Jeogiyo.","Excuse me.","저기요.\nတဆိတ်လောက်။\n\nTo call a waiter, or to stop someone in the street."]]},{"en":"Saying goodbye","fr":"안녕히 가세요","desc":"Who leaves and who stays, the end of the workday, and good night.","cards":[["Annyeonghi gaseyo.","Goodbye. (to someone who is leaving)","안녕히 가세요.\nကောင်းကောင်းသွားပါ။\n\nSaid by the person who stays: 'go in peace'."],["Annyeonghi gyeseyo.","Goodbye. (when you are the one leaving)","안녕히 계세요.\nကောင်းကောင်းနေခဲ့ပါ။\n\nSaid by the person who leaves: 'stay in peace'."],["Tto bwayo.","See you again.","또 봐요.\nနောက်မှ တွေ့မယ်။"],["Sugohasyeosseumnida.","Thanks for your hard work.","수고하셨습니다.\nပင်ပန်းသွားပြီနော်။\n\nSaid to colleagues at the end of the day."],["Annyeonghi jumuseyo.","Good night.","안녕히 주무세요.\nကောင်းကောင်းအိပ်ပါ။\n\nPolite. To friends: Jal ja."]]}];</script>
