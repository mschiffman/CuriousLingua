<script>const AUD_DIR="https://languages.rmlives.com/kor/expressions/greetings/";const AUD_EXT="mp3?v=2611190616";const categories=[{"en":"Saying hello","fr":"안녕하세요","desc":"Hello at any time of day, meeting someone new, and catching up.","cards":[["Annyeonghaseyo.","Hello.","안녕하세요.\n\nMorning, afternoon or evening. To friends: Annyeong.",{"my":["မင်္ဂလာပါ။","안녕하세요.\n\nမနက်၊ နေ့လယ်၊ ညနေ ဘယ်အချိန်မဆို သုံးလို့ရတယ်။ သူငယ်ချင်းတွေကိုတော့ Annyeong လို့ပဲ ပြောတယ်။"]}],["Mannaseo bangapseumnida.","Nice to meet you.","만나서 반갑습니다.\n\nOnly the first time you meet someone.",{"my":["တွေ့ရတာ ဝမ်းသာပါတယ်။","만나서 반갑습니다.\n\nတစ်ယောက်ယောက်နဲ့ ပထမဆုံးအကြိမ် တွေ့တဲ့အခါမှာပဲ သုံးတယ်။"]}],["Jal butakdeurimnida.","Pleased to meet you. / I'm in your care.","잘 부탁드립니다.",{"my":["ခင်ခင်မင်မင် ဆက်ဆံပေးပါ။","잘 부탁드립니다."]}],["Oraenmanieyo.","Long time no see.","오랜만이에요.",{"my":["မတွေ့တာ ကြာပြီနော်။","오랜만이에요."]}],["Jal jinaeyo?","How are you?","잘 지내요?",{"my":["နေကောင်းလား။","잘 지내요?"]}]],"tr":{"my":"တွေ့တွေ့ချင်း နှုတ်ဆက်ခြင်း"}},{"en":"Thanks and sorry","fr":"감사합니다, 죄송합니다","desc":"Thank you, you're welcome, sorry, and how to call a waiter.","cards":[["Gamsahamnida.","Thank you.","감사합니다.\n\nA little softer and friendlier: Gomawoyo.",{"my":["ကျေးဇူးတင်ပါတယ်။","감사합니다.\n\nနည်းနည်း ပိုနူးညံ့ပြီး ဖော်ရွေတဲ့ စကားက Gomawoyo ပါ။"]}],["Anieyo.","You're welcome. / It's nothing.","아니에요.\n\nLiterally 'no': the usual modest answer to thanks.",{"my":["ရပါတယ်။","아니에요.\n\nစာလုံးအတိုင်းဆိုရင် 'မဟုတ်ပါဘူး' လို့ အဓိပ္ပာယ်ရတယ်။ ကျေးဇူးတင်စကားကို နှိမ့်နှိမ့်ချချ ပြန်ဖြေလေ့ရှိတဲ့ စကားပါ။"]}],["Joesonghamnida.","I'm sorry.","죄송합니다.",{"my":["တောင်းပန်ပါတယ်။","죄송합니다."]}],["Jeogiyo.","Excuse me.","저기요.\n\nTo call a waiter, or to stop someone in the street.",{"my":["တဆိတ်လောက်။","저기요.\n\nစားပွဲထိုးကို ခေါ်တဲ့အခါ၊ လမ်းမှာ တစ်ယောက်ယောက်ကို လှမ်းခေါ်တဲ့အခါ သုံးတယ်။"]}]],"tr":{"my":"ကျေးဇူးတင်ခြင်းနှင့် တောင်းပန်ခြင်း"}},{"en":"Saying goodbye","fr":"안녕히 가세요","desc":"Who leaves and who stays, the end of the workday, and good night.","cards":[["Annyeonghi gaseyo.","Goodbye. (to someone who is leaving)","안녕히 가세요.\n\nSaid by the person who stays: 'go in peace'.",{"my":["ကောင်းကောင်းသွားပါ။","안녕히 가세요.\n\nကျန်ခဲ့တဲ့သူက ပြောတဲ့ စကားပါ။ 'ကောင်းကောင်းသွားပါ' လို့ အဓိပ္ပာယ်ရတယ်။"]}],["Annyeonghi gyeseyo.","Goodbye. (when you are the one leaving)","안녕히 계세요.\n\nSaid by the person who leaves: 'stay in peace'.",{"my":["ကောင်းကောင်းနေခဲ့ပါ။","안녕히 계세요.\n\nထွက်သွားတဲ့သူက ပြောတဲ့ စကားပါ။ 'ကောင်းကောင်းနေခဲ့ပါ' လို့ အဓိပ္ပာယ်ရတယ်။"]}],["Tto bwayo.","See you again.","또 봐요.",{"my":["နောက်မှ တွေ့မယ်။","또 봐요."]}],["Sugohasyeosseumnida.","Thanks for your hard work.","수고하셨습니다.\n\nSaid to colleagues at the end of the day.",{"my":["ပင်ပန်းသွားပြီနော်။","수고하셨습니다.\n\nအလုပ်ချိန်ပြီးတဲ့အခါ လုပ်ဖော်ကိုင်ဖက်တွေကို ပြောတယ်။"]}],["Annyeonghi jumuseyo.","Good night.","안녕히 주무세요.\n\nPolite. To friends: Jal ja.",{"my":["ကောင်းကောင်းအိပ်ပါ။","안녕히 주무세요.\n\nယဉ်ကျေးတဲ့ စကားပါ။ သူငယ်ချင်းတွေကိုတော့ Jal ja လို့ ပြောတယ်။"]}]],"tr":{"my":"ပြန်ခါနီး နှုတ်ဆက်ခြင်း"}}];const langs=["en","my"];const COURSE="kor";</script>
