<script>const AUD_DIR="https://languages.rmlives.com/spa/expressions/not_understanding/";const AUD_EXT="mp3?v=2611261029";const categories=[{"en":"I don't understand","fr":"No entiendo","desc":"Saying that you are lost, and that you are still learning.","cards":[["No entiendo.","I don't understand.","Entender: to understand.","Perdón, no entiendo.","Sorry, I don't understand."],["No entendí.","I didn't catch that.","The past: for what was just said.","Perdón, no entendí. ¿Puede repetir?","Sorry, I didn't catch that. Can you repeat it?"],["No hablo mucho español.","I don't speak much Spanish.","Hablar: to speak.","Perdón, no hablo mucho español.","Sorry, I don't speak much Spanish."],["Estoy aprendiendo español.","I'm learning Spanish.","People slow down and smile when they hear this.","Hablo un poco. Estoy aprendiendo español.","I speak a little. I'm learning Spanish."]]},{"en":"Say it again","fr":"¿Cómo?","desc":"Asking someone to repeat, or to slow down.","cards":[["¿Mande?","Pardon?","The polite Mexican 'what?'. ¿Qué? on its own sounds blunt.","— ¿Me pasas el…? — ¿Mande?","— Can you pass me the…? — Pardon?"],["¿Cómo?","Sorry?","Neutral, and understood everywhere Spanish is spoken.","¿Cómo? No te oí.","Sorry? I didn't hear you."],["¿Puede repetir, por favor?","Can you repeat that, please?","With tú: ¿puedes repetir?","No entendí el precio. ¿Puede repetir, por favor?","I didn't catch the price. Can you repeat it, please?"],["Más despacio, por favor.","More slowly, please.","Despacio: slowly.","¿Puede hablar más despacio, por favor?","Can you speak more slowly, please?"]]},{"en":"Asking about words","fr":"Palabras","desc":"Questions about a word, and the moment it makes sense.","cards":[["¿Qué significa «ahorita»?","What does 'ahorita' mean?","¿Qué significa…?: what does … mean?","Perdón, ¿qué significa «ahorita»?","Sorry, what does 'ahorita' mean?"],["¿Cómo se dice «receipt» en español?","How do you say 'receipt' in Spanish?","¿Cómo se dice…?: how do you say…?","¿Cómo se dice «receipt» en español? — Recibo.","How do you say 'receipt' in Spanish? — Recibo."],["¿Cómo se escribe?","How do you spell it?","Literally 'how is it written?'.","¿Cómo se escribe tu apellido?","How do you spell your last name?"],["Ya entendí.","Now I get it.","Ya: now, at last.","¡Ah, ya entendí! Gracias.","Oh, now I get it! Thanks."]]}];</script>
