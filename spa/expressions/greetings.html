<script>const AUD_DIR="https://languages.rmlives.com/spa/expressions/greetings/";const AUD_EXT="mp3?v=2611261029";const categories=[{"en":"Saying hello","fr":"Saludar","desc":"Hello at any hour, and the three greetings that follow the clock.","cards":[["¡Hola!","Hi! / Hello!","For everyone, at any time of day. With a stranger, add buenos días to be polite.","¡Hola, Ana! ¿Cómo estás?","Hi, Ana! How are you?"],["Buenos días.","Good morning.","Until about noon. People say it as they walk into a shop or a waiting room.","Buenos días, señora. ¿Tiene pan dulce?","Good morning, ma'am. Do you have sweet bread?"],["Buenas tardes.","Good afternoon.","From noon until dark.","Buenas tardes. Una mesa para dos, por favor.","Good afternoon. A table for two, please."],["Buenas noches.","Good evening. / Good night.","A hello after dark, and also a goodbye at bedtime.","Buenas noches. Hasta mañana.","Good night. See you tomorrow."],["¿Bueno?","Hello? (on the phone)","Only in Mexico, and only to answer the phone.","— ¿Bueno? — Hola, ¿está Lucas?","— Hello? — Hi, is Lucas there?"]]},{"en":"How are you?","fr":"¿Cómo estás?","desc":"Asking how someone is, and the usual answers.","cards":[["¿Cómo estás?","How are you?","With tú: friends, family, people your own age.","Hola, Lucas. ¿Cómo estás?","Hi, Lucas. How are you?"],["¿Cómo está usted?","How are you? (polite)","With usted: an older person, a customer, someone you have just met.","Buenos días, don Luis. ¿Cómo está usted?","Good morning, Don Luis. How are you?"],["¿Qué tal?","How's it going?","Friendly, and it works with tú and with usted. Often no real answer is expected.","¡Hola! ¿Qué tal el trabajo?","Hi! How's work?"],["¿Qué onda?","What's up?","Very Mexican, between friends. Not for your boss.","¿Qué onda, Lucas? ¿Todo bien?","What's up, Lucas? All good?"],["Bien, gracias. ¿Y tú?","Fine, thanks. And you?","The standard reply. With usted: ¿y usted?","— ¿Cómo estás? — Bien, gracias. ¿Y tú?","— How are you? — Fine, thanks. And you?"],["Más o menos.","So-so.","An honest answer, between friends.","— ¿Qué tal? — Más o menos. Tengo mucho trabajo.","— How's it going? — So-so. I have a lot of work."]]},{"en":"Saying goodbye","fr":"Despedirse","desc":"From the plain adiós to see you tomorrow.","cards":[["Adiós.","Goodbye.","The plain goodbye. In Mexico people also say it in passing, to someone they walk by without stopping.","Adiós, gracias por todo.","Goodbye, thanks for everything."],["Hasta luego.","See you later.","The everyday goodbye when you will see the person again, some day.","Hasta luego, doña Carmen.","See you later, Doña Carmen."],["Nos vemos.","See you.","Casual. Add when: nos vemos mañana, nos vemos el lunes.","Bueno, nos vemos mañana.","Right, see you tomorrow."],["Hasta mañana.","See you tomorrow.","Also said at bedtime, instead of buenas noches.","Ya me voy a dormir. Hasta mañana.","I'm going to bed. See you tomorrow."]]},{"en":"Heading off","fr":"Irse","desc":"Announcing that you are leaving, and wishing someone well.","cards":[["Ya me voy.","I'm leaving now.","Ya: now, already. It announces the goodbye; the goodbye itself can take a while.","Bueno, ya me voy. Es tarde.","Right, I'm leaving. It's late."],["Ahorita vengo.","I'll be right back.","Ahorita is Mexican for 'right now'. It can mean one minute or one hour.","Voy a la tienda. Ahorita vengo.","I'm going to the store. I'll be right back."],["Cuídate.","Take care.","With tú. With usted: cuídese.","Nos vemos el lunes. ¡Cuídate!","See you on Monday. Take care!"],["Que te vaya bien.","All the best. / Have a good one.","A warm goodbye to the person who is leaving. With usted: que le vaya bien.","Gracias por venir. ¡Que te vaya bien!","Thanks for coming. All the best!"],["Salúdame a tu mamá.","Say hi to your mom for me.","Saludar a…: to say hello to… The answer: de tu parte.","— Salúdame a tu mamá. — De tu parte.","— Say hi to your mom for me. — I will."]]}];</script>
