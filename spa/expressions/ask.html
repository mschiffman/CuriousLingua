<script>const AUD_DIR="https://languages.rmlives.com/spa/expressions/ask/";const AUD_EXT="mp3?v=2611261029";const categories=[{"en":"Please","fr":"Por favor","desc":"Asking for a thing, and asking someone to do something.","cards":[["¿Me da un café, por favor?","Can I have a coffee, please?","¿Me da…?: literally 'do you give me…?'. The standard polite request, with usted.","¿Me da un kilo de tortillas, por favor?","Can I have a kilo of tortillas, please?"],["Quisiera un boleto.","I'd like a ticket.","Quisiera: I would like. Softer than quiero, I want.","Quisiera un boleto para Oaxaca, por favor.","I'd like a ticket to Oaxaca, please."],["¿Me puedes ayudar?","Can you help me?","With tú. With usted: ¿me puede ayudar?","¿Me puedes ayudar con esta caja?","Can you help me with this box?"],["¿Me pasas la sal?","Can you pass me the salt?","At the table, among friends: a question in the present, not an order.","¿Me pasas la sal, por favor?","Can you pass me the salt, please?"]]},{"en":"May I?","fr":"¿Puedo?","desc":"Asking whether you may do something.","cards":[["¿Puedo pasar?","May I come in?","¿Puedo + a verb?: may I…?","Buenos días. ¿Puedo pasar?","Good morning. May I come in?"],["¿Puedo pagar con tarjeta?","Can I pay by card?","Con tarjeta: by card. En efectivo: in cash.","¿Puedo pagar con tarjeta o solo en efectivo?","Can I pay by card, or cash only?"],["¿Se puede?","Is it allowed? / May I?","A short way to ask if something is allowed. Also said at an open door, before walking in.","¿Se puede tomar fotos aquí?","Is it allowed to take photos here?"],["¿Tiene una talla más grande?","Do you have a bigger size?","¿Tiene…?: do you have…? In a shop, with usted.","Me queda chico. ¿Tiene una talla más grande?","It's too small for me. Do you have a bigger size?"]]},{"en":"Answering","fr":"Responder","desc":"Saying yes, saying soon, and saying no kindly.","cards":[["Claro.","Of course.","Fuller: claro que sí.","— ¿Me puedes ayudar? — Claro que sí.","— Can you help me? — Of course."],["Ahorita.","Right away.","In Mexico: right away, in a while, or never. The tone tells you which.","— ¿Me trae más agua? — Ahorita se la traigo.","— Could you bring me more water? — I'll bring it right away."],["Un momento, por favor.","One moment, please.","Shorter and more casual: un momentito.","Un momento, por favor. Ya casi termino.","One moment, please. I'm almost done."],["Lo siento, no puedo.","I'm sorry, I can't.","A reason usually follows.","Lo siento, no puedo. Tengo que trabajar.","I'm sorry, I can't. I have to work."]]}];</script>
