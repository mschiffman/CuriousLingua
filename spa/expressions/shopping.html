<script>const AUD_DIR="https://languages.rmlives.com/spa/expressions/shopping/";const AUD_EXT="mp3?v=2611261030";const categories=[{"en":"Looking","fr":"Buscar","desc":"Browsing, asking for something, and trying it on.","cards":[["Solo estoy viendo, gracias.","I'm just looking, thanks.","The answer to ¿le puedo ayudar?, can I help you?","— ¿Le puedo ayudar? — Solo estoy viendo, gracias.","— Can I help you? — I'm just looking, thanks."],["Busco una playera.","I'm looking for a T-shirt.","Buscar: to look for. Una playera: a T-shirt, in Mexico.","Busco una playera blanca, talla mediana.","I'm looking for a white T-shirt, size medium."],["¿Tiene esto en otro color?","Do you have this in another color?","Esto: this.","Me gusta. ¿Tiene esto en otro color?","I like it. Do you have this in another color?"],["¿Me lo puedo probar?","Can I try it on?","Probarse: to try on. The fitting rooms: los probadores.","¿Me lo puedo probar? — Sí, los probadores están al fondo.","Can I try it on? — Yes, the fitting rooms are at the back."]]},{"en":"Prices","fr":"Los precios","desc":"Asking the price, and asking for a better one.","cards":[["¿Cuánto cuesta?","How much is it?","For several things: ¿cuánto cuestan?","¿Cuánto cuesta esta bolsa?","How much is this bag?"],["¿A cómo el kilo?","How much a kilo?","Market Spanish: ¿a cómo…? asks the price by the kilo or by the piece.","¿A cómo el kilo de jitomate?","How much is a kilo of tomatoes?"],["Está muy caro.","It's very expensive.","Caro: expensive. Barato: cheap.","Está muy caro. ¿Tiene algo más barato?","It's very expensive. Do you have anything cheaper?"],["¿Es lo menos?","Is that your best price?","Literally 'is it the least?'. For markets and street stalls, never in a store with price tags.","— Son doscientos pesos. — ¿Es lo menos?","— That's two hundred pesos. — Is that your best price?"]]},{"en":"Buying","fr":"Comprar","desc":"Taking it, paying, a bag and the change.","cards":[["Me lo llevo.","I'll take it.","Llevarse: to take away with you. For a feminine thing: me la llevo.","Está perfecto. Me lo llevo.","It's perfect. I'll take it."],["¿Dónde pago?","Where do I pay?","La caja: the checkout.","— ¿Dónde pago? — En la caja, al fondo.","— Where do I pay? — At the checkout, at the back."],["¿Me da una bolsa?","Can I have a bag?","Una bolsa: a bag.","¿Me da una bolsa, por favor?","Can I have a bag, please?"],["¿Tiene cambio?","Do you have change?","El cambio: the change. Small shops often cannot change a big bill.","¿Tiene cambio de quinientos?","Do you have change for a five hundred?"]]}];</script>
