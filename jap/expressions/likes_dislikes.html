<script>const AUD_DIR="https://languages.rmlives.com/jap/expressions/likes_dislikes/";const AUD_EXT="mp3?v=2611241400";const categories=[{"en":"I like it","fr":"好きです","desc":"Liking, loving, and showing you like an idea.","cards":[["Nihon no eiga ga suki desu.","I like Japanese films.","日本の映画が好きです。\n\nThe thing you like takes ga, not o.","Ongaku ga suki desu.\n音楽が好きです。","I like music.",{"my":["ဂျပန်ရုပ်ရှင် ကြိုက်တယ်။","日本の映画が好きです。\n\nကြိုက်တဲ့အရာနောက်မှာ o မဟုတ်ဘဲ ga ကို သုံးတယ်။","သီချင်း ကြိုက်တယ်။"]}],["Rāmen ga daisuki desu.","I love ramen.","ラーメンが大好きです。\n\nDaisuki: 'big like'.","Watashi wa kōhī ga daisuki desu.\n私はコーヒーが大好きです。","I love coffee.",{"my":["ရာမင် သိပ်ကြိုက်တယ်။","ラーメンが大好きです。\n\nDaisuki: 'အကြီးအကျယ် ကြိုက်တယ်'။","ကော်ဖီ သိပ်ကြိုက်တယ်။"]}],["Ii desu ne.","That's nice.","いいですね。\n\nThe easy way to show you like an idea or a thing.","Shūmatsu, umi ni ikimasu. — Ii desu ne!\n週末、海に行きます。— いいですね！","I'm going to the sea at the weekend. — That's nice!",{"my":["ကောင်းတာပေါ့။","いいですね。\n\nအကြံတစ်ခု၊ ပစ္စည်းတစ်ခုကို ကြိုက်ကြောင်း လွယ်လွယ်နဲ့ ပြောတဲ့နည်းပါ။","ပိတ်ရက်မှာ ပင်လယ်သွားမယ်။ — ကောင်းတာပေါ့။"]}],["Omoshiroi desu.","It's interesting. / It's fun.","おもしろいです。\n\nFor books, films, people and ideas.","Kono hon wa omoshiroi desu.\nこの本はおもしろいです。","This book is interesting.",{"my":["စိတ်ဝင်စားစရာကောင်းတယ်။ / ပျော်စရာကောင်းတယ်။","おもしろいです。\n\nစာအုပ်၊ ရုပ်ရှင်၊ လူ၊ အတွေးအခေါ်တွေအတွက် သုံးတယ်။","ဒီစာအုပ် စိတ်ဝင်စားစရာကောင်းတယ်။"]}]],"tr":{"my":"ကြိုက်တယ်"}},{"en":"I don't like it","fr":"好きじゃありません","desc":"Japanese dislikes are usually softened.","cards":[["Karai mono wa amari suki ja arimasen.","I don't really like spicy food.","辛いものはあまり好きじゃありません。\n\nThe polite way to dislike: amari softens it.","Sakana wa amari suki ja arimasen.\n魚はあまり好きじゃありません。","I don't really like fish.",{"my":["အစပ် သိပ်မကြိုက်ဘူး။","辛いものはあまり好きじゃありません。\n\nမကြိုက်ကြောင်း ယဉ်ယဉ်ကျေးကျေး ပြောတဲ့နည်းပါ။ amari က စကားကို ပျော့သွားစေတယ်။","ငါး သိပ်မကြိုက်ဘူး။"]}],["Nattō wa chotto nigate desu.","I'm not very keen on natto.","納豆はちょっと苦手です。\n\nNigate: softer than kirai. For food, people and tasks.","Karai mono wa chotto nigate desu.\n辛いものはちょっと苦手です。","I'm not very good with spicy food.",{"my":["နတ္တိုး သိပ်မကြိုက်လှဘူး။","納豆はちょっと苦手です。\n\nNigate: kirai ထက် ပိုပျော့တယ်။ အစားအစာ၊ လူ၊ အလုပ်တွေအတွက် သုံးတယ်။","အစပ် သိပ်မစားနိုင်ဘူး။"]}],["Mushi ga kirai desu.","I hate insects.","虫が嫌いです。\n\nKirai is strong. Fine for insects or rain; too blunt for someone's cooking.","Ame ga kirai desu.\n雨が嫌いです。","I hate rain.",{"my":["ပိုးကောင်တွေ မုန်းတယ်။","虫が嫌いです。\n\nKirai က ပြင်းတယ်။ ပိုးကောင်၊ မိုးရွာတာမျိုးအတွက် ရတယ်။ တစ်ယောက်ယောက် ချက်ထားတဲ့ ဟင်းအတွက်တော့ ရိုင်းလွန်းတယ်။","မိုးရွာတာ မုန်းတယ်။"]}],["Māmā desu.","It's so-so.","まあまあです。\n\nNeither good nor bad.","Sono eiga wa dō deshita ka. — Māmā deshita.\nその映画はどうでしたか。— まあまあでした。","How was the film? — So-so.",{"my":["သာမန်ပါပဲ။","まあまあです。\n\nကောင်းလည်းမကောင်း၊ ဆိုးလည်းမဆိုးပါ။","ရုပ်ရှင် ဘယ်လိုလဲ။ — သာမန်ပါပဲ။"]}]],"tr":{"my":"မကြိုက်ဘူး"}},{"en":"Asking and choosing","fr":"どちら","desc":"Asking what people like, and saying which you prefer.","cards":[["Sushi wa suki desu ka.","Do you like sushi?","寿司は好きですか。\n\nA thing + wa suki desu ka: do you like…?","Sushi wa suki desu ka. — Hai, daisuki desu.\n寿司は好きですか。— はい、大好きです。","Do you like sushi? — Yes, I love it.",{"my":["ဆူရှီ ကြိုက်လား။","寿司は好きですか。\n\nပစ္စည်း + wa suki desu ka: …ကြိုက်လား။","ဆူရှီ ကြိုက်လား။ — ဟုတ်ကဲ့၊ သိပ်ကြိုက်တယ်။"]}],["Donna ongaku ga suki desu ka.","What kind of music do you like?","どんな音楽が好きですか。\n\nDonna: what kind of.","Donna tabemono ga suki desu ka.\nどんな食べ物が好きですか。","What kind of food do you like?",{"my":["ဘယ်လို သီချင်းမျိုး ကြိုက်လဲ။","どんな音楽が好きですか。\n\nDonna: ဘယ်လိုမျိုး။","ဘယ်လို အစားအစာမျိုး ကြိုက်လဲ။"]}],["Dochira ga suki desu ka.","Which do you prefer?","どちらが好きですか。\n\nOf two things. Casual: dotchi.","Kōhī to ocha to, dochira ga suki desu ka.\nコーヒーとお茶と、どちらが好きですか。","Which do you prefer, coffee or tea?",{"my":["ဘယ်ဟာ ပိုကြိုက်လဲ။","どちらが好きですか。\n\nနှစ်ခုထဲက တစ်ခုကို ရွေးခိုင်းတာပါ။ ရင်းနှီးတဲ့သူတွေနဲ့: dotchi။","ကော်ဖီနဲ့ လက်ဖက်ရည် ဘယ်ဟာ ပိုကြိုက်လဲ။"]}],["Ocha no hō ga suki desu.","I prefer tea.","お茶のほうが好きです。\n\nA thing + no hō ga suki desu: I like … more.","Natsu yori fuyu no hō ga suki desu.\n夏より冬のほうが好きです。","I prefer winter to summer.",{"my":["လက်ဖက်ရည် ပိုကြိုက်တယ်။","お茶のほうが好きです。\n\nပစ္စည်း + no hō ga suki desu: …ကို ပိုကြိုက်တယ်။","နွေရာသီထက် ဆောင်းရာသီကို ပိုကြိုက်တယ်။"]}]],"tr":{"my":"မေးခြင်းနှင့် ရွေးခြင်း"}}];const langs=["en","my"];const COURSE="jap";</script>
