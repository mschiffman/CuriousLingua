<script>const AUD_DIR="https://languages.rmlives.com/jap/expressions/likes_dislikes/";const AUD_EXT="mp3?v=2611241400";const categories=[{"en":"I like it","fr":"好きです","desc":"Liking, loving, and showing you like an idea.","cards":[["Nihon no eiga ga suki desu.","I like Japanese films.","日本の映画が好きです。\n\nThe thing you like takes ga, not o.","Ongaku ga suki desu.\n音楽が好きです。","I like music."],["Rāmen ga daisuki desu.","I love ramen.","ラーメンが大好きです。\n\nDaisuki: 'big like'.","Watashi wa kōhī ga daisuki desu.\n私はコーヒーが大好きです。","I love coffee."],["Ii desu ne.","That's nice.","いいですね。\n\nThe easy way to show you like an idea or a thing.","Shūmatsu, umi ni ikimasu. — Ii desu ne!\n週末、海に行きます。— いいですね！","I'm going to the sea at the weekend. — That's nice!"],["Omoshiroi desu.","It's interesting. / It's fun.","おもしろいです。\n\nFor books, films, people and ideas.","Kono hon wa omoshiroi desu.\nこの本はおもしろいです。","This book is interesting."]]},{"en":"I don't like it","fr":"好きじゃありません","desc":"Japanese dislikes are usually softened.","cards":[["Karai mono wa amari suki ja arimasen.","I don't really like spicy food.","辛いものはあまり好きじゃありません。\n\nThe polite way to dislike: amari softens it.","Sakana wa amari suki ja arimasen.\n魚はあまり好きじゃありません。","I don't really like fish."],["Nattō wa chotto nigate desu.","I'm not very keen on natto.","納豆はちょっと苦手です。\n\nNigate: softer than kirai. For food, people and tasks.","Karai mono wa chotto nigate desu.\n辛いものはちょっと苦手です。","I'm not very good with spicy food."],["Mushi ga kirai desu.","I hate insects.","虫が嫌いです。\n\nKirai is strong. Fine for insects or rain; too blunt for someone's cooking.","Ame ga kirai desu.\n雨が嫌いです。","I hate rain."],["Māmā desu.","It's so-so.","まあまあです。\n\nNeither good nor bad.","Sono eiga wa dō deshita ka. — Māmā deshita.\nその映画はどうでしたか。— まあまあでした。","How was the film? — So-so."]]},{"en":"Asking and choosing","fr":"どちら","desc":"Asking what people like, and saying which you prefer.","cards":[["Sushi wa suki desu ka.","Do you like sushi?","寿司は好きですか。\n\nA thing + wa suki desu ka: do you like…?","Sushi wa suki desu ka. — Hai, daisuki desu.\n寿司は好きですか。— はい、大好きです。","Do you like sushi? — Yes, I love it."],["Donna ongaku ga suki desu ka.","What kind of music do you like?","どんな音楽が好きですか。\n\nDonna: what kind of.","Donna tabemono ga suki desu ka.\nどんな食べ物が好きですか。","What kind of food do you like?"],["Dochira ga suki desu ka.","Which do you prefer?","どちらが好きですか。\n\nOf two things. Casual: dotchi.","Kōhī to ocha to, dochira ga suki desu ka.\nコーヒーとお茶と、どちらが好きですか。","Which do you prefer, coffee or tea?"],["Ocha no hō ga suki desu.","I prefer tea.","お茶のほうが好きです。\n\nA thing + no hō ga suki desu: I like … more.","Natsu yori fuyu no hō ga suki desu.\n夏より冬のほうが好きです。","I prefer winter to summer."]]}];</script>
