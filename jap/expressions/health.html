<script>const AUD_DIR="https://languages.rmlives.com/jap/expressions/health/";const AUD_EXT="mp3?v=2611261531";const categories=[{"en":"How you feel","fr":"体調","desc":"Telling someone you are not well, or better again.","tr":{"my":"နေထိုင်ပုံ"},"cards":[["Guai ga warui desu.","I don't feel well.","具合が悪いです。\n\nGuai: your condition. Warui: bad. The general way to say you are unwell.","Sumimasen, guai ga warui desu. Kaette mo ii desu ka.\nすみません、具合が悪いです。帰ってもいいですか。","Excuse me, I don't feel well. May I go home?",{"my":["နေမကောင်းဘူး။","具合が悪いです。\n\nGuai: ကိုယ့်အခြေအနေ။ Warui: မကောင်းဘူး။ နေမကောင်းတဲ့အခါ အထွေထွေ သုံးတဲ့ စကား။","တဆိတ်လောက်၊ နေမကောင်းလို့ပါ။ ပြန်လို့ရမလား။"]}],["Kibun ga warui desu.","I feel sick.","気分が悪いです。\n\nKibun: how you feel inside. Often means you feel you might throw up.","Basu de kibun ga waruku narimashita.\nバスで気分が悪くなりました。","I started to feel sick on the bus.",{"my":["ပျို့ချင်သလို ဖြစ်နေတယ်။","気分が悪いです。\n\nKibun: စိတ်ထဲ ကိုယ်ထဲ ခံစားရပုံ။ အန်ချင်သလို ဖြစ်တဲ့အခါ သုံးလေ့ရှိတယ်။","ဘတ်စ်ကားပေါ်မှာ ပျို့လာတယ်။"]}],["Memai ga shimasu.","I feel dizzy.","めまいがします。\n\nMemai: dizziness. A feeling + ga shimasu: I have that feeling.","Memai ga shimasu. Sukoshi suwarimasu.\nめまいがします。少し座ります。","I feel dizzy. I'll sit down for a moment.",{"my":["ခေါင်းမူးတယ်။","めまいがします。\n\nMemai: ခေါင်းမူးခြင်း။ ခံစားချက် + ga shimasu: အဲဒီလို ခံစားရတယ်။","ခေါင်းမူးတယ်။ ခဏ ထိုင်လိုက်မယ်။"]}],["Sukoshi yoku narimashita.","I'm a little better.","少しよくなりました。\n\nYoku naru: to get better. Sukoshi: a little.","Guai wa dō desu ka. — Sukoshi yoku narimashita.\n具合はどうですか。— 少しよくなりました。","How are you feeling? — I'm a little better.",{"my":["နည်းနည်း သက်သာလာပြီ။","少しよくなりました。\n\nYoku naru: သက်သာလာတယ်။ Sukoshi: နည်းနည်း။","နေကောင်းလား။ — နည်းနည်း သက်သာလာပြီ။"]}]]},{"en":"Pain and colds","fr":"痛み・風邪","desc":"Saying where it hurts, and the illnesses everyone gets.","tr":{"my":"နာကျင်မှုနှင့် အအေးမိခြင်း"},"cards":[["Atama ga itai desu.","I have a headache.","頭が痛いです。\n\nPart of the body + ga itai desu. Atama: head. Nodo: throat. Onaka: stomach. Ha: tooth.","Kinō kara atama ga itai desu.\n昨日から頭が痛いです。","I've had a headache since yesterday.",{"my":["ခေါင်းကိုက်တယ်။","頭が痛いです。\n\nကိုယ်အင်္ဂါ + ga itai desu။ Atama: ခေါင်း။ Nodo: လည်ချောင်း။ Onaka: ဗိုက်။ Ha: သွား။","မနေ့ကတည်းက ခေါင်းကိုက်နေတယ်။"]}],["Koko ga itai desu.","It hurts here.","ここが痛いです。\n\nKoko: here. Point to the place. Useful when you don't know the word.","Doko ga itai desu ka. — Koko ga itai desu.\nどこが痛いですか。— ここが痛いです。","Where does it hurt? — It hurts here.",{"my":["ဒီနားက နာတယ်။","ここが痛いです。\n\nKoko: ဒီနေရာ။ နာတဲ့နေရာကို လက်ညှိုးထိုးပြပါ။ စကားလုံး မသိတဲ့အခါ အသုံးဝင်တယ်။","ဘယ်နားက နာလဲ။ — ဒီနားက နာတယ်။"]}],["Kaze o hikimashita.","I caught a cold.","風邪をひきました。\n\nKaze o hiku: to catch a cold. Kaze: a cold.","Kaze o hikimashita. Kyō wa yasumimasu.\n風邪をひきました。今日は休みます。","I caught a cold. I'm taking today off.",{"my":["အအေးမိသွားတယ်။","風邪をひきました。\n\nKaze o hiku: အအေးမိတယ်။ Kaze: အအေးမိခြင်း။","အအေးမိသွားတယ်။ ဒီနေ့ နားမယ်။"]}],["Netsu ga arimasu.","I have a fever.","熱があります。\n\nNetsu: fever. Body temperature is said in do and bu: 38.5 = sanjūhachi-do go-bu.","Netsu ga arimasu. Sanjūhachi-do desu.\n熱があります。三十八度です。","I have a fever. It's thirty-eight degrees.",{"my":["အဖျားရှိတယ်။","熱があります。\n\nNetsu: အဖျား။ ကိုယ်အပူချိန်ကို do နဲ့ bu နဲ့ ပြောတယ်: 38.5 = sanjūhachi-do go-bu။","အဖျားရှိတယ်။ ၃၈ ဒီဂရီ။"]}],["Seki ga demasu.","I have a cough.","咳が出ます。\n\nSeki: a cough. Deru: to come out. Hanamizu ga demasu: I have a runny nose.","Yoru, seki ga demasu.\n夜、咳が出ます。","I cough at night.",{"my":["ချောင်းဆိုးတယ်။","咳が出ます。\n\nSeki: ချောင်းဆိုးခြင်း။ Deru: ထွက်တယ်။ Hanamizu ga demasu: နှာရည်ယိုတယ်။","ညဘက် ချောင်းဆိုးတယ်။"]}]]},{"en":"At the clinic and the pharmacy","fr":"病院・薬局","desc":"What you say, and what the doctor or pharmacist asks.","tr":{"my":"ဆေးခန်းနှင့် ဆေးဆိုင်မှာ"},"cards":[["Byōin ni ikitai desu.","I want to see a doctor.","病院に行きたいです。\n\nByōin: hospital or clinic, where you go for any illness. Ikitai: want to go.","Byōin ni ikitai desu. Chikaku ni arimasu ka.\n病院に行きたいです。近くにありますか。","I want to see a doctor. Is there a clinic nearby?",{"my":["ဆေးခန်း သွားချင်တယ်။","病院に行きたいです。\n\nByōin: ဆေးရုံ၊ ဆေးခန်း။ ဘာရောဂါမဆို သွားပြတဲ့နေရာ။ Ikitai: သွားချင်တယ်။","ဆေးခန်း သွားချင်တယ်။ အနီးအနားမှာ ရှိလား။"]}],["Dō shimashita ka.","What seems to be the problem?","どうしましたか。\n\nThe doctor's first question. Answer with what is wrong.","Dō shimashita ka. — Nodo ga itai desu.\nどうしましたか。— 喉が痛いです。","What seems to be the problem? — I have a sore throat.",{"my":["ဘာဖြစ်လို့လဲ။","どうしましたか。\n\nဆရာဝန်က ပထမဆုံး မေးတဲ့ မေးခွန်း။ ဘာဖြစ်နေလဲ ဖြေပါ။","ဘာဖြစ်လို့လဲ။ — လည်ချောင်းနာတယ်။"]}],["Itsu kara desu ka.","Since when?","いつからですか。\n\nItsu: when. Kara: since. Answer: kinō kara (since yesterday), mikka mae kara (for three days).","Itsu kara desu ka. — Mikka mae kara desu.\nいつからですか。— 三日前からです。","Since when? — For three days.",{"my":["ဘယ်တုန်းကတည်းကလဲ။","いつからですか。\n\nItsu: ဘယ်တုန်းက။ Kara: ကတည်းက။ အဖြေ: kinō kara (မနေ့ကတည်းက)၊ mikka mae kara (လွန်ခဲ့တဲ့ သုံးရက်ကတည်းက)။","ဘယ်တုန်းကတည်းကလဲ။ — လွန်ခဲ့တဲ့ သုံးရက်ကတည်းက။"]}],["Zutsū no kusuri wa arimasu ka.","Do you have something for a headache?","頭痛の薬はありますか。\n\nKusuri: medicine. Zutsū: headache. Kaze no kusuri: cold medicine. Seki no kusuri: cough medicine.","Sumimasen, kaze no kusuri wa arimasu ka.\nすみません、風邪の薬はありますか。","Excuse me, do you have cold medicine?",{"my":["ခေါင်းကိုက်ပျောက်ဆေး ရှိလား။","頭痛の薬はありますか。\n\nKusuri: ဆေး။ Zutsū: ခေါင်းကိုက်ခြင်း။ Kaze no kusuri: အအေးမိပျောက်ဆေး။ Seki no kusuri: ချောင်းဆိုးပျောက်ဆေး။","တဆိတ်လောက်၊ အအေးမိပျောက်ဆေး ရှိလား။"]}],["Ichinichi sankai, shokugo ni nonde kudasai.","Take it three times a day, after meals.","一日三回、食後に飲んでください。\n\nMedicine is drunk in Japanese: kusuri o nomu. Ichinichi sankai: three times a day. Shokugo: after a meal.","Kono kusuri wa ichinichi nikai nonde kudasai.\nこの薬は一日二回飲んでください。","Take this medicine twice a day.",{"my":["တစ်နေ့ သုံးကြိမ်၊ အစာစားပြီး သောက်ပါ။","一日三回、食後に飲んでください。\n\nဂျပန်လို ဆေးကို သောက်တယ်လို့ ပြောတယ်: kusuri o nomu။ Ichinichi sankai: တစ်နေ့ သုံးကြိမ်။ Shokugo: အစာစားပြီး။","ဒီဆေးကို တစ်နေ့ နှစ်ကြိမ် သောက်ပါ။"]}],["Arerugī ga arimasu.","I have an allergy.","アレルギーがあります。\n\nSay what it is first: tamago no arerugī (eggs), kusuri no arerugī (a medicine).","Arerugī wa arimasu ka. — Hai, ebi no arerugī ga arimasu.\nアレルギーはありますか。— はい、えびのアレルギーがあります。","Do you have any allergies? — Yes, I'm allergic to shrimp.",{"my":["ဓာတ်မတည့်တာ ရှိတယ်။","アレルギーがあります。\n\nဘာနဲ့ မတည့်လဲ အရင်ပြောပါ: tamago no arerugī (ကြက်ဥ)၊ kusuri no arerugī (ဆေး)။","ဓာတ်မတည့်တာ ရှိလား။ — ဟုတ်ကဲ့၊ ပုစွန်နဲ့ မတည့်ဘူး။"]}]]},{"en":"Kind words and emergencies","fr":"お大事に","desc":"Asking if someone is all right, wishing them well, and calling for help.","tr":{"my":"ဂရုစိုက်စကားနှင့် အရေးပေါ်"},"cards":[["Daijōbu desu ka.","Are you all right?","大丈夫ですか。\n\nDaijōbu: all right. The answer: Daijōbu desu, I'm fine.","Kaoiro ga warui desu yo. Daijōbu desu ka.\n顔色が悪いですよ。大丈夫ですか。","You look pale. Are you all right?",{"my":["အဆင်ပြေရဲ့လား။","大丈夫ですか。\n\nDaijōbu: အဆင်ပြေတယ်။ အဖြေ: Daijōbu desu (အဆင်ပြေပါတယ်)။","မျက်နှာ မကောင်းဘူးနော်။ အဆင်ပြေရဲ့လား။"]}],["Odaiji ni.","Take care of yourself.","お大事に。\n\nWhat you say to someone who is ill, and what the doctor and the pharmacist say as you leave.","Kaze desu ka. Odaiji ni.\n風邪ですか。お大事に。","A cold? Take care of yourself.",{"my":["ကျန်းမာရေး ဂရုစိုက်ပါ။","お大事に。\n\nနေမကောင်းတဲ့သူကို ပြောတဲ့စကား။ ဆေးခန်း၊ ဆေးဆိုင်က ပြန်ခါနီးမှာလည်း ဆရာဝန်နဲ့ ဆေးဆိုင်ဝန်ထမ်းက ပြောတယ်။","အအေးမိတာလား။ ကျန်းမာရေး ဂရုစိုက်ပါ။"]}],["Kyūkyūsha o yonde kudasai.","Please call an ambulance.","救急車を呼んでください。\n\nKyūkyūsha: ambulance. Yobu: to call. In Japan the number is 119.","Tasukete kudasai! Kyūkyūsha o yonde kudasai.\n助けてください！救急車を呼んでください。","Help! Please call an ambulance.",{"my":["လူနာတင်ကား ခေါ်ပေးပါ။","救急車を呼んでください。\n\nKyūkyūsha: လူနာတင်ကား။ Yobu: ခေါ်တယ်။ ဂျပန်မှာ ဖုန်းနံပါတ်က 119။","ကူညီကြပါ။ လူနာတင်ကား ခေါ်ပေးပါ။"]}]]}];const langs=["en","my"];const COURSE="jap";</script>
