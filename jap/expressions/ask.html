<script>const AUD_DIR="https://languages.rmlives.com/jap/expressions/ask/";const AUD_EXT="mp3?v=2611241359";const categories=[{"en":"Please","fr":"ください・お願いします","desc":"Asking for a thing, and asking someone to do something.","cards":[["Kore o kudasai.","This one, please.","これをください。\n\nA thing + o kudasai: please give me…","Mizu o kudasai.\n水をください。","Water, please.",{"my":["ဒါ ပေးပါ။","これをください。\n\nပစ္စည်း + o kudasai: …ပေးပါ။","ရေ ပေးပါ။"]}],["Onegai shimasu.","Please.","お願いします。\n\nMore polite than kudasai, and it works on its own: handing over a form, accepting an offer.","Kōhī o onegai shimasu.\nコーヒーをお願いします。","A coffee, please.",{"my":["ကျေးဇူးပြုပြီး။","お願いします。\n\nkudasai ထက် ပိုယဉ်ကျေးတယ်။ တစ်လုံးတည်းလည်း သုံးလို့ရတယ်။ ဖောင်ပေးတဲ့အခါ၊ ကမ်းလှမ်းတာကို လက်ခံတဲ့အခါ ပြောတယ်။","ကော်ဖီတစ်ခွက် ပေးပါ။"]}],["Chotto matte kudasai.","Please wait a moment.","ちょっと待ってください。\n\nThe -te form of a verb + kudasai: please do…","Sumimasen, chotto matte kudasai.\nすみません、ちょっと待ってください。","Sorry, please wait a moment.",{"my":["ခဏစောင့်ပါ။","ちょっと待ってください。\n\nကြိယာရဲ့ -te ပုံစံ + kudasai: …လုပ်ပေးပါ။","တောင်းပန်ပါတယ်၊ ခဏစောင့်ပါ။"]}],["Misete kudasai.","Please show me.","見せてください。\n\nMiseru: to show.","Sore o misete kudasai.\nそれを見せてください。","Please show me that one.",{"my":["ပြပေးပါ။","見せてください。\n\nMiseru: ပြတယ်။","အဲဒါ ပြပေးပါ။"]}]],"tr":{"my":"ကျေးဇူးပြု၍"}},{"en":"Asking for help","fr":"手伝ってください","desc":"Stopping someone politely, then saying what you need.","cards":[["Sumimasen, chotto ii desu ka.","Excuse me, do you have a moment?","すみません、ちょっといいですか。\n\nThe polite way to stop someone before you ask.","Sumimasen, chotto ii desu ka. — Hai, nan deshō.\nすみません、ちょっといいですか。— はい、何でしょう。","Excuse me, do you have a moment? — Yes, what is it?",{"my":["တဆိတ်လောက်၊ ခဏလောက် အချိန်ရမလား။","すみません、ちょっといいですか。\n\nတစ်ခုခု မမေးခင် တစ်ယောက်ယောက်ကို ယဉ်ယဉ်ကျေးကျေး ရပ်ခိုင်းတဲ့ စကားပါ။","တဆိတ်လောက်၊ ခဏလောက် အချိန်ရမလား။ — ဟုတ်ကဲ့၊ ဘာကိစ္စလဲ။"]}],["Tetsudatte kudasai.","Please help me.","手伝ってください。\n\nHelp with a task. In danger, shout Tasukete!","Sumimasen, chotto tetsudatte kudasai.\nすみません、ちょっと手伝ってください。","Excuse me, please give me a hand.",{"my":["ကူညီပေးပါ။","手伝ってください。\n\nအလုပ်တစ်ခုမှာ အကူအညီတောင်းတာပါ။ အန္တရာယ်ကြုံရင်တော့ Tasukete! လို့ အော်ပါ။","တဆိတ်လောက်၊ တစ်ချက်လောက် ကူပေးပါ။"]}],["Oshiete kudasai.","Please tell me.","教えてください。\n\nOshieru: to tell, to teach. For information of any kind.","Denwa bangō o oshiete kudasai.\n電話番号を教えてください。","Please tell me your phone number.",{"my":["ပြောပြပေးပါ။","教えてください。\n\nOshieru: ပြောပြတယ်၊ သင်ပေးတယ်။ ဘယ်လို အချက်အလက်မျိုးအတွက်မဆို သုံးလို့ရတယ်။","ဖုန်းနံပါတ် ပြောပြပေးပါ။"]}],["Shashin o totte kudasai.","Please take a photo.","写真を撮ってください。\n\nFor asking a passer-by to photograph you.","Sumimasen, shashin o totte kudasai. — Ii desu yo.\nすみません、写真を撮ってください。— いいですよ。","Excuse me, could you take a photo? — Sure.",{"my":["ဓာတ်ပုံ ရိုက်ပေးပါ။","写真を撮ってください。\n\nလမ်းသွားလမ်းလာ တစ်ယောက်ကို ကိုယ့်ဓာတ်ပုံ ရိုက်ပေးဖို့ တောင်းတဲ့အခါ သုံးတယ်။","တဆိတ်လောက်၊ ဓာတ်ပုံ ရိုက်ပေးနိုင်မလား။ — ရပါတယ်။"]}]],"tr":{"my":"အကူအညီတောင်းခြင်း"}},{"en":"May I?","fr":"〜てもいいですか","desc":"Asking permission, and the two answers you will hear.","cards":[["Ii desu ka.","May I? / Is it all right?","いいですか。\n\nPoint at a seat, or hold up your camera, and ask.","Koko, ii desu ka. — Hai, dōzo.\nここ、いいですか。— はい、どうぞ。","Is this seat free? — Yes, go ahead.",{"my":["ရမလား။ / အဆင်ပြေလား။","いいですか。\n\nခုံကို လက်ညှိုးထိုးပြပြီး၊ ဒါမှမဟုတ် ကင်မရာကို မြှောက်ပြပြီး မေးပါ။","ဒီခုံ လွတ်လား။ — ဟုတ်ကဲ့၊ ထိုင်ပါ။"]}],["Shashin o totte mo ii desu ka.","May I take a photo?","写真を撮ってもいいですか。\n\nThe -te form + mo ii desu ka: may I…?","Koko de shashin o totte mo ii desu ka.\nここで写真を撮ってもいいですか。","May I take a photo here?",{"my":["ဓာတ်ပုံ ရိုက်လို့ရမလား။","写真を撮ってもいいですか。\n\n-te ပုံစံ + mo ii desu ka: …လို့ရမလား။","ဒီမှာ ဓာတ်ပုံ ရိုက်လို့ရမလား။"]}],["Hai, dōzo.","Yes, go ahead.","はい、どうぞ。\n\nDōzo: here you are, after you, please do.","Suwatte mo ii desu ka. — Hai, dōzo.\n座ってもいいですか。— はい、どうぞ。","May I sit down? — Yes, please do.",{"my":["ဟုတ်ကဲ့၊ ရပါတယ်။","はい、どうぞ。\n\nDōzo: ယူပါ၊ အရင်သွားပါ၊ လုပ်ပါ။","ထိုင်လို့ရမလား။ — ဟုတ်ကဲ့၊ ထိုင်ပါ။"]}],["Sumimasen, chotto…","I'm sorry, but…","すみません、ちょっと…。\n\nThe soft Japanese no: the sentence trails off, and everyone understands.","Koko de tabete mo ii desu ka. — Sumimasen, koko wa chotto…\nここで食べてもいいですか。— すみません、ここはちょっと…。","May I eat here? — I'm sorry, not here.",{"my":["တောင်းပန်ပါတယ်၊ ဒါပေမဲ့…","すみません、ちょっと…。\n\nဂျပန်လူမျိုးတွေရဲ့ နူးညံ့တဲ့ ငြင်းနည်းပါ။ စာကြောင်းကို အဆုံးမသတ်ဘဲ ထားလိုက်တယ်၊ လူတိုင်း နားလည်တယ်။","ဒီမှာ စားလို့ရမလား။ — တောင်းပန်ပါတယ်၊ ဒီမှာတော့ မရပါဘူး။"]}]],"tr":{"my":"ခွင့်တောင်းခြင်း"}}];const langs=["en","my"];const COURSE="jap";</script>
