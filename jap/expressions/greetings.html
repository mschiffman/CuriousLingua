<script>const AUD_DIR="https://languages.rmlives.com/jap/expressions/greetings/";const AUD_EXT="mp3?v=2611171504";const categories=[{"en":"Saying hello","fr":"こんにちは","desc":"Morning, afternoon and evening, and meeting someone for the first time.","cards":[["Ohayō gozaimasu.","Good morning.","おはようございます。\n\nUntil about 10 am. To friends: Ohayō.",{"my":["မင်္ဂလာနံနက်ခင်းပါ။","おはようございます。\n\nမနက် ၁၀ နာရီလောက်အထိ သုံးတယ်။ သူငယ်ချင်းတွေကိုတော့ Ohayō လို့ပဲ ပြောတယ်။"]}],["Konnichiwa.","Hello. / Good afternoon.","こんにちは。",{"my":["မင်္ဂလာပါ။","こんにちは。"]}],["Konbanwa.","Good evening.","こんばんは。",{"my":["မင်္ဂလာညနေခင်းပါ။","こんばんは。"]}],["Hajimemashite.","Nice to meet you.","はじめまして。\n\nOnly the first time you meet someone.",{"my":["တွေ့ရတာ ဝမ်းသာပါတယ်။","はじめまして。\n\nတစ်ယောက်ယောက်နဲ့ ပထမဆုံးအကြိမ် တွေ့တဲ့အခါမှာပဲ သုံးတယ်။"]}],["Yoroshiku onegaishimasu.","Pleased to meet you. / I'm in your care.","よろしくおねがいします。",{"my":["ခင်ခင်မင်မင် ဆက်ဆံပေးပါ။","よろしくおねがいします。"]}]],"tr":{"my":"တွေ့တွေ့ချင်း နှုတ်ဆက်ခြင်း"}},{"en":"Thanks and sorry","fr":"ありがとう・すみません","desc":"Thank you, you're welcome, and the all-purpose sumimasen.","cards":[["Arigatō gozaimasu.","Thank you.","ありがとうございます。",{"my":["ကျေးဇူးတင်ပါတယ်။","ありがとうございます。"]}],["Dō itashimashite.","You're welcome.","どういたしまして。",{"my":["ရပါတယ်။","どういたしまして。"]}],["Sumimasen.","Excuse me. / Sorry.","すみません。\n\nAlso used to call a waiter or to thank someone for their trouble.",{"my":["တဆိတ်လောက်။ / တောင်းပန်ပါတယ်။","すみません。\n\nစားပွဲထိုးကို ခေါ်တဲ့အခါ၊ ကိုယ့်အတွက် အပင်ပန်းခံပေးတဲ့သူကို ကျေးဇူးတင်တဲ့အခါမှာလည်း သုံးတယ်။"]}]],"tr":{"my":"ကျေးဇူးတင်ခြင်းနှင့် တောင်းပန်ခြင်း"}},{"en":"Saying goodbye","fr":"さようなら","desc":"Leaving friends, leaving the office, and going to bed.","cards":[["Ja, mata.","See you.","じゃ、また。\n\nCasual, between friends.",{"my":["နောက်မှ တွေ့မယ်။","じゃ、また。\n\nသူငယ်ချင်း အချင်းချင်းကြား ရင်းရင်းနှီးနှီး ပြောတဲ့ စကားပါ။"]}],["Shitsurei shimasu.","Goodbye.","しつれいします。\n\nPolite: when you leave work or a room.",{"my":["ခွင့်ပြုပါဦး။","しつれいします。\n\nယဉ်ကျေးတဲ့ စကားပါ။ အလုပ်က ပြန်တဲ့အခါ၊ အခန်းထဲက ထွက်တဲ့အခါ သုံးတယ်။"]}],["Otsukaresama desu.","Thanks for your hard work.","おつかれさまです。\n\nSaid to colleagues all day long, and when leaving.",{"my":["ပင်ပန်းသွားပြီနော်။","おつかれさまです。\n\nလုပ်ဖော်ကိုင်ဖက်တွေကို တစ်နေ့လုံး ပြောလေ့ရှိတယ်။ အလုပ်က ပြန်တဲ့အခါမှာလည်း ပြောတယ်။"]}],["Oyasuminasai.","Good night.","おやすみなさい。",{"my":["အိပ်တော့မယ်နော်။","おやすみなさい。"]}]],"tr":{"my":"ပြန်ခါနီး နှုတ်ဆက်ခြင်း"}}];const langs=["en","my"];const COURSE="jap";</script>
