<script>const AUD_DIR="https://languages.rmlives.com/jap/expressions/greetings/";const AUD_EXT="mp3?v=2611171504";const categories=[{"en":"Saying hello","fr":"こんにちは","desc":"Morning, afternoon and evening, and meeting someone for the first time.","cards":[["Ohayō gozaimasu.","Good morning.","おはようございます。\nမင်္ဂလာနံနက်ခင်းပါ။\n\nUntil about 10 am. To friends: Ohayō."],["Konnichiwa.","Hello. / Good afternoon.","こんにちは。\nမင်္ဂလာပါ။"],["Konbanwa.","Good evening.","こんばんは。\nမင်္ဂလာညနေခင်းပါ။"],["Hajimemashite.","Nice to meet you.","はじめまして。\nတွေ့ရတာ ဝမ်းသာပါတယ်။\n\nOnly the first time you meet someone."],["Yoroshiku onegaishimasu.","Pleased to meet you. / I'm in your care.","よろしくおねがいします。\nခင်ခင်မင်မင် ဆက်ဆံပေးပါ။"]]},{"en":"Thanks and sorry","fr":"ありがとう・すみません","desc":"Thank you, you're welcome, and the all-purpose sumimasen.","cards":[["Arigatō gozaimasu.","Thank you.","ありがとうございます。\nကျေးဇူးတင်ပါတယ်။"],["Dō itashimashite.","You're welcome.","どういたしまして。\nရပါတယ်။"],["Sumimasen.","Excuse me. / Sorry.","すみません。\nတဆိတ်လောက်။ / တောင်းပန်ပါတယ်။\n\nAlso used to call a waiter or to thank someone for their trouble."]]},{"en":"Saying goodbye","fr":"さようなら","desc":"Leaving friends, leaving the office, and going to bed.","cards":[["Ja, mata.","See you.","じゃ、また。\nနောက်မှ တွေ့မယ်။\n\nCasual, between friends."],["Shitsurei shimasu.","Goodbye.","しつれいします。\nခွင့်ပြုပါဦး။\n\nPolite: when you leave work or a room."],["Otsukaresama desu.","Thanks for your hard work.","おつかれさまです。\nပင်ပန်းသွားပြီနော်။\n\nSaid to colleagues all day long, and when leaving."],["Oyasuminasai.","Good night.","おやすみなさい。\nအိပ်တော့မယ်နော်။"]]}];</script>
