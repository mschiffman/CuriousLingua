<script>const AUD_DIR="https://languages.rmlives.com/jap/expressions/thank/";const AUD_EXT="mp3?v=2611241358";const categories=[{"en":"Saying thank you","fr":"ありがとう","desc":"From the polite standard to a quick thanks between friends.","cards":[["Arigatō gozaimasu.","Thank you.","ありがとうございます。\n\nThe safe, polite thank you, for anyone.","Tetsudatte kurete, arigatō gozaimasu.\n手伝ってくれて、ありがとうございます。","Thank you for helping me."],["Arigatō.","Thanks.","ありがとう。\n\nCasual: friends and family only.","Purezento, arigatō!\nプレゼント、ありがとう！","Thanks for the present!"],["Dōmo arigatō gozaimasu.","Thank you very much.","どうもありがとうございます。\n\nDōmo makes it warmer. Dōmo on its own is a quick, light thanks.","Kyō wa dōmo arigatō gozaimashita.\n今日はどうもありがとうございました。","Thank you very much for today."],["Arigatō gozaimashita.","Thank you (for what you did).","ありがとうございました。\n\nThe past form: the help or the service is over, as when you leave a shop or a class.","Sensei, arigatō gozaimashita.\n先生、ありがとうございました。","Thank you, teacher."]]},{"en":"Answering thanks","fr":"どういたしまして","desc":"Japanese answers to thanks are modest: mostly a way of saying no.","cards":[["Dō itashimashite.","You're welcome.","どういたしまして。\n\nThe textbook answer. A little formal in daily life.","Arigatō gozaimasu. — Dō itashimashite.\nありがとうございます。— どういたしまして。","Thank you. — You're welcome."],["Iie, iie.","Not at all.","いいえ、いいえ。\n\nLiterally 'no, no': the modest everyday answer.","Tasukarimashita. — Iie, iie.\n助かりました。— いいえ、いいえ。","You were a great help. — Not at all."],["Kochira koso.","The pleasure is mine.","こちらこそ。\n\n'It is I who should thank you.' It hands the thanks back.","Kyō wa arigatō gozaimashita. — Kochira koso.\n今日はありがとうございました。— こちらこそ。","Thank you for today. — Thank you."],["Tondemo nai desu.","Not at all.","とんでもないです。\n\nStronger and more polite than iie: 'far from it'.","Hontō ni arigatō gozaimashita. — Tondemo nai desu.\n本当にありがとうございました。— とんでもないです。","Thank you so much. — Not at all."]]},{"en":"Thanks in daily life","fr":"日常","desc":"Set phrases that carry thanks: for help, for food, for someone's trouble.","cards":[["Sumimasen.","Thank you (for your trouble).","すみません。\n\nJapanese often thank with 'sorry', when someone has gone out of their way for you.","A, sumimasen.\nあ、すみません。","Oh, thank you. (someone picks up what you dropped)"],["Tasukarimashita.","That was a great help.","助かりました。\n\n'I was saved.' After someone has helped you.","Hontō ni tasukarimashita.\n本当に助かりました。","You really helped me out."],["Itadakimasu.","(said before eating)","いただきます。\n\n'I humbly receive.' Said before every meal: thanks for the food.","Oishisō! Itadakimasu.\nおいしそう！いただきます。","That looks delicious! Let's eat."],["Gochisōsama deshita.","Thank you for the meal.","ごちそうさまでした。\n\nSaid after eating: to the cook, to your host, or to the restaurant staff as you leave.","Gochisōsama deshita. Oishikatta desu.\nごちそうさまでした。おいしかったです。","Thank you for the meal. It was delicious."]]}];</script>
