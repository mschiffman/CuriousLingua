<script>const AUD_DIR="https://languages.rmlives.com/jap/expressions/shopping/";const AUD_EXT="mp3?v=2611241359";const categories=[{"en":"Looking and asking","fr":"探す","desc":"Prices, and whether the shop has what you want.","cards":[["Kore wa ikura desu ka.","How much is this?","これはいくらですか。\n\nKore: this (near me). Sore: that (near you). Are: that over there.","Sumimasen, kono kasa wa ikura desu ka.\nすみません、この傘はいくらですか。","Excuse me, how much is this umbrella?",{"my":["ဒါ ဘယ်လောက်လဲ။","これはいくらですか。\n\nKore: ဒါ (ကိုယ့်အနားက)။ Sore: အဲဒါ (တစ်ဖက်လူအနားက)။ Are: ဟိုဟာ (ဟိုးဘက်က)။","တဆိတ်လောက်၊ ဒီထီး ဘယ်လောက်လဲ။"]}],["Kitte wa arimasu ka.","Do you have stamps?","切手はありますか。\n\nA thing + wa arimasu ka: do you have…?","Jūdenki wa arimasu ka. — Hai, arimasu.\n充電器はありますか。— はい、あります。","Do you have a charger? — Yes, we do.",{"my":["တံဆိပ်ခေါင်း ရှိလား။","切手はありますか。\n\nပစ္စည်း + wa arimasu ka: …ရှိလား။","အားသွင်းကြိုး ရှိလား။ — ဟုတ်ကဲ့၊ ရှိပါတယ်။"]}],["Mite iru dake desu.","I'm just looking.","見ているだけです。\n\nFor when the staff come over to help.","Nanika osagashi desu ka. — Mite iru dake desu.\n何かお探しですか。— 見ているだけです。","Are you looking for something? — I'm just looking.",{"my":["ကြည့်ရုံ ကြည့်နေတာပါ။","見ているだけです。\n\nဝန်ထမ်းက ကူညီဖို့ လာမေးတဲ့အခါ ပြန်ဖြေတဲ့ စကားပါ။","ဘာ ရှာနေတာလဲ။ — ကြည့်ရုံ ကြည့်နေတာပါ။"]}],["Hoka no iro wa arimasu ka.","Do you have other colours?","ほかの色はありますか。\n\nHoka no: other.","Hoka no iro wa arimasu ka. — Kuro to shiro ga arimasu.\nほかの色はありますか。— 黒と白があります。","Do you have other colours? — We have black and white.",{"my":["တခြားအရောင် ရှိလား။","ほかの色はありますか。\n\nHoka no: တခြား။","တခြားအရောင် ရှိလား။ — အနက်နဲ့ အဖြူ ရှိပါတယ်။"]}]],"tr":{"my":"ကြည့်ခြင်းနှင့် မေးခြင်း"}},{"en":"Choosing","fr":"選ぶ","desc":"Too expensive, too small, and making up your mind.","cards":[["Chotto takai desu ne.","It's a little expensive.","ちょっと高いですね。\n\nTakai: expensive. Yasui: cheap.","Chotto takai desu ne. Motto yasui no wa arimasu ka.\nちょっと高いですね。もっと安いのはありますか。","It's a little expensive. Do you have a cheaper one?",{"my":["နည်းနည်း ဈေးကြီးတယ်။","ちょっと高いですね。\n\nTakai: ဈေးကြီးတယ်။ Yasui: ဈေးပေါတယ်။","နည်းနည်း ဈေးကြီးတယ်။ ဒီထက် ဈေးသက်သာတာ ရှိလား။"]}],["Kite mite mo ii desu ka.","May I try it on?","着てみてもいいですか。\n\nFor clothes. For shoes: Haite mite mo ii desu ka.","Kore, kite mite mo ii desu ka. — Hai, dōzo.\nこれ、着てみてもいいですか。— はい、どうぞ。","May I try this on? — Yes, go ahead.",{"my":["ဝတ်ကြည့်လို့ရမလား။","着てみてもいいですか。\n\nအဝတ်အစားအတွက်ပါ။ ဖိနပ်အတွက်: Haite mite mo ii desu ka။","ဒါ ဝတ်ကြည့်လို့ရမလား။ — ဟုတ်ကဲ့၊ ရပါတယ်။"]}],["Motto ōkii no wa arimasu ka.","Do you have a bigger one?","もっと大きいのはありますか。\n\nA smaller one: motto chiisai no.","Chotto chiisai desu. Motto ōkii no wa arimasu ka.\nちょっと小さいです。もっと大きいのはありますか。","It's a little small. Do you have a bigger one?",{"my":["ဒီထက်ကြီးတာ ရှိလား။","もっと大きいのはありますか。\n\nဒီထက်သေးတာ: motto chiisai no။","နည်းနည်း သေးတယ်။ ဒီထက်ကြီးတာ ရှိလား။"]}],["Kore ni shimasu.","I'll take this one.","これにします。\n\nA thing + ni shimasu: I decide on…","Ja, kore ni shimasu.\nじゃ、これにします。","Right, I'll take this one.",{"my":["ဒါ ယူမယ်။","これにします。\n\nပစ္စည်း + ni shimasu: …ကို ရွေးလိုက်ပြီ။","ကဲ၊ ဒါ ယူမယ်။"]}]],"tr":{"my":"ရွေးခြင်း"}},{"en":"Paying","fr":"払う","desc":"At the till.","cards":[["Kādo de haraemasu ka.","Can I pay by card?","カードで払えますか。\n\nCash: genkin.","Kādo de haraemasu ka. — Sumimasen, genkin dake desu.\nカードで払えますか。— すみません、現金だけです。","Can I pay by card? — Sorry, cash only.",{"my":["ကတ်နဲ့ ပေးလို့ရလား။","カードで払えますか。\n\nငွေသား: genkin။","ကတ်နဲ့ ပေးလို့ရလား။ — တောင်းပန်ပါတယ်၊ ငွေသားပဲ ရပါတယ်။"]}],["Fukuro wa irimasen.","I don't need a bag.","袋はいりません。\n\nThe staff ask: Fukuro wa irimasu ka. (Do you need a bag?)","Fukuro wa irimasu ka. — Iie, irimasen.\n袋はいりますか。— いいえ、いりません。","Do you need a bag? — No, I don't.",{"my":["အိတ် မလိုပါဘူး။","袋はいりません。\n\nဝန်ထမ်းက မေးတယ်: Fukuro wa irimasu ka. (အိတ် လိုလား။)","အိတ် လိုလား။ — မလိုပါဘူး။"]}],["Reshīto o kudasai.","The receipt, please.","レシートをください。\n\nReshīto is the till receipt.","Sumimasen, reshīto o kudasai.\nすみません、レシートをください。","Excuse me, the receipt, please.",{"my":["ပြေစာ ပေးပါ။","レシートをください。\n\nReshīto ဆိုတာ ငွေရှင်းစက်က ထွက်တဲ့ ပြေစာပါ။","တဆိတ်လောက်၊ ပြေစာ ပေးပါ။"]}],["Zenbu de ikura desu ka.","How much is it altogether?","全部でいくらですか。\n\nZenbu de: for everything.","Zenbu de ikura desu ka. — Sanzen-en desu.\n全部でいくらですか。— 三千円です。","How much altogether? — 3,000 yen.",{"my":["အားလုံးပေါင်း ဘယ်လောက်လဲ။","全部でいくらですか。\n\nZenbu de: အားလုံးပေါင်း။","အားလုံးပေါင်း ဘယ်လောက်လဲ။ — ယန်း ၃,၀၀၀ ပါ။"]}]],"tr":{"my":"ငွေပေးချေခြင်း"}}];const langs=["en","my"];const COURSE="jap";</script>
