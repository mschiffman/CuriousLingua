<script>const AUD_DIR="https://languages.rmlives.com/jap/expressions/apology/";const AUD_EXT="mp3?v=2611241359";const categories=[{"en":"Saying sorry","fr":"すみません","desc":"Four levels, from everyday to formal.","cards":[["Sumimasen.","I'm sorry. / Excuse me.","すみません。\n\nThe all-purpose polite sorry: bumping into someone, being a little late. Often said 'suimasen'.","Sumimasen, daijōbu desu ka.\nすみません、大丈夫ですか。","I'm sorry, are you all right?",{"my":["တောင်းပန်ပါတယ်။ / တဆိတ်လောက်။","すみません。\n\nနေရာတိုင်းမှာ သုံးလို့ရတဲ့ ယဉ်ကျေးတဲ့ တောင်းပန်စကားပါ။ တစ်ယောက်ယောက်ကို တိုက်မိတဲ့အခါ၊ နည်းနည်း နောက်ကျတဲ့အခါ သုံးတယ်။ 'suimasen' လို့ အသံထွက်တာ များတယ်။","တောင်းပန်ပါတယ်၊ အဆင်ပြေရဲ့လား။"]}],["Gomen nasai.","I'm sorry.","ごめんなさい。\n\nMore personal than sumimasen: for people you know. To friends: Gomen.","Gomen nasai, wasuremashita.\nごめんなさい、忘れました。","I'm sorry, I forgot.",{"my":["တောင်းပန်ပါတယ်။","ごめんなさい。\n\nsumimasen ထက် ပိုရင်းနှီးတယ်။ သိကျွမ်းတဲ့သူတွေနဲ့ သုံးတယ်။ သူငယ်ချင်းတွေကိုတော့ Gomen လို့ ပြောတယ်။","တောင်းပန်ပါတယ်၊ မေ့သွားတယ်။"]}],["Mōshiwake arimasen.","I'm terribly sorry.","申し訳ありません。\n\nFormal: at work, to customers. 'There is no excuse.'","Okurete mōshiwake arimasen.\n遅れて申し訳ありません。","I'm terribly sorry for being late.",{"my":["အနူးအညွတ် တောင်းပန်ပါတယ်။","申し訳ありません。\n\nတရားဝင်ဆန်တယ်။ အလုပ်မှာ၊ ဖောက်သည်တွေကို ပြောတယ်။ 'ဆင်ခြေပေးစရာ မရှိပါဘူး' လို့ အဓိပ္ပာယ်ရတယ်။","နောက်ကျတဲ့အတွက် အနူးအညွတ် တောင်းပန်ပါတယ်။"]}],["Shitsurei shimashita.","Pardon me.","失礼しました。\n\n'I was rude.' For a small slip: a wrong number, stepping on a foot.","A, shitsurei shimashita.\nあ、失礼しました。","Oh, pardon me.",{"my":["ခွင့်လွှတ်ပါ။","失礼しました。\n\n'ရိုင်းမိသွားပါတယ်' လို့ အဓိပ္ပာယ်ရတယ်။ ဖုန်းနံပါတ် မှားခေါ်မိတာ၊ ခြေထောက် နင်းမိတာလို အမှားသေးသေးလေးတွေအတွက် သုံးတယ်။","အို၊ ခွင့်လွှတ်ပါ။"]}]],"tr":{"my":"တောင်းပန်ခြင်း"}},{"en":"Sorry for…","fr":"〜てすみません","desc":"Saying what you are sorry for.","cards":[["Osoku natte sumimasen.","Sorry I'm late.","遅くなってすみません。\n\nThe -te form of a verb + sumimasen: sorry for doing…","Osoku natte sumimasen. Densha ga okuremashita.\n遅くなってすみません。電車が遅れました。","Sorry I'm late. The train was delayed.",{"my":["နောက်ကျလို့ တောင်းပန်ပါတယ်။","遅くなってすみません。\n\nကြိယာရဲ့ -te ပုံစံ + sumimasen: …လုပ်မိလို့ တောင်းပန်ပါတယ်။","နောက်ကျလို့ တောင်းပန်ပါတယ်။ ရထား နောက်ကျသွားလို့ပါ။"]}],["Omatase shimashita.","Sorry to keep you waiting.","お待たせしました。\n\nSaid by staff bringing your order, and by anyone who arrives after you.","Omatase shimashita. Kōhī desu.\nお待たせしました。コーヒーです。","Sorry for the wait. Here is your coffee.",{"my":["စောင့်ခိုင်းရလို့ တောင်းပန်ပါတယ်။","お待たせしました。\n\nမှာထားတာ လာချပေးတဲ့ ဝန်ထမ်းက ပြောတယ်။ ကိုယ့်ထက် နောက်ကျမှ ရောက်လာတဲ့သူကလည်း ပြောတယ်။","စောင့်ခိုင်းရလို့ တောင်းပန်ပါတယ်။ ကော်ဖီ ရပါပြီ။"]}],["Gomeiwaku o okake shimashita.","I'm sorry for the trouble.","ご迷惑をおかけしました。\n\nFormal: you have caused someone inconvenience.","Kinō wa gomeiwaku o okake shimashita.\n昨日はご迷惑をおかけしました。","I'm sorry for the trouble yesterday.",{"my":["ဒုက္ခပေးမိလို့ တောင်းပန်ပါတယ်။","ご迷惑をおかけしました。\n\nတရားဝင်ဆန်တယ်။ တစ်ယောက်ယောက်ကို အနှောင့်အယှက် ပေးမိတဲ့အခါ သုံးတယ်။","မနေ့က ဒုက္ခပေးမိလို့ တောင်းပန်ပါတယ်။"]}],["Machigaemashita.","I made a mistake.","間違えました。\n\nMachigaeru: to get something wrong.","Sumimasen, heya o machigaemashita.\nすみません、部屋を間違えました。","Sorry, I have the wrong room.",{"my":["မှားသွားပါတယ်။","間違えました。\n\nMachigaeru: မှားတယ်။","တောင်းပန်ပါတယ်၊ အခန်း မှားသွားတယ်။"]}]],"tr":{"my":"…အတွက် တောင်းပန်ခြင်း"}},{"en":"Answering an apology","fr":"大丈夫です","desc":"Putting the other person at ease.","cards":[["Daijōbu desu.","It's all right.","大丈夫です。\n\nThe usual reassuring answer. Careful: it can also mean 'no, thank you'.","Sumimasen! — Daijōbu desu yo.\nすみません！— 大丈夫ですよ。","Sorry! — It's fine.",{"my":["ရပါတယ်။","大丈夫です。\n\nစိတ်အေးအောင် ပြန်ဖြေလေ့ရှိတဲ့ စကားပါ။ သတိထားပါ၊ 'မလိုပါဘူး၊ ကျေးဇူးပါ' လို့လည်း အဓိပ္ပာယ်ရနိုင်တယ်။","တောင်းပန်ပါတယ်။ — ရပါတယ်။"]}],["Ki ni shinaide kudasai.","Don't worry about it.","気にしないでください。\n\n'Please don't let it bother you.'","Gomen nasai. — Ki ni shinaide kudasai.\nごめんなさい。— 気にしないでください。","I'm sorry. — Don't worry about it.",{"my":["စိတ်မပူပါနဲ့။","気にしないでください。\n\n'စိတ်ထဲ မထားပါနဲ့' လို့ အဓိပ္ပာယ်ရတယ်။","တောင်းပန်ပါတယ်။ — စိတ်မပူပါနဲ့။"]}],["Ii desu yo.","That's OK.","いいですよ。\n\nLight and friendly.","Okurete gomen nasai. — Ii desu yo.\n遅れてごめんなさい。— いいですよ。","Sorry I'm late. — That's OK.",{"my":["ကိစ္စမရှိပါဘူး။","いいですよ。\n\nပေါ့ပေါ့ပါးပါး၊ ဖော်ဖော်ရွေရွေ ပြောတဲ့ စကားပါ။","နောက်ကျလို့ တောင်းပန်ပါတယ်။ — ကိစ္စမရှိပါဘူး။"]}],["Kochira koso sumimasen.","I'm the one who should apologize.","こちらこそすみません。\n\nBoth sides apologize: very Japanese, and it ends the matter.","Sumimasen deshita. — Kochira koso sumimasen.\nすみませんでした。— こちらこそすみません。","I'm sorry about that. — No, I'm the one who's sorry.",{"my":["ကျွန်တော်/ကျွန်မကသာ တောင်းပန်ရမှာပါ။","こちらこそすみません。\n\nနှစ်ဖက်စလုံးက တောင်းပန်ကြတယ်။ ဂျပန်ဓလေ့ အစစ်ပါ၊ ဒီလိုပြောပြီးရင် ကိစ္စပြီးသွားတယ်။","အဲဒီကိစ္စ တောင်းပန်ပါတယ်။ — မဟုတ်တာ၊ ကျွန်တော်ကသာ တောင်းပန်ရမှာပါ။"]}]],"tr":{"my":"တောင်းပန်စကားကို ပြန်ဖြေခြင်း"}}];const langs=["en","my"];const COURSE="jap";</script>
