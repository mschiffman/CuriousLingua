<script>const AUD_DIR="https://languages.rmlives.com/lessons/Expressions/wishes/";const AUD_EXT="mp3?v=261024b";const categories=[{"en":"Everyday send-offs","fr":"Au quotidien","desc":"What you say as people leave: shops, work, friends.","cards":[["Bonne journée !","Have a good day!","The standard goodbye in shops and offices before late afternoon. The reply: merci, vous aussi !","Merci, au revoir, bonne journée !","Thank you, goodbye, have a good day!"],["Bonne soirée !","Have a good evening!","From late afternoon on. Bonsoir is the greeting; bonne soirée the goodbye.","Bonne soirée, et à demain !","Have a good evening, see you tomorrow!"],["Bonne nuit !","Good night!","Only when someone's off to bed. Leaving a party at night, it's bonne soirée.","Bon, je vais me coucher. Bonne nuit !","Right, I'm off to bed. Good night!"],["Dors bien !","Sleep well!","Often right after bonne nuit. Formal or plural: dormez bien ! The next morning: tu as bien dormi ?","Il est tard, va te coucher. Dors bien !","It's late, go to bed. Sleep well!"],["Fais de beaux rêves !","Sweet dreams!","Usually right after bonne nuit. Softer: fais de doux rêves. Formal or plural: faites de beaux rêves !","Bonne nuit, mon cœur. Fais de beaux rêves !","Good night, sweetheart. Sweet dreams!"],["Repose-toi bien !","Get some good rest!","For someone tired or ill, or after a long day. Formal or plural: reposez-vous bien !","Tu as eu une longue semaine. Repose-toi bien !","You've had a long week. Get some good rest!"],["Passe une bonne nuit !","Have a good night!","A slightly fuller bonne nuit, common in texts. Formal or plural: passez une bonne nuit !","Je file me coucher. Passe une bonne nuit !","I'm off to bed. Have a good night!"],["Au dodo !","Off to bed! / Night-night!","To children. Dodo /do.do/ is baby talk for sleep (from dormir); fais dodo: go to sleep. Not doudou /du.du/, a child's cuddly toy.","Allez, les enfants, au dodo !","Come on, kids, off to bed!"],["Bonne fin de journée !","Enjoy the rest of your day!","From mid-afternoon, when most of the day is gone. Also bonne fin de soirée.","Merci pour votre appel, bonne fin de journée !","Thanks for your call, enjoy the rest of your day!"],["Bon week-end !","Have a good weekend!","Bon, because week-end is masculine; bonne journée, because journée is feminine.","Bon week-end ! Tu fais quelque chose de spécial ?","Have a good weekend! Are you doing anything special?"],["Bonne semaine !","Have a good week!","On Sunday evening or Monday morning, or as a sign-off in emails.","On se voit vendredi. Bonne semaine !","See you on Friday. Have a good week!"]]},{"en":"At the table","fr":"À table","desc":"Before eating and when raising a glass.","cards":[["Bon appétit !","Enjoy your meal!","Said before eating, and by waiters as they serve. The reply: merci, vous aussi !","Voilà vos plats, bon appétit !","Here are your dishes, enjoy your meal!"],["Régale-toi !","Enjoy! / Tuck in!","Se régaler: to feast, to love one's food. Friendlier than bon appétit. Formal or plural: régalez-vous !","C'est ton plat préféré, régale-toi !","It's your favourite dish, tuck in!"],["Santé !","Cheers!","Neutral, for any occasion. Fuller: à votre santé !","Allez, santé ! À notre réussite !","Come on, cheers! To our success!"],["À la tienne !","Cheers! / Your health!","Literally ‘to yours’ (your health). Formal or plural: à la vôtre !","— Santé ! — À la tienne !","— Cheers! — Cheers!"],["Tchin-tchin !","Cheers!","Very casual, imitating the clink of glasses. Custom: look people in the eye as you clink.","Tchin-tchin ! Aux vacances !","Cheers! To the holidays!"]]},{"en":"Before a challenge","fr":"Encourager","desc":"Good luck, hang in there, break a leg.","cards":[["Bon courage !","Hang in there! / Good luck with it!","For effort you control: a long day, a move, revision. Very common, even for small chores.","Encore trois heures de route ? Bon courage !","Three more hours of driving? Hang in there!"],["Bonne chance !","Good luck!","For luck you don't control: a draw, a result, an audition. Learners mix it up with bon courage.","Le tirage est demain ? Bonne chance !","The draw's tomorrow? Good luck!"],["Merde !","Break a leg!","Said to actors and performers before they go on; bonne chance would bring bad luck. You don't reply merci.","C'est ta première ce soir ? Merde !","It's your opening night tonight? Break a leg!"],["Je croise les doigts pour toi.","I'll keep my fingers crossed for you.","Croiser les doigts: to cross your fingers. Also je pense à toi (I'm thinking of you).","Ton entretien, c'est demain ? Je croise les doigts pour toi.","Your interview's tomorrow? I'll keep my fingers crossed for you."]]},{"en":"Travelling & moving on","fr":"Le voyage et le départ","desc":"Send-offs for trips, holidays and new chapters.","cards":[["Bon voyage !","Have a good trip!","For any trip. For a short one: bonne promenade, bonne balade.","Tu pars au Japon demain ? Bon voyage !","You're off to Japan tomorrow? Have a good trip!"],["Bonne route !","Drive safely! / Safe journey!","When they're driving. Also sois prudent(e) (be careful).","Bonne route, et envoie-moi un message quand tu arrives !","Drive safely, and text me when you get there!"],["Bon retour !","Safe trip home!","For the journey back. Also bon retour parmi nous ! (welcome back!)","Merci d'être venus. Bon retour !","Thanks for coming. Safe trip home!"],["Bonnes vacances !","Have a good holiday!","Plural: vacances is always plural in this sense.","C'est ton dernier jour ? Bonnes vacances !","It's your last day? Have a good holiday!"],["Bonne continuation !","All the best!","When someone leaves a job, finishes a course or starts a new chapter.","Merci pour ces trois années. Bonne continuation !","Thanks for these three years. All the best!"]]},{"en":"Health","fr":"La santé","desc":"After a sneeze, and when someone's ill.","cards":[["À tes souhaits !","Bless you!","After a sneeze. Formal or plural: à vos souhaits ! The reply: merci.","Atchoum ! — À tes souhaits !","Atchoo! — Bless you!"],["À tes amours !","And to your loves!","Playful reply to a second sneeze. The traditional answer: et que les tiennes durent toujours.","Atchoum ! — À tes souhaits ! — Atchoum ! — À tes amours !","Atchoo! — Bless you! — Atchoo! — And to your loves!"],["Bon rétablissement !","Get well soon!","Formal-ish, for an illness or after an operation. Also remets-toi vite !","J'ai appris pour ton opération. Bon rétablissement !","I heard about your operation. Get well soon!"],["Prends soin de toi.","Take care of yourself.","Warm, as a goodbye or at the end of a message. Formal: prenez soin de vous.","Bisous, et prends soin de toi.","Love, and take care of yourself."],["Soigne-toi bien.","Look after yourself.","When someone's ill: get treatment, rest. Formal: soignez-vous bien.","T'as la grippe ? Soigne-toi bien !","You've got the flu? Look after yourself!"]]},{"en":"Celebrations","fr":"Les fêtes","desc":"Birthdays, Christmas and the new year.","cards":[["Joyeux anniversaire !","Happy birthday!","Also heard casually: bon anniversaire !","Joyeux anniversaire, ma chérie !","Happy birthday, darling!"],["Bonne année !","Happy New Year!","Said through all of January; bonne année, bonne santé is the traditional pair.","Bonne année, bonne santé !","Happy New Year, and good health!"],["Joyeux Noël !","Merry Christmas!","Also bonnes fêtes ! from mid-December.","Joyeux Noël à toute la famille !","Merry Christmas to the whole family!"],["Joyeuses fêtes !","Happy holidays!","Covers Christmas and New Year together. Also bonnes fêtes de fin d'année.","Merci pour tout, et joyeuses fêtes !","Thanks for everything, and happy holidays!"],["Meilleurs vœux !","Best wishes!","In cards and in January for the new year. Fuller: tous mes meilleurs vœux pour cette nouvelle année.","Meilleurs vœux pour 2027 !","Best wishes for 2027!"]]}];</script>
