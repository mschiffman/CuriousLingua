<script>const AUD_DIR="https://languages.rmlives.com/lessons/Expressions/miscellaneous/";const AUD_EXT="mp3?v=2610231955";const categories=[{"en":"Being right","fr":"Avoir raison","desc":"Rubbing it in, gently or not.","cards":[["J'ai toujours raison.","I'm always right.","Usually teasing. Full banter: j'ai toujours raison, tu devrais le savoir depuis le temps.","Tu vois, il a plu. J'ai toujours raison, tu devrais le savoir depuis le temps.","See, it rained. I'm always right, you should know that by now."],["Je te l'avais dit !","I told you so!","The classic. Formal: je vous l'avais dit. Ruder: qu'est-ce que je t'avais dit ?","Je te l'avais dit, ce restaurant est toujours complet le samedi.","I told you so, that restaurant's always full on Saturdays."],["Tu vois, j'avais raison !","See, I was right!","Points at the proof. Shorter: tu vois ? Grudging reply: bon, t'avais raison (OK, you were right).","Tu vois, j'avais raison ! Il fallait prendre le parapluie.","See, I was right! We should have taken the umbrella."]]},{"en":"You bet!","fr":"Et comment !","desc":"Emphatic yeses and ‘you said it’.","cards":[["Et comment !","You bet! / And how!","An enthusiastic yes to a question. Slightly old-fashioned and fun.","— Tu viens à la fête ? — Et comment !","— Are you coming to the party? — You bet!"],["Un peu, mon neveu !","You bet your life!","Playful, singsong rhyme, great for banter. Nobody needs to be your nephew.","— T'as faim ? — Un peu, mon neveu !","— Hungry? — You bet your life!"],["Tu l'as dit !","You said it!","Strong agreement with what was just said. Also tu l'as dit, bouffi ! (jokey, a bit dated).","— Ce prof est trop strict. — Tu l'as dit !","— That teacher's way too strict. — You said it!"],["Ça, tu peux le dire !","You can say that again!","Ça in front adds emphasis. Formal: ça, vous pouvez le dire !","— Il fait froid aujourd'hui. — Ça, tu peux le dire !","— It's cold today. — You can say that again!"]]},{"en":"Off-and-on rain","fr":"Une pluie intermittente","desc":"Describing weather that can't make up its mind.","cards":[["Il pleut par intermittence.","It's raining off and on.","The weather-forecast phrase. Also des averses (showers) and des éclaircies (sunny spells).","Demain, il pleuvra par intermittence sur la Bretagne.","Tomorrow there'll be intermittent rain over Brittany."],["Il pleut par moments.","It's raining on and off.","More conversational than par intermittence.","Il pleut par moments, mais on peut quand même se promener.","It's raining on and off, but we can still go for a walk."],["Il pleut de temps en temps.","It rains from time to time.","About a period or a place rather than right now: here it rains now and then.","En été, il pleut de temps en temps, mais il fait surtout beau.","In summer it rains from time to time, but it's mostly fine."],["Ça s'arrête, puis ça reprend.","It stops, then it starts again.","Ça for the rain, in everyday speech. Also il pleut, il ne pleut plus… (rain, no rain…)","Il pleut, ça s'arrête, puis ça reprend. Quel temps pourri !","It rains, it stops, then it starts again. What rotten weather!"]]}];</script>
