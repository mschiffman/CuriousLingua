<script>const AUD_DIR="https://languages.rmlives.com/fr/expressions/not_understanding/";const AUD_EXT="mp3?v=2611241421";const categories=[{"en":"I don't get it","fr":"Ne pas comprendre","desc":"Saying the meaning isn't getting through, from mild to total.","cards":[["Je vois pas.","I don't see it. / I don't get it.","Spoken form of je ne vois pas, and the mirror of je vois. Usually followed by what you don't see: je vois pas pourquoi, je vois pas le problème.","Je vois pas pourquoi tu t'énerves.","I don't see why you're getting worked up."],["J'ai rien compris.","I didn't understand a thing.","Blunt and total. Spoken form of je n'ai rien compris. With strangers, soften it: j'ai pas tout saisi.","Il a parlé pendant une heure et j'ai rien compris.","He talked for an hour and I didn't understand a thing."],["J'y comprends rien.","I can't make sense of it.","Y stands for the thing in front of you: a form, a film, a set of instructions.","Regarde cette notice, j'y comprends rien.","Look at these instructions, I can't make head or tail of them."],["Ça m'échappe.","It escapes me.","Échapper à: to escape. Polished and a little rueful: the logic, the point or a name won't come.","Son raisonnement m'échappe complètement.","His reasoning escapes me completely."],["Ça me dépasse.","It's beyond me.","Dépasser: to go beyond. For something too complicated, or for behaviour you can't fathom.","Toute cette paperasse, ça me dépasse.","All this paperwork is beyond me."]]},{"en":"Casual & slang","fr":"Familier","desc":"The negatives of je pige and je capte, and two images for being out of your depth.","cards":[["Je pige pas.","I don't get it.","Familiar, from piger (to get, to grasp). Stronger: je pige rien, j'y pige rien.","Explique-moi encore, je pige pas.","Explain it again, I don't get it."],["Je capte rien.","I'm not getting any of this.","Literally ‘I'm picking up no signal’, like a phone. Familiar.","Il parle trop vite, je capte rien.","He talks too fast, I'm not getting any of it."],["Je suis largué(e).","I'm lost. / I can't keep up.","Larguer: to drop, to cast off. The conversation or the class has left you behind. A woman writes larguée; it sounds the same.","Dès qu'ils parlent d'informatique, je suis larguée.","As soon as they talk about computers, I'm lost."],["Je nage complètement.","I'm completely at sea.","‘I'm swimming’: floundering, out of your depth. Familiar.","En maths, je nage complètement.","In maths, I'm completely at sea."],["C'est du chinois.","It's all Greek to me.","The French version of the idiom: for French speakers the unreadable language is Chinese.","Ce contrat, pour moi, c'est du chinois.","This contract is all Greek to me."]]},{"en":"Losing the thread","fr":"Perdre le fil","desc":"You were following, and then you weren't.","cards":[["Je te suis plus.","I'm not following you any more.","The negative of je te suis. Spoken form of je ne te suis plus. Formal: je ne vous suis plus.","Attends, je te suis plus. C'est qui, Julien ?","Wait, I've lost you. Who's Julien?"],["J'ai perdu le fil.","I've lost the thread.","Le fil: the thread of a story or an argument. Usually your own fault: your mind wandered.","Pardon, j'ai perdu le fil. Tu disais ?","Sorry, I lost the thread. You were saying?"],["Tu m'as perdu(e).","You've lost me.","Puts the blame, lightly, on the explanation. A woman writes perdue; it sounds the same.","Là, tu m'as perdu. Reprends depuis le début.","You've lost me there. Start again from the beginning."],["Je vois pas où tu veux en venir.","I don't see what you're getting at.","The negative of je vois où tu veux en venir. Often a little impatient.","Je vois pas où tu veux en venir. Dis-le clairement.","I don't see what you're getting at. Say it plainly."],["Je vois pas le rapport.","I don't see the connection.","Le rapport: the link between two things. A polite way to say ‘that's beside the point’.","— Il pleut, donc je sors pas. — Je vois pas le rapport, t'as une voiture.","— It's raining, so I'm not going out. — I don't see the connection, you have a car."]]},{"en":"It isn't clear","fr":"Ce n'est pas clair","desc":"Blaming the message, not yourself.","cards":[["C'est pas clair.","It's not clear.","Spoken form of ce n'est pas clair. Careful: said of a person or a deal, it means shady.","C'est pas clair, cette histoire de rendez-vous.","It's not clear, this business about the appointment."],["C'est flou.","It's vague.","Flou: blurred, like a photo. For plans, instructions and memories.","Les consignes sont un peu floues.","The instructions are a bit vague."],["Ça n'a aucun sens.","It makes no sense.","Aucun sens: no sense at all. Casual and stronger: ça veut rien dire.","Cette phrase n'a aucun sens.","This sentence makes no sense."],["C'est du charabia.","It's gibberish.","Le charabia: language nobody can follow, typically jargon or bad writing.","J'ai lu la lettre de la banque, c'est du charabia.","I read the letter from the bank. It's gibberish."]]},{"en":"When French is the problem","fr":"Quand on apprend","desc":"For learners: saying that the language itself is what is stopping you.","cards":[["Je parle pas très bien français.","I don't speak French very well.","Spoken form of je ne parle pas très bien français. Said with a smile, it buys a lot of patience.","Excusez-moi, je parle pas très bien français.","Excuse me, I don't speak French very well."],["J'apprends encore.","I'm still learning.","Encore: still.","Soyez patient, j'apprends encore.","Be patient, I'm still learning."],["Je connais pas ce mot.","I don't know that word.","Connaître, not savoir, for a word you have never met.","« Bouchon » ? Je connais pas ce mot.","‘Bouchon’? I don't know that word."],["Vous pouvez me l'écrire ?","Can you write it down for me?","Me l': ‘it, for me’. Informal: tu peux me l'écrire ?","Je comprends pas l'adresse. Vous pouvez me l'écrire ?","I don't understand the address. Can you write it down for me?"],["Vous pouvez me montrer ?","Can you show me?","When words fail, point. Informal: tu peux me montrer ?","Je trouve pas la sortie. Vous pouvez me montrer ?","I can't find the exit. Can you show me?"],["Vous parlez anglais ?","Do you speak English?","The last resort. Ask it in French first: people notice, and appreciate it.","Désolé, je suis perdu. Vous parlez anglais ?","Sorry, I'm lost. Do you speak English?"]]},{"en":"Buying time","fr":"Gagner du temps","desc":"When you need a moment, or the word won't come.","cards":[["Attends…","Hang on… / Wait…","Formal: attendez.","Attends, je cherche le mot.","Hang on, I'm looking for the word."],["Laisse-moi réfléchir.","Let me think.","Formal: laissez-moi réfléchir.","Laisse-moi réfléchir deux secondes.","Let me think for two seconds."],["J'ai un trou.","My mind's gone blank.","Un trou: a hole, short for un trou de mémoire. For a word or a name that won't come.","Comment il s'appelle, déjà ? J'ai un trou.","What's his name again? My mind's gone blank."],["Je l'ai sur le bout de la langue.","It's on the tip of my tongue.","The same image as in English.","Le nom du film… je l'ai sur le bout de la langue.","The name of the film… it's on the tip of my tongue."]]}];</script>
