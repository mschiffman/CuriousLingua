<script>const AUD_DIR="https://languages.rmlives.com/lessons/Expressions/greetings/";const AUD_EXT="mp3?v=2610231947";const categories=[{"en":"Saying hello","fr":"Saluer","desc":"From the formal bonjour to the affectionate coucou.","cards":[["Bonjour !","Hello! / Good morning!","Through the day, to everyone: shopkeepers, bus drivers, neighbours. Skipping it sounds rude. You greet a person once a day; meeting again, it's a joking rebonjour !","Bonjour madame, une baguette, s'il vous plaît.","Good morning, a baguette, please."],["Bonsoir !","Good evening!","From late afternoon on, as a greeting. Also a goodbye in the evening: bonsoir et merci !","Bonsoir, on a une table pour deux au nom de Martin.","Good evening, we've got a table for two under Martin."],["Salut !","Hi!","Informal: friends, family, colleagues you call tu. Doubles as ‘bye’.","Salut Léa ! Ça fait longtemps !","Hi Léa! It's been ages!"],["Coucou !","Hiya!","Affectionate, for friends, family and children; common at the start of texts.","Coucou ma puce, t'as passé une bonne journée ?","Hiya sweetheart, did you have a good day?"]]},{"en":"How are you?","fr":"Prendre des nouvelles","desc":"Asking how someone is, and the usual answers.","cards":[["Ça va ?","How's it going?","The everyday question; the answer uses the same words: ça va, et toi ? Fuller: comment ça va ?","— Salut, ça va ? — Ça va, et toi ?","— Hi, how's it going? — Fine, and you?"],["Comment allez-vous ?","How are you?","Formal, with vous. Informal but careful: comment vas-tu ? The reply: je vais bien, merci. Et vous ?","Bonjour docteur, comment allez-vous ?","Good morning, doctor, how are you?"],["Ça roule ?","All good?","Casual. The answer echoes it: ça roule ! (all good!)","— Ça roule ? — Ça roule, et toi ?","— All good? — All good, you?"],["Quoi de neuf ?","What's new?","Invites news. Common reply: pas grand-chose (not much).","— Quoi de neuf ? — Pas grand-chose, et toi ?","— What's new? — Not much, and you?"],["Tranquille.","Chilled. / All quiet.","A relaxed, casual answer: nothing much happening, all fine.","— Ça va, ce week-end ? — Tranquille, je me repose.","— How's the weekend going? — Chilled, I'm resting."],["Bof, ça va.","Meh, I'm OK.","Bof is a verbal shrug: not great, not terrible. Often an invitation to ask more: — Bof, ça va. — Qu'est-ce qui se passe ?","— Ça va ? — Bof, ça va. Un peu fatigué.","— How are you? — Meh, OK. A bit tired."]]},{"en":"Saying goodbye","fr":"Dire au revoir","desc":"The many ways to say ‘bye’ and ‘see you’.","cards":[["Au revoir !","Goodbye!","All-purpose and polite: shops, offices, strangers. With friends: salut ! or ciao ! (also spelt tchao).","Merci, au revoir, bonne journée !","Thanks, goodbye, have a nice day!"],["À bientôt !","See you soon!","Friendly and vague about when. Also in emails to people you'll see again.","C'était super de te voir, à bientôt !","It was great to see you, see you soon!"],["À plus !","See you later!","Casual; the final s is usually pronounced. In texts: À+ or A+.","Je file, à plus !","I'm off, see you later!"],["À tout à l'heure !","See you in a bit!","When you'll meet again the same day. Casual short form: à toute !","Je vais faire les courses, à tout à l'heure !","I'm going shopping, see you in a bit!"],["À demain !","See you tomorrow!","À + the time: à lundi !, à ce soir !, à la semaine prochaine ! Open-ended: à la prochaine ! (until next time!)","Bonne soirée, à demain !","Have a good evening, see you tomorrow!"]]},{"en":"Heading off","fr":"Annoncer son départ","desc":"Announcing you're leaving, and promising to stay in touch.","cards":[["Bon, je vais y aller.","Right, I'm going to head off.","The gentle signal that you're leaving. Bon warns that something's coming.","Bon, je vais y aller, il commence à être tard.","Right, I'm going to head off, it's getting late."],["Faut que j'y aille.","I've got to go.","Spoken form of il faut que j'y aille. More urgent than je vais y aller.","Désolée, faut que j'y aille, mon bus arrive.","Sorry, I've got to go, my bus is coming."],["Je te laisse.","I'll let you go.","Ends a call or a chat politely: I'll leave you to it. Formal: je vous laisse.","Bon, je te laisse, tu as du travail. Bisous !","Right, I'll let you go, you've got work. Love!"],["Je file !","I've got to dash!","Filer: to rush off. Same idea: je me sauve !","Je file, j'ai rendez-vous chez le dentiste.","I've got to dash, I've got a dentist's appointment."],["On s'appelle !","Let's talk soon!","Literally ‘we'll call each other’. Casual, sometimes just politeness. Young slang: on se capte.","Super soirée ! On s'appelle cette semaine ?","Great evening! Shall we talk this week?"],["Tiens-moi au courant.","Keep me posted.","Asks for news later. Formal: tenez-moi au courant.","Bonne chance pour l'entretien, tiens-moi au courant !","Good luck with the interview, keep me posted!"]]}];</script>
