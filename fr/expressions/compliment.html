<script>const AUD_DIR="https://languages.rmlives.com/lessons/Expressions/compliment/";const AUD_EXT="mp3?v=261023";const categories=[{"en":"Sweet & affectionate","fr":"Les mots doux","desc":"Warm compliments for people you're close to.","cards":[["T'es un amour.","You're a sweetheart.","Thanks someone for a kind gesture as much as it praises them. Spoken form of tu es un amour.","Tu m'as gardé une part de gâteau ? T'es un amour.","You saved me a slice of cake? You're a sweetheart."],["T'es trop chou !","You're so sweet!","Chou (cabbage) means cute or sweet here. Also c'est trop chou ! about a gesture, a baby or a puppy.","Tu m'as apporté des fleurs ? T'es trop chou !","You brought me flowers? You're so sweet!"],["T'es trop mignon(ne).","You're so cute.","Cute in looks or in a sweet little gesture. Trop here means ‘so’, not ‘too’.","T'es trop mignonne avec ton bonnet !","You look so cute in your hat!"],["Tu me fais fondre.","You melt my heart.","Fondre: to melt. Affectionate, a little playful. Also about a child or a pet: il me fait fondre.","Quand tu me regardes comme ça, tu me fais fondre.","When you look at me like that, you melt my heart."],["T'as un cœur en or.","You've got a heart of gold.","For someone generous and kind. Also il a un cœur gros comme ça (he's got a huge heart).","Tu passes tous tes week-ends à aider ta voisine ? T'as un cœur en or.","You spend every weekend helping your neighbour? You've got a heart of gold."]]},{"en":"Looks & style","fr":"L'apparence","desc":"Praising how someone looks or dresses.","cards":[["Ça te va très bien.","It really suits you.","About clothes, a haircut or glasses: aller à quelqu'un, to suit. Formal: ça vous va très bien.","Elle est nouvelle, ta veste ? Ça te va très bien.","Is that jacket new? It really suits you."],["T'as bonne mine.","You look well.","About health and rest: after a holiday or an illness. The opposite: t'as mauvaise mine (you look unwell).","T'as bonne mine ! Les vacances t'ont fait du bien.","You look well! The holiday did you good."],["Tu es ravissante.","You look lovely.","Elegant and a little old-fashioned, usually to a woman. Plainer: tu es très belle.","Tu es ravissante dans cette robe.","You look lovely in that dress."],["T'es canon !","You look gorgeous!","Casual, for someone very attractive. Used of a man or a woman; the word doesn't change.","Waouh, t'es canon ce soir !","Wow, you look gorgeous tonight!"],["T'es stylé(e) !","You look cool! / Nice style!","Young and casual: you've got style. About a thing: elle est stylée, ta veste.","T'es stylé avec ces lunettes !","You look cool in those glasses!"],["T'es classe.","You look classy.","Elegant in looks or behaviour. Also about a gesture: c'est classe (that's classy).","T'es classe en costume !","You look classy in a suit!"]]},{"en":"Talent & character","fr":"Le talent et la personnalité","desc":"Praising what someone can do, or who they are.","cards":[["T'es génial(e) !","You're brilliant!","Enthusiastic praise for a person, often after a favour. About a thing: c'est génial !","Tu as réparé mon vélo ? T'es génial !","You fixed my bike? You're brilliant!"],["T'es doué(e) !","You're talented!","Doué means gifted. Add en or pour: t'es doué en maths, douée pour la cuisine. Ironically: t'es doué, toi ! (well done, genius!)","T'as fait ce dessin toute seule ? T'es douée !","You did this drawing by yourself? You're so talented!"],["Tu déchires !","You rock!","Slang, from déchirer (to tear apart): you're amazing at this. Also ça déchire ! (that's awesome!)","T'as eu 19 sur 20 ? Tu déchires !","You got 19 out of 20? You rock!"],["T'es au top !","You're the best!","Casual: you're at the top of your game, or just great. About a thing: c'est au top.","Merci pour ton aide, t'es au top !","Thanks for your help, you're the best!"],["T'es formidable.","You're wonderful.","Sincere and warm, a step up from génial. Formal: vous êtes formidable.","Tu t'es occupée de tout pour le mariage. T'es formidable.","You took care of everything for the wedding. You're wonderful."],["T'es vraiment quelqu'un de bien.","You're a really good person.","Praise for character rather than skill. Quelqu'un de + adjective: quelqu'un de drôle, quelqu'un de fiable.","Tu as rendu le portefeuille ? T'es vraiment quelqu'un de bien.","You handed the wallet in? You're a really good person."]]},{"en":"Responding to a compliment","fr":"Répondre à un compliment","desc":"Thanking, blushing, or modestly shrugging it off.","cards":[["Merci, c'est gentil.","Thanks, that's kind.","The simplest gracious reply. Warmer: c'est gentil de ta part.","— J'adore ta coiffure. — Merci, c'est gentil.","— I love your hair. — Thanks, that's kind."],["Tu trouves ?","You think so?","A modest reply, half surprised. French people often play down a compliment rather than just say thanks.","— Elle te va bien, cette couleur. — Tu trouves ?","— That colour suits you. — You think so?"],["Toi aussi !","You too!","Returns the compliment. Formal: vous aussi ! For looks: toi aussi, t'es superbe.","— T'es très élégante ce soir ! — Toi aussi !","— You look very elegant tonight! — So do you!"],["Arrête, tu vas me faire rougir !","Stop, you'll make me blush!","Rougir: to blush. Playful modesty when the praise keeps coming.","— T'es la meilleure cuisinière que je connaisse. — Arrête, tu vas me faire rougir !","— You're the best cook I know. — Stop, you'll make me blush!"],["Ça me touche beaucoup.","That means a lot to me.","Toucher: to move, to touch emotionally. For a sincere compliment. Also ça me fait vraiment plaisir.","Merci pour ton message, ça me touche beaucoup.","Thanks for your message, it means a lot to me."]]}];</script>
