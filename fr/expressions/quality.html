<script>const AUD_DIR="https://languages.rmlives.com/lessons/Expressions/quality/";const AUD_EXT="mp3?v=261023";const categories=[{"en":"Meh","fr":"Bof","desc":"One-word shrugs of indifference.","cards":[["Bof.","Meh.","The quintessential French shrug: not bad, not good, not interested. Often with a pout. Sceptical cousin: mouais…","— Il était bien, le film ? — Bof.","— Was the film good? — Meh."],["Bof bof.","Not great.","Doubled for extra underwhelm: closer to a no than bof alone.","— Et ce nouveau resto ? — Bof bof, c'était un peu fade.","— And that new restaurant? — Not great, it was a bit bland."],["Moyen.","So-so.","The blunt verdict: average. Also c'était moyen (it was so-so).","— Comment était l'hôtel ? — Moyen. La chambre était petite.","— How was the hotel? — So-so. The room was small."],["Pff…","Pfft…","A dismissive puff of air: disappointment, boredom or scorn, all in one sound.","— Tu as aimé l'expo ? — Pff… je me suis ennuyé.","— Did you like the exhibition? — Pfft… I was bored."]]},{"en":"Not great","fr":"Pas terrible","desc":"Understated letdowns, mostly with a negative.","cards":[["C'est pas fameux.","It's nothing special.","Fameux here means good, not famous. Common for food and quality. Same register as c'est pas terrible.","Le vin n'est pas fameux, mais le fromage est excellent.","The wine's nothing special, but the cheese is excellent."],["C'est pas top.","It's not great.","Casual, from top (excellent). Understated: it really isn't good.","Le wifi n'est pas top ici, ça coupe tout le temps.","The wifi's not great here, it keeps cutting out."],["C'est pas génial.","It's not brilliant.","Mild, polite disappointment.","Son nouvel album n'est pas génial, je préfère l'ancien.","His new album isn't brilliant, I prefer the old one."],["C'est pas folichon.","It's nothing to write home about.","Old-fashioned but still very much used: dull, uninspiring.","La soirée n'était pas folichonne, tout le monde regardait son téléphone.","The party wasn't up to much, everyone was looking at their phone."],["C'est pas extraordinaire.","It's nothing out of the ordinary.","Polished and a little formal: fine, but don't expect much.","Le spectacle n'est pas extraordinaire, mais les enfants vont aimer.","The show's nothing out of the ordinary, but the kids will like it."],["Ça casse pas des briques.","It's nothing to write home about.","Literally ‘it doesn't break bricks’: unimpressive. Casual.","Le scénario, ça casse pas des briques, mais les acteurs sont bons.","The plot's nothing special, but the actors are good."]]},{"en":"Could be better","fr":"Peut mieux faire","desc":"Polite, pointed feedback: room for improvement.","cards":[["Ça laisse à désirer.","It leaves something to be desired.","Polite but pointed: a real complaint in neutral clothing.","Le service laisse un peu à désirer dans ce restaurant.","The service in this restaurant leaves something to be desired."],["Ça pourrait être mieux.","It could be better.","Honest and straightforward. Also ça pourrait être pire (it could be worse), the optimist's line.","— Ça va, ton nouveau boulot ? — Ça pourrait être mieux.","— How's the new job going? — Could be better."],["Il y a mieux.","There's better out there.","Dry, slightly dismissive: you've seen better. Spoken: y a mieux.","Pour ce prix-là, il y a mieux, crois-moi.","For that price, you can do better, trust me."],["C'est perfectible.","There's room for improvement.","Formal, used in feedback at work: tactful criticism.","Votre présentation est claire, mais la conclusion est perfectible.","Your presentation is clear, but the conclusion could be improved."],["Peut mieux faire.","Could do better.","The classic school-report comment, used jokingly about anything.","Ton gâteau est un peu sec. Peut mieux faire !","Your cake's a bit dry. Could do better!"]]},{"en":"Just OK","fr":"Correct, sans plus","desc":"Faint praise: acceptable and no more.","cards":[["C'est correct.","It's OK. / It's decent.","Not praise, just the bare minimum of approval. In Québec, c'est correct means ‘it's fine, no problem’.","L'hôtel était correct, propre et pas trop cher.","The hotel was OK, clean and not too expensive."],["Sans plus.","Nothing more.","Tacked onto a mild verdict: c'était bien, sans plus (it was fine, nothing special).","Le concert était sympa, sans plus.","The concert was nice, nothing more."],["Ça peut aller.","It'll do.","Acceptable, if unenthusiastic. Also about how you are: — Ça va ? — Ça peut aller.","— La chambre te plaît ? — Ça peut aller, c'est juste pour une nuit.","— Do you like the room? — It'll do, it's only for one night."],["C'est passable.","It's passable.","A reluctant pass, like a mark just above average.","Son anglais est passable, il se débrouille.","His English is passable, he gets by."],["Ça se mange.","It's edible.","Said of food: the lowest form of culinary praise. Also ça se laisse manger (it goes down all right).","— C'est bon, la cantine ? — Ça se mange.","— Is the canteen food good? — It's edible."],["On fait avec.","We make do.","Resigned acceptance of something imperfect. Faire avec: to put up with it.","L'appartement est petit, mais on fait avec.","The flat's small, but we make do."]]}];</script>
