<script>const AUD_DIR="https://languages.rmlives.com/lessons/Expressions/excitement/";const AUD_EXT="mp3?v=261011";const categories=[{"en":"Great news!","fr":"C'est génial !","desc":"Instant reactions when something great happens.","cards":[["Génial !","Great! / Awesome!","The most common positive reaction. Also in full: c'est génial !","— J'ai eu mon permis ! — Génial !","— I passed my driving test! — Awesome!"],["Trop bien !","So good! / Awesome!","Trop here means ‘really’, not ‘too’. Casual and very popular.","Trop bien, on a des places au premier rang !","Awesome, we've got front-row seats!"],["Trop cool !","So cool!","Laid-back and young.","Ton nouvel appart est trop cool !","Your new apartment is so cool!"],["C'est top !","That's great! / Perfect!","Casual. Often just top ! on its own.","— On se fait un ciné ce soir ? — Ah, top !","— Movie tonight? — Oh, great!"],["C'est chouette !","That's lovely! / How nice!","Warm and a little old-school, but still widely used. Also before a noun: une chouette idée.","C'est chouette que tu puisses venir !","It's great that you can come!"],["C'est le pied !","It's heaven! / It's the best!","Casual: something is a real pleasure.","Une semaine à la plage sans réveil, c'est le pied !","A week at the beach with no alarm clock is heaven!"]]},{"en":"Can't wait","fr":"J'ai hâte !","desc":"Looking forward to something coming up.","cards":[["J'ai hâte !","I can't wait!","Add de + infinitive or que + subjunctive: j'ai hâte que ça commence. Casual and stronger: j'ai trop hâte !","J'ai hâte de partir en vacances !","I can't wait to go on vacation!","Le concert, c'est samedi ? J'ai trop hâte !","The concert's on Saturday? I can't wait!"],["Vivement… !","Roll on…! / I can't wait for…!","Followed by a noun, or by que + subjunctive.","Vivement le week-end !","Roll on the weekend!","Vivement que l'été arrive !","I can't wait for summer!"],["Je compte les jours !","I'm counting the days!","Something you've been looking forward to for a while.","Plus que deux semaines avant le mariage, je compte les jours !","Only two weeks until the wedding, I'm counting the days!"],["Je ne tiens plus en place !","I can't sit still!","Too excited, or too impatient, to stay put. Spoken: je tiens plus en place.","Elle part demain pour le Japon, elle ne tient plus en place.","She leaves for Japan tomorrow and can't sit still."],["Ça va être génial !","It's going to be great!","Excitement about a plan. Also ça va être top.","On part tous ensemble en Bretagne, ça va être génial !","We're all going to Brittany together, it's going to be great!"]]},{"en":"Over the moon","fr":"Aux anges","desc":"Saying just how thrilled you are.","cards":[["Je suis aux anges !","I'm over the moon!","Literally ‘I'm with the angels’.","Elle a dit oui ! Je suis aux anges !","She said yes! I'm over the moon!"],["Je suis ravi(e) !","I'm delighted!","Polite and versatile. With que it takes the subjunctive.","Je suis ravie que tu aies accepté.","I'm delighted you've accepted."],["Je suis trop content(e) !","I'm so happy!","Everyday and casual. Trop again means ‘really’.","Je suis trop content de te revoir !","I'm so happy to see you again!"],["J'en reviens pas !","I can't believe it!","Amazed disbelief, usually happy. Written: je n'en reviens pas.","J'ai gagné le concours ! J'en reviens pas !","I won the competition! I can't believe it!"],["C'est trop beau pour être vrai !","It's too good to be true!","Here trop does mean ‘too’.","Un vol à trente euros pour Rome ? C'est trop beau pour être vrai !","A thirty-euro flight to Rome? It's too good to be true!"]]},{"en":"Cheering","fr":"Allez !","desc":"Shouts of joy, and cheering someone on.","cards":[["Youhou !","Woohoo!","A shout of joy, also spelled wouhou. Careful: youhou ! is also ‘yoo-hoo!’ to get someone's attention.","Youhou ! On est en finale !","Woohoo! We're in the final!"],["Allez !","Come on! / Go!","Cheering someone on. In sport: allez les Bleus !","Allez, allez, tu y es presque !","Come on, come on, you're almost there!"],["Trop fort !","Amazing! / Impressive!","Admiration for something impressive. Of a person: t'es trop fort(e) !","Tu as fini le marathon ? Trop fort !","You finished the marathon? Amazing!"],["C'est parti !","Here we go! / Let's go!","Excitement at the start of something.","Tout le monde est prêt ? C'est parti !","Is everyone ready? Here we go!"]]}];</script>
