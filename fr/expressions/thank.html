<script>const AUD_DIR="https://languages.rmlives.com/lessons/Expressions/thank/";const AUD_EXT="mp3?v=2610232005";const categories=[{"en":"Saying thank you","fr":"Remercier","desc":"From a quick merci to heartfelt thanks.","cards":[["Merci beaucoup !","Thanks a lot!","The everyday step up from merci. Also merci bien (a touch more formal, or ironic in some tones).","Merci beaucoup pour le cadeau, il est magnifique !","Thanks a lot for the present, it's gorgeous!"],["Merci infiniment.","Thank you so much.","Infiniment: endlessly. Heartfelt and a little formal, for a big favour.","Merci infiniment pour votre aide, je n'y serais jamais arrivé seul.","Thank you so much for your help, I'd never have managed alone."],["Je vous remercie.","Thank you.","More formal than merci: offices, emails, speeches. Informal: je te remercie. + pour or de: je vous remercie de votre patience.","Je vous remercie de m'avoir reçu si rapidement.","Thank you for seeing me so quickly."],["Merci à tous !","Thank you all!","To a group. Also merci à vous (thank you, to you in return) and merci à toi.","Merci à tous d'être venus, ça me touche beaucoup.","Thank you all for coming, it means a lot."],["Merci pour tout.","Thanks for everything.","Warm, at the end of a stay, a job or a long favour.","Merci pour tout, on a passé une semaine géniale chez vous.","Thanks for everything, we had a wonderful week at your place."],["Encore merci.","Thanks again.","A warm sign-off after you've already thanked someone, in speech or at the end of an email.","Encore merci pour le dîner, c'était délicieux.","Thanks again for dinner, it was delicious."],["En tout cas, merci.","Anyway, thanks.","Thanks even though it didn't work out, or to round off a conversation.","Je n'ai pas eu le poste, mais en tout cas, merci pour ta recommandation.","I didn't get the job, but thanks for recommending me anyway."],["C'est tout, merci.","That's all, thanks.","In shops when asked et avec ceci ? (anything else?). Also ce sera tout, merci.","— Et avec ceci ? — C'est tout, merci.","— Anything else? — That's all, thanks."]]},{"en":"Owing someone","fr":"Être reconnaissant","desc":"When a simple merci isn't enough.","cards":[["Je ne sais pas comment te remercier.","I don't know how to thank you.","For a big favour. Formal: je ne sais pas comment vous remercier.","Tu as gardé les enfants toute la semaine… Je ne sais pas comment te remercier.","You looked after the kids all week… I don't know how to thank you."],["Je te revaudrai ça.","I'll make it up to you.","Revaloir: to repay in kind. A promise to return the favour. Also je t'en dois une (I owe you one).","Merci de m'avoir remplacé au boulot, je te revaudrai ça.","Thanks for covering for me at work, I'll make it up to you."],["Tu m'as sauvé la vie !","You saved my life!","Playful exaggeration for a small rescue. Also tu me sauves ! (you're a lifesaver!)","Tu avais un parapluie en plus ? Tu m'as sauvé la vie !","You had a spare umbrella? You saved my life!"]]},{"en":"Replying to thanks","fr":"Répondre à un merci","desc":"‘You're welcome’, from casual to warm.","cards":[["De rien.","You're welcome.","The most common reply. Literally ‘of nothing’.","— Merci pour le coup de main ! — De rien.","— Thanks for the hand! — You're welcome."],["Il n'y a pas de quoi.","Don't mention it.","Literally ‘there's nothing to thank for’. Spoken: y a pas de quoi, or just pas de quoi.","— Merci de m'avoir raccompagnée. — Il n'y a pas de quoi.","— Thanks for walking me home. — Don't mention it."],["Je t'en prie.","You're welcome. / Please do.","Courteous; formal: je vous en prie. Also gives permission: je vous en prie, asseyez-vous.","— Merci, madame. — Je vous en prie.","— Thank you, madam. — You're welcome."],["C'est normal.","It's the least I could do.","When someone thanks you for something you consider obvious.","— Merci d'être venu à l'hôpital. — C'est normal, tu es mon frère.","— Thanks for coming to the hospital. — Of course, you're my brother."],["Ça me fait plaisir.","I'm happy to. / My pleasure.","Very natural and warm. Also ça m'a fait plaisir (it was a pleasure).","— Merci pour les fleurs ! — Ça me fait plaisir.","— Thanks for the flowers! — My pleasure."],["Quand tu veux.","Any time.","Offers to do it again. Formal: quand vous voulez.","— Merci pour la balade, c'était super. — Quand tu veux !","— Thanks for the walk, it was great. — Any time!"],["Toujours là pour toi.","Always here for you.","Personal and affectionate. Fuller: je suis toujours là pour toi.","— Merci de m'avoir écoutée hier soir. — Toujours là pour toi.","— Thanks for listening to me last night. — Always here for you."]]}];</script>
