<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/restaurant/";const AUD_EXT="mp3?v=2611200515";const categories=[{"en":"Arriving","my":"ရောက်ရှိခြင်း","desc":"Getting a table and the menu.","cards":[["A table for two, please.","နှစ်ယောက်စာ စားပွဲ တစ်လုံး ရနိုင်မလား။","Say how many people. For three: A table for three, please.","— Hello! — Hi, a table for four, please.","— မင်္ဂလာပါ။ — ဟိုင်း၊ လေးယောက်စာ စားပွဲ တစ်လုံး ရနိုင်မလား။",{"es":["Una mesa para dos, por favor.","Di cuántas personas son. Para tres: A table for three, please.","— ¡Hola! — Hola, una mesa para cuatro, por favor."],"fr":["Une table pour deux, s'il vous plaît.","Dites combien vous êtes. Pour trois : A table for three, please.","— Bonjour ! — Bonjour, une table pour quatre, s'il vous plaît."],"hi":["दो लोगों के लिए टेबल चाहिए।","बताइए कि कितने लोग हैं। तीन के लिए: A table for three, please.","— नमस्ते! — नमस्ते, चार लोगों के लिए टेबल चाहिए।"],"vi":["Cho tôi một bàn hai người.","Nói rõ có mấy người. Ba người: A table for three, please.","— Xin chào! — Chào bạn, cho tôi một bàn bốn người."]}],["Do you have a table by the window?","ပြတင်းပေါက်နား စားပွဲ ရှိလား။","Asks for a place you like. Also: outside, in the corner.","Do you have a table outside?","အပြင်ဘက်မှာ စားပွဲ ရှိလား။",{"es":["¿Tiene una mesa junto a la ventana?","Para pedir el lugar que prefieres. También: outside, in the corner.","¿Tiene una mesa afuera?"],"fr":["Vous avez une table près de la fenêtre ?","Pour demander la place que vous préférez. On dit aussi : outside, in the corner.","Vous avez une table dehors ?"],"hi":["क्या खिड़की के पास कोई टेबल है?","अपनी पसंद की जगह माँगने के लिए। यह भी: outside, in the corner.","क्या बाहर कोई टेबल है?"],"vi":["Có bàn nào cạnh cửa sổ không?","Để xin chỗ bạn thích. Cũng có: outside, in the corner.","Có bàn nào ở ngoài trời không?"]}],["Is this seat free?","ဒီခုံ အားလား။","Before you sit next to strangers. Free here means no one is sitting there.","Excuse me, is this seat free?","တဆိတ်လောက်၊ ဒီခုံ အားလား။",{"es":["¿Está libre este asiento?","Antes de sentarte junto a desconocidos. Free aquí quiere decir que no hay nadie sentado.","Disculpe, ¿está libre este asiento?"],"fr":["Cette place est libre ?","Avant de s'asseoir à côté d'inconnus. Free veut dire ici que personne n'y est assis.","Excusez-moi, cette place est libre ?"],"hi":["क्या यह सीट ख़ाली है?","अजनबियों के पास बैठने से पहले। यहाँ free का मतलब है कि वहाँ कोई नहीं बैठा।","सुनिए, क्या यह सीट ख़ाली है?"],"vi":["Chỗ này có ai ngồi chưa?","Trước khi ngồi cạnh người lạ. Free ở đây nghĩa là chưa có ai ngồi.","Xin lỗi, chỗ này có ai ngồi chưa?"]}],["Can I see the menu, please?","မီနူး ကြည့်လို့ ရမလား။","The menu is the list of food and prices.","Can we see the menu, please? And some water?","မီနူး ကြည့်လို့ ရမလား။ ရေလည်း နည်းနည်း။",{"es":["¿Me permite ver el menú, por favor?","El menu es la lista de platos y precios.","¿Nos trae el menú, por favor? ¿Y un poco de agua?"],"fr":["Je peux voir la carte, s'il vous plaît ?","Le menu est la liste des plats et des prix.","On peut voir la carte, s'il vous plaît ? Et avoir de l'eau ?"],"hi":["मेन्यू दिखाएँगे?","Menu व्यंजनों और दामों की सूची है।","मेन्यू दिखाएँगे? और थोड़ा पानी भी?"],"vi":["Cho tôi xem thực đơn.","Menu là danh sách món ăn và giá tiền.","Cho chúng tôi xem thực đơn. Và cho xin ít nước nữa?"]}]],"tr":{"es":["Al llegar","Conseguir una mesa y el menú."],"fr":["En arrivant","Obtenir une table et la carte."],"hi":["पहुँचना","टेबल और मेन्यू लेना।"],"vi":["Lúc đến","Tìm bàn và xin thực đơn."]}},{"en":"Ordering","my":"မှာယူခြင်း","desc":"Saying what you want, and asking about the food.","cards":[["I'll have <span class=gray>the fried rice<\/span>.","ထမင်းကြော် ယူမယ်။","The usual way to order. Not: I want… (it can sound rude).","I'll have the noodle soup, please.","ခေါက်ဆွဲပြုတ် ယူမယ်။",{"es":["Voy a pedir el arroz frito.","La manera habitual de pedir. No: I want… (puede sonar grosero).","Voy a pedir la sopa de fideos, por favor."],"fr":["Je vais prendre le riz frit.","La façon habituelle de commander. Pas : I want… (cela peut sembler impoli).","Je vais prendre la soupe de nouilles, s'il vous plaît."],"hi":["मैं <span class=gray>फ़्राइड राइस<\/span> लूँगा।","ऑर्डर देने का आम तरीक़ा। I want… नहीं (रूखा लग सकता है)।","मैं नूडल सूप लूँगा।"],"vi":["Cho tôi <span class=gray>cơm chiên<\/span>.","Cách gọi món thông thường. Không nói: I want… (có thể nghe thô lỗ).","Cho tôi bún nước."]}],["Can I get <span class=gray>a mango juice<\/span>?","သရက်သီးဖျော်ရည် တစ်ခွက် ရမလား။","Casual and very common, especially in cafés. Can I have…? is a little more polite.","Can I get a coffee with milk, please?","နို့ကော်ဖီ တစ်ခွက် ရမလား။",{"es":["¿Me da un jugo de mango?","Informal y muy común, sobre todo en los cafés. Can I have…? es un poco más cortés.","¿Me da un café con leche, por favor?"],"fr":["Je peux avoir un jus de mangue ?","Familier et très courant, surtout dans les cafés. Can I have…? est un peu plus poli.","Je peux avoir un café au lait, s'il vous plaît ?"],"hi":["<span class=gray>एक आम का जूस<\/span> मिलेगा?","अनौपचारिक और बहुत आम, ख़ासकर कैफ़े में। Can I have…? थोड़ा ज़्यादा विनम्र है।","एक दूध वाली कॉफ़ी मिलेगी?"],"vi":["Cho tôi <span class=gray>một nước xoài<\/span> được không?","Thân mật và rất phổ biến, nhất là ở quán cà phê. Can I have…? lịch sự hơn một chút.","Cho tôi một cà phê sữa được không?"]}],["What do you recommend?","ဘာ စားသင့်လဲ အကြံပေးပါဦး။","Asks the waiter for the best or most popular dish.","It all looks good. What do you recommend?","အကုန် ကောင်းပုံ ရတယ်။ ဘာ စားသင့်လဲ အကြံပေးပါဦး။",{"es":["¿Qué me recomienda?","Le pregunta al mesero cuál es el mejor plato o el más pedido.","Todo se ve rico. ¿Qué me recomienda?"],"fr":["Que me conseillez-vous ?","Demande au serveur le meilleur plat ou le plus apprécié.","Tout a l'air bon. Que me conseillez-vous ?"],"hi":["आप क्या लेने की सलाह देंगे?","वेटर से पूछता है कि सबसे अच्छा या सबसे ज़्यादा चलने वाला व्यंजन कौन-सा है।","सब कुछ अच्छा लग रहा है। आप क्या लेने की सलाह देंगे?"],"vi":["Bạn gợi ý món nào?","Hỏi người phục vụ món nào ngon nhất hoặc được gọi nhiều nhất.","Món nào trông cũng ngon. Bạn gợi ý món nào?"]}],["Is it spicy?","စပ်လား။","Very useful! Also: Is it very spicy? Not too spicy, please.","— Is it spicy? — Just a little.","— စပ်လား။ — နည်းနည်းပဲ။",{"es":["¿Es picante?","¡Muy útil! También: Is it very spicy? Not too spicy, please.","— ¿Es picante? — Solo un poco."],"fr":["C'est épicé ?","Très utile ! On dit aussi : Is it very spicy? Not too spicy, please.","— C'est épicé ? — Juste un peu."],"hi":["क्या यह तीखा है?","बहुत काम का! यह भी: Is it very spicy? Not too spicy, please.","— क्या यह तीखा है? — बस थोड़ा-सा।"],"vi":["Món này có cay không?","Rất hữu ích! Cũng có: Is it very spicy? Not too spicy, please.","— Món này có cay không? — Chỉ hơi cay thôi."]}],["Without <span class=gray>ice<\/span>, please.","ရေခဲ မထည့်ပါနဲ့။","Asks for something to be left out. The opposite: with extra ice.","A lemon juice without sugar, please.","သံပုရာရည် သကြား မထည့်ဘဲ တစ်ခွက်။",{"es":["Sin hielo, por favor.","Para pedir que no le pongan algo. Lo contrario: with extra ice.","Una limonada sin azúcar, por favor."],"fr":["Sans glaçons, s'il vous plaît.","Pour demander qu'on enlève quelque chose. Le contraire : with extra ice.","Un jus de citron sans sucre, s'il vous plaît."],"hi":["बिना <span class=gray>बर्फ़<\/span> के।","यह कहने के लिए कि कोई चीज़ न डालें। उलटा: with extra ice.","बिना चीनी का एक नींबू का रस।"],"vi":["Không <span class=gray>đá<\/span> nhé.","Để dặn đừng cho thứ gì đó vào. Ngược lại: with extra ice.","Một nước chanh không đường nhé."]}],["I'm vegetarian.","သက်သတ်လွတ် စားပါတယ်။","You don't eat meat or fish. Ask: Is there meat in this?","I'm vegetarian. Is there meat in this soup?","သက်သတ်လွတ် စားပါတယ်။ ဒီဟင်းချိုထဲမှာ အသား ပါလား။",{"es":["Soy vegetariano.","No comes carne ni pescado. Pregunta: Is there meat in this?","Soy vegetariano. ¿Esta sopa lleva carne?"],"fr":["Je suis végétarien.","Vous ne mangez ni viande ni poisson. Demandez : Is there meat in this?","Je suis végétarien. Il y a de la viande dans cette soupe ?"],"hi":["मैं शाकाहारी हूँ।","आप मांस या मछली नहीं खाते। पूछिए: Is there meat in this?","मैं शाकाहारी हूँ। क्या इस सूप में मांस है?"],"vi":["Tôi ăn chay.","Bạn không ăn thịt hay cá. Hãy hỏi: Is there meat in this?","Tôi ăn chay. Canh này có thịt không?"]}]],"tr":{"es":["Pedir","Decir lo que quieres y preguntar por la comida."],"fr":["Commander","Dire ce que l'on veut et poser des questions sur les plats."],"hi":["ऑर्डर देना","बताना कि आपको क्या चाहिए, और खाने के बारे में पूछना।"],"vi":["Gọi món","Nói món bạn muốn, và hỏi về món ăn."]}},{"en":"What the waiter says","my":"စားပွဲထိုး ပြောတတ်တာများ","desc":"Questions you will hear, so you can answer quickly.","cards":[["Are you ready to order?","မှာမလား။","Answer: Yes, please. Or: Not yet. Can we have a few more minutes?","— Are you ready to order? — Not yet, sorry.","— မှာမလား။ — မမှာရသေးဘူး၊ ဆောရီး။",{"es":["¿Listos para pedir?","Se responde: Yes, please. O bien: Not yet. Can we have a few more minutes?","— ¿Listos para pedir? — Todavía no, perdón."],"fr":["Vous avez choisi ?","On répond : Yes, please. Ou : Not yet. Can we have a few more minutes?","— Vous avez choisi ? — Pas encore, désolé."],"hi":["क्या आप ऑर्डर देने के लिए तैयार हैं?","जवाब: Yes, please. या: Not yet. Can we have a few more minutes?","— क्या आप ऑर्डर देने के लिए तैयार हैं? — अभी नहीं, माफ़ कीजिए।"],"vi":["Anh chị gọi món được chưa ạ?","Trả lời: Yes, please. Hoặc: Not yet. Can we have a few more minutes?","— Anh chị gọi món được chưa ạ? — Chưa, xin lỗi nhé."]}],["For here or to go?","ဒီမှာ စားမလား၊ ပါဆယ်လား။","Eat in the café, or take it away. British English: Eat in or take away?","— For here or to go? — To go, please.","— ဒီမှာ စားမလား၊ ပါဆယ်လား။ — ပါဆယ်ပါ။",{"es":["¿Para aquí o para llevar?","Comer en el café o llevárselo. En inglés británico: Eat in or take away?","— ¿Para aquí o para llevar? — Para llevar, por favor."],"fr":["Sur place ou à emporter ?","Manger dans le café ou emporter. En anglais britannique : Eat in or take away?","— Sur place ou à emporter ? — À emporter, s'il vous plaît."],"hi":["यहीं खाएँगे या ले जाएँगे?","कैफ़े में खाना या साथ ले जाना। ब्रिटिश अंग्रेज़ी में: Eat in or take away?","— यहीं खाएँगे या ले जाएँगे? — ले जाऊँगा।"],"vi":["Dùng ở đây hay mang đi ạ?","Ăn tại quán hay mang về. Trong tiếng Anh Anh: Eat in or take away?","— Dùng ở đây hay mang đi ạ? — Mang đi."]}],["Anything to drink?","သောက်စရာ ဘာယူမလဲ။","Answer with your drink, or: Just water, please.","— Anything to drink? — Just water, please.","— သောက်စရာ ဘာယူမလဲ။ — ရေပဲ ပေးပါ။",{"es":["¿Algo de tomar?","Se responde con la bebida, o bien: Just water, please.","— ¿Algo de tomar? — Solo agua, por favor."],"fr":["Quelque chose à boire ?","On répond en nommant sa boisson, ou : Just water, please.","— Quelque chose à boire ? — Juste de l'eau, s'il vous plaît."],"hi":["पीने के लिए कुछ?","जवाब में पेय बताइए, या: Just water, please.","— पीने के लिए कुछ? — बस पानी।"],"vi":["Anh chị uống gì không ạ?","Trả lời bằng tên đồ uống, hoặc: Just water, please.","— Anh chị uống gì không ạ? — Cho tôi nước lọc thôi."]}],["Is everything OK?","အားလုံး အဆင်ပြေရဲ့လား။","The waiter checks during the meal. Answer: Yes, it's great, thanks!","— Is everything OK? — Yes, it's delicious, thanks!","— အားလုံး အဆင်ပြေရဲ့လား။ — ဟုတ်ကဲ့၊ အရမ်း စားကောင်းပါတယ်၊ ကျေးဇူးပါ။",{"es":["¿Todo bien?","El mesero pregunta durante la comida. Se responde: Yes, it's great, thanks!","— ¿Todo bien? — Sí, está delicioso, ¡gracias!"],"fr":["Tout se passe bien ?","Le serveur vérifie pendant le repas. On répond : Yes, it's great, thanks!","— Tout se passe bien ? — Oui, c'est délicieux, merci !"],"hi":["सब ठीक है?","खाने के दौरान वेटर पूछता है। जवाब: Yes, it's great, thanks!","— सब ठीक है? — हाँ, बहुत स्वादिष्ट है, शुक्रिया!"],"vi":["Mọi thứ ổn chứ ạ?","Người phục vụ hỏi trong bữa ăn. Trả lời: Yes, it's great, thanks!","— Mọi thứ ổn chứ ạ? — Vâng, ngon lắm, cảm ơn!"]}]],"tr":{"es":["Lo que dice el mesero","Preguntas que vas a oír, para que puedas responder rápido."],"fr":["Ce que dit le serveur","Des questions que vous entendrez, pour pouvoir répondre vite."],"hi":["वेटर क्या कहता है","जो सवाल आपको सुनाई देंगे, ताकि आप झट से जवाब दे सकें।"],"vi":["Người phục vụ nói gì","Những câu hỏi bạn sẽ nghe, để trả lời cho nhanh."]}},{"en":"During the meal","my":"စားနေစဉ်","desc":"Asking for more, or saying politely that something is wrong.","cards":[["Could we have some water?","ရေ နည်းနည်း ရနိုင်မလား။","Start with Excuse me to call the waiter politely. Don't snap your fingers.","Excuse me, could we have some water?","တဆိတ်လောက်၊ ရေ နည်းနည်း ရနိုင်မလား။",{"es":["¿Nos podría traer agua?","Empieza con Excuse me para llamar al mesero con cortesía. No chasquees los dedos.","Disculpe, ¿nos podría traer agua?"],"fr":["Pourrions-nous avoir de l'eau ?","Commencez par Excuse me pour appeler poliment le serveur. Ne claquez pas des doigts.","Excusez-moi, pourrions-nous avoir de l'eau ?"],"hi":["क्या हमें थोड़ा पानी मिल सकता है?","वेटर को विनम्रता से बुलाने के लिए Excuse me से शुरू कीजिए। चुटकी मत बजाइए।","सुनिए, क्या हमें थोड़ा पानी मिल सकता है?"],"vi":["Cho chúng tôi xin ít nước được không?","Mở đầu bằng Excuse me để gọi người phục vụ một cách lịch sự. Đừng búng tay.","Xin lỗi, cho chúng tôi xin ít nước được không?"]}],["Can we have some more rice?","ထမင်း နည်းနည်း ထပ်ရနိုင်မလား။","Some more = an extra amount.","This is great. Can we have some more rice?","ဒါ အရမ်း ကောင်းတယ်။ ထမင်း နည်းနည်း ထပ်ရနိုင်မလား။",{"es":["¿Nos trae un poco más de arroz?","Some more = una cantidad extra.","Está riquísimo. ¿Nos trae un poco más de arroz?"],"fr":["On peut avoir encore un peu de riz ?","Some more = une quantité en plus.","C'est très bon. On peut avoir encore un peu de riz ?"],"hi":["थोड़े और चावल मिलेंगे?","Some more = थोड़ा और।","बहुत बढ़िया है। थोड़े और चावल मिलेंगे?"],"vi":["Cho chúng tôi thêm cơm được không?","Some more = thêm một ít.","Ngon quá. Cho chúng tôi thêm cơm được không?"]}],["This isn't what I ordered.","ဒါ မှာထားတာ မဟုတ်ဘူး။","Polite if you say it calmly. Then say what you ordered.","Sorry, this isn't what I ordered. I asked for chicken.","ဆောရီး၊ ဒါ မှာထားတာ မဟုတ်ဘူး။ ကြက်သား မှာထားတာပါ။",{"es":["Esto no es lo que pedí.","Es cortés si lo dices con calma. Luego di lo que pediste.","Perdón, esto no es lo que pedí. Yo pedí pollo."],"fr":["Ce n'est pas ce que j'ai commandé.","Poli si on le dit calmement. Précisez ensuite ce que vous aviez commandé.","Excusez-moi, ce n'est pas ce que j'ai commandé. J'avais demandé du poulet."],"hi":["मैंने यह ऑर्डर नहीं किया था।","शांति से कहें तो विनम्र है। फिर बताइए कि आपने क्या मँगाया था।","माफ़ कीजिए, मैंने यह ऑर्डर नहीं किया था। मैंने चिकन मँगाया था।"],"vi":["Đây không phải món tôi gọi.","Nói bình tĩnh thì vẫn lịch sự. Sau đó nói món bạn đã gọi.","Xin lỗi, đây không phải món tôi gọi. Tôi gọi gà mà."]}],["It's a bit cold.","နည်းနည်း အေးနေတယ်။","A bit makes a complaint softer. Ask: Could you heat it up, please?","Excuse me, my soup is a bit cold.","တဆိတ်လောက်၊ ဟင်းချိုက နည်းနည်း အေးနေတယ်။",{"es":["Está un poco frío.","A bit suaviza la queja. Puedes pedir: Could you heat it up, please?","Disculpe, mi sopa está un poco fría."],"fr":["C'est un peu froid.","A bit adoucit la réclamation. Demandez : Could you heat it up, please?","Excusez-moi, ma soupe est un peu froide."],"hi":["यह थोड़ा ठंडा है।","A bit शिकायत को नरम कर देता है। आप कह सकते हैं: Could you heat it up, please?","सुनिए, मेरा सूप थोड़ा ठंडा है।"],"vi":["Hơi nguội một chút.","A bit làm lời phàn nàn nhẹ đi. Bạn có thể nhờ: Could you heat it up, please?","Xin lỗi, canh của tôi hơi nguội một chút."]}]],"tr":{"es":["Durante la comida","Pedir más, o decir con cortesía que algo está mal."],"fr":["Pendant le repas","Demander davantage, ou dire poliment que quelque chose ne va pas."],"hi":["खाने के दौरान","और माँगना, या विनम्रता से बताना कि कुछ गड़बड़ है।"],"vi":["Trong bữa ăn","Xin thêm, hoặc nói một cách lịch sự rằng có gì đó chưa ổn."]}},{"en":"Finishing and paying","my":"စားပြီး ငွေရှင်းခြင်း","desc":"Asking for the bill, taking food home, saying thank you.","cards":[["Could we have the bill, please?","ငွေ ရှင်းမယ်နော်။","Polite. In American English: Could we have the check, please?","Excuse me, could we have the bill, please?","တဆိတ်လောက်၊ ငွေ ရှင်းမယ်နော်။",{"es":["¿Nos trae la cuenta, por favor?","Es cortés. En inglés americano: Could we have the check, please?","Disculpe, ¿nos trae la cuenta, por favor?"],"fr":["Pourrions-nous avoir l'addition, s'il vous plaît ?","Poli. En anglais américain : Could we have the check, please?","Excusez-moi, pourrions-nous avoir l'addition, s'il vous plaît ?"],"hi":["बिल ले आइए।","विनम्र है। अमेरिकी अंग्रेज़ी में: Could we have the check, please?","सुनिए, बिल ले आइए।"],"vi":["Cho chúng tôi xin hóa đơn.","Lịch sự. Trong tiếng Anh Mỹ: Could we have the check, please?","Xin lỗi, cho chúng tôi xin hóa đơn."]}],["Can I pay at the counter?","ကောင်တာမှာ ငွေရှင်းလို့ ရမလား။","In some places you pay at the table, in others at the counter.","Can I pay at the counter, or do you bring the bill?","ကောင်တာမှာ ငွေရှင်းလို့ ရမလား၊ ဒါမှမဟုတ် ဘောက်ချာ ယူလာပေးမလား။",{"es":["¿Puedo pagar en la caja?","En algunos lugares se paga en la mesa; en otros, en la caja.","¿Puedo pagar en la caja, o traen la cuenta?"],"fr":["Je peux payer au comptoir ?","Dans certains endroits on paie à table, dans d'autres au comptoir.","Je peux payer au comptoir, ou vous apportez l'addition ?"],"hi":["क्या मैं काउंटर पर पैसे दे सकता हूँ?","कुछ जगहों पर टेबल पर ही पैसे दिए जाते हैं; कुछ में काउंटर पर।","क्या मैं काउंटर पर पैसे दे सकता हूँ, या आप बिल ले आएँगे?"],"vi":["Tôi trả tiền ở quầy được không?","Có nơi trả tiền tại bàn; có nơi trả ở quầy.","Tôi trả tiền ở quầy được không, hay bạn mang hóa đơn ra?"]}],["Can I take this home?","ဒါ အိမ် ယူသွားလို့ ရမလား။","For food you didn't finish. Also: Can I have a box for this?","I can't finish it. Can I take this home?","မကုန်နိုင်တော့ဘူး။ ဒါ အိမ် ယူသွားလို့ ရမလား။",{"es":["¿Me lo puedo llevar?","Para la comida que no terminaste. También: Can I have a box for this?","No me lo puedo terminar. ¿Me lo puedo llevar?"],"fr":["Je peux emporter le reste ?","Pour ce que vous n'avez pas fini. On dit aussi : Can I have a box for this?","Je n'arrive pas à finir. Je peux emporter le reste ?"],"hi":["क्या मैं इसे घर ले जा सकता हूँ?","उस खाने के लिए जो आप ख़त्म नहीं कर पाए। यह भी: Can I have a box for this?","मुझसे ख़त्म नहीं होगा। क्या मैं इसे घर ले जा सकता हूँ?"],"vi":["Tôi mang cái này về được không?","Cho đồ ăn bạn chưa ăn hết. Cũng có: Can I have a box for this?","Tôi ăn không hết. Tôi mang cái này về được không?"]}],["That was lovely, thank you.","အရမ်း ကောင်းပါတယ်၊ ကျေးဇူးပါ။","What you say to the waiter or cook as you leave.","Thank you, that was lovely. We'll come again.","ကျေးဇူးပါ၊ အရမ်း ကောင်းပါတယ်။ နောက်လည်း လာဦးမယ်။",{"es":["Estuvo delicioso, gracias.","Lo que le dices al mesero o al cocinero al salir.","Gracias, estuvo delicioso. Volveremos."],"fr":["C'était très bon, merci.","Ce que l'on dit au serveur ou au cuisinier en partant.","Merci, c'était très bon. Nous reviendrons."],"hi":["खाना बहुत अच्छा था, धन्यवाद।","निकलते समय वेटर या रसोइए से कहा जाता है।","धन्यवाद, खाना बहुत अच्छा था। हम फिर आएँगे।"],"vi":["Ngon lắm, cảm ơn.","Câu bạn nói với người phục vụ hoặc đầu bếp khi ra về.","Cảm ơn, ngon lắm. Chúng tôi sẽ quay lại."]}]],"tr":{"es":["Terminar y pagar","Pedir la cuenta, llevarte la comida y dar las gracias."],"fr":["Finir et payer","Demander l'addition, emporter les restes, dire merci."],"hi":["ख़त्म करना और पैसे देना","बिल माँगना, खाना घर ले जाना, धन्यवाद कहना।"],"vi":["Ăn xong và thanh toán","Xin hóa đơn, mang đồ ăn về, nói lời cảm ơn."]}}];const langs=["my","es","fr","hi","vi"];const COURSE="eng";</script>
