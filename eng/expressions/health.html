<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/health/";const AUD_EXT="mp3?v=2611170808";const categories=[{"en":"How you feel","my":"ဘယ်လို ခံစားရလဲ","desc":"Telling someone that you are not well, or better again.","cards":[["I don't feel well.","နေမကောင်းဘူး။","The everyday way to say you are ill. Also: I'm not feeling well.","Mum, I don't feel well. Can I stay home?","မေမေ၊ နေမကောင်းဘူး။ အိမ်မှာ နေလို့ ရမလား။",{"es":["No me siento bien.","La manera de todos los días de decir que estás enfermo. También: I'm not feeling well.","Mamá, no me siento bien. ¿Me puedo quedar en casa?"],"fr":["Je ne me sens pas bien.","La façon courante de dire que l'on est malade. On dit aussi : I'm not feeling well.","Maman, je ne me sens pas bien. Je peux rester à la maison ?"]}],["I feel sick.","အန်ချင်သလို ဖြစ်နေတယ်။","In British English it usually means you might vomit. In American English it can just mean ill.","I feel sick. I think I ate too much.","အန်ချင်သလို ဖြစ်နေတယ်။ အများကြီး စားမိသွားလို့ ထင်တယ်။",{"es":["Tengo náuseas.","En inglés británico suele significar que podrías vomitar. En inglés americano puede significar solo enfermo.","Tengo náuseas. Creo que comí demasiado."],"fr":["J'ai mal au cœur.","En anglais britannique, cela veut dire en général que l'on a envie de vomir. En anglais américain, cela peut vouloir dire simplement malade.","J'ai mal au cœur. Je crois que j'ai trop mangé."]}],["I feel dizzy.","ခေါင်းမူးတယ်။","Everything seems to turn around you. Sit down!","I feel dizzy. I need to sit down.","ခေါင်းမူးတယ်။ ထိုင်ဖို့ လိုတယ်။",{"es":["Estoy mareado.","Todo parece dar vueltas a tu alrededor. ¡Siéntate!","Estoy mareado. Necesito sentarme."],"fr":["J'ai la tête qui tourne.","Tout semble tourner autour de vous. Asseyez-vous !","J'ai la tête qui tourne. Il faut que je m'assoie."]}],["I feel better now.","အခု သက်သာသွားပြီ။","After you were ill. Also: I'm much better, thanks.","— How are you today? — I feel better now, thanks.","— ဒီနေ့ ဘယ်လိုလဲ။ — အခု သက်သာသွားပြီ၊ ကျေးဇူးပါ။",{"es":["Ya me siento mejor.","Después de haber estado enfermo. También: I'm much better, thanks.","— ¿Cómo estás hoy? — Ya me siento mejor, gracias."],"fr":["Je me sens mieux maintenant.","Après avoir été malade. On dit aussi : I'm much better, thanks.","— Comment vas-tu aujourd'hui ? — Je me sens mieux maintenant, merci."]}]],"tr":{"es":["Cómo te sientes","Decirle a alguien que no estás bien, o que ya estás mejor."],"fr":["Comment on se sent","Dire à quelqu'un que l'on ne va pas bien, ou que l'on va mieux."]}},{"en":"Pain","my":"နာကျင်ခြင်း","desc":"Saying where it hurts.","cards":[["I have a headache.","ခေါင်းကိုက်တယ်။","Some pains are one word with -ache: headache, stomachache, toothache, earache.","I have a headache. It's too noisy here.","ခေါင်းကိုက်တယ်။ ဒီမှာ ဆူညံလွန်းတယ်။",{"es":["Me duele la cabeza.","Algunos dolores son una sola palabra con -ache: headache, stomachache, toothache, earache.","Me duele la cabeza. Aquí hay demasiado ruido."],"fr":["J'ai mal à la tête.","Certaines douleurs s'écrivent en un mot avec -ache : headache, stomachache, toothache, earache.","J'ai mal à la tête. Il y a trop de bruit ici."]}],["I have a stomachache.","ဗိုက်နာတယ်။","Stomach sounds like stum-uk. Children often say tummy ache.","I have a stomachache. I don't want any lunch.","ဗိုက်နာတယ်။ နေ့လယ်စာ မစားချင်ဘူး။",{"es":["Me duele el estómago.","Stomach suena como stum-uk. Los niños suelen decir tummy ache.","Me duele el estómago. No quiero comer."],"fr":["J'ai mal au ventre.","Stomach se prononce comme stum-uk. Les enfants disent souvent tummy ache.","J'ai mal au ventre. Je ne veux pas déjeuner."]}],["I have a sore throat.","လည်ချောင်း နာတယ်။","Sore = painful. Also: sore eyes, a sore back.","I have a sore throat. It hurts when I swallow.","လည်ချောင်း နာတယ်။ မျိုချရင် နာတယ်။",{"es":["Me duele la garganta.","Sore = adolorido. También: sore eyes, a sore back.","Me duele la garganta. Me duele al tragar."],"fr":["J'ai mal à la gorge.","Sore = douloureux. On dit aussi : sore eyes, a sore back.","J'ai mal à la gorge. Ça fait mal quand j'avale."]}],["It hurts here.","ဒီနေရာ နာတယ်။","Point to the place. Useful when you don't know the English word.","— Where does it hurt? — It hurts here.","— ဘယ်နေရာ နာလဲ။ — ဒီနေရာ နာတယ်။",{"es":["Me duele aquí.","Señala el lugar. Útil cuando no sabes la palabra en inglés.","— ¿Dónde te duele? — Me duele aquí."],"fr":["J'ai mal ici.","Montrez l'endroit. Utile quand on ne connaît pas le mot anglais.","— Où as-tu mal ? — J'ai mal ici."]}],["My <span class=gray>leg<\/span> hurts.","ခြေထောက် နာတယ်။","Body part + hurts. For two: My feet hurt.","I ran too much. My legs hurt.","အများကြီး ပြေးမိလို့ ခြေထောက်တွေ နာတယ်။",{"es":["Me duele la pierna.","Parte del cuerpo + hurts. Para dos: My feet hurt.","Corrí demasiado. Me duelen las piernas."],"fr":["J'ai mal à la jambe.","Partie du corps + hurts. Pour deux : My feet hurt.","J'ai trop couru. J'ai mal aux jambes."]}]],"tr":{"es":["Dolor","Decir dónde te duele."],"fr":["La douleur","Dire où l'on a mal."]}},{"en":"Colds and fever","my":"အအေးမိခြင်းနှင့် ဖျားခြင်း","desc":"The illnesses everyone gets.","cards":[["I have a cold.","အအေးမိနေတယ်။","A cold, with a. Not: I have cold, which means I feel cold.","I have a cold, so I'll stay at home today.","အအေးမိနေလို့ ဒီနေ့ အိမ်မှာပဲ နေမယ်။",{"es":["Tengo un resfriado.","A cold, con a. No: I have cold, que significaría tengo frío.","Tengo un resfriado, así que hoy me quedo en casa."],"fr":["J'ai un rhume.","A cold, avec a. Pas : I have cold, qui voudrait dire j'ai froid.","J'ai un rhume, alors je reste à la maison aujourd'hui."]}],["I have a fever.","ဖျားနေတယ်။","Your body is very hot. British English also says I have a temperature.","I have a fever and my head hurts.","ဖျားနေပြီး ခေါင်းလည်း ကိုက်တယ်။",{"es":["Tengo fiebre.","Tu cuerpo está muy caliente. En inglés británico también se dice I have a temperature.","Tengo fiebre y me duele la cabeza."],"fr":["J'ai de la fièvre.","Votre corps est très chaud. L'anglais britannique dit aussi I have a temperature.","J'ai de la fièvre et mal à la tête."]}],["I have a cough.","ချောင်းဆိုးနေတယ်။","Cough sounds like koff.","I have a bad cough at night.","ညဘက်ဆို ချောင်း အရမ်း ဆိုးတယ်။",{"es":["Tengo tos.","Cough suena como koff.","En la noche tengo mucha tos."],"fr":["Je tousse.","Cough se prononce comme koff.","Je tousse beaucoup la nuit."]}],["I have a runny nose.","နှာရည် ယိုနေတယ်။","Water keeps coming from your nose. You need a tissue!","I have a runny nose. Do you have a tissue?","နှာရည် ယိုနေတယ်။ တစ်ရှူး ပါလား။",{"es":["Tengo escurrimiento nasal.","No deja de salirte agua de la nariz. ¡Necesitas un pañuelo!","Me escurre la nariz. ¿Tienes un pañuelo?"],"fr":["J'ai le nez qui coule.","Votre nez n'arrête pas de couler. Il vous faut un mouchoir !","J'ai le nez qui coule. Tu as un mouchoir ?"]}]],"tr":{"es":["Resfriados y fiebre","Las enfermedades que a todos nos dan."],"fr":["Rhume et fièvre","Les maladies que tout le monde attrape."]}},{"en":"At the doctor and the pharmacy","my":"ဆရာဝန်နှင့် ဆေးဆိုင်မှာ","desc":"What you say, and what the doctor or pharmacist asks.","cards":[["I need to see a doctor.","ဆရာဝန်နဲ့ ပြဖို့ လိုတယ်။","See a doctor = visit a doctor. Not: I need to meet a doctor.","I've had a fever for three days. I need to see a doctor.","သုံးရက်လောက် ဖျားနေတယ်။ ဆရာဝန်နဲ့ ပြဖို့ လိုတယ်။",{"es":["Necesito ver a un médico.","See a doctor = ir a consulta. No: I need to meet a doctor.","Llevo tres días con fiebre. Necesito ver a un médico."],"fr":["Je dois voir un médecin.","See a doctor = consulter un médecin. Pas : I need to meet a doctor.","J'ai de la fièvre depuis trois jours. Je dois voir un médecin."]}],["What's the matter?","ဘယ်လို ဖြစ်နေလဲ။","What a doctor or nurse asks first. Answer with the problem: I have a…","— What's the matter? — I have a sore throat.","— ဘယ်လို ဖြစ်နေလဲ။ — လည်ချောင်း နာတယ်။",{"es":["¿Qué le pasa?","Lo primero que pregunta un médico o una enfermera. Responde con el problema: I have a…","— ¿Qué le pasa? — Me duele la garganta."],"fr":["Qu'est-ce qui ne va pas ?","La première question du médecin ou de l'infirmière. Répondez par le problème : I have a…","— Qu'est-ce qui ne va pas ? — J'ai mal à la gorge."]}],["How long have you felt like this?","ဒီလို ဖြစ်နေတာ ဘယ်လောက် ကြာပြီလဲ။","Answer with for or since: For two days. Since Monday.","— How long have you felt like this? — Since yesterday.","— ဒီလို ဖြစ်နေတာ ဘယ်လောက် ကြာပြီလဲ။ — မနေ့ကတည်းကပါ။",{"es":["¿Desde cuándo se siente así?","Responde con for o since: For two days. Since Monday.","— ¿Desde cuándo se siente así? — Desde ayer."],"fr":["Depuis quand vous sentez-vous ainsi ?","Répondez avec for ou since : For two days. Since Monday.","— Depuis quand vous sentez-vous ainsi ? — Depuis hier."]}],["Take this medicine twice a day.","ဒီဆေးကို တစ်နေ့ နှစ်ခါ သောက်ပါ။","Once a day, twice a day, three times a day.","Take this medicine twice a day, after meals.","ဒီဆေးကို တစ်နေ့ နှစ်ခါ၊ ထမင်းစားပြီးမှ သောက်ပါ။",{"es":["Tome este medicamento dos veces al día.","Once a day, twice a day, three times a day.","Tome este medicamento dos veces al día, después de comer."],"fr":["Prenez ce médicament deux fois par jour.","Once a day, twice a day, three times a day.","Prenez ce médicament deux fois par jour, après les repas."]}],["Do you have something for <span class=gray>a headache<\/span>?","ခေါင်းကိုက်တာအတွက် ဆေး ရှိလား။","At a pharmacy, when you don't know the medicine's name.","Do you have something for a cough?","ချောင်းဆိုးတာအတွက် ဆေး ရှိလား။",{"es":["¿Tiene algo para el dolor de cabeza?","En una farmacia, cuando no sabes el nombre del medicamento.","¿Tiene algo para la tos?"],"fr":["Vous avez quelque chose contre le mal de tête ?","À la pharmacie, quand on ne connaît pas le nom du médicament.","Vous avez quelque chose contre la toux ?"]}],["Are you allergic to anything?","ဘာနဲ့ မတည့်တာ ရှိလဲ။","Allergic = your body reacts badly to it. Answer: I'm allergic to peanuts.","— Are you allergic to anything? — Yes, to penicillin.","— ဘာနဲ့ မတည့်တာ ရှိလဲ။ — ဟုတ်ကဲ့၊ ပင်နီစလင်နဲ့ မတည့်ပါဘူး။",{"es":["¿Es alérgico a algo?","Allergic = tu cuerpo reacciona mal a eso. Respuesta: I'm allergic to peanuts.","— ¿Es alérgico a algo? — Sí, a la penicilina."],"fr":["Êtes-vous allergique à quelque chose ?","Allergic = votre corps y réagit mal. Réponse : I'm allergic to peanuts.","— Êtes-vous allergique à quelque chose ? — Oui, à la pénicilline."]}]],"tr":{"es":["Con el médico y en la farmacia","Lo que dices tú, y lo que pregunta el médico o el farmacéutico."],"fr":["Chez le médecin et à la pharmacie","Ce que vous dites, et ce que demande le médecin ou le pharmacien."]}},{"en":"Small accidents","my":"အသေးစား မတော်တဆမှုများ","desc":"Cuts, falls and bumps, at home, at school or playing.","cards":[["I cut my finger.","လက်ချောင်း ရှသွားတယ်။","Cut is the same in the past: I cut it yesterday.","Ouch! I cut my finger on the paper.","အား၊ စက္ကူနဲ့ လက်ချောင်း ရှသွားတယ်။",{"es":["Me corté el dedo.","Cut es igual en pasado: I cut it yesterday.","¡Ay! Me corté el dedo con el papel."],"fr":["Je me suis coupé le doigt.","Cut ne change pas au passé : I cut it yesterday.","Aïe ! Je me suis coupé le doigt avec le papier."]}],["I fell over.","လဲကျသွားတယ်။","You fell to the ground. Also: I fell off my bike.","I fell over in the playground.","ကစားကွင်းမှာ လဲကျသွားတယ်။",{"es":["Me caí.","Te caíste al suelo. También: I fell off my bike.","Me caí en el patio de la escuela."],"fr":["Je suis tombé.","Vous êtes tombé par terre. On dit aussi : I fell off my bike.","Je suis tombé dans la cour de récréation."]}],["I hurt my <span class=gray>knee<\/span>.","ဒူး ဒဏ်ရာ ရသွားတယ်။","Hurt + body part = injured it. Hurt is the same in the past.","I hurt my knee playing football.","ဘောလုံး ကန်ရင်း ဒူး ဒဏ်ရာ ရသွားတယ်။",{"es":["Me lastimé la rodilla.","Hurt + parte del cuerpo = te la lastimaste. Hurt es igual en pasado.","Me lastimé la rodilla jugando fútbol."],"fr":["Je me suis fait mal au genou.","Hurt + partie du corps = se blesser. Hurt ne change pas au passé.","Je me suis fait mal au genou en jouant au foot."]}],["Can I have a plaster?","ပလာစတာ တစ်ခု ရနိုင်မလား။","A small sticky bandage for a cut. American English: a Band-Aid.","My finger is bleeding. Can I have a plaster?","လက်ချောင်းက သွေးထွက်နေတယ်။ ပလာစတာ တစ်ခု ရနိုင်မလား။",{"es":["¿Me da una curita?","Una venda pequeña y adhesiva para una cortada. En inglés americano: a Band-Aid.","Me sangra el dedo. ¿Me da una curita?"],"fr":["Je peux avoir un pansement ?","Un petit pansement adhésif pour une coupure. En anglais américain : a Band-Aid.","Mon doigt saigne. Je peux avoir un pansement ?"]}]],"tr":{"es":["Accidentes pequeños","Cortadas, caídas y golpes, en casa, en la escuela o jugando."],"fr":["Petits accidents","Coupures, chutes et bosses, à la maison, à l'école ou en jouant."]}}];const langs=["my","es","fr"];const COURSE="eng";</script>
