<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/i_mean/";const AUD_EXT="mp3?v=2611241433";const categories=[{"en":"Correcting yourself","my":"ကိုယ့်စကားကို ပြန်ပြင်ခြင်း","desc":"Fixing what you just said: a wrong word, a wrong fact, or something that came out too strong.","cards":[["I mean…","ဆိုလိုတာက…","The quickest way to fix or sharpen what you just said. Very common in speech. Not: I am meaning.","It starts at six. I mean, at seven.","ခြောက်နာရီမှာ စမယ်။ ဆိုလိုတာက ခုနစ်နာရီမှာ။",{"es":["O sea…","La manera más rápida de corregir o precisar lo que acabas de decir. Muy común al hablar. No: I am meaning.","Empieza a las seis. O sea, a las siete."],"fr":["Je veux dire…","La façon la plus rapide de corriger ou de préciser ce que l'on vient de dire. Très courant à l'oral. Pas : I am meaning.","Ça commence à six heures. Je veux dire, à sept heures."]}],["Sorry, I meant <span class=gray>Tuesday<\/span>.","ဆောရီး၊ အင်္ဂါနေ့လို့ ပြောချင်တာ။","Meant (say ‘ment’) is the past of mean. Use it when you notice the mistake a moment later.","Did I say Monday? Sorry, I meant Tuesday.","တနင်္လာနေ့လို့ ပြောလိုက်မိလား။ ဆောရီး၊ အင်္ဂါနေ့လို့ ပြောချင်တာ။",{"es":["Perdón, quise decir el martes.","Meant (se dice ‘ment’) es el pasado de mean. Úsalo cuando notas el error un momento después.","¿Dije lunes? Perdón, quise decir el martes."],"fr":["Pardon, je voulais dire mardi.","Meant (prononcez « ment ») est le passé de mean. À employer quand vous remarquez l'erreur un instant plus tard.","J'ai dit lundi ? Pardon, je voulais dire mardi."]}],["Actually…","တကယ်တော့…","Gives the real fact, correcting yourself or the other person. Careful: actually does not mean ‘now’. For ‘now’, say currently or at the moment.","I saw him yesterday. Actually, it was two days ago.","မနေ့က သူ့ကို တွေ့တယ်။ တကယ်တော့ တမြန်နေ့ကပါ။",{"es":["En realidad…","Da el dato real, corrigiéndote a ti o a la otra persona. Cuidado: actually no significa ‘actualmente’. Para eso se dice currently o at the moment.","Lo vi ayer. En realidad, fue hace dos días."],"fr":["En fait…","Donne le fait exact, pour se corriger ou corriger l'autre. Attention : actually ne veut pas dire « actuellement ». Pour cela, on dit currently ou at the moment.","Je l'ai vu hier. En fait, c'était il y a deux jours."]}],["Or rather…","ပိုမှန်အောင် ပြောရရင်…","Swaps in a more exact word. A little careful. Common in writing too.","He's angry, or rather, disappointed.","သူ စိတ်ဆိုးနေတယ်၊ ပိုမှန်အောင် ပြောရရင် စိတ်ပျက်နေတာ။",{"es":["O más bien…","Cambia una palabra por otra más exacta. Algo cuidado. Común también por escrito.","Está enojado, o más bien, decepcionado."],"fr":["Ou plutôt…","Remplace un mot par un autre plus exact. Assez soigné. Courant à l'écrit aussi.","Il est en colère, ou plutôt, déçu."]}],["Well, not exactly.","အင်း… အတိအကျတော့ မဟုတ်ဘူး။","Takes back part of what you said.","It's free. Well, not exactly. You pay for delivery.","အခမဲ့ပါ။ အင်း… အတိအကျတော့ မဟုတ်ဘူး။ ပို့ခတော့ ပေးရတယ်။",{"es":["Bueno, no exactamente.","Retira parte de lo que dijiste.","Es gratis. Bueno, no exactamente. Pagas el envío."],"fr":["Enfin, pas exactement.","Retire une partie de ce que vous avez dit.","C'est gratuit. Enfin, pas exactement. Vous payez la livraison."]}]],"tr":{"es":["Corregirte","Arreglar lo que acabas de decir: una palabra equivocada, un dato equivocado o algo que salió demasiado fuerte."],"fr":["Se corriger","Rattraper ce que l'on vient de dire : un mot inexact, un fait erroné, ou une formule trop forte."]}},{"en":"Explaining it another way","my":"တစ်မျိုးပြောင်း ရှင်းပြခြင်း","desc":"Saying the same thing again, more clearly or more simply.","cards":[["In other words…","တစ်နည်းအားဖြင့်…","Says it again in plainer words. Often it gives the conclusion the other person has not said out loud.","He never answers my messages. In other words, he isn't interested.","သူ ကျွန်မ မက်ဆေ့ချ်တွေကို ဘယ်တော့မှ ပြန်မဖြေဘူး။ တစ်နည်းအားဖြင့် စိတ်မဝင်စားဘူးပေါ့။",{"es":["En otras palabras…","Lo dice otra vez con palabras más sencillas. A menudo da la conclusión que la otra persona no dijo en voz alta.","Nunca contesta mis mensajes. En otras palabras, no le interesa."],"fr":["Autrement dit…","Le redit en mots plus simples. Donne souvent la conclusion que l'autre n'a pas dite tout haut.","Il ne répond jamais à mes messages. Autrement dit, ça ne l'intéresse pas."]}],["What I mean is…","ကျွန်တော်/ကျွန်မ ဆိုလိုတာက…","Steps back to make your point clearly, often after someone has misunderstood you.","What I mean is, we should wait a little.","ကျွန်တော် ဆိုလိုတာက နည်းနည်း စောင့်သင့်တယ်။",{"es":["Lo que quiero decir es…","Das un paso atrás para dejar clara tu idea, a menudo después de un malentendido.","Lo que quiero decir es que deberíamos esperar un poco."],"fr":["Ce que je veux dire, c'est…","On prend du recul pour clarifier son idée, souvent après un malentendu.","Ce que je veux dire, c'est qu'on devrait attendre un peu."]}],["That is…","ဆိုလိုတာကတော့…","Adds the exact meaning. Rather formal. In writing you will see i.e., which means the same.","She works from home, that is, she never goes to the office.","သူ အိမ်ကနေ အလုပ်လုပ်တယ်၊ ဆိုလိုတာကတော့ ရုံးကို ဘယ်တော့မှ မသွားဘူး။",{"es":["Es decir…","Agrega el significado exacto. Bastante formal. Por escrito verás i.e., que significa lo mismo.","Trabaja desde su casa, es decir, nunca va a la oficina."],"fr":["C'est-à-dire…","Ajoute le sens exact. Plutôt formel. À l'écrit, vous verrez i.e., qui veut dire la même chose.","Elle travaille de chez elle, c'est-à-dire qu'elle ne va jamais au bureau."]}],["Meaning?","ဘာကို ဆိုလိုတာလဲ။","A one-word question that asks the other person to explain. Let your voice go up. Friendly, but it can sound like a challenge.","— I've made a decision. — Meaning?","— ဆုံးဖြတ်ချက် ချလိုက်ပြီ။ — ဘာကို ဆိုလိုတာလဲ။",{"es":["¿O sea?","Una pregunta de una sola palabra que le pide a la otra persona que explique. Deja que la voz suba. Amistosa, pero puede sonar a desafío.","— Tomé una decisión. — ¿O sea?"],"fr":["C'est-à-dire ?","Une question en un mot qui demande à l'autre de s'expliquer. Laissez la voix monter. Amical, mais on peut y entendre un défi.","— J'ai pris une décision. — C'est-à-dire ?"]}],["Let me put it another way.","တစ်မျိုးပြောင်း ပြောကြည့်မယ်။","For when your first explanation did not work. Put here means say.","Let me put it another way. We have no money left.","တစ်မျိုးပြောင်း ပြောကြည့်မယ်။ ပိုက်ဆံ မကျန်တော့ဘူး။",{"es":["Déjame decirlo de otra manera.","Para cuando tu primera explicación no funcionó. Put aquí significa decir.","Déjame decirlo de otra manera. Ya no nos queda dinero."],"fr":["Je vais le dire autrement.","Pour quand votre première explication n'a pas marché. Put veut dire ici dire.","Je vais le dire autrement. Il ne nous reste plus d'argent."]}]],"tr":{"es":["Explicarlo de otra manera","Decir lo mismo otra vez, con más claridad o más sencillez."],"fr":["L'expliquer autrement","Redire la même chose, plus clairement ou plus simplement."]}},{"en":"Searching for words","my":"စကားလုံး ရှာခြင်း","desc":"Buying time, or softening something that is hard to say.","cards":[["How can I put it…","ဘယ်လိုပြောရမလဲ…","A pause while you look for the right words, often before something delicate. Also: How shall I put this?","He's… how can I put it… not very careful.","သူက… ဘယ်လိုပြောရမလဲ… သိပ်ဂရုမစိုက်တတ်ဘူး။",{"es":["Cómo te lo digo…","Una pausa mientras buscas las palabras adecuadas, a menudo antes de algo delicado. También: How shall I put this?","Es… cómo te lo digo… no muy cuidadoso."],"fr":["Comment dire…","Une pause pendant que l'on cherche les bons mots, souvent avant quelque chose de délicat. On dit aussi : How shall I put this?","Il est… comment dire… pas très soigneux."]}],["I don't know how to say this.","ဒါကို ဘယ်လိုပြောရမှန်း မသိဘူး။","Said before bad news, or before something personal.","I don't know how to say this, but I lost your book.","ဘယ်လိုပြောရမှန်း မသိဘူး၊ ဒါပေမဲ့ မင်းစာအုပ် ပျောက်သွားတယ်။",{"es":["No sé cómo decir esto.","Se dice antes de una mala noticia, o antes de algo personal.","No sé cómo decir esto, pero perdí tu libro."],"fr":["Je ne sais pas comment le dire.","Se dit avant une mauvaise nouvelle, ou avant quelque chose de personnel.","Je ne sais pas comment le dire, mais j'ai perdu ton livre."]}],["Let's say…","ဆိုပါတော့…","Softens an answer when the plain one would be too blunt. Also: Let's just say…","— Did you like the food? — Let's say I wasn't very hungry.","— အစားအသောက် ကြိုက်လား။ — ဆိုပါတော့… သိပ်မဆာလို့ပါ။",{"es":["Digamos que…","Suaviza una respuesta cuando la directa sería demasiado brusca. También: Let's just say…","— ¿Te gustó la comida? — Digamos que no tenía mucha hambre."],"fr":["Disons que…","Adoucit une réponse quand la version directe serait trop brutale. On dit aussi : Let's just say…","— Tu as aimé le repas ? — Disons que je n'avais pas très faim."]}],["Sort of.","အဲလိုမျိုးပေါ့။","Says a word is only roughly right. On its own, a careful yes. Also Kind of. In fast speech: sorta, kinda.","— Is he your boss? — Sort of. He's my team leader.","— သူက မင်းရဲ့ သူဌေးလား။ — အဲလိုမျိုးပေါ့။ အဖွဲ့ခေါင်းဆောင်ပါ။",{"es":["Más o menos.","Dice que una palabra es solo aproximada. Sola, es un sí prudente. También Kind of. Al hablar rápido: sorta, kinda.","— ¿Es tu jefe? — Más o menos. Es el líder de mi equipo."],"fr":["En quelque sorte.","Dit qu'un mot n'est qu'approximatif. Seul, c'est un oui prudent. Aussi Kind of. En parlant vite : sorta, kinda.","— C'est ton chef ? — En quelque sorte. C'est mon chef d'équipe."]}]],"tr":{"es":["Buscar las palabras","Ganar tiempo, o suavizar algo difícil de decir."],"fr":["Chercher ses mots","Gagner du temps, ou adoucir quelque chose de difficile à dire."]}},{"en":"Fillers and softeners","my":"အပြောစကားများ","desc":"Small spoken words that fill a pause, or take the edge off what you just said.","cards":[["Like…","ဆိုတော့… / လောက်","A very informal filler for an example or a rough idea. Young people use it a lot. Do not use it in writing or in exams.","It was, like, two hours late.","နှစ်နာရီလောက်ကို နောက်ကျတာ။",{"es":["Como que…","Una muletilla muy informal para un ejemplo o una idea aproximada. Los jóvenes la usan mucho. No la uses al escribir ni en exámenes.","Llegó, como que, dos horas tarde."],"fr":["Genre…","Un mot de remplissage très familier pour un exemple ou une idée approximative. Les jeunes l'emploient beaucoup. À éviter à l'écrit et aux examens.","Il avait, genre, deux heures de retard."]}],["Well…","အင်း…","The pause before an answer, often an awkward one. Also Um… and Er…","Well… I'm not sure.","အင်း… မသေချာဘူး။",{"es":["Pues…","La pausa antes de una respuesta, a menudo incómoda. También Um… y Er…","Pues… no estoy seguro."],"fr":["Eh bien…","La pause avant une réponse, souvent embarrassée. Aussi Um… et Er…","Eh bien… je ne suis pas sûr."]}],["Mind you…","ဒါပေမဲ့လည်း…","Adds a ‘but’ to what you just said. British English. Americans say Then again…","It's expensive. Mind you, the quality is good.","ဈေးကြီးတယ်။ ဒါပေမဲ့လည်း အရည်အသွေးတော့ ကောင်းတယ်။",{"es":["Eso sí…","Agrega un ‘pero’ a lo que acabas de decir. Inglés británico. Los estadounidenses dicen Then again…","Es caro. Eso sí, la calidad es buena."],"fr":["Remarque…","Ajoute un « mais » à ce que vous venez de dire. Anglais britannique. Les Américains disent Then again…","C'est cher. Remarque, la qualité est bonne."]}],["That said…","ဒါပေမဲ့…","Balances what came before with a point on the other side. Also: Having said that…","He's often late. That said, he works hard.","သူ ခဏခဏ နောက်ကျတယ်။ ဒါပေမဲ့ အလုပ်တော့ ကြိုးစားတယ်။",{"es":["Dicho esto…","Equilibra lo anterior con un punto del otro lado. También: Having said that…","Suele llegar tarde. Dicho esto, trabaja duro."],"fr":["Cela dit…","Équilibre ce qui précède par un argument dans l'autre sens. On dit aussi : Having said that…","Il est souvent en retard. Cela dit, il travaille dur."]}]],"tr":{"es":["Muletillas y suavizadores","Palabritas del habla que llenan una pausa, o le quitan filo a lo que acabas de decir."],"fr":["Mots de remplissage et adoucisseurs","De petits mots de l'oral qui comblent une pause, ou arrondissent ce que l'on vient de dire."]}},{"en":"Checking they follow","my":"နားလည်ရဲ့လား စစ်ခြင်း","desc":"Making sure the listener is still with you.","cards":[["You know…","သိတယ်မလား…","Checks that the listener is following, or fills a pause. Used too often, it sounds unsure.","It's, you know, a bit difficult.","နည်းနည်း ခက်တယ်လေ၊ သိတယ်မလား။",{"es":["Ya sabes…","Comprueba que quien escucha te sigue, o llena una pausa. Usado demasiado, suena inseguro.","Es, ya sabes, un poco difícil."],"fr":["Tu sais…","Vérifie que l'autre suit, ou comble une pause. Trop répété, cela donne un air hésitant.","C'est, tu sais, un peu difficile."]}],["You know what I mean?","ဘာပြောချင်လဲ သိတယ်မလား။","Asks whether your point got across, or the thing you did not say out loud.","He's nice, but… you know what I mean?","သူက သဘောကောင်းပါတယ်၊ ဒါပေမဲ့… ဘာပြောချင်လဲ သိတယ်မလား။",{"es":["¿Me entiendes?","Pregunta si tu idea se entendió, o lo que no dijiste en voz alta.","Es simpático, pero… ¿me entiendes?"],"fr":["Tu vois ce que je veux dire ?","Demande si votre idée est passée, ou ce que vous n'avez pas dit tout haut.","Il est sympa, mais… tu vois ce que je veux dire ?"]}],["Does that make sense?","ရှင်းလား။","A polite check after an explanation. Kinder than Do you understand?, which can sound like a strict teacher.","Turn left, then right at the bank. Does that make sense?","ဘယ်ကွေ့၊ ပြီးရင် ဘဏ်နားမှာ ညာကွေ့။ ရှင်းလား။",{"es":["¿Me explico?","Una comprobación cortés después de una explicación. Más amable que Do you understand?, que puede sonar a maestro estricto.","Gire a la izquierda y luego a la derecha en el banco. ¿Me explico?"],"fr":["C'est clair ?","Une vérification polie après une explication. Plus aimable que Do you understand?, qui peut faire professeur sévère.","Tournez à gauche, puis à droite à la banque. C'est clair ?"]}]],"tr":{"es":["Comprobar que te siguen","Asegurarte de que quien te escucha sigue contigo."],"fr":["Vérifier que l'on vous suit","S'assurer que la personne qui écoute vous suit toujours."]}}];const langs=["my","es","fr"];const COURSE="eng";</script>
