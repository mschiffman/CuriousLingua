<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/concern/";const AUD_EXT="mp3?v=2611251024";const categories=[{"en":"Asking what's wrong","my":"ဘာဖြစ်လို့လဲ မေးခြင်း","desc":"The first questions when someone looks hurt, sad or upset.","cards":[["Are you okay?","အဆင်ပြေရဲ့လား။","The first question to ask. Also: Are you all right?","You fell! Are you okay?","လဲကျသွားတာပဲ။ အဆင်ပြေရဲ့လား။",{"es":["¿Estás bien?","La primera pregunta que hay que hacer. También: Are you all right?","¡Te caíste! ¿Estás bien?"],"fr":["Ça va ?","La première question à poser. On dit aussi : Are you all right?","Tu es tombé ! Ça va ?"]}],["What's wrong?","ဘာဖြစ်လို့လဲ။","Asks gently what the problem is.","You're not eating. What's wrong?","ထမင်းမစားဘူးနော်။ ဘာဖြစ်လို့လဲ။",{"es":["¿Qué te pasa?","Pregunta con suavidad cuál es el problema.","No estás comiendo. ¿Qué te pasa?"],"fr":["Qu'est-ce qui ne va pas ?","Demande doucement quel est le problème.","Tu ne manges pas. Qu'est-ce qui ne va pas ?"]}],["What's the matter?","ဘာဖြစ်တာလဲ။","The same meaning as What's wrong?, a little softer.","You look sad. What's the matter?","ဝမ်းနည်းနေပုံပဲ။ ဘာဖြစ်တာလဲ။",{"es":["¿Qué tienes?","El mismo significado que What's wrong?, un poco más suave.","Te ves triste. ¿Qué tienes?"],"fr":["Qu'est-ce qu'il y a ?","Même sens que What's wrong?, en un peu plus doux.","Tu as l'air triste. Qu'est-ce qu'il y a ?"]}],["What happened?","ဘာဖြစ်ခဲ့တာလဲ။","Asks about something that is finished: an accident, a fall, bad news.","Your knee is bleeding! What happened?","ဒူးက သွေးထွက်နေတယ်။ ဘာဖြစ်ခဲ့တာလဲ။",{"es":["¿Qué pasó?","Pregunta por algo que ya terminó: un accidente, una caída, una mala noticia.","¡Te sangra la rodilla! ¿Qué pasó?"],"fr":["Qu'est-ce qui s'est passé ?","Porte sur quelque chose de terminé : un accident, une chute, une mauvaise nouvelle.","Ton genou saigne ! Qu'est-ce qui s'est passé ?"]}],["Is everything all right?","အားလုံး အဆင်ပြေရဲ့လား။","Polite. Good for people you do not know well.","You left early yesterday. Is everything all right?","မနေ့က စောစော ပြန်သွားတယ်နော်။ အားလုံး အဆင်ပြေရဲ့လား။",{"es":["¿Todo está bien?","Cortés. Bueno con personas que no conoces bien.","Ayer se fue temprano. ¿Todo está bien?"],"fr":["Tout va bien ?","Poli. Bien avec les personnes que vous connaissez peu.","Vous êtes parti tôt hier. Tout va bien ?"]}]],"tr":{"es":["Preguntar qué pasa","Las primeras preguntas cuando alguien se ve herido, triste o alterado."],"fr":["Demander ce qui ne va pas","Les premières questions quand quelqu'un semble blessé, triste ou bouleversé."]}},{"en":"Saying what you notice","my":"သတိထားမိတာကို ပြောခြင်း","desc":"Telling someone, kindly, that you can see something is not right.","cards":[["You look tired.","ပင်ပန်းနေပုံပဲ။","You look + adjective: tired, sad, pale, worried. Not: You look tiredly.","You look tired. Did you sleep well?","ပင်ပန်းနေပုံပဲ။ ကောင်းကောင်း အိပ်ရရဲ့လား။",{"es":["Te ves cansado.","You look + adjetivo: tired, sad, pale, worried. No: You look tiredly.","Te ves cansado. ¿Dormiste bien?"],"fr":["Tu as l'air fatigué.","You look + adjectif : tired, sad, pale, worried. Pas : You look tiredly.","Tu as l'air fatigué. Tu as bien dormi ?"]}],["You don't look well.","နေမကောင်းတဲ့ပုံပဲ။","Well here means healthy.","You don't look well. Do you want to go home?","နေမကောင်းတဲ့ပုံပဲ။ အိမ်ပြန်ချင်လား။",{"es":["No te ves bien.","Well aquí significa sano.","No te ves bien. ¿Quieres irte a tu casa?"],"fr":["Tu n'as pas l'air bien.","Well veut dire ici en bonne santé.","Tu n'as pas l'air bien. Tu veux rentrer chez toi ?"]}],["Are you sure?","သေချာလား။","Ask again when someone says I'm fine but does not look fine.","“I'm fine.” “Are you sure? You're very quiet.”","“အဆင်ပြေပါတယ်။” “သေချာလား။ အရမ်း တိတ်နေတယ်နော်။”",{"es":["¿Seguro?","Pregunta otra vez cuando alguien dice I'm fine pero no se ve bien.","— Estoy bien. — ¿Seguro? Estás muy callado."],"fr":["Tu es sûr ?","Redemandez quand quelqu'un dit I'm fine sans en avoir l'air.","— Ça va. — Tu es sûr ? Tu es bien silencieux."]}],["Is something bothering you?","တစ်ခုခု စိတ်ပူစရာ ရှိလား။","Bother: to make someone worried or unhappy.","You keep looking at your phone. Is something bothering you?","ဖုန်းကိုပဲ ခဏခဏ ကြည့်နေတယ်။ တစ်ခုခု စိတ်ပူစရာ ရှိလား။",{"es":["¿Algo te preocupa?","Bother: preocupar o poner triste a alguien.","No dejas de mirar tu teléfono. ¿Algo te preocupa?"],"fr":["Quelque chose te tracasse ?","Bother : inquiéter ou rendre malheureux.","Tu n'arrêtes pas de regarder ton téléphone. Quelque chose te tracasse ?"]}],["Does it hurt?","နာလား။","For the body: a cut, a fall, a headache.","You hit your head. Does it hurt?","ခေါင်း ထိမိသွားတယ်။ နာလား။",{"es":["¿Te duele?","Para el cuerpo: una cortada, una caída, un dolor de cabeza.","Te pegaste en la cabeza. ¿Te duele?"],"fr":["Ça fait mal ?","Pour le corps : une coupure, une chute, un mal de tête.","Tu t'es cogné la tête. Ça fait mal ?"]}]],"tr":{"es":["Decir lo que notas","Decirle a alguien, con amabilidad, que ves que algo no anda bien."],"fr":["Dire ce que l'on remarque","Dire gentiment à quelqu'un que l'on voit que quelque chose ne va pas."]}},{"en":"Worrying about someone","my":"တစ်ယောက်ယောက်အတွက် စိတ်ပူခြင်း","desc":"When you do not know if a person is safe or well.","cards":[["I'm worried about you.","မင်းအတွက် စိတ်ပူတယ်။","Worried about + a person or a thing.","You work too much. I'm worried about you.","မင်း အလုပ်တွေ အရမ်းလုပ်တယ်။ မင်းအတွက် စိတ်ပူတယ်။",{"es":["Me preocupas.","Worried about + una persona o una cosa.","Trabajas demasiado. Me preocupas."],"fr":["Je m'inquiète pour toi.","Worried about + une personne ou une chose.","Tu travailles trop. Je m'inquiète pour toi."]}],["I was so worried!","အရမ်း စိတ်ပူနေတာ။","Said when the person is back, or safe at last.","You're home! I was so worried!","ပြန်ရောက်ပြီပဲ။ အရမ်း စိတ်ပူနေတာ။",{"es":["¡Estaba muy preocupado!","Se dice cuando la persona ya regresó, o por fin está a salvo.","¡Ya llegaste! ¡Estaba muy preocupado!"],"fr":["J'étais tellement inquiet !","Se dit quand la personne est revenue, ou enfin en sécurité.","Tu es rentré ! J'étais tellement inquiet !"]}],["What if <span class=gray>he's sick<\/span>?","သူ နေမကောင်းဖြစ်နေရင်ကော။","What if…? imagines something bad that is possible.","She's not answering. What if she's lost?","သူ ဖုန်းမကိုင်ဘူး။ လမ်းပျောက်နေရင်ကော။",{"es":["¿Y si está enfermo?","What if…? imagina algo malo que es posible.","No contesta. ¿Y si se perdió?"],"fr":["Et s'il était malade ?","What if…? imagine quelque chose de fâcheux qui est possible.","Elle ne répond pas. Et si elle s'était perdue ?"]}],["I hope everything's okay.","အားလုံး အဆင်ပြေပါစေ။","Kind to say or write when you do not know yet.","I heard about your mother. I hope everything's okay.","မင်းအမေအကြောင်း ကြားတယ်။ အားလုံး အဆင်ပြေပါစေ။",{"es":["Espero que todo esté bien.","Amable para decir o escribir cuando todavía no sabes.","Supe lo de tu mamá. Espero que todo esté bien."],"fr":["J'espère que tout va bien.","Gentil à dire ou à écrire quand on ne sait pas encore.","J'ai appris pour ta mère. J'espère que tout va bien."]}],["That's a relief!","စိတ်အေးသွားပြီ။","Said when the worry is over.","“The doctor says it's nothing.” “That's a relief!”","“ဆရာဝန်က ဘာမှ မဖြစ်ဘူးတဲ့။” “စိတ်အေးသွားပြီ။”",{"es":["¡Qué alivio!","Se dice cuando la preocupación ya pasó.","— El médico dice que no es nada. — ¡Qué alivio!"],"fr":["Quel soulagement !","Se dit quand l'inquiétude est passée.","— Le médecin dit que ce n'est rien. — Quel soulagement !"]}]],"tr":{"es":["Preocuparse por alguien","Cuando no sabes si una persona está a salvo o está bien."],"fr":["S'inquiéter pour quelqu'un","Quand on ne sait pas si une personne est en sécurité ou va bien."]}},{"en":"Showing you care","my":"ဂရုစိုက်ကြောင်း ပြခြင်း","desc":"What to say when you hear bad news, big or small.","cards":[["Oh no!","ဟာ၊ ဒုက္ခပါပဲ။","The natural first reaction to bad news.","“I lost my wallet.” “Oh no!”","“ပိုက်ဆံအိတ် ပျောက်သွားတယ်။” “ဟာ၊ ဒုက္ခပါပဲ။”",{"es":["¡Ay, no!","La primera reacción natural ante una mala noticia.","— Perdí mi cartera. — ¡Ay, no!"],"fr":["Oh non !","La première réaction naturelle à une mauvaise nouvelle.","— J'ai perdu mon portefeuille. — Oh non !"]}],["Poor thing!","သနားစရာလေး။","Warm and informal: for a friend, a child, an animal. Not for your boss.","“She has a fever.” “Poor thing!”","“သူ ဖျားနေတယ်။” “သနားစရာလေး။”",{"es":["¡Pobrecito!","Cálido e informal: para un amigo, un niño, un animal. No para tu jefe.","— Tiene fiebre. — ¡Pobrecita!"],"fr":["Le pauvre !","Chaleureux et familier : pour un ami, un enfant, un animal. Pas pour votre supérieur.","— Elle a de la fièvre. — La pauvre !"]}],["That's terrible.","ဆိုးလိုက်တာ။","For serious bad news. Also: That's awful.","“Someone stole her bike.” “That's terrible.”","“သူ့စက်ဘီး အခိုးခံရတယ်။” “ဆိုးလိုက်တာ။”",{"es":["Qué terrible.","Para malas noticias serias. También: That's awful.","— Le robaron la bici. — Qué terrible."],"fr":["C'est terrible.","Pour les mauvaises nouvelles graves. On dit aussi : That's awful.","— On lui a volé son vélo. — C'est terrible."]}],["Can I do anything?","ဘာကူညီပေးရမလဲ။","Offers help without pushing. Also: Is there anything I can do?","You look so tired. Can I do anything?","အရမ်း ပင်ပန်းနေပုံပဲ။ ဘာကူညီပေးရမလဲ။",{"es":["¿Puedo hacer algo?","Ofrece ayuda sin presionar. También: Is there anything I can do?","Te ves muy cansado. ¿Puedo hacer algo?"],"fr":["Je peux faire quelque chose ?","Propose de l'aide sans insister. On dit aussi : Is there anything I can do?","Tu as l'air épuisé. Je peux faire quelque chose ?"]}],["Take care of yourself.","ကိုယ့်ကိုယ်ကို ဂရုစိုက်နော်။","Said to someone who is sick, tired or sad, often when you say goodbye.","Get some rest. Take care of yourself.","အနားယူဦး။ ကိုယ့်ကိုယ်ကို ဂရုစိုက်နော်။",{"es":["Cuídate mucho.","Se le dice a alguien enfermo, cansado o triste, a menudo al despedirse.","Descansa. Cuídate mucho."],"fr":["Prends soin de toi.","Se dit à quelqu'un de malade, fatigué ou triste, souvent en se quittant.","Repose-toi. Prends soin de toi."]}]],"tr":{"es":["Mostrar que te importa","Qué decir cuando oyes una mala noticia, grande o pequeña."],"fr":["Montrer que l'on se soucie","Que dire quand on apprend une mauvaise nouvelle, grande ou petite."]}},{"en":"Answering","my":"ပြန်ဖြေခြင်း","desc":"What to say when someone is worried about you.","cards":[["I'm fine.","အဆင်ပြေပါတယ်။","The usual answer, even when it is not completely true.","“Are you okay?” “I'm fine. Just tired.”","“အဆင်ပြေရဲ့လား။” “အဆင်ပြေပါတယ်။ ပင်ပန်းနေရုံပါ။”",{"es":["Estoy bien.","La respuesta habitual, aunque no sea del todo cierta.","— ¿Estás bien? — Estoy bien. Solo cansado."],"fr":["Ça va.","La réponse habituelle, même quand ce n'est pas tout à fait vrai.","— Ça va ? — Ça va. Juste fatigué."]}],["It's nothing.","ဘာမှ မဟုတ်ပါဘူး။","It is not serious.","“You're bleeding!” “It's nothing. Just a small cut.”","“သွေးထွက်နေတယ်။” “ဘာမှ မဟုတ်ပါဘူး။ နည်းနည်း ရှမိတာပါ။”",{"es":["No es nada.","No es grave.","— ¡Estás sangrando! — No es nada. Solo una cortadita."],"fr":["Ce n'est rien.","Ce n'est pas grave.","— Tu saignes ! — Ce n'est rien. Juste une petite coupure."]}],["Don't worry.","စိတ်မပူပါနဲ့။","Tells the other person to stop worrying. Also: Don't worry about me.","Don't worry. I'll call you when I arrive.","စိတ်မပူပါနဲ့။ ရောက်ရင် ဖုန်းဆက်မယ်။",{"es":["No te preocupes.","Le dice a la otra persona que deje de preocuparse. También: Don't worry about me.","No te preocupes. Te llamo cuando llegue."],"fr":["Ne t'inquiète pas.","Dit à l'autre d'arrêter de s'inquiéter. On dit aussi : Don't worry about me.","Ne t'inquiète pas. Je t'appelle en arrivant."]}],["Thanks for asking.","မေးပေးတာ ကျေးဇူးပါ။","A polite way to end your answer.","I'm much better now. Thanks for asking.","အခု အများကြီး သက်သာသွားပြီ။ မေးပေးတာ ကျေးဇူးပါ။",{"es":["Gracias por preguntar.","Una manera cortés de terminar tu respuesta.","Ya estoy mucho mejor. Gracias por preguntar."],"fr":["Merci de demander.","Une façon polie de terminer votre réponse.","Je vais beaucoup mieux maintenant. Merci de demander."]}]],"tr":{"es":["Responder","Qué decir cuando alguien se preocupa por ti."],"fr":["Répondre","Que dire quand quelqu'un s'inquiète pour vous."]}}];const langs=["my","es","fr"];const COURSE="eng";</script>
