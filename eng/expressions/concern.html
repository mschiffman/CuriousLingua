<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/concern/";const AUD_EXT="mp3?v=2611251024";const categories=[{"en":"Asking what's wrong","my":"ဘာဖြစ်လို့လဲ မေးခြင်း","desc":"The first questions when someone looks hurt, sad or upset.","cards":[["Are you okay?","အဆင်ပြေရဲ့လား။","The first question to ask. Also: Are you all right?","You fell! Are you okay?","လဲကျသွားတာပဲ။ အဆင်ပြေရဲ့လား။"],["What's wrong?","ဘာဖြစ်လို့လဲ။","Asks gently what the problem is.","You're not eating. What's wrong?","ထမင်းမစားဘူးနော်။ ဘာဖြစ်လို့လဲ။"],["What's the matter?","ဘာဖြစ်တာလဲ။","The same meaning as What's wrong?, a little softer.","You look sad. What's the matter?","ဝမ်းနည်းနေပုံပဲ။ ဘာဖြစ်တာလဲ။"],["What happened?","ဘာဖြစ်ခဲ့တာလဲ။","Asks about something that is finished: an accident, a fall, bad news.","Your knee is bleeding! What happened?","ဒူးက သွေးထွက်နေတယ်။ ဘာဖြစ်ခဲ့တာလဲ။"],["Is everything all right?","အားလုံး အဆင်ပြေရဲ့လား။","Polite. Good for people you do not know well.","You left early yesterday. Is everything all right?","မနေ့က စောစော ပြန်သွားတယ်နော်။ အားလုံး အဆင်ပြေရဲ့လား။"]]},{"en":"Saying what you notice","my":"သတိထားမိတာကို ပြောခြင်း","desc":"Telling someone, kindly, that you can see something is not right.","cards":[["You look tired.","ပင်ပန်းနေပုံပဲ။","You look + adjective: tired, sad, pale, worried. Not: You look tiredly.","You look tired. Did you sleep well?","ပင်ပန်းနေပုံပဲ။ ကောင်းကောင်း အိပ်ရရဲ့လား။"],["You don't look well.","နေမကောင်းတဲ့ပုံပဲ။","Well here means healthy.","You don't look well. Do you want to go home?","နေမကောင်းတဲ့ပုံပဲ။ အိမ်ပြန်ချင်လား။"],["Are you sure?","သေချာလား။","Ask again when someone says I'm fine but does not look fine.","“I'm fine.” “Are you sure? You're very quiet.”","“အဆင်ပြေပါတယ်။” “သေချာလား။ အရမ်း တိတ်နေတယ်နော်။”"],["Is something bothering you?","တစ်ခုခု စိတ်ပူစရာ ရှိလား။","Bother: to make someone worried or unhappy.","You keep looking at your phone. Is something bothering you?","ဖုန်းကိုပဲ ခဏခဏ ကြည့်နေတယ်။ တစ်ခုခု စိတ်ပူစရာ ရှိလား။"],["Does it hurt?","နာလား။","For the body: a cut, a fall, a headache.","You hit your head. Does it hurt?","ခေါင်း ထိမိသွားတယ်။ နာလား။"]]},{"en":"Worrying about someone","my":"တစ်ယောက်ယောက်အတွက် စိတ်ပူခြင်း","desc":"When you do not know if a person is safe or well.","cards":[["I'm worried about you.","မင်းအတွက် စိတ်ပူတယ်။","Worried about + a person or a thing.","You work too much. I'm worried about you.","မင်း အလုပ်တွေ အရမ်းလုပ်တယ်။ မင်းအတွက် စိတ်ပူတယ်။"],["I was so worried!","အရမ်း စိတ်ပူနေတာ။","Said when the person is back, or safe at last.","You're home! I was so worried!","ပြန်ရောက်ပြီပဲ။ အရမ်း စိတ်ပူနေတာ။"],["What if <span class=gray>he's sick<\/span>?","သူ နေမကောင်းဖြစ်နေရင်ကော။","What if…? imagines something bad that is possible.","She's not answering. What if she's lost?","သူ ဖုန်းမကိုင်ဘူး။ လမ်းပျောက်နေရင်ကော။"],["I hope everything's okay.","အားလုံး အဆင်ပြေပါစေ။","Kind to say or write when you do not know yet.","I heard about your mother. I hope everything's okay.","မင်းအမေအကြောင်း ကြားတယ်။ အားလုံး အဆင်ပြေပါစေ။"],["That's a relief!","စိတ်အေးသွားပြီ။","Said when the worry is over.","“The doctor says it's nothing.” “That's a relief!”","“ဆရာဝန်က ဘာမှ မဖြစ်ဘူးတဲ့။” “စိတ်အေးသွားပြီ။”"]]},{"en":"Showing you care","my":"ဂရုစိုက်ကြောင်း ပြခြင်း","desc":"What to say when you hear bad news, big or small.","cards":[["Oh no!","ဟာ၊ ဒုက္ခပါပဲ။","The natural first reaction to bad news.","“I lost my wallet.” “Oh no!”","“ပိုက်ဆံအိတ် ပျောက်သွားတယ်။” “ဟာ၊ ဒုက္ခပါပဲ။”"],["Poor thing!","သနားစရာလေး။","Warm and informal: for a friend, a child, an animal. Not for your boss.","“She has a fever.” “Poor thing!”","“သူ ဖျားနေတယ်။” “သနားစရာလေး။”"],["That's terrible.","ဆိုးလိုက်တာ။","For serious bad news. Also: That's awful.","“Someone stole her bike.” “That's terrible.”","“သူ့စက်ဘီး အခိုးခံရတယ်။” “ဆိုးလိုက်တာ။”"],["Can I do anything?","ဘာကူညီပေးရမလဲ။","Offers help without pushing. Also: Is there anything I can do?","You look so tired. Can I do anything?","အရမ်း ပင်ပန်းနေပုံပဲ။ ဘာကူညီပေးရမလဲ။"],["Take care of yourself.","ကိုယ့်ကိုယ်ကို ဂရုစိုက်နော်။","Said to someone who is sick, tired or sad, often when you say goodbye.","Get some rest. Take care of yourself.","အနားယူဦး။ ကိုယ့်ကိုယ်ကို ဂရုစိုက်နော်။"]]},{"en":"Answering","my":"ပြန်ဖြေခြင်း","desc":"What to say when someone is worried about you.","cards":[["I'm fine.","အဆင်ပြေပါတယ်။","The usual answer, even when it is not completely true.","“Are you okay?” “I'm fine. Just tired.”","“အဆင်ပြေရဲ့လား။” “အဆင်ပြေပါတယ်။ ပင်ပန်းနေရုံပါ။”"],["It's nothing.","ဘာမှ မဟုတ်ပါဘူး။","It is not serious.","“You're bleeding!” “It's nothing. Just a small cut.”","“သွေးထွက်နေတယ်။” “ဘာမှ မဟုတ်ပါဘူး။ နည်းနည်း ရှမိတာပါ။”"],["Don't worry.","စိတ်မပူပါနဲ့။","Tells the other person to stop worrying. Also: Don't worry about me.","Don't worry. I'll call you when I arrive.","စိတ်မပူပါနဲ့။ ရောက်ရင် ဖုန်းဆက်မယ်။"],["Thanks for asking.","မေးပေးတာ ကျေးဇူးပါ။","A polite way to end your answer.","I'm much better now. Thanks for asking.","အခု အများကြီး သက်သာသွားပြီ။ မေးပေးတာ ကျေးဇူးပါ။"]]}];</script>
