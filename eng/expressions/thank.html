<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/thank/";const AUD_EXT="mp3?v=2611090800";const categories=[{"en":"Saying thank you","my":"ကျေးဇူးတင်ခြင်း","desc":"The everyday thanks, from a quick thanks to a warm thank you so much.","cards":[["Thank you.","ကျေးဇူးတင်ပါတယ်။","Safe everywhere: shops, teachers, strangers, family. English speakers say it many times a day, even for small things like passing the salt.","— Here's your coffee. — Thank you.","— ကော်ဖီ ရပါပြီ။ — ကျေးဇူးတင်ပါတယ်။",{"es":["Gracias.","Sirve en todas partes: tiendas, maestros, desconocidos, familia. Los angloparlantes lo dicen muchas veces al día, hasta por cosas pequeñas como pasar la sal.","— Aquí tiene su café. — Gracias."],"fr":["Merci.","Convient partout : magasins, professeurs, inconnus, famille. Les anglophones le disent de nombreuses fois par jour, même pour de petites choses comme passer le sel.","— Voici votre café. — Merci."]}],["Thanks!","ကျေးဇူးပါ။","Short and friendly. In Burmese we don't often thank close family, but in English people thank family and friends all the time. It sounds warm, not distant.","Thanks, Grandma! The soup is delicious.","ကျေးဇူးပါ အဖွား။ ဟင်းချို အရမ်းစားကောင်းတယ်။",{"es":["¡Gracias!","Corto y amistoso. En inglés se le dan las gracias a la familia y a los amigos todo el tiempo. Suena cálido, no distante.","¡Gracias, abuela! La sopa está deliciosa."],"fr":["Merci !","Court et amical. En anglais, on remercie sans cesse la famille et les amis. Cela paraît chaleureux, pas distant.","Merci, mamie ! La soupe est délicieuse."]}],["Thank you so much.","အရမ်း ကျေးဇူးတင်ပါတယ်။","Warmer and stronger. Thank you very much means the same, but is a little more formal.","Thank you so much for the lovely dinner.","ညစာ ကောင်းကောင်း ကျွေးတဲ့အတွက် အရမ်း ကျေးဇူးတင်ပါတယ်။",{"es":["Muchísimas gracias.","Más cálido y más fuerte. Thank you very much significa lo mismo, pero es un poco más formal.","Muchísimas gracias por la cena tan rica."],"fr":["Merci infiniment.","Plus chaleureux et plus fort. Thank you very much veut dire la même chose, en un peu plus formel.","Merci infiniment pour ce délicieux dîner."]}],["Thanks a lot.","ကျေးဇူး အများကြီးပါ။","Friendly and casual. Careful with your voice: said flat or annoyed, Thanks a lot! is sarcastic and means the opposite.","Thanks a lot! You saved me so much time.","ကျေးဇူး အများကြီးပါ။ အချိန်တွေ အများကြီး သက်သာသွားတယ်။",{"es":["Muchas gracias.","Amistoso e informal. Cuidado con la voz: dicho en tono seco o molesto, Thanks a lot! es sarcástico y significa lo contrario.","¡Muchas gracias! Me ahorraste mucho tiempo."],"fr":["Merci beaucoup.","Amical et familier. Attention au ton : dit d'une voix plate ou agacée, Thanks a lot! est ironique et veut dire le contraire.","Merci beaucoup ! Tu m'as fait gagner un temps fou."]}]],"tr":{"es":["Dar las gracias","Las gracias de todos los días, desde un thanks rápido hasta un thank you so much cálido."],"fr":["Dire merci","Les mercis de tous les jours, d'un thanks rapide à un thank you so much chaleureux."]}},{"en":"Thanks for…","my":"တစ်ခုခုအတွက် ကျေးဇူးတင်ခြင်း","desc":"Saying what you are thankful for: thanks for + a thing, or thanks for + -ing.","cards":[["Thanks for your help.","ကူညီပေးတဲ့အတွက် ကျေးဇူးပါ။","After someone helps you. With a verb, use -ing: Thanks for helping me. Not: Thanks for help me.","Thanks for your help with the bags.","အိတ်တွေ သယ်ပေးတဲ့အတွက် ကျေးဇူးပါ။",{"es":["Gracias por tu ayuda.","Cuando alguien te ayudó. Con un verbo, usa -ing: Thanks for helping me. No: Thanks for help me.","Gracias por tu ayuda con las bolsas."],"fr":["Merci pour ton aide.","Après avoir reçu de l'aide. Avec un verbe, on met -ing : Thanks for helping me. Pas : Thanks for help me.","Merci pour ton aide avec les sacs."]}],["Thanks for the gift.","လက်ဆောင် အတွက် ကျေးဇူးပါ။","For a gift, a meal, a message: anything someone gives you. Say something nice about it, too.","Thanks for the flowers! They're beautiful.","ပန်းတွေအတွက် ကျေးဇူးပါ။ အရမ်းလှတယ်။",{"es":["Gracias por el regalo.","Por un regalo, una comida, un mensaje: cualquier cosa que alguien te da. Di también algo amable sobre ello.","¡Gracias por las flores! Están preciosas."],"fr":["Merci pour le cadeau.","Pour un cadeau, un repas, un message : tout ce que l'on vous donne. Ajoutez un mot gentil à son sujet.","Merci pour les fleurs ! Elles sont magnifiques."]}],["Thank you for coming.","လာတဲ့အတွက် ကျေးဇူးတင်ပါတယ်။","What a host says to guests, at the door or at the end of a party or meeting.","Thank you for coming. Please come again!","လာတဲ့အတွက် ကျေးဇူးတင်ပါတယ်။ နောက်လည်း လာခဲ့ပါဦး။",{"es":["Gracias por venir.","Lo que dice el anfitrión a sus invitados, en la puerta o al final de una fiesta o una reunión.","Gracias por venir. ¡Vuelvan pronto!"],"fr":["Merci d'être venu.","Ce que dit l'hôte à ses invités, à la porte ou à la fin d'une fête ou d'une réunion.","Merci d'être venus. Revenez quand vous voulez !"]}],["Thanks for waiting.","စောင့်ပေးတဲ့အတွက် ကျေးဇူးပါ။","When you kept someone waiting. Shops and offices say: Thank you for your patience.","Sorry I'm late. Thanks for waiting.","နောက်ကျသွားလို့ ဆောရီးနော်။ စောင့်ပေးတဲ့အတွက် ကျေးဇူးပါ။",{"es":["Gracias por esperar.","Cuando hiciste esperar a alguien. En tiendas y oficinas dicen: Thank you for your patience.","Perdón por llegar tarde. Gracias por esperar."],"fr":["Merci d'avoir attendu.","Quand vous avez fait attendre quelqu'un. Dans les magasins et les bureaux, on dit : Thank you for your patience.","Désolé du retard. Merci d'avoir attendu."]}],["Thanks anyway.","ဘာပဲဖြစ်ဖြစ် ကျေးဇူးပါ။","When someone tried to help but couldn't. It is kind, not rude.","— Sorry, I don't know where the bank is. — OK, thanks anyway.","— ဆောရီး၊ ဘဏ် ဘယ်မှာလဲ မသိဘူး။ — ရပါတယ်၊ ဘာပဲဖြစ်ဖြစ် ကျေးဇူးပါ။",{"es":["Gracias de todos modos.","Cuando alguien intentó ayudar pero no pudo. Es amable, no grosero.","— Perdón, no sé dónde está el banco. — Bueno, gracias de todos modos."],"fr":["Merci quand même.","Quand quelqu'un a essayé d'aider sans y parvenir. C'est aimable, pas impoli.","— Désolé, je ne sais pas où est la banque. — D'accord, merci quand même."]}]],"tr":{"es":["Gracias por…","Decir por qué das las gracias: thanks for + una cosa, o thanks for + -ing."],"fr":["Merci pour…","Dire de quoi l'on remercie : thanks for + une chose, ou thanks for + -ing."]}},{"en":"Big thanks","my":"အထူး ကျေးဇူးတင်ခြင်း","desc":"When someone did something really kind or important for you.","cards":[["I really appreciate it.","တကယ် ကျေးဇူးတင်ပါတယ်။","Deeper than thanks: it shows you know the help cost them time or effort. Often comes after Thank you.","Thanks for driving me to the airport. I really appreciate it.","လေဆိပ်ကို လိုက်ပို့ပေးလို့ ကျေးဇူးပါ။ တကယ်ကို ကျေးဇူးတင်မိပါတယ်။",{"es":["Te lo agradezco mucho.","Más profundo que thanks: muestra que sabes que la ayuda les costó tiempo o esfuerzo. Suele ir después de Thank you.","Gracias por llevarme al aeropuerto. Te lo agradezco mucho."],"fr":["J'apprécie vraiment.","Plus profond que thanks : on montre que l'on sait que l'aide a coûté du temps ou des efforts. Vient souvent après Thank you.","Merci de m'avoir conduit à l'aéroport. J'apprécie vraiment."]}],["That's very kind of you.","အရမ်း သဘောကောင်းတာပဲ။","Thanks the person for being kind, not just for the thing. Polite and warm: good with older people and strangers.","— Let me carry that for you. — Oh, that's very kind of you.","— အဲဒါ ကျွန်တော် သယ်ပေးမယ်။ — အို၊ အရမ်း သဘောကောင်းတာပဲ။",{"es":["Es muy amable de tu parte.","Agradece a la persona por ser amable, no solo por la cosa. Cortés y cálido: bueno con personas mayores y desconocidos.","— Permítame cargarle eso. — Ay, es muy amable de su parte."],"fr":["C'est très gentil de votre part.","Remercie la personne pour sa gentillesse, pas seulement pour la chose. Poli et chaleureux : bien avec les personnes âgées et les inconnus.","— Laissez-moi porter ça. — Oh, c'est très gentil de votre part."]}],["You shouldn't have!","အားနာလိုက်တာ။","The English way to show အားနာ when you get a gift. It sounds like a complaint, but it means Thank you, that's so kind. Then accept the gift and say thank you.","A present for me? Oh, you shouldn't have! Thank you!","ကျွန်မအတွက် လက်ဆောင်လား။ အို၊ အားနာလိုက်တာ။ ကျေးဇူးပါ။",{"es":["¡No te hubieras molestado!","Lo que se dice al recibir un regalo, para mostrar que te apena que se hayan molestado. Suena a queja, pero significa Gracias, qué amable. Después acepta el regalo y da las gracias.","¿Un regalo para mí? ¡Ay, no te hubieras molestado! ¡Gracias!"],"fr":["Il ne fallait pas !","Ce que l'on dit en recevant un cadeau, pour montrer que l'on est gêné du dérangement. On dirait un reproche, mais cela veut dire Merci, c'est trop gentil. Acceptez ensuite le cadeau et remerciez.","Un cadeau pour moi ? Oh, il ne fallait pas ! Merci !"]}],["You're a lifesaver!","ကယ်တင်ရှင်ပဲ။","Casual and a little funny, for help that came at the perfect time. Nobody's life is really in danger.","You found my phone? You're a lifesaver!","ကျွန်တော့်ဖုန်း တွေ့တယ်ဟုတ်လား။ ကယ်တင်ရှင်ပဲ။",{"es":["¡Me salvaste la vida!","Informal y un poco gracioso, para una ayuda que llegó en el momento justo. La vida de nadie corre peligro de verdad.","¿Encontraste mi teléfono? ¡Me salvaste la vida!"],"fr":["Tu me sauves la vie !","Familier et un peu drôle, pour une aide arrivée au moment parfait. Personne n'est vraiment en danger.","Tu as retrouvé mon téléphone ? Tu me sauves la vie !"]}],["I owe you one.","ကျေးဇူးတစ်ခု တင်သွားပြီနော်။","Casual: I'll help you next time. Between friends and coworkers.","Thanks for covering my shift. I owe you one.","ကျွန်တော့်အလှည့် ဝင်လုပ်ပေးလို့ ကျေးဇူးပဲ။ ကျေးဇူးတစ်ခု တင်သွားပြီနော်။",{"es":["Te debo una.","Informal: la próxima vez te ayudo yo. Entre amigos y compañeros de trabajo.","Gracias por cubrir mi turno. Te debo una."],"fr":["Je te revaudrai ça.","Familier : la prochaine fois, c'est moi qui t'aide. Entre amis et collègues.","Merci d'avoir pris mon service. Je te revaudrai ça."]}]],"tr":{"es":["Muchísimas gracias","Cuando alguien hizo por ti algo muy amable o importante."],"fr":["Un grand merci","Quand quelqu'un a fait pour vous quelque chose de vraiment gentil ou important."]}},{"en":"Replying to thanks","my":"ကျေးဇူးတင်တာကို ပြန်ဖြေခြင်း","desc":"What to say when someone thanks you.","cards":[["You're welcome.","ရပါတယ်။","The standard answer. Always say the whole phrase: Welcome! alone means I'm happy you're here, not You're welcome.","— Thank you. — You're welcome.","— ကျေးဇူးတင်ပါတယ်။ — ရပါတယ်။",{"es":["De nada.","La respuesta estándar. Di siempre la frase completa: Welcome! solo significa Qué gusto que estés aquí, no De nada.","— Gracias. — De nada."],"fr":["De rien.","La réponse classique. Dites toujours la phrase entière : Welcome! tout seul veut dire Bienvenue, pas De rien.","— Merci. — De rien."]}],["No problem.","ကိစ္စမရှိပါဘူး။","Casual and very common. Also: No worries, popular in Australia and the UK and growing in the US.","— Thanks for the ride. — No problem!","— လိုက်ပို့ပေးလို့ ကျေးဇူးပါ။ — ကိစ္စမရှိပါဘူး။",{"es":["No hay problema.","Informal y muy común. También: No worries, popular en Australia y el Reino Unido y cada vez más en Estados Unidos.","— Gracias por traerme. — ¡No hay problema!"],"fr":["Pas de problème.","Familier et très courant. On dit aussi : No worries, répandu en Australie et au Royaume-Uni, et de plus en plus aux États-Unis.","— Merci de m'avoir déposé. — Pas de problème !"]}],["My pleasure.","ကူညီရတာ ဝမ်းသာပါတယ်။","Warm and polite: I was happy to do it. Hotel and restaurant staff say it often.","— Thank you for the lovely meal. — My pleasure.","— စားလို့ အရမ်းကောင်းတယ်၊ ကျေးဇူးပါ။ — ကျွေးရတာ ဝမ်းသာပါတယ်။",{"es":["Con mucho gusto.","Cálido y cortés: lo hice con gusto. El personal de hoteles y restaurantes lo dice mucho.","— Gracias por la comida tan rica. — Con mucho gusto."],"fr":["Avec plaisir.","Chaleureux et poli : j'ai été heureux de le faire. Le personnel des hôtels et des restaurants le dit souvent.","— Merci pour ce délicieux repas. — Avec plaisir."]}],["Don't mention it.","ပြောစရာ မလိုပါဘူး။","It was nothing, no need to thank me. Friendly, a little old-fashioned.","— Thanks for fixing my bike. — Don't mention it.","— စက်ဘီး ပြင်ပေးလို့ ကျေးဇူးပါ။ — ပြောစရာ မလိုပါဘူး။",{"es":["No hay de qué.","No fue nada, no hace falta agradecer. Amistoso, un poco anticuado.","— Gracias por arreglar mi bici. — No hay de qué."],"fr":["Il n'y a pas de quoi.","Ce n'était rien, inutile de me remercier. Amical, un peu vieillot.","— Merci d'avoir réparé mon vélo. — Il n'y a pas de quoi."]}],["Anytime!","အချိန်မရွေး ပြောပါ။","Friendly: I'm happy to help again. Between friends.","— Thanks for listening. — Anytime!","— နားထောင်ပေးလို့ ကျေးဇူးပါ။ — အချိန်မရွေး ပြောပါ။",{"es":["¡Cuando quieras!","Amistoso: con gusto te ayudo otra vez. Entre amigos.","— Gracias por escucharme. — ¡Cuando quieras!"],"fr":["Quand tu veux !","Amical : je serai content d'aider à nouveau. Entre amis.","— Merci de m'avoir écouté. — Quand tu veux !"]}]],"tr":{"es":["Responder a las gracias","Qué decir cuando alguien te da las gracias."],"fr":["Répondre à un merci","Que dire quand on vous remercie."]}},{"en":"Yes, please / No, thank you","my":"လက်ခံခြင်းနဲ့ ယဉ်ယဉ်ကျေးကျေး ငြင်းခြင်း","desc":"Saying yes or no to an offer, politely.","cards":[["Yes, please.","ဟုတ်ကဲ့၊ ပေးပါ။","To accept an offer. Yes alone can sound a little rude: add please.","— Would you like some tea? — Yes, please.","— လက်ဖက်ရည် သောက်မလား။ — ဟုတ်ကဲ့၊ ပေးပါ။",{"es":["Sí, por favor.","Para aceptar un ofrecimiento. Yes solo puede sonar un poco grosero: agrega please.","— ¿Quieres un poco de té? — Sí, por favor."],"fr":["Oui, s'il vous plaît.","Pour accepter une offre. Yes tout seul peut sembler un peu impoli : ajoutez please.","— Voulez-vous du thé ? — Oui, s'il vous plaît."]}],["No, thank you.","မလိုပါဘူး၊ ကျေးဇူးပါ။","A polite no. Important: in Myanmar, guests often say no first to be polite and wait to be asked again. English speakers believe your first no and won't ask again. If you want it, say Yes, please!","— More rice? — No, thank you. I'm full.","— ထမင်း ထပ်ထည့်ဦးမလား။ — မလိုပါဘူး၊ ကျေးဇူးပါ။ ဗိုက်ပြည့်ပြီ။",{"es":["No, gracias.","Un no cortés. Importante: los angloparlantes creen tu primer no y no vuelven a ofrecer. Si lo quieres, di Yes, please!","— ¿Más arroz? — No, gracias. Ya estoy lleno."],"fr":["Non, merci.","Un non poli. Important : les anglophones prennent votre premier non au sérieux et ne reproposent pas. Si vous en voulez, dites Yes, please!","— Encore du riz ? — Non, merci. Je n'ai plus faim."]}],["I'm fine, thanks.","ရပါတယ်၊ ကျေးဇူးပါ။","Another polite no, often to an offer of help. Here it is not about your health.","— Do you need help with that? — I'm fine, thanks.","— အကူအညီ လိုလား။ — ရပါတယ်၊ ကျေးဇူးပါ။",{"es":["Estoy bien, gracias.","Otro no cortés, a menudo cuando te ofrecen ayuda. Aquí no habla de tu salud.","— ¿Necesitas ayuda con eso? — Estoy bien, gracias."],"fr":["Ça va, merci.","Un autre non poli, souvent quand on vous propose de l'aide. Ici, il ne s'agit pas de votre santé.","— Tu as besoin d'aide ? — Ça va, merci."]}],["Thanks for asking.","မေးပေးလို့ ကျေးဇူးပါ။","Makes a no softer, or thanks someone for caring about you.","— Are you OK? You look tired. — I'm OK, but thanks for asking.","— နေကောင်းရဲ့လား။ ပင်ပန်းနေပုံရတယ်။ — ရပါတယ်၊ မေးပေးလို့ ကျေးဇူးပါ။",{"es":["Gracias por preguntar.","Suaviza un no, o agradece que alguien se preocupe por ti.","— ¿Estás bien? Te ves cansado. — Estoy bien, pero gracias por preguntar."],"fr":["Merci de demander.","Adoucit un non, ou remercie quelqu'un de s'inquiéter pour vous.","— Ça va ? Tu as l'air fatigué. — Ça va, mais merci de demander."]}]],"tr":{"es":["Sí, por favor / No, gracias","Decir que sí o que no a un ofrecimiento, con cortesía."],"fr":["Oui, s'il vous plaît / Non, merci","Dire oui ou non à une offre, poliment."]}},{"en":"Thanks at work and in messages","my":"အလုပ်မှာနဲ့ စာထဲမှာ ကျေးဇူးတင်ခြင်း","desc":"Polite thanks for interviews, meetings, emails and texts.","cards":[["Thank you for your time.","အချိန်ပေးတဲ့အတွက် ကျေးဇူးတင်ပါတယ်။","Polite thanks at the end of a meeting. The best last line in a job interview.","Thank you for your time. I hope to hear from you soon.","အချိန်ပေးတဲ့အတွက် ကျေးဇူးတင်ပါတယ်။ မကြာခင် အကြောင်းပြန်မယ်လို့ မျှော်လင့်ပါတယ်။",{"es":["Gracias por su tiempo.","Agradecimiento cortés al final de una reunión. La mejor última frase en una entrevista de trabajo.","Gracias por su tiempo. Espero tener noticias suyas pronto."],"fr":["Merci pour votre temps.","Remerciement poli à la fin d'une réunion. La meilleure dernière phrase d'un entretien d'embauche.","Merci pour votre temps. J'espère avoir bientôt de vos nouvelles."]}],["Thanks for letting me know.","အသိပေးတဲ့အတွက် ကျေးဇူးပါ။","When someone gives you news or information, even bad news.","— The meeting is cancelled. — OK, thanks for letting me know.","— အစည်းအဝေး ဖျက်လိုက်ပြီ။ — အိုကေ၊ အသိပေးတဲ့အတွက် ကျေးဇူးပါ။",{"es":["Gracias por avisarme.","Cuando alguien te da una noticia o información, aunque sea mala.","— Se canceló la reunión. — Bueno, gracias por avisarme."],"fr":["Merci de m'avoir prévenu.","Quand on vous donne une nouvelle ou une information, même mauvaise.","— La réunion est annulée. — D'accord, merci de m'avoir prévenu."]}],["Thanks in advance.","ကြိုတင်ပြီး ကျေးဇူးတင်ပါတယ်။","At the end of a message that asks for something. Some people find it a little pushy: Thank you for your help is softer.","Could you send me the form? Thanks in advance!","ဖောင်ကို ပို့ပေးနိုင်မလား။ ကြိုတင်ပြီး ကျေးဇူးတင်ပါတယ်။",{"es":["Gracias de antemano.","Al final de un mensaje en el que pides algo. A algunas personas les parece un poco insistente: Thank you for your help es más suave.","¿Me podría enviar el formulario? ¡Gracias de antemano!"],"fr":["Merci d'avance.","À la fin d'un message où l'on demande quelque chose. Certains le trouvent un peu insistant : Thank you for your help est plus doux.","Pourriez-vous m'envoyer le formulaire ? Merci d'avance !"]}],["Thanks again.","ထပ်ပြီး ကျေးဇူးတင်ပါတယ်။","A second thank you at the end of a conversation or email, for something you thanked them for earlier.","Thanks again for everything. See you next week!","အားလုံးအတွက် ထပ်ပြီး ကျေးဇူးတင်ပါတယ်။ နောက်အပတ် တွေ့မယ်။",{"es":["Gracias otra vez.","Un segundo agradecimiento al final de una conversación o de un correo, por algo que ya habías agradecido.","Gracias otra vez por todo. ¡Nos vemos la próxima semana!"],"fr":["Encore merci.","Un second merci à la fin d'une conversation ou d'un courriel, pour quelque chose dont vous avez déjà remercié.","Encore merci pour tout. À la semaine prochaine !"]}]],"tr":{"es":["Gracias en el trabajo y en mensajes","Agradecimientos corteses para entrevistas, reuniones, correos y mensajes."],"fr":["Merci au travail et dans les messages","Des remerciements polis pour les entretiens, les réunions, les courriels et les messages."]}}];const langs=["my","es","fr"];const COURSE="eng";</script>
