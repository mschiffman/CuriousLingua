<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/wishes_celebrations/";const AUD_EXT="mp3?v=2611170809";const categories=[{"en":"Birthdays","my":"မွေးနေ့","desc":"Wishes for someone's birthday, on the day or a little late.","cards":[["Happy birthday!","မွေးနေ့ မင်္ဂလာပါ။","The everyday birthday wish, said or written. Add a name: Happy birthday, Mia!","Happy birthday, Grandma! This is for you.","မွေးနေ့ မင်္ဂလာပါ အဖွား။ ဒါ အဖွားအတွက်ပါ။",{"es":["¡Feliz cumpleaños!","El deseo de cumpleaños de siempre, dicho o escrito. Agrega un nombre: Happy birthday, Mia!","¡Feliz cumpleaños, abuela! Esto es para ti."],"fr":["Joyeux anniversaire !","Le vœu d'anniversaire de tous les jours, dit ou écrit. Ajoutez un prénom : Happy birthday, Mia!","Joyeux anniversaire, mamie ! C'est pour toi."],"hi":["जन्मदिन मुबारक!","जन्मदिन की जानी-पहचानी शुभकामना, बोलकर या लिखकर। नाम जोड़ दीजिए: Happy birthday, Mia!","जन्मदिन मुबारक, दादी! यह आपके लिए है।"],"vi":["Chúc mừng sinh nhật!","Lời chúc sinh nhật quen thuộc, nói hoặc viết. Thêm tên vào: Happy birthday, Mia!","Chúc mừng sinh nhật bà! Cái này cháu tặng bà ạ."]}],["Many happy returns!","ဒီလို မွေးနေ့တွေ အများကြီး ကြုံပါစေ။","An older, warm birthday wish: may you have many more happy birthdays. More common in British English.","Happy birthday, and many happy returns!","မွေးနေ့ မင်္ဂလာပါ၊ ဒီလို မွေးနေ့တွေ အများကြီး ကြုံပါစေ။",{"es":["¡Que cumplas muchos más!","Un deseo de cumpleaños más antiguo y cálido: que tengas muchos cumpleaños felices más. Más común en el inglés británico.","¡Feliz cumpleaños, y que cumplas muchos más!"],"fr":["Et beaucoup d'autres encore !","Un vœu d'anniversaire plus ancien et chaleureux : puissiez-vous en fêter encore beaucoup. Plus courant en anglais britannique.","Joyeux anniversaire, et beaucoup d'autres encore !"],"hi":["यह दिन बार-बार आए!","जन्मदिन की पुरानी, अपनेपन भरी शुभकामना: आपके ऐसे बहुत-से ख़ुशहाल जन्मदिन आएँ। ब्रिटिश अंग्रेज़ी में ज़्यादा आम।","जन्मदिन मुबारक, और यह दिन बार-बार आए!"],"vi":["Chúc bạn thêm nhiều sinh nhật vui!","Một lời chúc sinh nhật kiểu cũ và ấm áp: chúc bạn còn nhiều sinh nhật hạnh phúc nữa. Phổ biến hơn trong tiếng Anh Anh.","Chúc mừng sinh nhật, và chúc bạn thêm nhiều sinh nhật vui!"]}],["Make a wish!","ဆုတောင်းလိုက်ပါ။","Said before the birthday person blows out the candles on the cake. The wish is a secret.","Here's your cake. Make a wish!","ကိတ်မုန့် ရောက်ပြီ။ ဆုတောင်းလိုက်ပါ။",{"es":["¡Pide un deseo!","Se dice antes de que el festejado sople las velas del pastel. El deseo es secreto.","Aquí está tu pastel. ¡Pide un deseo!"],"fr":["Fais un vœu !","Se dit avant que la personne fêtée souffle les bougies du gâteau. Le vœu reste secret.","Voici ton gâteau. Fais un vœu !"],"hi":["कोई मुराद माँगो!","केक की मोमबत्तियाँ बुझाने से ठीक पहले कहा जाता है। मुराद राज़ रखी जाती है।","यह रहा तुम्हारा केक। कोई मुराद माँगो!"],"vi":["Ước đi!","Nói trước khi người được mừng sinh nhật thổi nến trên bánh. Điều ước phải giữ bí mật.","Bánh của bạn đây. Ước đi!"]}],["Happy belated birthday!","နောက်ကျသွားပေမဲ့ မွေးနေ့ မင်္ဂလာပါ။","When you forgot, or couldn't say it on the day. Belated means late.","Happy belated birthday! Sorry I missed it.","နောက်ကျသွားပေမဲ့ မွေးနေ့ မင်္ဂလာပါ။ မေ့သွားလို့ ဆောရီးနော်။",{"es":["¡Feliz cumpleaños atrasado!","Cuando se te olvidó, o no pudiste decirlo ese día. Belated significa tardío.","¡Feliz cumpleaños atrasado! Perdón por no haber estado."],"fr":["Joyeux anniversaire en retard !","Quand vous avez oublié, ou n'avez pas pu le dire le jour même. Belated veut dire tardif.","Joyeux anniversaire en retard ! Désolé de l'avoir manqué."],"hi":["देर से ही सही, जन्मदिन मुबारक!","जब आप भूल गए हों, या उस दिन कह न पाए हों। Belated का मतलब है देर से आया हुआ।","देर से ही सही, जन्मदिन मुबारक! माफ़ करना, मुझसे छूट गया।"],"vi":["Chúc mừng sinh nhật muộn!","Khi bạn quên, hoặc không nói được vào đúng ngày. Belated nghĩa là muộn.","Chúc mừng sinh nhật muộn! Xin lỗi mình lỡ mất."]}],["Thanks for the birthday wishes!","မွေးနေ့ ဆုတောင်းပေးတဲ့အတွက် ကျေးဇူးပါ။","What you say or post after people wish you a happy birthday.","Thanks for the birthday wishes, everyone!","မွေးနေ့ ဆုတောင်းပေးကြတဲ့အတွက် အားလုံးကို ကျေးဇူးပါ။",{"es":["¡Gracias por las felicitaciones!","Lo que dices o publicas después de que te felicitan por tu cumpleaños.","¡Gracias a todos por las felicitaciones!"],"fr":["Merci pour vos vœux d'anniversaire !","Ce que l'on dit ou publie après avoir reçu des vœux d'anniversaire.","Merci à tous pour vos vœux d'anniversaire !"],"hi":["जन्मदिन की शुभकामनाओं के लिए शुक्रिया!","जन्मदिन की बधाइयाँ मिलने के बाद आप यह कहते या पोस्ट करते हैं।","जन्मदिन की शुभकामनाओं के लिए आप सबका शुक्रिया!"],"vi":["Cảm ơn những lời chúc sinh nhật!","Câu bạn nói hoặc đăng sau khi được mọi người chúc mừng sinh nhật.","Cảm ơn mọi người vì những lời chúc sinh nhật!"]}]],"tr":{"es":["Cumpleaños","Deseos para el cumpleaños de alguien, ese día o un poco después."],"fr":["Anniversaires","Des vœux pour l'anniversaire de quelqu'un, le jour même ou un peu en retard."],"hi":["जन्मदिन","किसी के जन्मदिन की शुभकामनाएँ, उसी दिन या थोड़ी देर से।"],"vi":["Sinh nhật","Lời chúc sinh nhật, đúng ngày hoặc muộn một chút."]}},{"en":"Holidays and festivals","my":"ပွဲတော်များ","desc":"Greetings for New Year and other festivals.","cards":[["Happy New Year!","နှစ်သစ် မင်္ဂလာပါ။","Said around 1 January, from the last days of December to the first week of January.","Happy New Year! I hope it's a great one.","နှစ်သစ် မင်္ဂလာပါ။ ကောင်းတဲ့ နှစ်တစ်နှစ် ဖြစ်ပါစေ။",{"es":["¡Feliz Año Nuevo!","Se dice alrededor del 1 de enero, desde los últimos días de diciembre hasta la primera semana de enero.","¡Feliz Año Nuevo! Espero que sea un gran año."],"fr":["Bonne année !","Se dit autour du 1er janvier, des derniers jours de décembre à la première semaine de janvier.","Bonne année ! J'espère qu'elle sera excellente."],"hi":["नया साल मुबारक!","1 जनवरी के आसपास कहा जाता है, दिसंबर के आख़िरी दिनों से जनवरी के पहले हफ़्ते तक।","नया साल मुबारक! उम्मीद है यह साल बढ़िया रहेगा।"],"vi":["Chúc mừng năm mới!","Nói quanh ngày 1 tháng 1, từ những ngày cuối tháng 12 đến tuần đầu tháng 1.","Chúc mừng năm mới! Mong đây là một năm tuyệt vời."]}],["Merry Christmas!","ခရစ္စမတ် မင်္ဂလာပါ။","Said in the days before Christmas and on 25 December. Merry is only used in this greeting.","Merry Christmas and a happy New Year!","ခရစ္စမတ် မင်္ဂလာပါ၊ နှစ်သစ်မှာလည်း ပျော်ရွှင်ပါစေ။",{"es":["¡Feliz Navidad!","Se dice en los días previos a la Navidad y el 25 de diciembre. Merry solo se usa en este saludo.","¡Feliz Navidad y próspero Año Nuevo!"],"fr":["Joyeux Noël !","Se dit les jours qui précèdent Noël et le 25 décembre. Merry ne s'emploie que dans cette formule.","Joyeux Noël et bonne année !"],"hi":["क्रिसमस मुबारक!","क्रिसमस से पहले के दिनों में और 25 दिसंबर को कहा जाता है। Merry सिर्फ़ इसी शुभकामना में आता है।","क्रिसमस और नया साल मुबारक!"],"vi":["Giáng sinh vui vẻ!","Nói trong những ngày trước Giáng sinh và vào ngày 25 tháng 12. Merry chỉ dùng trong lời chúc này.","Giáng sinh vui vẻ và chúc mừng năm mới!"]}],["Happy holidays!","ပျော်ရွှင်ဖွယ် အားလပ်ရက်များ ဖြစ်ပါစေ။","A December greeting for everyone, whatever festival they celebrate.","Happy holidays! See you in January.","ပျော်ရွှင်ဖွယ် အားလပ်ရက်များ ဖြစ်ပါစေ။ ဇန်နဝါရီမှာ တွေ့မယ်။",{"es":["¡Felices fiestas!","Un saludo de diciembre para todos, celebren la fiesta que celebren.","¡Felices fiestas! Nos vemos en enero."],"fr":["Joyeuses fêtes !","Une formule de décembre pour tout le monde, quelle que soit la fête célébrée.","Joyeuses fêtes ! On se voit en janvier."],"hi":["छुट्टियाँ मुबारक!","दिसंबर की शुभकामना, सबके लिए, चाहे वे कोई भी त्योहार मनाते हों।","छुट्टियाँ मुबारक! जनवरी में मिलते हैं।"],"vi":["Chúc mùa lễ vui vẻ!","Lời chúc tháng 12 dành cho tất cả mọi người, dù họ mừng lễ nào.","Chúc mùa lễ vui vẻ! Tháng 1 gặp lại nhé."]}],["Happy Thingyan!","ပျော်ရွှင်ဖွယ် သင်္ကြန် ဖြစ်ပါစေ။","English uses Happy + the festival's name: Happy Thingyan, Happy Diwali, Happy Eid. Also: Happy Myanmar New Year!","Happy Thingyan! Don't get too wet!","ပျော်ရွှင်ဖွယ် သင်္ကြန် ဖြစ်ပါစေ။ သိပ်မစိုစေနဲ့နော်။",{"es":["¡Feliz Thingyan!","El inglés usa Happy + el nombre de la fiesta: Happy Thingyan, Happy Diwali, Happy Eid. También: Happy Myanmar New Year!","¡Feliz Thingyan! ¡No te mojes demasiado!"],"fr":["Joyeux Thingyan !","L'anglais emploie Happy + le nom de la fête : Happy Thingyan, Happy Diwali, Happy Eid. On dit aussi : Happy Myanmar New Year!","Joyeux Thingyan ! Ne te fais pas trop mouiller !"],"hi":["थिंगयान मुबारक!","अंग्रेज़ी में Happy + त्योहार का नाम लगता है: Happy Thingyan, Happy Diwali, Happy Eid. यह भी: Happy Myanmar New Year!","थिंगयान मुबारक! ज़्यादा मत भीगना!"],"vi":["Chúc mừng Thingyan!","Tiếng Anh dùng Happy + tên lễ hội: Happy Thingyan, Happy Diwali, Happy Eid, Happy Lunar New Year. Cũng có: Happy Myanmar New Year!","Chúc mừng Thingyan! Đừng để ướt quá nhé!"]}]],"tr":{"es":["Fiestas y festivales","Saludos para el Año Nuevo y otras fiestas."],"fr":["Fêtes et festivals","Des formules pour le Nouvel An et les autres fêtes."],"hi":["छुट्टियाँ और त्योहार","नए साल और दूसरे त्योहारों की शुभकामनाएँ।"],"vi":["Ngày lễ và lễ hội","Lời chúc năm mới và các lễ hội khác."]}},{"en":"Big days and good news","my":"အထူးနေ့များနှင့် သတင်းကောင်း","desc":"Weddings, new jobs, babies, exams: sharing someone's happiness.","cards":[["Congratulations on your <span class=gray>new job<\/span>!","အလုပ်သစ် ရတဲ့အတွက် ဂုဏ်ယူပါတယ်။","Congratulations on + the good news: on your wedding, on your new baby, on passing your exam.","Congratulations on your wedding! You look wonderful.","မင်္ဂလာဆောင်အတွက် ဂုဏ်ယူပါတယ်။ အရမ်း လှတယ်။",{"es":["¡Felicidades por tu nuevo trabajo!","Congratulations on + la buena noticia: on your wedding, on your new baby, on passing your exam.","¡Felicidades por tu boda! Te ves espectacular."],"fr":["Félicitations pour ton nouveau travail !","Congratulations on + la bonne nouvelle : on your wedding, on your new baby, on passing your exam.","Félicitations pour ton mariage ! Tu es superbe."],"hi":["<span class=gray>नई नौकरी<\/span> की बधाई!","Congratulations on + अच्छी ख़बर: on your wedding, on your new baby, on passing your exam.","शादी की बधाई! आप बहुत सुंदर लग रही हैं।"],"vi":["Chúc mừng bạn có <span class=gray>việc mới<\/span>!","Congratulations on + tin vui: on your wedding, on your new baby, on passing your exam.","Chúc mừng đám cưới của bạn! Trông bạn tuyệt lắm."]}],["I'm so happy for you!","အရမ်း ဝမ်းသာပေးပါတယ်။","Shows you share their joy. Warm and personal.","— I got into university! — I'm so happy for you!","— တက္ကသိုလ် ဝင်ခွင့် ရပြီ။ — အရမ်း ဝမ်းသာပေးပါတယ်။",{"es":["¡Me alegro mucho por ti!","Muestra que compartes su alegría. Cálido y personal.","— ¡Entré a la universidad! — ¡Me alegro mucho por ti!"],"fr":["Je suis tellement content pour toi !","Montre que vous partagez sa joie. Chaleureux et personnel.","— Je suis admis à l'université ! — Je suis tellement content pour toi !"],"hi":["मैं तुम्हारे लिए बहुत ख़ुश हूँ!","दिखाता है कि आप उनकी ख़ुशी में शामिल हैं। आत्मीय और निजी।","— मेरा यूनिवर्सिटी में दाख़िला हो गया! — मैं तुम्हारे लिए बहुत ख़ुश हूँ!"],"vi":["Mình mừng cho bạn lắm!","Cho thấy bạn chia sẻ niềm vui với họ. Ấm áp và thân tình.","— Mình đỗ đại học rồi! — Mình mừng cho bạn lắm!"]}],["You deserve it!","ထိုက်တန်ပါတယ်။","Says they worked hard for this good thing.","— I won the prize! — Well, you deserve it!","— ဆုရသွားပြီ။ — ထိုက်တန်ပါတယ်။",{"es":["¡Te lo mereces!","Dice que trabajaron duro para conseguir esto.","— ¡Gané el premio! — ¡Pues te lo mereces!"],"fr":["Tu le mérites !","Dit qu'ils ont travaillé dur pour cette belle chose.","— J'ai gagné le prix ! — Eh bien, tu le mérites !"],"hi":["तुम इसके हक़दार हो!","कहता है कि उन्होंने इसे पाने के लिए कड़ी मेहनत की।","— मैंने इनाम जीत लिया! — तुम इसके हक़दार हो!"],"vi":["Bạn xứng đáng mà!","Nói rằng họ đã nỗ lực nhiều để có được điều này.","— Mình trúng giải rồi! — Bạn xứng đáng mà!"]}],["Happy anniversary!","နှစ်ပတ်လည် မင်္ဂလာပါ။","For the day someone got married, or started a job or a business, years ago.","Happy anniversary! Twenty years together!","နှစ်ပတ်လည် မင်္ဂလာပါ။ အတူတူ နှစ်ဆယ်နှစ် ရှိပြီ။",{"es":["¡Feliz aniversario!","Para el día en que alguien se casó, o empezó un trabajo o un negocio, hace años.","¡Feliz aniversario! ¡Veinte años juntos!"],"fr":["Joyeux anniversaire de mariage !","Pour le jour où quelqu'un s'est marié, ou a commencé un travail ou une entreprise, il y a des années.","Joyeux anniversaire de mariage ! Vingt ans ensemble !"],"hi":["सालगिरह मुबारक!","उस दिन के लिए, जब बरसों पहले किसी की शादी हुई थी, या किसी ने नौकरी या कारोबार शुरू किया था।","सालगिरह मुबारक! बीस साल साथ-साथ!"],"vi":["Chúc mừng ngày kỷ niệm!","Cho ngày mà nhiều năm trước ai đó kết hôn, hoặc bắt đầu một công việc hay việc kinh doanh.","Chúc mừng ngày kỷ niệm! Hai mươi năm bên nhau rồi!"]}],["All the best!","အားလုံး အဆင်ပြေပါစေ။","A warm wish for the future: for someone leaving, starting something new, or at the end of a card.","Good luck in your new school. All the best!","ကျောင်းသစ်မှာ ကံကောင်းပါစေ။ အားလုံး အဆင်ပြေပါစေ။",{"es":["¡Te deseo lo mejor!","Un deseo cálido para el futuro: para alguien que se va, que empieza algo nuevo, o al final de una tarjeta.","Suerte en tu nueva escuela. ¡Te deseo lo mejor!"],"fr":["Tous mes vœux !","Un vœu chaleureux pour l'avenir : pour quelqu'un qui part, qui commence quelque chose, ou à la fin d'une carte.","Bonne chance dans ta nouvelle école. Tous mes vœux !"],"hi":["ढेरों शुभकामनाएँ!","आगे के लिए आत्मीय शुभकामना: उसके लिए जो जा रहा है, कुछ नया शुरू कर रहा है, या कार्ड के अंत में।","नए स्कूल के लिए शुभकामनाएँ। सब अच्छा हो!"],"vi":["Chúc mọi điều tốt đẹp!","Lời chúc ấm áp cho tương lai: dành cho người sắp đi xa, sắp bắt đầu điều gì mới, hoặc viết ở cuối tấm thiệp.","Chúc bạn may mắn ở trường mới. Chúc mọi điều tốt đẹp!"]}]],"tr":{"es":["Días importantes y buenas noticias","Bodas, trabajos nuevos, bebés, exámenes: compartir la alegría de alguien."],"fr":["Grands jours et bonnes nouvelles","Mariages, nouveaux emplois, naissances, examens : partager la joie de quelqu'un."],"hi":["बड़े दिन और अच्छी ख़बर","शादी, नई नौकरी, बच्चा, परीक्षा: किसी की ख़ुशी में शामिल होना।"],"vi":["Ngày trọng đại và tin vui","Đám cưới, việc làm mới, em bé, kỳ thi: chia vui cùng người khác."]}},{"en":"Good wishes for what's next","my":"ရှေ့ဆက်အတွက် ဆုတောင်းစကား","desc":"Wishes for a trip, a meal, a night's sleep or a big moment.","cards":[["Have a safe trip!","ခရီး ချောမောပါစေ။","Said to someone leaving on a journey. Also: Safe travels!","Have a safe trip! Call me when you get there.","ခရီး ချောမောပါစေ။ ရောက်ရင် ဖုန်းဆက်နော်။",{"es":["¡Buen viaje!","Se le dice a alguien que sale de viaje. También: Safe travels!","¡Buen viaje! Llámame cuando llegues."],"fr":["Bon voyage !","Se dit à quelqu'un qui part en voyage. On dit aussi : Safe travels!","Bon voyage ! Appelle-moi quand tu arrives."],"hi":["आपकी यात्रा शुभ हो!","सफ़र पर निकल रहे व्यक्ति से कहा जाता है। यह भी: Safe travels!","यात्रा शुभ हो! पहुँचकर फ़ोन करना।"],"vi":["Chúc thượng lộ bình an!","Nói với người sắp lên đường. Cũng có: Safe travels!","Chúc thượng lộ bình an! Đến nơi gọi cho mình nhé."]}],["Enjoy your meal!","အရသာရှိရှိ စားပါ။","What a waiter, a cook or a host says when the food arrives.","Here's your soup. Enjoy your meal!","ဟင်းချို ရပါပြီ။ အရသာရှိရှိ စားပါ။",{"es":["¡Buen provecho!","Lo que dice un mesero, un cocinero o un anfitrión cuando llega la comida.","Aquí está su sopa. ¡Buen provecho!"],"fr":["Bon appétit !","Ce que dit un serveur, un cuisinier ou un hôte quand le plat arrive.","Voici votre soupe. Bon appétit !"],"hi":["खाने का आनंद लीजिए!","खाना आने पर वेटर, रसोइया या मेज़बान कहता है।","यह रहा आपका सूप। खाने का आनंद लीजिए!"],"vi":["Chúc ngon miệng!","Câu người phục vụ, đầu bếp hoặc chủ nhà nói khi món ăn được dọn ra.","Canh của anh đây. Chúc ngon miệng!"]}],["Have fun!","ပျော်ပျော် နေနော်။","Said to someone going to a party, a trip or a game.","— I'm going to the zoo today! — Have fun!","— ဒီနေ့ တိရစ္ဆာန်ရုံ သွားမယ်။ — ပျော်ပျော် နေနော်။",{"es":["¡Que te diviertas!","Se le dice a alguien que va a una fiesta, un viaje o un partido.","— ¡Hoy voy al zoológico! — ¡Que te diviertas!"],"fr":["Amuse-toi bien !","Se dit à quelqu'un qui va à une fête, en voyage ou à un match.","— Je vais au zoo aujourd'hui ! — Amuse-toi bien !"],"hi":["मज़े करना!","पार्टी, सैर या मैच पर जा रहे व्यक्ति से कहा जाता है।","— मैं आज चिड़ियाघर जा रहा हूँ! — मज़े करना!"],"vi":["Chơi vui nhé!","Nói với người sắp đi dự tiệc, đi chơi hay đi xem trận đấu.","— Hôm nay mình đi sở thú! — Chơi vui nhé!"]}],["Enjoy your holiday!","အားလပ်ရက်ကို ပျော်ပျော် ဖြတ်သန်းပါ။","Said to someone going away or taking time off. American English often says vacation.","Enjoy your holiday! Send us a photo.","အားလပ်ရက်ကို ပျော်ပျော် ဖြတ်သန်းပါ။ ဓာတ်ပုံ ပို့ပေးနော်။",{"es":["¡Felices vacaciones!","Se le dice a alguien que sale de viaje o se toma unos días libres. El inglés americano suele decir vacation.","¡Felices vacaciones! Mándanos una foto."],"fr":["Bonnes vacances !","Se dit à quelqu'un qui part ou prend des congés. L'anglais américain dit souvent vacation.","Bonnes vacances ! Envoie-nous une photo."],"hi":["छुट्टियों का मज़ा लेना!","उससे कहा जाता है जो घूमने जा रहा हो या कुछ दिन की छुट्टी ले रहा हो। अमेरिकी अंग्रेज़ी में अक्सर vacation कहते हैं।","छुट्टियों का मज़ा लेना! हमें एक फ़ोटो भेजना।"],"vi":["Đi nghỉ vui vẻ nhé!","Nói với người sắp đi du lịch hoặc nghỉ vài ngày. Tiếng Anh Mỹ thường nói vacation.","Đi nghỉ vui vẻ nhé! Gửi ảnh cho bọn mình nhé."]}],["Sleep well!","ကောင်းကောင်း အိပ်ပျော်ပါစေ။","Said at bedtime, after Good night. To children: Sweet dreams!","Good night, sleep well!","ကောင်းသောညပါ၊ ကောင်းကောင်း အိပ်ပျော်ပါစေ။",{"es":["¡Que duermas bien!","Se dice a la hora de dormir, después de Good night. A los niños: Sweet dreams!","Buenas noches, ¡que duermas bien!"],"fr":["Dors bien !","Se dit au coucher, après Good night. Aux enfants : Sweet dreams!","Bonne nuit, dors bien !"],"hi":["अच्छी नींद आए!","सोने के समय, Good night के बाद कहा जाता है। बच्चों से: Sweet dreams!","शुभ रात्रि, अच्छी नींद आए!"],"vi":["Ngủ ngon nhé!","Nói lúc đi ngủ, sau Good night. Với trẻ em: Sweet dreams!","Chúc ngủ ngon, ngủ ngon nhé!"]}],["Fingers crossed!","ကံကောင်းပါစေလို့ ဆုတောင်းပေးမယ်။","Hoping something goes well. People often cross two fingers when they say it.","— My exam results come out tomorrow. — Fingers crossed!","— မနက်ဖြန် စာမေးပွဲ အဖြေ ထွက်မယ်။ — ကံကောင်းပါစေလို့ ဆုတောင်းပေးမယ်။",{"es":["¡Crucemos los dedos!","Esperas que algo salga bien. La gente suele cruzar dos dedos al decirlo.","— Mañana salen los resultados de mi examen. — ¡Crucemos los dedos!"],"fr":["Je croise les doigts !","On espère que quelque chose se passera bien. Les gens croisent souvent deux doigts en le disant.","— Mes résultats d'examen sortent demain. — Je croise les doigts !"],"hi":["ईश्वर करे सब ठीक हो!","आप उम्मीद करते हैं कि कुछ अच्छा हो जाए। लोग इसे कहते हुए अक्सर दो उँगलियाँ एक-दूसरे पर चढ़ा लेते हैं।","— कल मेरी परीक्षा का नतीजा आ रहा है। — ईश्वर करे सब ठीक हो!"],"vi":["Cầu mong mọi việc suôn sẻ!","Bạn mong một việc gì đó diễn ra tốt đẹp. Người ta thường bắt chéo hai ngón tay khi nói câu này.","— Mai có kết quả thi của mình. — Cầu mong mọi việc suôn sẻ!"]}]],"tr":{"es":["Buenos deseos para lo que viene","Deseos para un viaje, una comida, una noche de sueño o un gran momento."],"fr":["Bons vœux pour la suite","Des vœux pour un voyage, un repas, une nuit de sommeil ou un grand moment."],"hi":["आगे के लिए शुभकामनाएँ","सफ़र, खाने, रात की नींद या किसी बड़े मौक़े के लिए शुभकामनाएँ।"],"vi":["Lời chúc cho điều sắp tới","Lời chúc cho một chuyến đi, một bữa ăn, một giấc ngủ hay một dịp quan trọng."]}},{"en":"When someone is ill","my":"နေမကောင်းတဲ့အခါ","desc":"Kind words for someone who is sick or going through a hard time.","cards":[["Get well soon!","မြန်မြန် နေကောင်းပါစေ။","The usual wish for someone who is ill or in hospital. Also written on cards.","I heard you're in hospital. Get well soon!","ဆေးရုံ တက်နေတယ်လို့ ကြားတယ်။ မြန်မြန် နေကောင်းပါစေ။",{"es":["¡Que te mejores pronto!","El deseo habitual para alguien enfermo o en el hospital. También se escribe en tarjetas.","Supe que estás en el hospital. ¡Que te mejores pronto!"],"fr":["Bon rétablissement !","Le vœu habituel pour quelqu'un de malade ou d'hospitalisé. S'écrit aussi sur les cartes.","J'ai appris que tu es à l'hôpital. Bon rétablissement !"],"hi":["जल्दी ठीक हो जाइए!","बीमार या अस्पताल में भर्ती व्यक्ति के लिए आम शुभकामना। कार्डों पर भी लिखी जाती है।","सुना है आप अस्पताल में हैं। जल्दी ठीक हो जाइए!"],"vi":["Chóng khỏe nhé!","Lời chúc thông thường cho người ốm hoặc đang nằm viện. Cũng được viết trên thiệp.","Mình nghe nói bạn đang nằm viện. Chóng khỏe nhé!"]}],["I hope you feel better soon.","မြန်မြန် သက်သာပါစေလို့ မျှော်လင့်ပါတယ်။","Softer and a little longer. Good for a cold, a headache, a bad day.","Sorry you've got a cold. I hope you feel better soon.","အအေးမိနေတယ်ဆိုလို့ စိတ်မကောင်းဘူး။ မြန်မြန် သက်သာပါစေ။",{"es":["Espero que te sientas mejor pronto.","Más suave y un poco más largo. Bueno para un resfriado, un dolor de cabeza, un mal día.","Qué mal que tengas un resfriado. Espero que te sientas mejor pronto."],"fr":["J'espère que tu iras mieux bientôt.","Plus doux et un peu plus long. Bien pour un rhume, un mal de tête, une mauvaise journée.","Désolé que tu aies un rhume. J'espère que tu iras mieux bientôt."],"hi":["उम्मीद है आप जल्द बेहतर महसूस करेंगे।","ज़्यादा नरम और थोड़ा लंबा। ज़ुकाम, सिरदर्द या बुरे दिन के लिए अच्छा।","अफ़सोस, तुम्हें ज़ुकाम हो गया। उम्मीद है तुम जल्द बेहतर महसूस करोगे।"],"vi":["Mong bạn sớm thấy khá hơn.","Nhẹ nhàng hơn và dài hơn một chút. Hợp khi ai đó bị cảm, đau đầu, hoặc có một ngày tồi tệ.","Tội bạn bị cảm. Mong bạn sớm thấy khá hơn."]}],["Take it easy.","အေးအေးဆေးဆေး နေပါ။","Rest and don't work too hard. Also a casual goodbye.","Stay in bed today and take it easy.","ဒီနေ့ အိပ်ရာထဲမှာပဲ အေးအေးဆေးဆေး နေပါ။",{"es":["Tómalo con calma.","Descansa y no trabajes demasiado. También es una despedida informal.","Hoy quédate en cama y tómalo con calma."],"fr":["Ménage-toi.","Reposez-vous et ne travaillez pas trop. C'est aussi un au revoir familier.","Reste au lit aujourd'hui et ménage-toi."],"hi":["आराम कीजिए।","आराम कीजिए और ज़्यादा काम मत कीजिए। यह अनौपचारिक विदा भी है।","आज बिस्तर पर ही रहो और आराम करो।"],"vi":["Nghỉ ngơi cho khỏe nhé.","Hãy nghỉ ngơi và đừng làm việc quá sức. Cũng là một lời tạm biệt thân mật.","Hôm nay cứ nằm nghỉ, đừng làm gì nhiều nhé."]}],["I'm thinking of you.","သတိရနေပါတယ်။","For someone having a hard time: you care about them, even from far away.","I'm thinking of you. Call me if you need anything.","သတိရနေပါတယ်။ ဘာလိုလို ဖုန်းဆက်နော်။",{"es":["Pienso en ti.","Para alguien que pasa por un momento difícil: te importa, aunque estés lejos.","Pienso en ti. Llámame si necesitas algo."],"fr":["Je pense à toi.","Pour quelqu'un qui traverse un moment difficile : il compte pour vous, même de loin.","Je pense à toi. Appelle-moi si tu as besoin de quoi que ce soit."],"hi":["मैं तुम्हारे बारे में सोच रहा हूँ।","उसके लिए जो मुश्किल दौर से गुज़र रहा हो: आपको उसकी परवाह है, भले ही आप दूर हों।","मैं तुम्हारे बारे में सोच रहा हूँ। कुछ चाहिए हो तो फ़ोन करना।"],"vi":["Mình luôn nghĩ đến bạn.","Dành cho người đang trải qua lúc khó khăn: bạn quan tâm đến họ, dù ở xa.","Mình luôn nghĩ đến bạn. Cần gì cứ gọi cho mình nhé."]}]],"tr":{"es":["Cuando alguien está enfermo","Palabras amables para alguien enfermo o que pasa por un momento difícil."],"fr":["Quand quelqu'un est malade","Des mots gentils pour quelqu'un de malade ou qui traverse un moment difficile."],"hi":["जब कोई बीमार हो","बीमार या मुश्किल समय से गुज़र रहे व्यक्ति के लिए नरम शब्द।"],"vi":["Khi ai đó bị ốm","Những lời tử tế dành cho người đang ốm hoặc đang gặp khó khăn."]}},{"en":"Answering good wishes","my":"ဆုတောင်းစကားကို ပြန်ဖြေခြင်း","desc":"What to say back when someone wishes you well.","cards":[["Same to you!","ခင်ဗျား/ရှင့်အတွက်လည်း ဒီလိုပဲ ဖြစ်ပါစေ။","Returns the same wish. Good for Happy New Year! and Merry Christmas! Not for Happy birthday!","— Happy New Year! — Thanks, same to you!","— နှစ်သစ် မင်္ဂလာပါ။ — ကျေးဇူးပါ၊ ခင်ဗျားအတွက်လည်း ဒီလိုပဲ ဖြစ်ပါစေ။",{"es":["¡Igualmente!","Devuelve el mismo deseo. Bueno para Happy New Year! y Merry Christmas! No para Happy birthday!","— ¡Feliz Año Nuevo! — ¡Gracias, igualmente!"],"fr":["À toi aussi !","Renvoie le même vœu. Bien pour Happy New Year! et Merry Christmas! Pas pour Happy birthday!","— Bonne année ! — Merci, à toi aussi !"],"hi":["आपको भी वही शुभकामनाएँ!","वही शुभकामना लौटाता है। Happy New Year! और Merry Christmas! के लिए अच्छा। Happy birthday! के लिए नहीं।","— नया साल मुबारक! — शुक्रिया, आपको भी!"],"vi":["Bạn cũng vậy nhé!","Chúc lại đúng lời chúc đó. Hợp với Happy New Year! và Merry Christmas! Không dùng cho Happy birthday!","— Chúc mừng năm mới! — Cảm ơn, bạn cũng vậy nhé!"]}],["You too!","ခင်ဗျား/ရှင်လည်းပဲ။","Short and friendly. Very common after Have a nice day! or Have a good weekend!","— Have a great weekend! — You too!","— ပျော်စရာ ပိတ်ရက် ဖြစ်ပါစေ။ — ခင်ဗျားလည်းပဲ။",{"es":["¡Tú también!","Corto y amistoso. Muy común después de Have a nice day! o Have a good weekend!","— ¡Que tengas un excelente fin de semana! — ¡Tú también!"],"fr":["Toi aussi !","Court et amical. Très courant après Have a nice day! ou Have a good weekend!","— Passe un excellent week-end ! — Toi aussi !"],"hi":["आपको भी!","छोटा और दोस्ताना। Have a nice day! या Have a good weekend! के बाद बहुत आम।","— वीकेंड बढ़िया बीते! — तुम्हारा भी!"],"vi":["Bạn cũng thế nhé!","Ngắn gọn và thân thiện. Rất hay dùng sau Have a nice day! hoặc Have a good weekend!","— Cuối tuần vui vẻ nhé! — Bạn cũng thế nhé!"]}],["Thanks, I will!","ကျေးဇူးပါ၊ ဒီလိုပဲ နေမှာပါ။","The answer to Have fun! or Enjoy your holiday!","— Have fun at the party! — Thanks, I will!","— ပါတီမှာ ပျော်ပျော် နေနော်။ — ကျေးဇူးပါ၊ ပျော်အောင် နေမှာပါ။",{"es":["¡Gracias, así lo haré!","La respuesta a Have fun! o Enjoy your holiday!","— ¡Que te diviertas en la fiesta! — ¡Gracias, así lo haré!"],"fr":["Merci, je n'y manquerai pas !","La réponse à Have fun! ou Enjoy your holiday!","— Amuse-toi bien à la fête ! — Merci, je n'y manquerai pas !"],"hi":["शुक्रिया, ज़रूर!","Have fun! या Enjoy your holiday! का जवाब।","— पार्टी में मज़े करना! — शुक्रिया, ज़रूर!"],"vi":["Cảm ơn, nhất định rồi!","Câu đáp lại Have fun! hoặc Enjoy your holiday!","— Dự tiệc vui nhé! — Cảm ơn, nhất định rồi!"]}],["Thanks, it means a lot.","ကျေးဇူးပါ၊ အရမ်း တန်ဖိုးထားပါတယ်။","When someone's kind words really touch you.","— I'm so proud of you. — Thanks, it means a lot.","— မင်းအတွက် အရမ်း ဂုဏ်ယူတယ်။ — ကျေးဇူးပါ၊ အရမ်း တန်ဖိုးထားပါတယ်။",{"es":["Gracias, significa mucho para mí.","Cuando las palabras amables de alguien de verdad te llegan.","— Estoy muy orgulloso de ti. — Gracias, significa mucho para mí."],"fr":["Merci, ça me touche beaucoup.","Quand les mots gentils de quelqu'un vous touchent vraiment.","— Je suis tellement fier de toi. — Merci, ça me touche beaucoup."],"hi":["शुक्रिया, यह मेरे लिए बहुत मायने रखता है।","जब किसी के भले शब्द सचमुच आपके दिल को छू जाएँ।","— मुझे तुम पर बहुत गर्व है। — शुक्रिया, यह मेरे लिए बहुत मायने रखता है।"],"vi":["Cảm ơn, điều đó rất có ý nghĩa với mình.","Khi những lời tử tế của ai đó thật sự chạm đến bạn.","— Mình rất tự hào về bạn. — Cảm ơn, điều đó rất có ý nghĩa với mình."]}]],"tr":{"es":["Responder a los buenos deseos","Qué responder cuando alguien te desea algo bueno."],"fr":["Répondre aux bons vœux","Que répondre quand on vous souhaite quelque chose de bon."],"hi":["शुभकामनाओं का जवाब","जब कोई आपको शुभकामना दे, तो जवाब में क्या कहें।"],"vi":["Đáp lại lời chúc","Nói gì khi có người chúc bạn."]}}];const langs=["my","es","fr","hi","vi"];const COURSE="eng";</script>
