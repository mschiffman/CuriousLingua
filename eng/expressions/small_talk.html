<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/small_talk/";const AUD_EXT="mp3?v=2611110945";const categories=[{"en":"Starting a conversation","my":"စကားစ ပြောခြင်း","desc":"Easy first lines for neighbors, coworkers and people waiting next to you.","cards":[["Nice day, isn't it?","ဒီနေ့ ရာသီဥတု သာယာတယ်နော်။","Isn't it? at the end works like နော်: it invites the other person to agree. Just answer: Yes, it is! or It really is!","— Nice day, isn't it? — It really is!","— ရာသီဥတု သာယာတယ်နော်။ — ဟုတ်တယ်နော်။",{"es":["Qué bonito día, ¿verdad?","Isn't it? al final funciona como ¿verdad?: invita a la otra persona a estar de acuerdo. Solo responde: Yes, it is! o It really is!","— Qué bonito día, ¿verdad? — ¡La verdad, sí!"],"fr":["Belle journée, n'est-ce pas ?","Isn't it? à la fin fonctionne comme n'est-ce pas : on invite l'autre à approuver. Répondez simplement : Yes, it is! ou It really is!","— Belle journée, n'est-ce pas ? — Oui, vraiment !"],"hi":["अच्छा दिन है, है न?","अंत का isn't it? “है न?” का काम करता है: सामने वाले को सहमत होने का न्योता देता है। बस जवाब दीजिए: Yes, it is! या It really is!","— अच्छा दिन है, है न? — सच में!"],"vi":["Trời đẹp nhỉ?","Isn't it? ở cuối giống như “nhỉ?”: mời người kia đồng tình. Chỉ cần trả lời: Yes, it is! hoặc It really is!","— Trời đẹp nhỉ? — Đẹp thật!"]}],["How's your day going?","ဒီနေ့ ဘယ်လိုလဲ။","A friendly question for coworkers, or shop staff you know. Answer short: Pretty good, thanks. You?","— How's your day going? — Not bad! It's almost Friday.","— ဒီနေ့ ဘယ်လိုလဲ။ — မဆိုးပါဘူး။ သောကြာနေ့ ရောက်တော့မှာပဲ။",{"es":["¿Cómo va tu día?","Una pregunta amistosa para compañeros de trabajo o empleados de tienda que conoces. Respuesta corta: Pretty good, thanks. You?","— ¿Cómo va tu día? — ¡Nada mal! Ya casi es viernes."],"fr":["Comment se passe ta journée ?","Une question amicale pour les collègues ou les commerçants que vous connaissez. Réponse courte : Pretty good, thanks. You?","— Comment se passe ta journée ? — Pas mal ! C'est presque vendredi."],"hi":["आपका दिन कैसा जा रहा है?","सहकर्मियों या जान-पहचान के दुकानदारों के लिए दोस्ताना सवाल। छोटा जवाब: Pretty good, thanks. You?","— दिन कैसा जा रहा है? — बुरा नहीं! शुक्रवार आने ही वाला है।"],"vi":["Hôm nay của bạn thế nào?","Câu hỏi thân thiện dành cho đồng nghiệp hoặc nhân viên cửa hàng bạn quen. Trả lời ngắn: Pretty good, thanks. You?","— Hôm nay của bạn thế nào? — Cũng ổn! Sắp đến thứ Sáu rồi."]}],["Busy day?","ဒီနေ့ အလုပ်များလား။","Short and casual, at work or in a shop. Shows you notice the other person.","— Busy day? — Yes, it's been crazy!","— ဒီနေ့ အလုပ်များလား။ — အင်း၊ အရမ်းများတာပဲ။",{"es":["¿Mucho trabajo hoy?","Corto e informal, en el trabajo o en una tienda. Muestra que te fijas en la otra persona.","— ¿Mucho trabajo hoy? — ¡Sí, ha sido una locura!"],"fr":["Grosse journée ?","Court et familier, au travail ou dans un magasin. Montre que vous prêtez attention à l'autre.","— Grosse journée ? — Oui, c'est la folie !"],"hi":["आज बहुत काम है?","छोटा और अनौपचारिक, काम पर या दुकान में। दिखाता है कि आपका ध्यान सामने वाले पर है।","— आज बहुत काम है? — हाँ, आज तो हद ही हो गई!"],"vi":["Hôm nay bận à?","Ngắn gọn và thân mật, ở chỗ làm hoặc trong cửa hàng. Cho thấy bạn để ý đến người kia.","— Hôm nay bận à? — Ừ, bận điên lên được!"]}],["Have you been here before?","ဒီကို အရင် ရောက်ဖူးလား။","Good at a café, an event or any new place. Easy for the other person to answer.","Have you been here before? The noodles are great.","ဒီကို အရင် ရောက်ဖူးလား။ ခေါက်ဆွဲက အရမ်းကောင်းတယ်။",{"es":["¿Ya habías venido aquí?","Bueno en un café, un evento o cualquier lugar nuevo. Fácil de responder para la otra persona.","¿Ya habías venido aquí? Los fideos son buenísimos."],"fr":["Vous êtes déjà venu ici ?","Bien dans un café, à un événement ou dans tout lieu nouveau. Facile à répondre pour l'autre.","Vous êtes déjà venu ici ? Les nouilles sont excellentes."],"hi":["आप यहाँ पहले आए हैं?","किसी कैफ़े, कार्यक्रम या नई जगह पर अच्छा। सामने वाले के लिए जवाब देना आसान है।","आप यहाँ पहले आए हैं? यहाँ के नूडल्स बहुत बढ़िया हैं।"],"vi":["Bạn đến đây bao giờ chưa?","Hợp ở quán cà phê, sự kiện hoặc bất cứ chỗ nào mới. Người kia dễ trả lời.","Bạn đến đây bao giờ chưa? Mì ở đây ngon lắm."]}],["Are you waiting for the bus too?","မင်းလဲ ဘတ်စ်ကား စောင့်နေတာလား။","A natural way to start talking to someone waiting next to you.","Are you waiting for the number 12 bus too? It's late again.","၁၂ နံပါတ် ဘတ်စ်ကား စောင့်နေတာလား။ ထပ်နောက်ကျနေပြန်ပြီ။",{"es":["¿Usted también espera el autobús?","Una manera natural de empezar a hablar con alguien que espera junto a ti.","¿Usted también espera el autobús 12? Otra vez viene tarde."],"fr":["Vous attendez le bus aussi ?","Une façon naturelle d'engager la conversation avec quelqu'un qui attend à côté de vous.","Vous attendez le bus 12 aussi ? Il est encore en retard."],"hi":["क्या आप भी बस का इंतज़ार कर रहे हैं?","अपने पास इंतज़ार कर रहे व्यक्ति से बात शुरू करने का सहज तरीक़ा।","क्या आप भी 12 नंबर की बस का इंतज़ार कर रहे हैं? आज फिर देर से है।"],"vi":["Bạn cũng đang chờ xe buýt à?","Cách tự nhiên để bắt chuyện với người đang chờ cạnh bạn.","Bạn cũng đang chờ xe buýt số 12 à? Xe lại trễ nữa rồi."]}]],"tr":{"es":["Empezar una conversación","Primeras frases fáciles para vecinos, compañeros de trabajo y gente que espera junto a ti."],"fr":["Engager la conversation","Des premières phrases faciles pour les voisins, les collègues et les personnes qui attendent à côté de vous."],"hi":["बातचीत शुरू करना","पड़ोसियों, सहकर्मियों और आपके पास इंतज़ार कर रहे लोगों के लिए आसान पहली पंक्तियाँ।"],"vi":["Bắt chuyện","Những câu mở đầu dễ nói với hàng xóm, đồng nghiệp và người đang chờ bên cạnh bạn."]}},{"en":"The weather","my":"ရာသီဥတု","desc":"The safest small-talk topic in English. Everyone has something to say about the weather.","cards":[["It's so hot today!","ဒီနေ့ အရမ်း ပူတာပဲ။","Easy to say, easy to agree with. Also: It's boiling!","It's so hot today! I need a cold drink.","ဒီနေ့ အရမ်း ပူတာပဲ။ အအေး တစ်ခွက် သောက်ချင်တယ်။",{"es":["¡Qué calor hace hoy!","Fácil de decir y fácil de aprobar. También: It's boiling!","¡Qué calor hace hoy! Necesito una bebida fría."],"fr":["Qu'est-ce qu'il fait chaud aujourd'hui !","Facile à dire, facile à approuver. On dit aussi : It's boiling!","Qu'est-ce qu'il fait chaud aujourd'hui ! Il me faut une boisson fraîche."],"hi":["आज कितनी गरमी है!","कहना आसान, और हामी भरना भी आसान। यह भी: It's boiling!","आज कितनी गरमी है! मुझे कुछ ठंडा पीना है।"],"vi":["Hôm nay nóng quá!","Dễ nói và dễ được đồng tình. Cũng có: It's boiling!","Hôm nay nóng quá! Mình cần một ly nước mát."]}],["It looks like rain.","ကြည့်ရတာ မိုးရွာမယ့်ပုံပဲ။","The sky is dark and rain is coming. Also: It's going to rain.","It looks like rain. Do you have an umbrella?","မိုးရွာမယ့်ပုံပဲ။ ထီး ပါလား။",{"es":["Parece que va a llover.","El cielo está oscuro y viene la lluvia. También: It's going to rain.","Parece que va a llover. ¿Traes paraguas?"],"fr":["On dirait qu'il va pleuvoir.","Le ciel est sombre et la pluie arrive. On dit aussi : It's going to rain.","On dirait qu'il va pleuvoir. Tu as un parapluie ?"],"hi":["लगता है बारिश होगी।","आसमान काला है और बारिश आने वाली है। यह भी: It's going to rain.","लगता है बारिश होगी। आपके पास छाता है?"],"vi":["Trời sắp mưa thì phải.","Trời tối sầm và mưa sắp đến. Cũng có: It's going to rain.","Trời sắp mưa thì phải. Bạn có ô không?"]}],["What a lovely day!","ရာသီဥတု သာယာလိုက်တာ။","A happy comment on sunny, pleasant weather. Lovely is very common in British English.","What a lovely day! Let's eat outside.","ရာသီဥတု လှလိုက်တာ။ အပြင်မှာ ထိုင်စားကြရအောင်။",{"es":["¡Qué día tan bonito!","Un comentario alegre sobre un clima soleado y agradable. Lovely es muy común en el inglés británico.","¡Qué día tan bonito! Vamos a comer afuera."],"fr":["Quelle belle journée !","Une remarque joyeuse sur un temps ensoleillé et agréable. Lovely est très courant en anglais britannique.","Quelle belle journée ! Mangeons dehors."],"hi":["कितना सुहाना दिन है!","धूप वाले, ख़ुशनुमा मौसम पर ख़ुशी भरी टिप्पणी। Lovely ब्रिटिश अंग्रेज़ी में बहुत आम है।","कितना सुहाना दिन है! चलो बाहर बैठकर खाते हैं।"],"vi":["Hôm nay trời đẹp quá!","Lời nhận xét vui vẻ về thời tiết nắng đẹp, dễ chịu. Lovely rất phổ biến trong tiếng Anh Anh.","Hôm nay trời đẹp quá! Mình ăn ngoài trời đi."]}],["It's freezing!","အရမ်း စိမ့်အေးတာပဲ။","Very cold. People say it even when it's only a little cold.","It's freezing in this office! Can we turn the air conditioning off?","ဒီရုံးခန်းထဲ အရမ်း အေးတာပဲ။ အဲယားကွန်း ပိတ်လို့ ရမလား။",{"es":["¡Hace un frío tremendo!","Muy frío. La gente lo dice aunque solo haga un poco de frío.","¡Hace un frío tremendo en esta oficina! ¿Podemos apagar el aire acondicionado?"],"fr":["On gèle !","Très froid. Les gens le disent même quand il ne fait qu'un peu froid.","On gèle dans ce bureau ! On peut éteindre la climatisation ?"],"hi":["कड़ाके की ठंड है!","बहुत ठंड। लोग हल्की-सी ठंड में भी यह कह देते हैं।","इस दफ़्तर में कड़ाके की ठंड है! क्या हम एसी बंद कर सकते हैं?"],"vi":["Lạnh cóng!","Rất lạnh. Người ta nói vậy ngay cả khi chỉ hơi lạnh.","Văn phòng này lạnh cóng! Mình tắt máy lạnh được không?"]}],["Is it going to rain all week?","တစ်ပတ်လုံး မိုးရွာမှာလား။","Weather questions keep the conversation going. Also: What's the weather like tomorrow?","— Is it going to rain all week? — I hope not. My clothes won't dry!","— တစ်ပတ်လုံး မိုးရွာမှာလား။ — မရွာပါစေနဲ့။ အဝတ်တွေ မခြောက်ဘူး။",{"es":["¿Va a llover toda la semana?","Las preguntas sobre el clima mantienen viva la conversación. También: What's the weather like tomorrow?","— ¿Va a llover toda la semana? — Espero que no. ¡Mi ropa no se va a secar!"],"fr":["Il va pleuvoir toute la semaine ?","Les questions sur la météo entretiennent la conversation. On dit aussi : What's the weather like tomorrow?","— Il va pleuvoir toute la semaine ? — J'espère que non. Mon linge ne séchera jamais !"],"hi":["क्या पूरे हफ़्ते बारिश होगी?","मौसम के सवाल बातचीत को चलाए रखते हैं। यह भी: What's the weather like tomorrow?","— क्या पूरे हफ़्ते बारिश होगी? — उम्मीद है कि नहीं। मेरे कपड़े नहीं सूखेंगे!"],"vi":["Trời sẽ mưa cả tuần à?","Những câu hỏi về thời tiết giữ cho cuộc trò chuyện tiếp tục. Cũng có: What's the weather like tomorrow?","— Trời sẽ mưa cả tuần à? — Mong là không. Quần áo mình không khô được!"]}]],"tr":{"es":["El clima","El tema más seguro para platicar en inglés. Todos tienen algo que decir sobre el clima."],"fr":["La météo","Le sujet le plus sûr pour bavarder en anglais. Tout le monde a quelque chose à dire sur le temps."],"hi":["मौसम","अंग्रेज़ी में हल्की-फुल्की बातचीत का सबसे सुरक्षित विषय। मौसम पर कहने को हर किसी के पास कुछ होता है।"],"vi":["Thời tiết","Đề tài chuyện phiếm an toàn nhất trong tiếng Anh. Ai cũng có điều gì đó để nói về thời tiết."]}},{"en":"Weekends and plans","my":"ပိတ်ရက်နဲ့ အစီအစဉ်","desc":"Monday and Friday questions, at work and with friends.","cards":[["How was your weekend?","ပိတ်ရက်က ဘယ်လိုလဲ။","The Monday-morning question. Answer short, then ask back: Good, thanks. How was yours?","— How was your weekend? — Good, thanks. How was yours?","— ပိတ်ရက်က ဘယ်လိုလဲ။ — ကောင်းပါတယ်၊ ကျေးဇူးပါ။ မင်းရော။",{"es":["¿Qué tal tu fin de semana?","La pregunta del lunes por la mañana. Responde corto y devuelve la pregunta: Good, thanks. How was yours?","— ¿Qué tal tu fin de semana? — Bien, gracias. ¿Y el tuyo?"],"fr":["Tu as passé un bon week-end ?","La question du lundi matin. Répondez brièvement, puis renvoyez la question : Good, thanks. How was yours?","— Tu as passé un bon week-end ? — Oui, merci. Et toi ?"],"hi":["आपका वीकेंड कैसा रहा?","सोमवार सुबह का सवाल। छोटा जवाब दीजिए और सवाल लौटा दीजिए: Good, thanks. How was yours?","— वीकेंड कैसा रहा? — अच्छा, शुक्रिया। और तुम्हारा?"],"vi":["Cuối tuần của bạn thế nào?","Câu hỏi của sáng thứ Hai. Trả lời ngắn rồi hỏi lại: Good, thanks. How was yours?","— Cuối tuần của bạn thế nào? — Vui, cảm ơn. Còn bạn?"]}],["Did you do anything nice?","ဘာပျော်စရာတွေ လုပ်ဖြစ်သေးလဲ။","A follow-up question. A short answer is fine: one or two sentences.","— Did you do anything nice? — We went to the beach.","— ဘာ ထူးထူးခြားခြား လုပ်ခဲ့လဲ။ — ကမ်းခြေ သွားခဲ့တယ်။",{"es":["¿Hiciste algo bonito?","Una pregunta de seguimiento. Basta una respuesta corta: una o dos oraciones.","— ¿Hiciste algo bonito? — Fuimos a la playa."],"fr":["Tu as fait quelque chose de sympa ?","Une question pour relancer. Une réponse courte suffit : une ou deux phrases.","— Tu as fait quelque chose de sympa ? — On est allés à la plage."],"hi":["कुछ अच्छा किया?","आगे का सवाल। छोटा जवाब काफ़ी है: एक-दो वाक्य।","— कुछ अच्छा किया? — हम समुद्र-तट पर गए थे।"],"vi":["Bạn có làm gì vui không?","Câu hỏi tiếp theo. Trả lời ngắn là đủ: một hai câu.","— Bạn có làm gì vui không? — Bọn mình đi biển."]}],["Any plans for the weekend?","ပိတ်ရက် ဘာအစီအစဉ် ရှိလဲ။","The Friday question. Short for Do you have any plans for the weekend?","— Any plans for the weekend? — I'm visiting my aunt.","— ပိတ်ရက် ဘာအစီအစဉ် ရှိလဲ။ — အဒေါ့်ဆီ သွားလည်မယ်။",{"es":["¿Algún plan para el fin de semana?","La pregunta del viernes. Forma corta de Do you have any plans for the weekend?","— ¿Algún plan para el fin de semana? — Voy a visitar a mi tía."],"fr":["Des projets pour le week-end ?","La question du vendredi. Forme courte de Do you have any plans for the weekend?","— Des projets pour le week-end ? — Je vais voir ma tante."],"hi":["वीकेंड की कोई योजना?","शुक्रवार का सवाल। Do you have any plans for the weekend? का छोटा रूप।","— वीकेंड की कोई योजना? — मैं अपनी मौसी से मिलने जा रहा हूँ।"],"vi":["Cuối tuần có dự định gì không?","Câu hỏi của thứ Sáu. Dạng rút gọn của Do you have any plans for the weekend?","— Cuối tuần có dự định gì không? — Mình đi thăm dì."]}],["Ready for the weekend?","ပိတ်ရက် မျှော်နေပြီလား။","Another Friday question at work. It means: Are you happy the weekend is almost here? Answer: So ready! or Definitely!","— Ready for the weekend? — So ready! It's been a long week.","— ပိတ်ရက် မျှော်နေပြီလား။ — အရမ်း မျှော်နေတာ။ ဒီတစ်ပတ် အရမ်း ပင်ပန်းတယ်။",{"es":["¿Listo para el fin de semana?","Otra pregunta de viernes en el trabajo. Significa: ¿te alegra que ya casi sea fin de semana? Respuesta: So ready! o Definitely!","— ¿Listo para el fin de semana? — ¡Listísimo! Fue una semana larga."],"fr":["Prêt pour le week-end ?","Une autre question du vendredi au travail. Elle veut dire : content que le week-end arrive ? Réponse : So ready! ou Definitely!","— Prêt pour le week-end ? — Plus que prêt ! La semaine a été longue."],"hi":["वीकेंड के लिए तैयार?","काम पर शुक्रवार का एक और सवाल। मतलब: ख़ुश हो कि वीकेंड आने ही वाला है? जवाब: So ready! या Definitely!","— वीकेंड के लिए तैयार? — एकदम तैयार! यह हफ़्ता बहुत लंबा रहा।"],"vi":["Sẵn sàng cho cuối tuần chưa?","Một câu hỏi thứ Sáu khác ở chỗ làm. Nghĩa là: bạn có mừng vì sắp đến cuối tuần không? Trả lời: So ready! hoặc Definitely!","— Sẵn sàng cho cuối tuần chưa? — Quá sẵn sàng! Tuần này dài thật."]}],["Just relaxing at home.","အိမ်မှာပဲ အနားယူနေမယ်။","A perfect answer, even if your weekend is quiet. Also: Nothing much.","— What are you doing this weekend? — Just relaxing at home.","— ဒီပိတ်ရက် ဘာလုပ်မလဲ။ — အိမ်မှာပဲ အနားယူနေမယ်။",{"es":["Solo descansar en casa.","Una respuesta perfecta, aunque tu fin de semana sea tranquilo. También: Nothing much.","— ¿Qué vas a hacer este fin de semana? — Solo descansar en casa."],"fr":["Juste me reposer à la maison.","Une réponse parfaite, même si votre week-end est calme. On dit aussi : Nothing much.","— Tu fais quoi ce week-end ? — Juste me reposer à la maison."],"hi":["बस घर पर आराम।","बिलकुल ठीक जवाब, भले ही आपका वीकेंड शांत हो। यह भी: Nothing much.","— इस वीकेंड क्या कर रहे हो? — बस घर पर आराम।"],"vi":["Chỉ ở nhà nghỉ ngơi thôi.","Một câu trả lời hoàn hảo, dù cuối tuần của bạn rất bình lặng. Cũng có: Nothing much.","— Cuối tuần này bạn làm gì? — Chỉ ở nhà nghỉ ngơi thôi."]}],["Have a good weekend!","ပိတ်ရက် ပျော်ပါစေ။","The Friday goodbye. Answer: You too!","See you Monday. Have a good weekend!","တနင်္လာနေ့ တွေ့မယ်။ ပိတ်ရက် ပျော်ပါစေ။",{"es":["¡Buen fin de semana!","La despedida del viernes. Respuesta: You too!","Nos vemos el lunes. ¡Buen fin de semana!"],"fr":["Bon week-end !","L'au revoir du vendredi. Réponse : You too!","À lundi. Bon week-end !"],"hi":["वीकेंड अच्छा बीते!","शुक्रवार की विदा। जवाब: You too!","सोमवार को मिलते हैं। वीकेंड अच्छा बीते!"],"vi":["Cuối tuần vui vẻ nhé!","Lời tạm biệt của thứ Sáu. Trả lời: You too!","Thứ Hai gặp lại. Cuối tuần vui vẻ nhé!"]}]],"tr":{"es":["Fines de semana y planes","Las preguntas del lunes y del viernes, en el trabajo y con amigos."],"fr":["Week-ends et projets","Les questions du lundi et du vendredi, au travail et entre amis."],"hi":["वीकेंड और योजनाएँ","सोमवार और शुक्रवार के सवाल, काम पर और दोस्तों के साथ।"],"vi":["Cuối tuần và dự định","Câu hỏi của thứ Hai và thứ Sáu, ở chỗ làm và với bạn bè."]}},{"en":"Food","my":"အစားအသောက်","desc":"Everyone eats, so food is easy to talk about.","cards":[["This looks delicious!","စားချင်စရာ ကောင်းလိုက်တာ။","A compliment before you eat. Hosts and cooks love to hear it.","Wow, this looks delicious! Did you make it?","ဝိုး၊ စားချင်စရာ ကောင်းလိုက်တာ။ ကိုယ်တိုင် ချက်တာလား။",{"es":["¡Esto se ve delicioso!","Un cumplido antes de comer. A los anfitriones y a quienes cocinan les encanta oírlo.","¡Guau, esto se ve delicioso! ¿Lo hiciste tú?"],"fr":["Ça a l'air délicieux !","Un compliment avant de manger. Les hôtes et les cuisiniers adorent l'entendre.","Ouah, ça a l'air délicieux ! C'est toi qui l'as fait ?"],"hi":["यह तो बहुत स्वादिष्ट लग रहा है!","खाने से पहले की तारीफ़। मेज़बानों और खाना बनाने वालों को यह सुनना बहुत अच्छा लगता है।","वाह, यह तो बहुत स्वादिष्ट लग रहा है! आपने बनाया है?"],"vi":["Trông ngon quá!","Lời khen trước khi ăn. Chủ nhà và người nấu rất thích nghe câu này.","Chà, trông ngon quá! Bạn tự làm à?"]}],["Have you tried mohinga?","မုန့်ဟင်းခါး စားကြည့်ဖူးလား။","Good for talking about local food. Tried = eaten or drunk for the first time.","— Have you tried mohinga? — No, what's that? — It's a fish noodle soup. You'll love it!","— မုန့်ဟင်းခါး စားကြည့်ဖူးလား။ — မစားဖူးဘူး၊ အဲဒါ ဘာလဲ။ — ငါးဟင်းရည်နဲ့ ခေါက်ဆွဲ။ ကြိုက်မှာ သေချာတယ်။",{"es":["¿Ya probaste el mohinga?","Bueno para hablar de la comida local. Tried = comido o bebido por primera vez.","— ¿Ya probaste el mohinga? — No, ¿qué es? — Es una sopa de fideos con pescado. ¡Te va a encantar!"],"fr":["Tu as déjà goûté le mohinga ?","Bien pour parler de la cuisine locale. Tried = mangé ou bu pour la première fois.","— Tu as déjà goûté le mohinga ? — Non, c'est quoi ? — Une soupe de nouilles au poisson. Tu vas adorer !"],"hi":["क्या आपने मोहिंगा चखा है?","यहाँ के खाने पर बात करने के लिए अच्छा। Tried = पहली बार खाया या पिया।","— क्या आपने मोहिंगा चखा है? — नहीं, वह क्या है? — मछली वाला नूडल सूप। आपको बहुत पसंद आएगा!"],"vi":["Bạn đã thử mohinga chưa?","Hợp để nói về món ăn địa phương. Tried = ăn hoặc uống lần đầu.","— Bạn đã thử mohinga chưa? — Chưa, đó là gì vậy? — Là món bún cá. Bạn sẽ thích cho xem!"]}],["What's good here?","ဒီမှာ ဘာကောင်းလဲ။","Ask a friend or a waiter at a new restaurant.","It's my first time here. What's good?","ဒီကို ပထမဆုံး ရောက်ဖူးတာ။ ဘာကောင်းလဲ။",{"es":["¿Qué está rico aquí?","Pregúntale a un amigo o a un mesero en un restaurante nuevo.","Es mi primera vez aquí. ¿Qué está rico?"],"fr":["Qu'est-ce qui est bon ici ?","À demander à un ami ou à un serveur dans un nouveau restaurant.","C'est la première fois que je viens. Qu'est-ce qui est bon ?"],"hi":["यहाँ क्या अच्छा मिलता है?","नए रेस्तराँ में किसी दोस्त या वेटर से पूछिए।","मैं यहाँ पहली बार आया हूँ। यहाँ क्या अच्छा मिलता है?"],"vi":["Ở đây có món gì ngon?","Hỏi bạn bè hoặc người phục vụ ở một nhà hàng mới.","Mình đến đây lần đầu. Có món gì ngon?"]}],["Have you had lunch yet?","နေ့လယ်စာ စားပြီးပြီလား။","As a greeting, Have you eaten? sounds strange in English. But near lunchtime, this is a real, friendly question, often before an invitation.","Have you had lunch yet? Do you want to come with us?","နေ့လယ်စာ စားပြီးပြီလား။ ငါတို့နဲ့ လိုက်မလား။",{"es":["¿Ya comiste?","En inglés no se usa como saludo. Pero cerca de la hora de la comida es una pregunta real y amistosa, a menudo antes de una invitación.","¿Ya comiste? ¿Quieres venir con nosotros?"],"fr":["Tu as déjà déjeuné ?","En anglais, ce n'est pas une salutation. Mais vers midi, c'est une vraie question amicale, souvent avant une invitation.","Tu as déjà déjeuné ? Tu veux venir avec nous ?"],"hi":["आपने लंच कर लिया?","अंग्रेज़ी में यह अभिवादन की तरह नहीं बोला जाता। पर खाने के समय के आसपास यह सचमुच का, दोस्ताना सवाल है, अक्सर किसी न्योते से पहले।","तुमने लंच कर लिया? हमारे साथ चलोगे?"],"vi":["Bạn ăn trưa chưa?","Trong tiếng Anh, câu này không dùng làm lời chào. Nhưng gần giờ ăn thì đó là một câu hỏi thật, thân thiện, thường đi trước một lời mời.","Bạn ăn trưa chưa? Đi cùng bọn mình không?"]}],["I'm starving!","ဗိုက် အရမ်းဆာနေပြီ။","Very hungry. Casual, and not meant literally.","I'm starving! Let's get something to eat.","ဗိုက် အရမ်းဆာနေပြီ။ တစ်ခုခု သွားစားရအောင်။",{"es":["¡Me muero de hambre!","Mucha hambre. Informal, y no se dice en sentido literal.","¡Me muero de hambre! Vamos por algo de comer."],"fr":["Je meurs de faim !","Très faim. Familier, et pas à prendre au pied de la lettre.","Je meurs de faim ! Allons manger quelque chose."],"hi":["भूख से जान निकल रही है!","बहुत भूख लगी है। अनौपचारिक, और इसे शब्दशः नहीं लिया जाता।","भूख से जान निकल रही है! चलो कुछ खाते हैं।"],"vi":["Mình đói muốn chết!","Rất đói. Thân mật, và không hiểu theo nghĩa đen.","Mình đói muốn chết! Đi kiếm gì ăn đi."]}]],"tr":{"es":["La comida","Todos comemos, así que es fácil hablar de comida."],"fr":["La nourriture","Tout le monde mange, donc la nourriture est un sujet facile."],"hi":["खाना","खाते सभी हैं, इसलिए खाने पर बात करना आसान है।"],"vi":["Đồ ăn","Ai cũng ăn, nên chuyện ăn uống rất dễ nói."]}},{"en":"Work and free time","my":"အလုပ်နဲ့ အားလပ်ချိန်","desc":"Easy questions about someone's job, hobbies, and what they're watching or reading.","cards":[["How's work treating you?","အလုပ်ကော အဆင်ပြေရဲ့လား။","A friendly way to say How's work? Answer: Not bad, thanks. or Can't complain.","— How's work treating you? — Can't complain. Busy, but good.","— အလုပ်ကော အဆင်ပြေရဲ့လား။ — အဆင်ပြေပါတယ်။ အလုပ်များပေမယ့် ကောင်းပါတယ်။",{"es":["¿Cómo te va en el trabajo?","Una manera amistosa de decir How's work? Respuesta: Not bad, thanks. o Can't complain.","— ¿Cómo te va en el trabajo? — No me quejo. Mucho trabajo, pero bien."],"fr":["Comment ça se passe au travail ?","Une façon amicale de dire How's work? Réponse : Not bad, thanks. ou Can't complain.","— Comment ça se passe au travail ? — Je ne me plains pas. Chargé, mais bien."],"hi":["काम कैसा चल रहा है?","How's work? कहने का दोस्ताना तरीक़ा। जवाब: Not bad, thanks. या Can't complain.","— काम कैसा चल रहा है? — शिकायत नहीं कर सकता। व्यस्त हूँ, पर ठीक है।"],"vi":["Công việc dạo này thế nào?","Một cách thân thiện để hỏi How's work? Trả lời: Not bad, thanks. hoặc Can't complain.","— Công việc dạo này thế nào? — Không có gì để phàn nàn. Bận, nhưng ổn."]}],["What do you do to unwind?","အနားယူချင်ရင် ဘာလုပ်လဲ။","Unwind = relax after work or a busy day. A warm way to ask about someone's hobbies.","— What do you do to unwind? — I go for a walk or cook something.","— အနားယူချင်ရင် ဘာလုပ်လဲ။ — လမ်းလျှောက်တယ်၊ ဒါမှမဟုတ် တစ်ခုခု ချက်စားတယ်။",{"es":["¿Qué haces para relajarte?","Unwind = relajarse después del trabajo o de un día pesado. Una manera cálida de preguntar por los pasatiempos de alguien.","— ¿Qué haces para relajarte? — Salgo a caminar o cocino algo."],"fr":["Que fais-tu pour décompresser ?","Unwind = se détendre après le travail ou une journée chargée. Une façon chaleureuse de s'intéresser aux loisirs de quelqu'un.","— Que fais-tu pour décompresser ? — Je vais marcher ou je cuisine quelque chose."],"hi":["थकान उतारने के लिए आप क्या करते हैं?","Unwind = काम या भारी दिन के बाद सुस्ताना। किसी के शौक़ पूछने का आत्मीय तरीक़ा।","— थकान उतारने के लिए तुम क्या करते हो? — मैं टहलने निकल जाता हूँ या कुछ पका लेता हूँ।"],"vi":["Bạn làm gì để thư giãn?","Unwind = thư giãn sau giờ làm hoặc sau một ngày mệt. Một cách ấm áp để hỏi về sở thích của ai đó.","— Bạn làm gì để thư giãn? — Mình đi dạo hoặc nấu món gì đó."]}],["Picked up any new hobbies?","ဝါသနာ အသစ် တစ်ခုခု စလုပ်ဖြစ်လား။","Short for Have you picked up any new hobbies? Pick up a hobby = start a new hobby.","— Picked up any new hobbies? — Yes, I've started playing badminton.","— ဝါသနာ အသစ် တစ်ခုခု စလုပ်ဖြစ်လား။ — အင်း၊ ကြက်တောင် စရိုက်နေတယ်။",{"es":["¿Algún pasatiempo nuevo?","Forma corta de Have you picked up any new hobbies? Pick up a hobby = empezar un pasatiempo nuevo.","— ¿Algún pasatiempo nuevo? — Sí, empecé a jugar bádminton."],"fr":["De nouveaux passe-temps ?","Forme courte de Have you picked up any new hobbies? Pick up a hobby = se mettre à un nouveau loisir.","— De nouveaux passe-temps ? — Oui, je me suis mis au badminton."],"hi":["कोई नया शौक़ शुरू किया?","Have you picked up any new hobbies? का छोटा रूप। Pick up a hobby = नया शौक़ शुरू करना।","— कोई नया शौक़ शुरू किया? — हाँ, मैंने बैडमिंटन खेलना शुरू किया है।"],"vi":["Có sở thích gì mới không?","Dạng rút gọn của Have you picked up any new hobbies? Pick up a hobby = bắt đầu một sở thích mới.","— Có sở thích gì mới không? — Có, mình mới bắt đầu chơi cầu lông."]}],["Watching anything good?","ရုပ်ရှင်ကောင်းကောင်း တစ်ခုခု ကြည့်နေလား။","About TV shows and series. Casual questions often drop the first words: (Are you) watching anything good?","— Watching anything good? — Yes, a great Korean drama.","— ကောင်းတာ တစ်ခုခု ကြည့်နေလား။ — အင်း၊ ကိုရီးယား ဇာတ်လမ်းတွဲ ကောင်းကောင်း တစ်ခု။",{"es":["¿Estás viendo algo bueno?","Sobre programas y series de televisión. Las preguntas informales suelen omitir las primeras palabras: (Are you) watching anything good?","— ¿Estás viendo algo bueno? — Sí, una serie coreana buenísima."],"fr":["Tu regardes quelque chose de bien ?","À propos des émissions et des séries. Les questions familières omettent souvent les premiers mots : (Are you) watching anything good?","— Tu regardes quelque chose de bien ? — Oui, une super série coréenne."],"hi":["कुछ अच्छा देख रहे हो?","टीवी कार्यक्रमों और सीरीज़ के बारे में। अनौपचारिक सवालों में अक्सर शुरू के शब्द छूट जाते हैं: (Are you) watching anything good?","— कुछ अच्छा देख रहे हो? — हाँ, एक बढ़िया कोरियाई ड्रामा।"],"vi":["Đang xem gì hay không?","Về các chương trình và phim truyền hình. Câu hỏi thân mật thường bỏ mấy từ đầu: (Are you) watching anything good?","— Đang xem gì hay không? — Có, một bộ phim Hàn rất hay."]}],["Read any good books lately?","အခုတလော စာအုပ်ကောင်းကောင်း ဖတ်ဖြစ်လား။","Short for Have you read...? Lately = recently. Change the noun: Seen any good movies lately?","— Read any good books lately? — Not really. I don't have time!","— အခုတလော စာအုပ်ကောင်းကောင်း ဖတ်ဖြစ်လား။ — သိပ်မဖတ်ဖြစ်ဘူး။ အချိန် မရဘူး။",{"es":["¿Has leído algún buen libro últimamente?","Forma corta de Have you read...? Lately = recientemente. Cambia el sustantivo: Seen any good movies lately?","— ¿Has leído algún buen libro últimamente? — La verdad, no. ¡No tengo tiempo!"],"fr":["Tu as lu de bons livres dernièrement ?","Forme courte de Have you read...? Lately = récemment. Changez le nom : Seen any good movies lately?","— Tu as lu de bons livres dernièrement ? — Pas vraiment. Je n'ai pas le temps !"],"hi":["इधर कोई अच्छी किताब पढ़ी?","Have you read...? का छोटा रूप। Lately = हाल में। संज्ञा बदल दीजिए: Seen any good movies lately?","— इधर कोई अच्छी किताब पढ़ी? — कुछ ख़ास नहीं। समय ही नहीं मिलता!"],"vi":["Dạo này có đọc cuốn nào hay không?","Dạng rút gọn của Have you read...? Lately = gần đây. Đổi danh từ: Seen any good movies lately?","— Dạo này có đọc cuốn nào hay không? — Không hẳn. Mình chẳng có thời gian!"]}]],"tr":{"es":["Trabajo y tiempo libre","Preguntas fáciles sobre el trabajo de alguien, sus pasatiempos y lo que está viendo o leyendo."],"fr":["Travail et temps libre","Des questions faciles sur le travail de quelqu'un, ses loisirs, et ce qu'il regarde ou lit."],"hi":["काम और ख़ाली समय","किसी के काम, शौक़ और वे क्या देख या पढ़ रहे हैं, इस पर आसान सवाल।"],"vi":["Công việc và thời gian rảnh","Những câu hỏi dễ về công việc, sở thích, và người kia đang xem gì, đọc gì."]}},{"en":"Keeping the conversation going","my":"စကားဆက်ပြောခြင်း","desc":"Small talk is like a ball game: catch it, then throw it back.","cards":[["What about you?","ခင်ဗျား/ရှင်ရော။","Throws the question back. Without it, small talk stops. Also: How about you?","— I've lived here for three years. What about you? — Only six months.","— ဒီမှာ သုံးနှစ် နေခဲ့ပြီ။ ခင်ဗျားရော။ — ခြောက်လပဲ ရှိသေးတယ်။",{"es":["¿Y tú?","Devuelve la pregunta. Sin ella, la plática se acaba. También: How about you?","— Llevo tres años viviendo aquí. ¿Y tú? — Solo seis meses."],"fr":["Et toi ?","Renvoie la question. Sans cela, la conversation s'arrête. On dit aussi : How about you?","— J'habite ici depuis trois ans. Et toi ? — Seulement six mois."],"hi":["और आप?","सवाल लौटा देता है। इसके बिना बातचीत ख़त्म हो जाती है। यह भी: How about you?","— मैं यहाँ तीन साल से रह रहा हूँ। और आप? — बस छह महीने से।"],"vi":["Còn bạn thì sao?","Hỏi lại người kia. Không có nó, câu chuyện sẽ tắt. Cũng có: How about you?","— Mình sống ở đây ba năm rồi. Còn bạn thì sao? — Mới sáu tháng thôi."]}],["Oh, really?","အော်၊ ဟုတ်လား။","Shows interest and invites the person to tell you more. Let your voice go up.","— I used to be a nurse. — Oh, really? Where did you work?","— အရင်က သူနာပြု လုပ်ခဲ့တယ်။ — အော်၊ ဟုတ်လား။ ဘယ်မှာ လုပ်ခဲ့လဲ။",{"es":["¿Ah, sí?","Muestra interés e invita a la persona a contarte más. Deja que la voz suba.","— Antes era enfermera. — ¿Ah, sí? ¿Dónde trabajabas?"],"fr":["Ah bon ?","Montre de l'intérêt et invite la personne à en dire plus. Laissez la voix monter.","— J'étais infirmière avant. — Ah bon ? Où travaillais-tu ?"],"hi":["अच्छा, सच में?","दिलचस्पी दिखाता है और सामने वाले को और बताने का न्योता देता है। आवाज़ ऊपर उठने दीजिए।","— मैं पहले नर्स थी। — अच्छा, सच में? आप कहाँ काम करती थीं?"],"vi":["Ồ, thật à?","Tỏ ra quan tâm và mời người kia kể thêm. Để giọng lên cao.","— Trước đây mình làm y tá. — Ồ, thật à? Bạn làm ở đâu?"]}],["That sounds fun!","ပျော်စရာကြီး။","A warm reaction to someone's plans or story. Also: That sounds great!","— We're going camping this weekend. — That sounds fun!","— ဒီပိတ်ရက် စခန်းချ သွားမလို့။ — ပျော်စရာကြီး။",{"es":["¡Suena divertido!","Una reacción cálida a los planes o a la historia de alguien. También: That sounds great!","— Vamos a acampar este fin de semana. — ¡Suena divertido!"],"fr":["Ça a l'air sympa !","Une réaction chaleureuse aux projets ou au récit de quelqu'un. On dit aussi : That sounds great!","— On part camper ce week-end. — Ça a l'air sympa !"],"hi":["सुनकर मज़ेदार लग रहा है!","किसी की योजना या क़िस्से पर आत्मीय प्रतिक्रिया। यह भी: That sounds great!","— इस वीकेंड हम कैंपिंग पर जा रहे हैं। — सुनकर मज़ेदार लग रहा है!"],"vi":["Nghe vui đấy!","Một phản ứng ấm áp trước dự định hay câu chuyện của ai đó. Cũng có: That sounds great!","— Cuối tuần này bọn mình đi cắm trại. — Nghe vui đấy!"]}],["How long have you lived here?","ဒီမှာ နေတာ ဘယ်လောက် ကြာပြီလဲ။","A great follow-up question about someone's life. Also: How long have you worked here?","— How long have you lived here? — About five years.","— ဒီမှာ နေတာ ဘယ်လောက် ကြာပြီလဲ။ — ငါးနှစ်လောက် ရှိပြီ။",{"es":["¿Cuánto tiempo llevas viviendo aquí?","Una excelente pregunta de seguimiento sobre la vida de alguien. También: How long have you worked here?","— ¿Cuánto tiempo llevas viviendo aquí? — Unos cinco años."],"fr":["Depuis combien de temps habites-tu ici ?","Une excellente question pour relancer sur la vie de quelqu'un. On dit aussi : How long have you worked here?","— Depuis combien de temps habites-tu ici ? — Environ cinq ans."],"hi":["आप यहाँ कब से रह रहे हैं?","किसी की ज़िंदगी के बारे में आगे पूछने का बढ़िया सवाल। यह भी: How long have you worked here?","— आप यहाँ कब से रह रहे हैं? — क़रीब पाँच साल से।"],"vi":["Bạn sống ở đây bao lâu rồi?","Một câu hỏi tiếp rất hay về cuộc sống của ai đó. Cũng có: How long have you worked here?","— Bạn sống ở đây bao lâu rồi? — Khoảng năm năm."]}],["Oh, nice!","ကောင်းလိုက်တာ။","A short, happy reaction that keeps things friendly. Also: Oh, cool!","— I just started a cooking class. — Oh, nice! What are you making?","— ချက်ပြုတ်နည်း သင်တန်း အခုမှ စတက်တာ။ — ကောင်းလိုက်တာ။ ဘာချက်နေလဲ။",{"es":["¡Ah, qué bien!","Una reacción corta y alegre que mantiene el buen ambiente. También: Oh, cool!","— Acabo de empezar una clase de cocina. — ¡Ah, qué bien! ¿Qué estás preparando?"],"fr":["Oh, super !","Une réaction courte et joyeuse qui garde l'ambiance amicale. On dit aussi : Oh, cool!","— Je viens de commencer un cours de cuisine. — Oh, super ! Qu'est-ce que tu prépares ?"],"hi":["अरे, बढ़िया!","छोटी, ख़ुशी भरी प्रतिक्रिया जो माहौल अच्छा बनाए रखती है। यह भी: Oh, cool!","— मैंने अभी-अभी कुकिंग क्लास शुरू की है। — अरे, बढ़िया! क्या बना रहे हो?"],"vi":["Ồ, hay quá!","Một phản ứng ngắn, vui vẻ, giữ cho không khí dễ chịu. Cũng có: Oh, cool!","— Mình mới bắt đầu một lớp nấu ăn. — Ồ, hay quá! Bạn đang nấu món gì?"]}]],"tr":{"es":["Mantener la conversación","La plática es como un juego de pelota: atrápala y devuélvela."],"fr":["Entretenir la conversation","Bavarder, c'est comme un jeu de balle : on l'attrape, puis on la renvoie."],"hi":["बातचीत को आगे बढ़ाना","हल्की-फुल्की बातचीत गेंद के खेल जैसी है: पकड़िए, फिर वापस फेंकिए।"],"vi":["Giữ cho cuộc trò chuyện tiếp tục","Chuyện phiếm giống như chơi bóng: bắt lấy, rồi ném lại."]}},{"en":"Careful: too personal","my":"သတိ၊ ကိုယ်ရေးကိုယ်တာ လွန်တယ်","desc":"Questions that are friendly in Myanmar can feel too personal in English, especially with people you've just met.","cards":[["How old are you?","အသက် ဘယ်လောက်လဲ။","Normal in Burmese, where age tells you how to address someone. In English, adults rarely ask people they've just met. Wait until you're friends.","— How old are you? — Ha, that's a secret!","— အသက် ဘယ်လောက်လဲ။ — ဟား၊ လျှို့ဝှက်ချက်ပါ။",{"es":["¿Cuántos años tienes?","En inglés, los adultos casi nunca se lo preguntan a alguien que acaban de conocer. Espera a que sean amigos.","— ¿Cuántos años tienes? — ¡Ja, es un secreto!"],"fr":["Quel âge as-tu ?","En anglais, les adultes le demandent rarement à quelqu'un qu'ils viennent de rencontrer. Attendez d'être amis.","— Quel âge as-tu ? — Ha, c'est un secret !"],"hi":["आपकी उम्र क्या है?","अंग्रेज़ी में बड़े लोग यह सवाल उससे लगभग कभी नहीं पूछते जिससे वे अभी मिले हों। दोस्ती हो जाने तक रुकिए।","— आपकी उम्र क्या है? — हा, यह तो राज़ है!"],"vi":["Bạn bao nhiêu tuổi?","Trong tiếng Anh, người lớn hầu như không bao giờ hỏi câu này với người vừa mới quen. Hãy chờ đến khi thành bạn.","— Bạn bao nhiêu tuổi? — Ha, bí mật đấy!"]}],["That's a bit personal.","အဲဒါက နည်းနည်း ကိုယ်ရေးကိုယ်တာ ကျတယ်။","A polite way not to answer a personal question. Smile, then change the topic.","— How much did you pay for your house? — Oh, that's a bit personal! So, how's work?","— အိမ်ကို ဘယ်လောက်နဲ့ ဝယ်ခဲ့လဲ။ — အော်၊ အဲဒါက နည်းနည်း ကိုယ်ရေးကိုယ်တာ ကျတယ်။ ဒါနဲ့ အလုပ်ကော ဘယ်လိုလဲ။",{"es":["Eso es un poco personal.","Una manera cortés de no responder una pregunta personal. Sonríe y cambia de tema.","— ¿Cuánto pagaste por tu casa? — ¡Ay, eso es un poco personal! Y bueno, ¿qué tal el trabajo?"],"fr":["C'est un peu personnel.","Une façon polie de ne pas répondre à une question personnelle. Souriez, puis changez de sujet.","— Combien as-tu payé ta maison ? — Oh, c'est un peu personnel ! Alors, et le travail ?"],"hi":["यह थोड़ा निजी सवाल है।","निजी सवाल का जवाब न देने का विनम्र तरीक़ा। मुस्कुराइए और बात बदल दीजिए।","— आपने अपना घर कितने में ख़रीदा? — अरे, यह थोड़ा निजी सवाल है! तो, काम कैसा चल रहा है?"],"vi":["Câu đó hơi riêng tư.","Một cách lịch sự để không trả lời câu hỏi riêng tư. Mỉm cười rồi đổi đề tài.","— Bạn mua nhà hết bao nhiêu tiền? — Ôi, câu đó hơi riêng tư! Thế, công việc dạo này thế nào?"]}]],"tr":{"es":["Cuidado: demasiado personal","Preguntas que en otras culturas son amistosas pueden sentirse demasiado personales en inglés, sobre todo con gente que acabas de conocer."],"fr":["Attention : trop personnel","Des questions amicales dans d'autres cultures peuvent paraître trop personnelles en anglais, surtout avec des gens que l'on vient de rencontrer."],"hi":["सावधान: बहुत निजी","जो सवाल अपने यहाँ दोस्ताना माने जाते हैं, वे अंग्रेज़ी में बहुत निजी लग सकते हैं, ख़ासकर उन लोगों के साथ जिनसे आप अभी मिले हैं।"],"vi":["Cẩn thận: quá riêng tư","Những câu hỏi thân tình ở quê mình có thể bị coi là quá riêng tư trong tiếng Anh, nhất là với người bạn vừa mới gặp."]}}];const langs=["my","es","fr","hi","vi"];const COURSE="eng";</script>
