<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/likes_dislikes/";const AUD_EXT="mp3?v=2611100606";const categories=[{"en":"Saying you like something","my":"ကြိုက်တာကို ပြောခြင်း","desc":"From a simple like to a big love.","cards":[["I like <span class=gray>Burmese food<\/span>.","ဗမာအစားအစာကို ကြိုက်တယ်။","For general likes, use the plural: I like cats. I like movies. For things you don't count, no plural: I like rice. I like coffee.","I like cats, but I don't have one.","ကြောင်ကို ကြိုက်တယ်၊ ဒါပေမဲ့ မမွေးထားဘူး။",{"es":["Me gusta la comida birmana.","Para gustos generales, usa el plural: I like cats. I like movies. Para lo que no se cuenta, sin plural: I like rice. I like coffee.","Me gustan los gatos, pero no tengo ninguno."],"fr":["J'aime la cuisine birmane.","Pour les goûts généraux, employez le pluriel : I like cats. I like movies. Pour ce qui ne se compte pas, pas de pluriel : I like rice. I like coffee.","J'aime les chats, mais je n'en ai pas."],"hi":["मुझे <span class=gray>बर्मी खाना<\/span> पसंद है।","आम पसंद के लिए बहुवचन लगाइए: I like cats. I like movies. जो चीज़ें गिनी नहीं जातीं, वहाँ बहुवचन नहीं: I like rice. I like coffee.","मुझे बिल्लियाँ पसंद हैं, पर मेरे पास एक भी नहीं है।"],"vi":["Mình thích <span class=gray>món ăn Myanmar<\/span>.","Với sở thích nói chung, dùng số nhiều: I like cats. I like movies. Với thứ không đếm được thì không có số nhiều: I like rice. I like coffee.","Mình thích mèo, nhưng mình không nuôi con nào."]}],["I love <span class=gray>noodles<\/span>.","ခေါက်ဆွဲကို အရမ်းကြိုက်တယ်။","Stronger than like. English uses love for food, music, places and hobbies, not only people. Here it means အရမ်းကြိုက်တယ်, not ချစ်တယ်.","I love mohinga. I eat it every Sunday.","မုန့်ဟင်းခါး အရမ်းကြိုက်တယ်။ တနင်္ဂနွေတိုင်း စားတယ်။",{"es":["Me encantan los fideos.","Más fuerte que like. El inglés usa love para comida, música, lugares y pasatiempos, no solo para personas. Aquí es me encanta, no amo.","Me encanta el mohinga. Lo como todos los domingos."],"fr":["J'adore les nouilles.","Plus fort que like. L'anglais emploie love pour la nourriture, la musique, les lieux et les loisirs, pas seulement pour les personnes. Ici, c'est adorer, pas aimer d'amour.","J'adore le mohinga. J'en mange tous les dimanches."],"hi":["मुझे <span class=gray>नूडल्स<\/span> बहुत पसंद हैं।","like से ज़्यादा ज़ोरदार। अंग्रेज़ी में love खाने, संगीत, जगहों और शौक़ के लिए भी आता है, सिर्फ़ लोगों के लिए नहीं। यहाँ मतलब “बहुत पसंद है” है, “प्यार करता हूँ” नहीं।","मुझे मोहिंगा बहुत पसंद है। मैं हर रविवार खाता हूँ।"],"vi":["Mình rất thích <span class=gray>mì<\/span>.","Mạnh hơn like. Tiếng Anh dùng love cho đồ ăn, âm nhạc, nơi chốn và sở thích, không chỉ cho con người. Ở đây nghĩa là “rất thích”, không phải “yêu”.","Mình rất thích mohinga. Chủ nhật nào mình cũng ăn."]}],["I enjoy <span class=gray>reading<\/span>.","စာဖတ်တာ နှစ်သက်ပါတယ်။","Enjoy takes -ing or a noun: I enjoy cooking. I enjoy the music. Not: I enjoy to cook.","I enjoy walking in the evening.","ညနေ လမ်းလျှောက်ရတာ ပျော်တယ်။",{"es":["Disfruto leer.","Enjoy lleva -ing o un sustantivo: I enjoy cooking. I enjoy the music. No: I enjoy to cook.","Disfruto caminar por la tarde."],"fr":["J'aime bien lire.","Enjoy est suivi de -ing ou d'un nom : I enjoy cooking. I enjoy the music. Pas : I enjoy to cook.","J'aime bien marcher le soir."],"hi":["मुझे <span class=gray>पढ़ने<\/span> में मज़ा आता है।","Enjoy के बाद -ing या संज्ञा आती है: I enjoy cooking. I enjoy the music. ग़लत: I enjoy to cook.","मुझे शाम को टहलने में मज़ा आता है।"],"vi":["Mình thích <span class=gray>đọc sách<\/span>.","Sau enjoy là -ing hoặc danh từ: I enjoy cooking. I enjoy the music. Không nói: I enjoy to cook.","Mình thích đi bộ vào buổi tối."]}],["I'm really into <span class=gray>football<\/span>.","ဘောလုံးကို အရမ်း ဝါသနာပါတယ်။","Casual: a hobby or interest you love right now. Common with young people.","I'm really into Korean dramas these days.","အခုတလော ကိုရီးယား ဇာတ်လမ်းတွဲတွေ စွဲနေတယ်။",{"es":["Me apasiona el fútbol.","Informal: un pasatiempo o interés que te encanta en este momento. Común entre jóvenes.","Últimamente me apasionan las series coreanas."],"fr":["Je suis à fond dans le foot.","Familier : un loisir ou un intérêt que vous adorez en ce moment. Courant chez les jeunes.","Je suis à fond dans les séries coréennes en ce moment."],"hi":["मुझे <span class=gray>फ़ुटबॉल<\/span> का बड़ा शौक़ है।","अनौपचारिक: कोई शौक़ या रुचि जो इन दिनों आपको बहुत भा रही है। युवाओं के बीच आम।","आजकल मुझे कोरियाई ड्रामे का बड़ा शौक़ है।"],"vi":["Mình đang mê <span class=gray>bóng đá<\/span>.","Thân mật: một thú vui hay mối quan tâm bạn đang rất thích lúc này. Phổ biến trong giới trẻ.","Dạo này mình đang mê phim Hàn."]}],["My favorite <span class=gray>color<\/span> is <span class=gray>blue<\/span>.","အကြိုက်ဆုံး အရောင်က အပြာပါ။","Your number one. British spelling: favourite.","My favorite food is tea leaf salad.","အကြိုက်ဆုံး အစားအစာက လက်ဖက်သုပ်ပါ။",{"es":["Mi color favorito es el azul.","Tu número uno. Ortografía británica: favourite.","Mi comida favorita es la ensalada de hojas de té."],"fr":["Ma couleur préférée est le bleu.","Votre numéro un. Orthographe britannique : favourite.","Mon plat préféré est la salade de feuilles de thé."],"hi":["मेरा पसंदीदा <span class=gray>रंग<\/span> <span class=gray>नीला<\/span> है।","आपकी पहली पसंद। ब्रिटिश वर्तनी: favourite.","मेरा पसंदीदा खाना चाय की पत्तियों का सलाद है।"],"vi":["<span class=gray>Màu<\/span> mình thích nhất là <span class=gray>màu xanh<\/span>.","Thứ bạn thích số một. Cách viết kiểu Anh: favourite.","Món mình thích nhất là gỏi lá trà."]}]],"tr":{"es":["Decir que algo te gusta","Desde un simple like hasta un gran love."],"fr":["Dire que l'on aime","D'un simple like à un grand love."],"hi":["कहना कि कुछ पसंद है","सीधे-सादे like से लेकर ज़ोरदार love तक।"],"vi":["Nói rằng bạn thích","Từ like đơn giản đến love thật mạnh."]}},{"en":"Saying you don't like something","my":"မကြိုက်တာကို ပြောခြင်း","desc":"From soft to strong. About other people's things, softer is kinder.","cards":[["I don't like <span class=gray>cold weather<\/span>.","အေးတဲ့ ရာသီဥတုကို မကြိုက်ဘူး။","Clear and simple. Fine for things like weather, noise, or food in general.","I don't like rainy days.","မိုးရွာတဲ့နေ့တွေကို မကြိုက်ဘူး။",{"es":["No me gusta el frío.","Claro y sencillo. Está bien para cosas como el clima, el ruido o la comida en general.","No me gustan los días lluviosos."],"fr":["Je n'aime pas le froid.","Clair et simple. Convient pour le temps, le bruit ou la nourriture en général.","Je n'aime pas les jours de pluie."],"hi":["मुझे <span class=gray>ठंडा मौसम<\/span> पसंद नहीं।","साफ़ और सीधा। मौसम, शोर या आम तौर पर खाने जैसी चीज़ों के लिए ठीक है।","मुझे बारिश वाले दिन पसंद नहीं।"],"vi":["Mình không thích <span class=gray>trời lạnh<\/span>.","Rõ ràng và đơn giản. Dùng được cho những thứ như thời tiết, tiếng ồn hay đồ ăn nói chung.","Mình không thích những ngày mưa."]}],["I don't really like <span class=gray>horror movies<\/span>.","သရဲကားတွေကို သိပ်မကြိုက်ဘူး။","Softer. Word order matters: I don't really like it is soft, but I really don't like it is strong!","I don't really like spicy food.","စပ်တဲ့ အစားအစာကို သိပ်မကြိုက်ဘူး။",{"es":["No me gustan mucho las películas de terror.","Más suave. El orden importa: I don't really like it es suave, ¡pero I really don't like it es fuerte!","No me gusta mucho la comida picante."],"fr":["Je n'aime pas trop les films d'horreur.","Plus doux. L'ordre des mots compte : I don't really like it est doux, mais I really don't like it est fort !","Je n'aime pas trop la cuisine épicée."],"hi":["मुझे <span class=gray>डरावनी फ़िल्में<\/span> कुछ ख़ास पसंद नहीं।","ज़्यादा नरम। शब्दों का क्रम मायने रखता है: I don't really like it नरम है, पर I really don't like it कड़ा है!","मुझे तीखा खाना कुछ ख़ास पसंद नहीं।"],"vi":["Mình không thích <span class=gray>phim kinh dị<\/span> lắm.","Nhẹ nhàng hơn. Trật tự từ rất quan trọng: I don't really like it thì nhẹ, còn I really don't like it thì mạnh!","Mình không thích đồ cay lắm."]}],["I'm not a big fan of <span class=gray>sports<\/span>.","အားကစားကို သိပ် ဝါသနာမပါဘူး။","A friendly, gentle way to say you don't like something. Good for food someone made, or a friend's hobby.","I'm not a big fan of durian. The smell is too strong for me.","ဒူးရင်းသီးကို သိပ် ဝါသနာမပါဘူး။ အနံ့ ပြင်းလွန်းတယ်။",{"es":["No soy muy fan de los deportes.","Una manera amistosa y suave de decir que algo no te gusta. Buena para la comida que alguien preparó o el pasatiempo de un amigo.","No soy muy fan del durián. El olor es demasiado fuerte para mí."],"fr":["Je ne suis pas très fan de sport.","Une façon amicale et douce de dire que l'on n'aime pas. Bien pour un plat que quelqu'un a préparé ou le loisir d'un ami.","Je ne suis pas très fan du durian. L'odeur est trop forte pour moi."],"hi":["मैं <span class=gray>खेलों<\/span> का कोई बड़ा शौक़ीन नहीं हूँ।","यह कहने का दोस्ताना, नरम तरीक़ा कि कोई चीज़ आपको पसंद नहीं। किसी के बनाए खाने या दोस्त के शौक़ के लिए अच्छा।","मैं डूरियन का कोई बड़ा शौक़ीन नहीं हूँ। उसकी गंध मेरे लिए बहुत तेज़ है।"],"vi":["Mình không mê <span class=gray>thể thao<\/span> lắm.","Cách nói thân thiện, nhẹ nhàng rằng bạn không thích thứ gì đó. Hợp khi nói về món ăn ai đó nấu hoặc sở thích của bạn bè.","Mình không mê sầu riêng lắm. Mùi nặng quá với mình."]}],["<span class=gray>Shopping<\/span> isn't really my thing.","ဈေးဝယ်ရတာ သိပ်ဝါသနာမပါဘူး။","Casual: it's fine for other people, just not for me. No criticism.","Dancing isn't really my thing.","ကခုန်တာက ကိုယ်နဲ့ သိပ်မကိုက်ဘူး။",{"es":["Ir de compras no es lo mío.","Informal: está bien para otros, pero no para mí. Sin criticar.","Bailar no es lo mío."],"fr":["Le shopping, ce n'est pas trop mon truc.","Familier : c'est très bien pour les autres, mais pas pour moi. Sans critique.","La danse, ce n'est pas trop mon truc."],"hi":["<span class=gray>ख़रीदारी<\/span> मेरे बस की बात नहीं।","अनौपचारिक: दूसरों के लिए ठीक है, पर मेरे लिए नहीं। बिना बुराई किए।","नाचना मेरे बस की बात नहीं।"],"vi":["<span class=gray>Mua sắm<\/span> không hợp với mình lắm.","Thân mật: người khác thích thì được, còn mình thì không. Không chê bai.","Nhảy múa không hợp với mình lắm."]}],["I hate <span class=gray>traffic jams<\/span>.","ကားကြပ်တာကို အရမ်း မုန်းတယ်။","Very strong. Also: I can't stand it. Fine for traffic or mosquitoes, but never about food someone cooked for you.","I hate mosquitoes!","ခြင်တွေကို အရမ်း မုန်းတယ်။",{"es":["Odio los embotellamientos.","Muy fuerte. También: I can't stand it. Está bien para el tráfico o los mosquitos, pero nunca para la comida que alguien te cocinó.","¡Odio los mosquitos!"],"fr":["Je déteste les embouteillages.","Très fort. On dit aussi : I can't stand it. Convient pour les bouchons ou les moustiques, jamais pour un plat que l'on vous a cuisiné.","Je déteste les moustiques !"],"hi":["मुझे <span class=gray>ट्रैफ़िक जाम<\/span> से नफ़रत है।","बहुत कड़ा। यह भी: I can't stand it. ट्रैफ़िक या मच्छरों के लिए ठीक है, पर उस खाने के लिए कभी नहीं जो किसी ने आपके लिए पकाया हो।","मुझे मच्छरों से नफ़रत है!"],"vi":["Mình ghét <span class=gray>kẹt xe<\/span>.","Rất mạnh. Cũng có: I can't stand it. Dùng cho kẹt xe hay muỗi thì được, nhưng đừng bao giờ dùng cho món ăn người khác nấu cho bạn.","Mình ghét muỗi!"]}]],"tr":{"es":["Decir que algo no te gusta","De suave a fuerte. Sobre las cosas de los demás, más suave es más amable."],"fr":["Dire que l'on n'aime pas","Du plus doux au plus fort. Pour ce qui appartient aux autres, la douceur est plus aimable."],"hi":["कहना कि कुछ पसंद नहीं","नरम से कड़े तक। दूसरों की चीज़ों के बारे में नरम कहना ज़्यादा भला है।"],"vi":["Nói rằng bạn không thích","Từ nhẹ đến mạnh. Khi nói về thứ của người khác, nhẹ nhàng thì tử tế hơn."]}},{"en":"In between","my":"ကြားထဲက ခံစားချက်","desc":"When you don't love it and don't hate it.","cards":[["It's OK.","သာမန်ပါပဲ။","Careful: with a flat voice, It's OK means only average, not good. To praise something, say It's great!","— How's the new restaurant? — It's OK. Nothing special.","— ဆိုင်အသစ်က ဘယ်လိုလဲ။ — သာမန်ပါပဲ။ ထူးထူးခြားခြား မရှိဘူး။",{"es":["Está bien.","Cuidado: en tono plano, It's OK significa regular, no bueno. Para elogiar algo, di It's great!","— ¿Qué tal el restaurante nuevo? — Está bien. Nada especial."],"fr":["C'est pas mal.","Attention : d'une voix plate, It's OK veut dire moyen, pas bon. Pour faire un compliment, dites It's great!","— Il est comment, le nouveau restaurant ? — C'est pas mal. Rien de spécial."],"hi":["ठीक-ठाक है।","ध्यान रहे: सपाट लहजे में It's OK का मतलब है बस ठीक-ठाक, अच्छा नहीं। किसी चीज़ की तारीफ़ के लिए कहिए It's great!","— नया रेस्तराँ कैसा है? — ठीक-ठाक है। कुछ ख़ास नहीं।"],"vi":["Cũng được.","Cẩn thận: nói bằng giọng đều đều thì It's OK nghĩa là tàm tạm, không phải là ngon hay tốt. Muốn khen thì nói It's great!","— Nhà hàng mới thế nào? — Cũng được. Không có gì đặc biệt."]}],["I don't mind <span class=gray>the rain<\/span>.","မိုးရွာလည်း ကိစ္စမရှိပါဘူး။","It's OK for me, I won't complain. With a verb, use -ing: I don't mind waiting.","I don't mind working on Saturdays.","စနေနေ့ အလုပ်ဆင်းရလည်း ရပါတယ်။",{"es":["No me molesta la lluvia.","Para mí está bien, no me voy a quejar. Con un verbo, usa -ing: I don't mind waiting.","No me molesta trabajar los sábados."],"fr":["La pluie ne me dérange pas.","Ça me va, je ne me plaindrai pas. Avec un verbe, on met -ing : I don't mind waiting.","Ça ne me dérange pas de travailler le samedi."],"hi":["मुझे <span class=gray>बारिश<\/span> से कोई दिक़्क़त नहीं।","मेरे लिए ठीक है, मैं शिकायत नहीं करूँगा। क्रिया के साथ -ing लगाइए: I don't mind waiting.","मुझे शनिवार को काम करने से कोई दिक़्क़त नहीं।"],"vi":["Mình không ngại <span class=gray>trời mưa<\/span>.","Với mình thì không sao, mình không phàn nàn gì. Với động từ thì dùng -ing: I don't mind waiting.","Mình không ngại làm việc vào thứ Bảy."]}],["It depends.","အခြေအနေပေါ် မူတည်တယ်။","Your answer changes with the situation. Then explain: It depends on the weather.","— Do you like walking? — It depends. Not in the hot sun!","— လမ်းလျှောက်ရတာ ကြိုက်လား။ — အခြေအနေပေါ် မူတည်တယ်။ နေပူကြီးထဲမှာတော့ မကြိုက်ဘူး။",{"es":["Depende.","Tu respuesta cambia según la situación. Luego explica: It depends on the weather.","— ¿Te gusta caminar? — Depende. ¡Bajo el sol, no!"],"fr":["Ça dépend.","Votre réponse change selon la situation. Expliquez ensuite : It depends on the weather.","— Tu aimes marcher ? — Ça dépend. Pas en plein soleil !"],"hi":["यह निर्भर करता है।","आपका जवाब हालात के हिसाब से बदलता है। फिर समझाइए: It depends on the weather.","— क्या तुम्हें पैदल चलना पसंद है? — यह निर्भर करता है। तेज़ धूप में तो नहीं!"],"vi":["Còn tùy.","Câu trả lời của bạn thay đổi theo tình huống. Sau đó giải thích: It depends on the weather.","— Bạn có thích đi bộ không? — Còn tùy. Trời nắng gắt thì không!"]}],["I can take it or leave it.","ရှိလည်း ရတယ်၊ မရှိလည်း ရပါတယ်။","You don't feel strongly: you're happy with it or without it.","— Do you like chocolate? — I can take it or leave it.","— ချောကလက် ကြိုက်လား။ — ရှိလည်း ရ၊ မရှိလည်း ရပါတယ်။",{"es":["Me da igual.","No tienes una opinión fuerte: estás bien con ello o sin ello.","— ¿Te gusta el chocolate? — Me da igual."],"fr":["Je peux m'en passer.","Vous n'avez pas d'avis tranché : avec ou sans, cela vous va.","— Tu aimes le chocolat ? — Je peux m'en passer."],"hi":["हो तो ठीक, न हो तो भी ठीक।","आपकी कोई पक्की राय नहीं: उसके साथ भी ठीक, उसके बिना भी।","— क्या तुम्हें चॉकलेट पसंद है? — हो तो ठीक, न हो तो भी ठीक।"],"vi":["Có cũng được, không có cũng chẳng sao.","Bạn không có ý kiến rõ rệt: có hay không đều được.","— Bạn có thích sô-cô-la không? — Có cũng được, không có cũng chẳng sao."]}]],"tr":{"es":["Ni sí ni no","Cuando ni te encanta ni lo odias."],"fr":["Entre les deux","Quand on n'adore pas et que l'on ne déteste pas."],"hi":["बीच का","जब आपको न बहुत पसंद हो, न नापसंद।"],"vi":["Lưng chừng","Khi bạn không mê mà cũng không ghét."]}},{"en":"Asking about likes","my":"ကြိုက်တာကို မေးခြင်း","desc":"Good questions for small talk and getting to know people.","cards":[["Do you like <span class=gray>tea<\/span>?","လက်ဖက်ရည် ကြိုက်လား။","The basic question. Answer: Yes, I do. or No, I don't. Not the same as Would you like some tea?, which is an offer.","— Do you like swimming? — Yes, I do!","— ရေကူးရတာ ကြိုက်လား။ — ကြိုက်တယ်။",{"es":["¿Te gusta el té?","La pregunta básica. Respuesta: Yes, I do. o No, I don't. No es lo mismo que Would you like some tea?, que es un ofrecimiento.","— ¿Te gusta nadar? — ¡Sí, me gusta!"],"fr":["Tu aimes le thé ?","La question de base. Réponse : Yes, I do. ou No, I don't. Ce n'est pas la même chose que Would you like some tea?, qui est une offre.","— Tu aimes nager ? — Oui, j'aime ça !"],"hi":["क्या आपको <span class=gray>चाय<\/span> पसंद है?","बुनियादी सवाल। जवाब: Yes, I do. या No, I don't. यह Would you like some tea? से अलग है, जो एक पेशकश है।","— क्या तुम्हें तैरना पसंद है? — हाँ, बहुत!"],"vi":["Bạn có thích <span class=gray>trà<\/span> không?","Câu hỏi cơ bản. Trả lời: Yes, I do. hoặc No, I don't. Khác với Would you like some tea?, vốn là một lời mời.","— Bạn có thích bơi không? — Có chứ!"]}],["What kind of <span class=gray>food<\/span> do you like?","ဘယ်လို အစားအစာမျိုး ကြိုက်လဲ။","Asks for details, and keeps the conversation going.","What kind of music do you like?","ဘယ်လို သီချင်းမျိုး ကြိုက်လဲ။",{"es":["¿Qué tipo de comida te gusta?","Pide detalles y mantiene viva la conversación.","¿Qué tipo de música te gusta?"],"fr":["Quel genre de cuisine aimes-tu ?","Demande des détails et entretient la conversation.","Quel genre de musique aimes-tu ?"],"hi":["आपको किस तरह का <span class=gray>खाना<\/span> पसंद है?","ब्योरा पूछता है और बातचीत को चलाए रखता है।","तुम्हें किस तरह का संगीत पसंद है?"],"vi":["Bạn thích loại <span class=gray>đồ ăn<\/span> nào?","Hỏi chi tiết và giữ cho cuộc trò chuyện tiếp tục.","Bạn thích loại nhạc nào?"]}],["What's your favorite <span class=gray>movie<\/span>?","အကြိုက်ဆုံး ရုပ်ရှင်က ဘာလဲ။","A fun, easy question for new friends.","What's your favorite song right now?","အခု အကြိုက်ဆုံး သီချင်းက ဘာလဲ။",{"es":["¿Cuál es tu película favorita?","Una pregunta divertida y fácil para nuevos amigos.","¿Cuál es tu canción favorita en este momento?"],"fr":["Quel est ton film préféré ?","Une question amusante et facile pour de nouveaux amis.","Quelle est ta chanson préférée en ce moment ?"],"hi":["आपकी पसंदीदा <span class=gray>फ़िल्म<\/span> कौन-सी है?","नए दोस्तों के लिए मज़ेदार और आसान सवाल।","आजकल तुम्हारा पसंदीदा गाना कौन-सा है?"],"vi":["<span class=gray>Bộ phim<\/span> bạn thích nhất là gì?","Một câu hỏi vui và dễ cho những người bạn mới.","Dạo này bài hát bạn thích nhất là gì?"]}],["What do you like doing in your free time?","အားလပ်ချိန်မှာ ဘာလုပ်ရတာ ကြိုက်လဲ။","A friendly question about hobbies. Also: What do you do for fun?","— What do you like doing in your free time? — I like reading and playing chinlone.","— အားလပ်ချိန်မှာ ဘာလုပ်ရတာ ကြိုက်လဲ။ — စာဖတ်ရတာနဲ့ ခြင်းလုံး ခတ်ရတာ ကြိုက်တယ်။",{"es":["¿Qué te gusta hacer en tu tiempo libre?","Una pregunta amistosa sobre pasatiempos. También: What do you do for fun?","— ¿Qué te gusta hacer en tu tiempo libre? — Me gusta leer y jugar chinlone."],"fr":["Qu'est-ce que tu aimes faire pendant ton temps libre ?","Une question amicale sur les loisirs. On dit aussi : What do you do for fun?","— Qu'est-ce que tu aimes faire pendant ton temps libre ? — J'aime lire et jouer au chinlone."],"hi":["ख़ाली समय में आपको क्या करना पसंद है?","शौक़ के बारे में दोस्ताना सवाल। यह भी: What do you do for fun?","— ख़ाली समय में तुम्हें क्या करना पसंद है? — मुझे पढ़ना और चिनलोन खेलना पसंद है।"],"vi":["Lúc rảnh bạn thích làm gì?","Một câu hỏi thân thiện về sở thích. Cũng có: What do you do for fun?","— Lúc rảnh bạn thích làm gì? — Mình thích đọc sách và chơi chinlone."]}],["Are you into <span class=gray>music<\/span>?","ဂီတကို ဝါသနာပါလား။","Casual: Are you interested in music? Common with young people.","Are you into photography?","ဓာတ်ပုံရိုက်တာ ဝါသနာပါလား။",{"es":["¿Te gusta la música?","Informal: Are you interested in music? Común entre jóvenes.","¿Te gusta la fotografía?"],"fr":["Tu t'intéresses à la musique ?","Familier : Are you interested in music? Courant chez les jeunes.","Tu t'intéresses à la photo ?"],"hi":["क्या आपको <span class=gray>संगीत<\/span> का शौक़ है?","अनौपचारिक: Are you interested in music? युवाओं के बीच आम।","क्या तुम्हें फ़ोटोग्राफ़ी का शौक़ है?"],"vi":["Bạn có mê <span class=gray>âm nhạc<\/span> không?","Thân mật: Are you interested in music? Phổ biến trong giới trẻ.","Bạn có mê chụp ảnh không?"]}]],"tr":{"es":["Preguntar por los gustos","Buenas preguntas para platicar y conocer a la gente."],"fr":["Demander les goûts","De bonnes questions pour bavarder et faire connaissance."],"hi":["पसंद के बारे में पूछना","हल्की-फुल्की बातचीत और जान-पहचान के लिए अच्छे सवाल।"],"vi":["Hỏi về sở thích","Những câu hỏi hay để trò chuyện và làm quen."]}},{"en":"Same or different","my":"တူတာ၊ မတူတာ","desc":"Answering when someone tells you what they like or don't like.","cards":[["Me too.","ကျွန်တော်/ကျွန်မလည်း ဒီလိုပဲ။","Agrees with a positive sentence: I like tea. — Me too. More formal: So do I.","— I love the rainy season. — Me too!","— မိုးရာသီကို အရမ်းကြိုက်တယ်။ — ကျွန်မလည်း ဒီလိုပဲ။",{"es":["A mí también.","Coincide con una oración afirmativa: I like tea. — Me too. Más formal: So do I.","— Me encanta la temporada de lluvias. — ¡A mí también!"],"fr":["Moi aussi.","Approuve une phrase affirmative : I like tea. — Me too. Plus formel : So do I.","— J'adore la saison des pluies. — Moi aussi !"],"hi":["मुझे भी।","हाँ वाले वाक्य से सहमति: I like tea. — Me too. ज़्यादा औपचारिक: So do I.","— मुझे बरसात का मौसम बहुत पसंद है। — मुझे भी!"],"vi":["Mình cũng vậy.","Đồng tình với một câu khẳng định: I like tea. — Me too. Trang trọng hơn: So do I.","— Mình rất thích mùa mưa. — Mình cũng vậy!"]}],["Me neither.","ကျွန်တော်/ကျွန်မလည်း မကြိုက်ဘူး။","Agrees with a negative sentence. Not: I don't like it. — Me too. Correct: Me neither. More formal: Neither do I.","— I don't like horror movies. — Me neither.","— သရဲကား မကြိုက်ဘူး။ — ကျွန်တော်လည်း မကြိုက်ဘူး။",{"es":["A mí tampoco.","Coincide con una oración negativa. No: I don't like it. — Me too. Lo correcto: Me neither. Más formal: Neither do I.","— No me gustan las películas de terror. — A mí tampoco."],"fr":["Moi non plus.","Approuve une phrase négative. Pas : I don't like it. — Me too. Correct : Me neither. Plus formel : Neither do I.","— Je n'aime pas les films d'horreur. — Moi non plus."],"hi":["मुझे भी नहीं।","ना वाले वाक्य से सहमति। ग़लत: I don't like it. — Me too. सही: Me neither. ज़्यादा औपचारिक: Neither do I.","— मुझे डरावनी फ़िल्में पसंद नहीं। — मुझे भी नहीं।"],"vi":["Mình cũng không.","Đồng tình với một câu phủ định. Không nói: I don't like it. — Me too. Câu đúng: Me neither. Trang trọng hơn: Neither do I.","— Mình không thích phim kinh dị. — Mình cũng không."]}],["Really? I love it!","တကယ်လား။ အရမ်းကြိုက်တယ်။","Disagrees in a friendly way when someone doesn't like something. Smile, and add a reason.","— I don't like durian. — Really? I love it! It's my favorite fruit.","— ဒူးရင်းသီး မကြိုက်ဘူး။ — တကယ်လား။ ကျွန်မကတော့ အရမ်းကြိုက်တယ်။ အကြိုက်ဆုံး အသီးပဲ။",{"es":["¿En serio? ¡A mí me encanta!","No estás de acuerdo, de manera amistosa, cuando a alguien no le gusta algo. Sonríe y agrega un motivo.","— No me gusta el durián. — ¿En serio? ¡A mí me encanta! Es mi fruta favorita."],"fr":["Ah bon ? Moi, j'adore !","Exprime un désaccord amical quand quelqu'un n'aime pas quelque chose. Souriez et ajoutez une raison.","— Je n'aime pas le durian. — Ah bon ? Moi, j'adore ! C'est mon fruit préféré."],"hi":["सच में? मुझे तो बहुत पसंद है!","जब किसी को कोई चीज़ पसंद न हो, तब दोस्ताना ढंग से असहमति। मुस्कुराइए और वजह जोड़िए।","— मुझे डूरियन पसंद नहीं। — सच में? मुझे तो बहुत पसंद है! यह मेरा पसंदीदा फल है।"],"vi":["Thật à? Mình thì thích lắm!","Không đồng tình một cách thân thiện, khi ai đó không thích thứ gì. Hãy mỉm cười và thêm một lý do.","— Mình không thích sầu riêng. — Thật à? Mình thì thích lắm! Đó là loại quả mình thích nhất."]}],["Not me.","ကျွန်တော်/ကျွန်မကတော့ မကြိုက်ဘူး။","Disagrees with a positive sentence, casually. Kinder with a reason.","— I love sweet tea. — Not me. It's too sweet.","— လက်ဖက်ရည်ချို အရမ်းကြိုက်တယ်။ — ကျွန်တော်ကတော့ မကြိုက်ဘူး။ ချိုလွန်းတယ်။",{"es":["Yo no.","No estás de acuerdo con una oración afirmativa, de manera informal. Más amable con un motivo.","— Me encanta el té dulce. — A mí no. Es demasiado dulce."],"fr":["Pas moi.","Exprime un désaccord avec une phrase affirmative, de façon familière. Plus gentil avec une raison.","— J'adore le thé sucré. — Pas moi. C'est trop sucré."],"hi":["मुझे नहीं।","हाँ वाले वाक्य से अनौपचारिक असहमति। वजह के साथ ज़्यादा भला लगता है।","— मुझे मीठी चाय बहुत पसंद है। — मुझे नहीं। बहुत ज़्यादा मीठी होती है।"],"vi":["Mình thì không.","Không đồng tình với một câu khẳng định, theo cách thân mật. Thêm lý do thì dễ nghe hơn.","— Mình rất thích trà ngọt. — Mình thì không. Ngọt quá."]}]],"tr":{"es":["Igual o diferente","Responder cuando alguien te dice lo que le gusta o no le gusta."],"fr":["Pareil ou différent","Répondre quand quelqu'un vous dit ce qu'il aime ou n'aime pas."],"hi":["एक जैसा या अलग","जब कोई बताए कि उसे क्या पसंद या नापसंद है, तब जवाब देना।"],"vi":["Giống hay khác","Đáp lại khi ai đó nói họ thích hay không thích gì."]}},{"en":"Preferences","my":"ပိုကြိုက်တာ","desc":"Choosing between two things.","cards":[["I prefer <span class=gray>rice<\/span> to <span class=gray>bread<\/span>.","ပေါင်မုန့်ထက် ထမင်းကို ပိုကြိုက်တယ်။","Prefer A to B, not than. With than, say: I like A more than B. The order is the reverse of Burmese: I prefer tea to coffee = ကော်ဖီထက် လက်ဖက်ရည်ကို ပိုကြိုက်တယ်.","I prefer tea to coffee.","ကော်ဖီထက် လက်ဖက်ရည်ကို ပိုကြိုက်တယ်။",{"es":["Prefiero el arroz al pan.","Prefer A to B, no than. Con than, se dice: I like A more than B.","Prefiero el té al café."],"fr":["Je préfère le riz au pain.","Prefer A to B, pas than. Avec than, on dit : I like A more than B.","Je préfère le thé au café."],"hi":["मुझे <span class=gray>रोटी<\/span> से ज़्यादा <span class=gray>चावल<\/span> पसंद है।","Prefer A to B, than नहीं। than के साथ कहते हैं: I like A more than B.","मुझे कॉफ़ी से ज़्यादा चाय पसंद है।"],"vi":["Mình thích <span class=gray>cơm<\/span> hơn <span class=gray>bánh mì<\/span>.","Prefer A to B, không dùng than. Với than thì nói: I like A more than B.","Mình thích trà hơn cà phê."]}],["I'd rather <span class=gray>stay home<\/span>.","အိမ်မှာပဲ နေချင်ပါတယ်။","I'd rather = I would rather. Use the base verb: I'd rather walk. Not: I'd rather to walk.","— Shall we take a taxi? — I'd rather walk. It's not far.","— တက္ကစီ စီးကြမလား။ — လမ်းလျှောက်ရင် ပိုကောင်းမယ်။ မဝေးပါဘူး။",{"es":["Prefiero quedarme en casa.","I'd rather = I would rather. Usa el verbo en su forma base: I'd rather walk. No: I'd rather to walk.","— ¿Tomamos un taxi? — Prefiero caminar. No está lejos."],"fr":["Je préfère rester à la maison.","I'd rather = I would rather. Employez la base verbale : I'd rather walk. Pas : I'd rather to walk.","— On prend un taxi ? — Je préfère marcher. Ce n'est pas loin."],"hi":["मैं तो <span class=gray>घर पर ही रहना<\/span> चाहूँगा।","I'd rather = I would rather. क्रिया का मूल रूप लगाइए: I'd rather walk. ग़लत: I'd rather to walk.","— टैक्सी ले लें? — मैं तो पैदल चलना चाहूँगा। दूर नहीं है।"],"vi":["Mình muốn <span class=gray>ở nhà<\/span> hơn.","I'd rather = I would rather. Dùng động từ nguyên mẫu: I'd rather walk. Không nói: I'd rather to walk.","— Mình đi taxi nhé? — Mình muốn đi bộ hơn. Không xa đâu."]}],["I like both.","နှစ်ခုလုံး ကြိုက်တယ်။","When you can't choose. Also: I like them both.","— Cats or dogs? — I like both!","— ကြောင်လား၊ ခွေးလား။ — နှစ်ခုလုံး ကြိုက်တယ်။",{"es":["Me gustan los dos.","Cuando no puedes elegir. También: I like them both.","— ¿Gatos o perros? — ¡Me gustan los dos!"],"fr":["J'aime les deux.","Quand on n'arrive pas à choisir. On dit aussi : I like them both.","— Chats ou chiens ? — J'aime les deux !"],"hi":["मुझे दोनों पसंद हैं।","जब आप चुन न पाएँ। यह भी: I like them both.","— बिल्लियाँ या कुत्ते? — मुझे दोनों पसंद हैं!"],"vi":["Mình thích cả hai.","Khi bạn không chọn được. Cũng có: I like them both.","— Mèo hay chó? — Mình thích cả hai!"]}],["Either is fine.","ဘယ်ဟာဖြစ်ဖြစ် ရပါတယ်။","When you really don't mind. If you have a small preference, say it: hosts are happy to know.","— Tea or coffee? — Either is fine, thanks.","— လက်ဖက်ရည်လား၊ ကော်ဖီလား။ — ဘယ်ဟာဖြစ်ဖြစ် ရပါတယ်၊ ကျေးဇူးပါ။",{"es":["Cualquiera está bien.","Cuando de verdad te da igual. Si tienes una pequeña preferencia, dila: a los anfitriones les gusta saberla.","— ¿Té o café? — Cualquiera está bien, gracias."],"fr":["L'un ou l'autre, ça me va.","Quand cela vous est vraiment égal. Si vous avez une petite préférence, dites-la : les hôtes aiment la connaître.","— Thé ou café ? — L'un ou l'autre, ça me va, merci."],"hi":["कोई भी चलेगा।","जब आपको सचमुच फ़र्क़ न पड़ता हो। अगर थोड़ी-सी भी पसंद है, तो बता दीजिए: मेज़बानों को जानना अच्छा लगता है।","— चाय या कॉफ़ी? — कोई भी चलेगा, शुक्रिया।"],"vi":["Cái nào cũng được.","Khi bạn thật sự thấy thế nào cũng được. Nếu hơi thích một bên hơn thì cứ nói: chủ nhà muốn biết điều đó.","— Trà hay cà phê? — Cái nào cũng được, cảm ơn."]}]],"tr":{"es":["Preferencias","Elegir entre dos cosas."],"fr":["Les préférences","Choisir entre deux choses."],"hi":["पसंद की तुलना","दो चीज़ों में से चुनना।"],"vi":["Thích cái nào hơn","Chọn giữa hai thứ."]}}];const langs=["my","es","fr","hi","vi"];const COURSE="eng";</script>
