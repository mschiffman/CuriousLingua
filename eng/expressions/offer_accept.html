<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/offer_accept/";const AUD_EXT="mp3?v=2611100523";const categories=[{"en":"Offering things","my":"တစ်ခုခု ကမ်းလှမ်းခြင်း","desc":"Food, drinks and other things: from a polite would you like to a warm have some.","cards":[["Would you like <span class=gray>some tea<\/span>?","လက်ဖက်ရည် ယူမလား။","The polite way to offer. Not the same as Do you like tea?, which asks what you like in general. With a verb: Would you like to sit down?","— Would you like a cup of tea? — Yes, please.","— လက်ဖက်ရည် တစ်ခွက် သောက်မလား။ — ဟုတ်ကဲ့၊ ပေးပါ။",{"es":["¿Gusta un poco de té?","La manera cortés de ofrecer. No es lo mismo que Do you like tea?, que pregunta por tus gustos en general. Con un verbo: Would you like to sit down?","— ¿Gusta una taza de té? — Sí, por favor."],"fr":["Voulez-vous du thé ?","La façon polie d'offrir. Ce n'est pas la même chose que Do you like tea?, qui porte sur vos goûts en général. Avec un verbe : Would you like to sit down?","— Voulez-vous une tasse de thé ? — Oui, s'il vous plaît."],"hi":["क्या आप <span class=gray>चाय<\/span> लेंगे?","पेशकश करने का विनम्र तरीक़ा। यह Do you like tea? से अलग है, जो आपकी आम पसंद के बारे में पूछता है। क्रिया के साथ: Would you like to sit down?","— एक कप चाय लेंगे? — जी हाँ, ज़रूर।"],"vi":["Bạn có muốn dùng <span class=gray>trà<\/span> không?","Cách mời lịch sự. Khác với Do you like tea?, vốn hỏi về sở thích nói chung của bạn. Với động từ: Would you like to sit down?","— Bạn có muốn dùng một tách trà không? — Vâng, cho tôi xin."]}],["Do you want <span class=gray>a coffee<\/span>?","ကော်ဖီ လိုချင်လား။","Casual: for family and friends. With strangers, Would you like…? is safer.","Do you want some cake?","ကိတ်မုန့် စားမလား။",{"es":["¿Quieres un café?","Informal: para familia y amigos. Con desconocidos, Would you like…? es más seguro.","¿Quieres pastel?"],"fr":["Tu veux un café ?","Familier : en famille et entre amis. Avec des inconnus, Would you like…? est plus sûr.","Tu veux du gâteau ?"],"hi":["<span class=gray>कॉफ़ी<\/span> चाहिए?","अनौपचारिक: परिवार और दोस्तों के लिए। अजनबियों के साथ Would you like…? ज़्यादा ठीक है।","केक खाओगे?"],"vi":["Bạn uống <span class=gray>cà phê<\/span> không?","Thân mật: dành cho gia đình và bạn bè. Với người lạ, Would you like…? an toàn hơn.","Bạn ăn bánh không?"]}],["How about <span class=gray>some water<\/span>?","ရေ ရော ဘယ်လိုလဲ။","Offers an idea or another choice. Answer: Sounds good! or Maybe something else?","No coffee? How about some juice?","ကော်ဖီ မသောက်ဘူးလား။ ဖျော်ရည် ရော ဘယ်လိုလဲ။",{"es":["¿Qué tal un poco de agua?","Ofrece una idea u otra opción. Respuesta: Sounds good! o Maybe something else?","¿No quieres café? ¿Qué tal un jugo?"],"fr":["Et un peu d'eau ?","Propose une idée ou un autre choix. Réponse : Sounds good! ou Maybe something else?","Pas de café ? Et un jus de fruits ?"],"hi":["<span class=gray>पानी<\/span> चलेगा?","कोई सुझाव या दूसरा विकल्प पेश करता है। जवाब: Sounds good! या Maybe something else?","कॉफ़ी नहीं? जूस चलेगा?"],"vi":["Hay là <span class=gray>uống nước<\/span> nhé?","Đưa ra một gợi ý hoặc lựa chọn khác. Trả lời: Sounds good! hoặc Maybe something else?","Không uống cà phê à? Hay là nước ép nhé?"]}],["Can I get you anything?","ဘာယူပေးရမလဲ။","Hosts and staff say it. Answer with what you want, or I'm fine, thanks.","Come in, sit down. Can I get you anything?","ဝင်ပါ၊ ထိုင်ပါ။ ဘာယူပေးရမလဲ။",{"es":["¿Te ofrezco algo?","Lo dicen los anfitriones y el personal. Responde con lo que quieres, o I'm fine, thanks.","Pasa, siéntate. ¿Te ofrezco algo?"],"fr":["Je vous sers quelque chose ?","Ce que disent les hôtes et le personnel. Répondez par ce que vous voulez, ou I'm fine, thanks.","Entrez, asseyez-vous. Je vous sers quelque chose ?"],"hi":["आपके लिए कुछ लाऊँ?","मेज़बान और कर्मचारी कहते हैं। जो चाहिए वह बता दीजिए, या कहिए I'm fine, thanks.","आइए, बैठिए। आपके लिए कुछ लाऊँ?"],"vi":["Tôi lấy gì cho bạn nhé?","Chủ nhà và nhân viên hay nói. Hãy trả lời bạn muốn gì, hoặc I'm fine, thanks.","Vào đi, ngồi đi. Mình lấy gì cho bạn nhé?"]}],["Help yourself.","စိတ်ကြိုက် ယူစားပါ။","Take what you want, no need to ask. The host means it: don't wait to be offered again.","There's food on the table. Help yourself!","စားပွဲပေါ်မှာ စားစရာတွေ ရှိတယ်။ စိတ်ကြိုက် ယူစားပါ။",{"es":["Sírvete.","Toma lo que quieras, sin pedir permiso. El anfitrión lo dice en serio: no esperes a que te ofrezcan otra vez.","Hay comida en la mesa. ¡Sírvete!"],"fr":["Sers-toi.","Prenez ce que vous voulez, sans demander. L'hôte le pense vraiment : n'attendez pas qu'on vous repropose.","Il y a à manger sur la table. Sers-toi !"],"hi":["ख़ुद ले लीजिए।","जो चाहें, बिना पूछे ले लीजिए। मेज़बान सचमुच यही चाहता है: दोबारा कहे जाने का इंतज़ार मत कीजिए।","खाना मेज़ पर रखा है। ख़ुद ले लीजिए!"],"vi":["Cứ tự nhiên nhé.","Muốn gì cứ lấy, không cần xin phép. Chủ nhà nói thật lòng: đừng chờ được mời thêm lần nữa.","Đồ ăn ở trên bàn. Cứ tự nhiên nhé!"]}],["Have <span class=gray>some fruit<\/span>.","အသီး စားပါဦး။","A warm, direct offer, like စားပါဦး. Friendly, between people who know each other.","Have some more rice. There's plenty.","ထမင်း ထပ်စားပါဦး။ အများကြီး ရှိတယ်။",{"es":["Toma un poco de fruta.","Un ofrecimiento cálido y directo. Amistoso, entre personas que se conocen.","Sírvete más arroz. Hay de sobra."],"fr":["Prends des fruits.","Une offre chaleureuse et directe. Amical, entre personnes qui se connaissent.","Reprends du riz. Il y en a beaucoup."],"hi":["<span class=gray>फल<\/span> लीजिए।","अपनेपन भरी, सीधी पेशकश। दोस्ताना, जान-पहचान वालों के बीच।","थोड़े चावल और लो। बहुत हैं।"],"vi":["Ăn <span class=gray>trái cây<\/span> đi.","Lời mời thân tình và trực tiếp. Thân thiện, giữa những người quen biết nhau.","Ăn thêm cơm đi. Còn nhiều lắm."]}]],"tr":{"es":["Ofrecer cosas","Comida, bebidas y otras cosas: desde un would you like cortés hasta un have some cálido."],"fr":["Offrir quelque chose","Nourriture, boissons et autres choses : d'un would you like poli à un have some chaleureux."],"hi":["चीज़ें पेश करना","खाना, पीना और दूसरी चीज़ें: विनम्र would you like से लेकर अपनेपन भरे have some तक।"],"vi":["Mời ăn uống","Đồ ăn, đồ uống và những thứ khác: từ would you like lịch sự đến have some thân tình."]}},{"en":"Offering help","my":"ကူညီဖို့ ကမ်းလှမ်းခြင်း","desc":"Asking if someone wants help, or just starting to help.","cards":[["Can I help you?","ဘာကူညီပေးရမလဲ။","What shop staff say, and what you can say to anyone who looks lost. In a shop, if you're only looking: I'm just looking, thanks.","— Can I help you? — No, thanks. I'm just looking.","— ဘာကူညီပေးရမလဲ။ — ရပါတယ်၊ ကြည့်ရုံပါ။",{"es":["¿Le puedo ayudar?","Lo que dice el personal de las tiendas, y lo que puedes decirle a cualquiera que se vea perdido. En una tienda, si solo estás mirando: I'm just looking, thanks.","— ¿Le puedo ayudar? — No, gracias. Solo estoy mirando."],"fr":["Je peux vous aider ?","Ce que disent les vendeurs, et ce que vous pouvez dire à toute personne qui semble perdue. Dans un magasin, si vous regardez seulement : I'm just looking, thanks.","— Je peux vous aider ? — Non, merci. Je regarde seulement."],"hi":["मैं आपकी मदद करूँ?","दुकानों के कर्मचारी यही कहते हैं, और आप भी किसी भटके हुए दिखते व्यक्ति से कह सकते हैं। दुकान में, अगर आप बस देख रहे हैं: I'm just looking, thanks.","— मैं आपकी मदद करूँ? — नहीं, शुक्रिया। मैं बस देख रहा हूँ।"],"vi":["Tôi giúp gì được ạ?","Câu nhân viên cửa hàng hay nói, và bạn cũng có thể nói với bất cứ ai trông có vẻ đang lạc đường. Trong cửa hàng, nếu bạn chỉ xem thôi: I'm just looking, thanks.","— Tôi giúp gì được ạ? — Không, cảm ơn. Tôi chỉ xem thôi."]}],["Do you need a hand?","အကူအညီလိုပါသလား။","A hand = help. Friendly, when someone is carrying, lifting or fixing something.","That box looks heavy. Do you need a hand?","အဲဒီသေတ္တာ လေးပုံရတယ်။ ကူပေးရမလား။",{"es":["¿Te echo una mano?","A hand = ayuda. Amistoso, cuando alguien carga, levanta o arregla algo.","Esa caja se ve pesada. ¿Te echo una mano?"],"fr":["Tu veux un coup de main ?","A hand = de l'aide. Amical, quand quelqu'un porte, soulève ou répare quelque chose.","Ce carton a l'air lourd. Tu veux un coup de main ?"],"hi":["हाथ बँटाऊँ?","A hand = मदद। दोस्ताना, जब कोई कुछ ढो रहा हो, उठा रहा हो या ठीक कर रहा हो।","वह डिब्बा भारी लग रहा है। हाथ बँटाऊँ?"],"vi":["Cần mình giúp một tay không?","A hand = sự giúp đỡ. Thân thiện, khi ai đó đang mang, nhấc hay sửa thứ gì.","Cái hộp đó trông nặng đấy. Cần mình giúp một tay không?"]}],["Let me help.","ကူပေးပရစေ။","Offers by starting to help right away. Friendly and quick.","Let me get the door for you.","တံခါး ဖွင့်ပေးမယ်။",{"es":["Déjame ayudarte.","Ofrece empezando a ayudar de inmediato. Amistoso y rápido.","Déjame abrirte la puerta."],"fr":["Laisse-moi t'aider.","On propose en commençant à aider tout de suite. Amical et rapide.","Laisse-moi t'ouvrir la porte."],"hi":["लाइए, मैं मदद करता हूँ।","तुरंत मदद शुरू करके पेशकश करता है। दोस्ताना और झटपट।","लाइए, मैं आपके लिए दरवाज़ा खोल देता हूँ।"],"vi":["Để mình giúp.","Ngỏ ý bằng cách bắt tay vào giúp ngay. Thân thiện và nhanh gọn.","Để mình mở cửa cho bạn."]}],["Shall I <span class=gray>carry it<\/span>?","သယ်ပေးရမလား။","Asks if your help is wanted. More common in British English. Americans often say Should I…?","It's cold. Shall I close the window?","အေးတယ်နော်။ ပြတင်းပေါက် ပိတ်ပေးရမလား။",{"es":["¿Lo cargo yo?","Pregunta si quieren tu ayuda. Más común en el inglés británico. Los estadounidenses suelen decir Should I…?","Hace frío. ¿Cierro la ventana?"],"fr":["Je le porte ?","Demande si votre aide est souhaitée. Plus courant en anglais britannique. Les Américains disent souvent Should I…?","Il fait froid. Je ferme la fenêtre ?"],"hi":["मैं <span class=gray>इसे उठा<\/span> लूँ?","पूछता है कि उन्हें आपकी मदद चाहिए या नहीं। ब्रिटिश अंग्रेज़ी में ज़्यादा आम। अमेरिकी अक्सर Should I…? कहते हैं।","ठंड है। मैं खिड़की बंद कर दूँ?"],"vi":["Để mình <span class=gray>xách<\/span> nhé?","Hỏi xem người kia có muốn bạn giúp không. Phổ biến hơn trong tiếng Anh Anh. Người Mỹ thường nói Should I…?","Trời lạnh. Để mình đóng cửa sổ nhé?"]}],["Do you want me to <span class=gray>wait<\/span>?","စောင့်ပေးစေချင်လား။","Everyday and clear, especially in American English.","Do you want me to call a taxi?","တက္ကစီ ခေါ်ပေးစေချင်လား။",{"es":["¿Quieres que espere?","De todos los días y claro, sobre todo en el inglés americano.","¿Quieres que llame un taxi?"],"fr":["Tu veux que j'attende ?","Courant et clair, surtout en anglais américain.","Tu veux que j'appelle un taxi ?"],"hi":["क्या आप चाहते हैं कि मैं <span class=gray>रुकूँ<\/span>?","रोज़मर्रा का और साफ़, ख़ासकर अमेरिकी अंग्रेज़ी में।","क्या आप चाहते हैं कि मैं टैक्सी बुला दूँ?"],"vi":["Bạn có muốn mình <span class=gray>đợi<\/span> không?","Hằng ngày và rõ ràng, nhất là trong tiếng Anh Mỹ.","Bạn có muốn mình gọi taxi không?"]}],["I can <span class=gray>drive<\/span> if you like.","လိုရင် ကားမောင်းပေးလို့ရတယ်။","A gentle offer: it's easy for the other person to say no.","I can show you the way, if you like.","လိုရင် လမ်းပြပေးလို့ရတယ်။",{"es":["Puedo manejar yo, si quieres.","Un ofrecimiento suave: a la otra persona le resulta fácil decir que no.","Te puedo enseñar el camino, si quieres."],"fr":["Je peux conduire, si tu veux.","Une offre douce : l'autre peut facilement dire non.","Je peux te montrer le chemin, si tu veux."],"hi":["आप चाहें तो मैं <span class=gray>गाड़ी चला<\/span> सकता हूँ।","नरम पेशकश: सामने वाले के लिए ना कहना आसान रहता है।","आप चाहें तो मैं रास्ता दिखा सकता हूँ।"],"vi":["Mình <span class=gray>lái xe<\/span> cũng được, nếu bạn muốn.","Lời ngỏ ý nhẹ nhàng: người kia dễ từ chối.","Mình chỉ đường cho bạn cũng được, nếu bạn muốn."]}]],"tr":{"es":["Ofrecer ayuda","Preguntar si alguien quiere ayuda, o simplemente empezar a ayudar."],"fr":["Proposer de l'aide","Demander si quelqu'un veut de l'aide, ou commencer à aider tout simplement."],"hi":["मदद की पेशकश","पूछना कि किसी को मदद चाहिए या नहीं, या बस मदद शुरू कर देना।"],"vi":["Ngỏ ý giúp đỡ","Hỏi xem ai đó có cần giúp không, hoặc cứ thế bắt tay vào giúp."]}},{"en":"Accepting","my":"လက်ခံခြင်း","desc":"Saying yes to an offer. Yes, please. is the simplest; these are warmer.","cards":[["That would be great.","အဲဒါဆို အရမ်းကောင်းမှာပဲ။","A warm yes, especially to an offer of help. Also: That would be lovely.","— I can pick you up at the station. — That would be great, thanks!","— ဘူတာမှာ လာကြိုပေးမယ်။ — အဲဒါဆို အရမ်းကောင်းမှာပဲ၊ ကျေးဇူးပါ။",{"es":["Sería genial.","Un sí cálido, sobre todo cuando te ofrecen ayuda. También: That would be lovely.","— Puedo pasar por ti a la estación. — ¡Sería genial, gracias!"],"fr":["Ce serait super.","Un oui chaleureux, surtout à une offre d'aide. On dit aussi : That would be lovely.","— Je peux venir te chercher à la gare. — Ce serait super, merci !"],"hi":["यह तो बहुत अच्छा रहेगा।","आत्मीय हाँ, ख़ासकर जब कोई मदद की पेशकश करे। यह भी: That would be lovely.","— मैं तुम्हें स्टेशन से ले लूँगा। — यह तो बहुत अच्छा रहेगा, शुक्रिया!"],"vi":["Thế thì tốt quá.","Lời đồng ý ấm áp, nhất là khi có người ngỏ ý giúp. Cũng có: That would be lovely.","— Mình đón bạn ở ga được. — Thế thì tốt quá, cảm ơn nhé!"]}],["I'd love one.","တခုလိုချင်တယ်။","A happy yes. For things you count: I'd love one. For food or drinks you don't count: I'd love some.","— Would you like a coffee? — Oh, I'd love one!","— ကော်ဖီ သောက်မလား။ — အို၊ သိပ်သောက်ချင်တာပဲ။",{"es":["Me encantaría uno.","Un sí alegre. Para cosas que se cuentan: I'd love one. Para comida o bebida que no se cuenta: I'd love some.","— ¿Gustas un café? — ¡Ay, me encantaría!"],"fr":["Très volontiers.","Un oui joyeux. Pour ce qui se compte : I'd love one. Pour la nourriture ou les boissons qui ne se comptent pas : I'd love some.","— Voulez-vous un café ? — Oh, très volontiers !"],"hi":["हाँ, ज़रूर लूँगा!","ख़ुशी भरी हाँ। गिनी जा सकने वाली चीज़ों के लिए: I'd love one. जो खाने-पीने की चीज़ें गिनी नहीं जातीं, उनके लिए: I'd love some.","— कॉफ़ी लेंगे? — अरे हाँ, ज़रूर लूँगा!"],"vi":["Có chứ, mình thích lắm.","Lời đồng ý vui vẻ. Với thứ đếm được: I'd love one. Với đồ ăn, đồ uống không đếm được: I'd love some.","— Bạn uống cà phê không? — Ồ, có chứ, mình thích lắm!"]}],["Sure, why not?","ရတာပေါ့၊ ဘာလို့ မရရမှာလဲ။","A relaxed, casual yes. Friends only.","— Want to get lunch together? — Sure, why not?","— နေ့လယ်စာ အတူ စားကြမလား။ — ရတာပေါ့။",{"es":["Claro, ¿por qué no?","Un sí relajado e informal. Solo con amigos.","— ¿Vamos a comer juntos? — Claro, ¿por qué no?"],"fr":["Oui, pourquoi pas ?","Un oui détendu et familier. Entre amis seulement.","— On déjeune ensemble ? — Oui, pourquoi pas ?"],"hi":["हाँ, क्यों नहीं?","बेफ़िक्र, अनौपचारिक हाँ। सिर्फ़ दोस्तों के साथ।","— साथ में लंच करें? — हाँ, क्यों नहीं?"],"vi":["Ừ, sao lại không?","Lời đồng ý thoải mái, thân mật. Chỉ dùng với bạn bè.","— Đi ăn trưa cùng không? — Ừ, sao lại không?"]}],["If you don't mind.","စိတ်မရှိဘူးဆိုရင်ပေါ့။","A polite yes that shows you don't want to be any trouble. Good with people you don't know well.","— I'll drive you home. — Oh, if you don't mind. Thank you.","— အိမ်ကို ကားနဲ့ လိုက်ပို့ပေးမယ်။ — အို၊ ကိစ္စမရှိရင်တော့ပေါ့။ ကျေးဇူးပါ။",{"es":["Si no es molestia.","Un sí cortés que muestra que no quieres causar molestias. Bueno con personas que no conoces bien.","— Te llevo a tu casa. — Ay, si no es molestia. Gracias."],"fr":["Si ça ne vous dérange pas.","Un oui poli qui montre que vous ne voulez pas déranger. Bien avec les personnes que vous connaissez peu.","— Je vous ramène chez vous. — Oh, si ça ne vous dérange pas. Merci."],"hi":["अगर आपको तकलीफ़ न हो तो।","विनम्र हाँ, जो दिखाती है कि आप तकलीफ़ नहीं देना चाहते। उन लोगों के साथ अच्छा, जिन्हें आप ठीक से नहीं जानते।","— मैं आपको घर छोड़ देता हूँ। — अगर आपको तकलीफ़ न हो तो। धन्यवाद।"],"vi":["Nếu bạn không phiền.","Lời đồng ý lịch sự, cho thấy bạn không muốn làm phiền. Hợp với người bạn chưa quen thân.","— Để tôi chở bạn về. — Ồ, nếu anh không phiền. Cảm ơn anh."]}],["Just a little, please.","နည်းနည်းပဲ ပေးပါ။","A polite middle way: you accept, but only a small amount. Useful when you're not very hungry.","— More soup? — Just a little, please.","— ဟင်းချို ထပ်ထည့်ဦးမလား။ — နည်းနည်းပဲ ပေးပါ။",{"es":["Solo un poquito, por favor.","Un punto medio cortés: aceptas, pero solo un poco. Útil cuando no tienes mucha hambre.","— ¿Más sopa? — Solo un poquito, por favor."],"fr":["Juste un peu, s'il vous plaît.","Un juste milieu poli : vous acceptez, mais une petite quantité. Utile quand on n'a pas très faim.","— Encore de la soupe ? — Juste un peu, s'il vous plaît."],"hi":["बस थोड़ा-सा।","विनम्र बीच का रास्ता: आप लेते हैं, पर थोड़ा ही। जब ज़्यादा भूख न हो तब काम का है।","— और सूप? — बस थोड़ा-सा।"],"vi":["Cho mình một chút thôi.","Một cách dung hòa lịch sự: bạn nhận, nhưng chỉ một ít. Hữu ích khi bạn không đói lắm.","— Thêm canh nhé? — Cho mình một chút thôi."]}]],"tr":{"es":["Aceptar","Decir que sí a un ofrecimiento. Yes, please. es lo más sencillo; estas son más cálidas."],"fr":["Accepter","Dire oui à une offre. Yes, please. est le plus simple ; celles-ci sont plus chaleureuses."],"hi":["स्वीकार करना","पेशकश को हाँ कहना। Yes, please. सबसे सरल है; ये ज़्यादा आत्मीय हैं।"],"vi":["Nhận lời","Đồng ý với một lời mời. Yes, please. là đơn giản nhất; những câu này ấm áp hơn."]}},{"en":"Saying no nicely","my":"ယဉ်ယဉ်ကျေးကျေး ငြင်းခြင်း","desc":"Refusing without sounding cold. Remember: English speakers believe your first no.","cards":[["I'm good, thanks.","ရပါတယ်၊ ကျေးဇူးပါ။","Casual and very American. It means No, thanks, not I'm happy. You'll hear it all the time.","— More coffee? — I'm good, thanks.","— ကော်ဖီ ထပ်ထည့်ဦးမလား။ — ရပါတယ်၊ ကျေးဇူးပါ။",{"es":["Así estoy bien, gracias.","Informal y muy estadounidense. Significa No, gracias, no Estoy contento. Lo vas a oír todo el tiempo.","— ¿Más café? — Así estoy bien, gracias."],"fr":["Ça ira, merci.","Familier et très américain. Cela veut dire Non, merci, pas Je suis content. Vous l'entendrez sans arrêt.","— Encore du café ? — Ça ira, merci."],"hi":["नहीं, बस, शुक्रिया।","अनौपचारिक और बहुत अमेरिकी। मतलब है “नहीं, शुक्रिया”, “मैं ख़ुश हूँ” नहीं। आप इसे हर समय सुनेंगे।","— और कॉफ़ी? — नहीं, बस, शुक्रिया।"],"vi":["Mình đủ rồi, cảm ơn.","Thân mật và rất Mỹ. Nghĩa là “Không, cảm ơn”, không phải “Tôi đang vui”. Bạn sẽ nghe câu này suốt.","— Thêm cà phê nhé? — Mình đủ rồi, cảm ơn."]}],["Not right now, thanks.","အခု မလိုသေးဘူး၊ ကျေးဇူးပါ။","A soft no that leaves the door open for later. Also: Maybe later.","— Would you like something to drink? — Not right now, thanks.","— တစ်ခုခု သောက်မလား။ — အခု မလိုသေးဘူး၊ ကျေးဇူးပါ။",{"es":["Ahorita no, gracias.","Un no suave que deja la puerta abierta para después. También: Maybe later.","— ¿Gusta algo de tomar? — Ahorita no, gracias."],"fr":["Pas pour l'instant, merci.","Un non doux qui laisse la porte ouverte pour plus tard. On dit aussi : Maybe later.","— Voulez-vous boire quelque chose ? — Pas pour l'instant, merci."],"hi":["अभी नहीं, शुक्रिया।","नरम ना, जो बाद के लिए रास्ता खुला रखती है। यह भी: Maybe later.","— कुछ पीने को लेंगे? — अभी नहीं, शुक्रिया।"],"vi":["Bây giờ thì chưa, cảm ơn.","Lời từ chối nhẹ nhàng, để ngỏ cho lần sau. Cũng có: Maybe later.","— Bạn uống gì không? — Bây giờ thì chưa, cảm ơn."]}],["I couldn't eat another bite!","နောက်ထပ် တစ်လုတ်တောင် မစားနိုင်တော့ဘူး။","A friendly no to more food. It also tells the cook the food was good.","Thank you, it was delicious, but I couldn't eat another bite!","ကျေးဇူးပါ၊ အရမ်းစားကောင်းတယ်၊ ဒါပေမဲ့ နောက်ထပ် တစ်လုတ်တောင် မစားနိုင်တော့ဘူး။",{"es":["¡No me cabe ni un bocado más!","Un no amistoso a más comida. También le dice a quien cocinó que la comida estuvo rica.","Gracias, estuvo delicioso, ¡pero no me cabe ni un bocado más!"],"fr":["Je ne peux plus rien avaler !","Un non amical quand on vous ressert. Cela dit aussi au cuisinier que c'était bon.","Merci, c'était délicieux, mais je ne peux plus rien avaler !"],"hi":["अब एक कौर भी नहीं खा सकता!","और खाने के लिए दोस्ताना ना। पकाने वाले को यह भी बता देता है कि खाना स्वादिष्ट था।","शुक्रिया, बहुत स्वादिष्ट था, पर अब एक कौर भी नहीं खा सकता!"],"vi":["Mình no không ăn thêm nổi miếng nào nữa!","Lời từ chối thân thiện khi được mời ăn thêm. Cũng là cách nói với người nấu rằng món ăn rất ngon.","Cảm ơn, ngon lắm, nhưng mình no không ăn thêm nổi miếng nào nữa!"]}],["Thanks, but I can manage.","ကျေးဇူးပါ၊ ကိုယ့်ဘာသာ လုပ်နိုင်ပါတယ်။","A polite no to an offer of help. Manage = do it by yourself.","— Do you need a hand with those bags? — Thanks, but I can manage.","— အိတ်တွေ ကူသယ်ပေးရမလား။ — ကျေးဇူးပါ၊ ကိုယ့်ဘာသာ သယ်နိုင်ပါတယ်။",{"es":["Gracias, pero yo puedo.","Un no cortés cuando te ofrecen ayuda. Manage = hacerlo tú solo.","— ¿Te echo una mano con esas bolsas? — Gracias, pero yo puedo."],"fr":["Merci, mais je vais y arriver.","Un non poli à une offre d'aide. Manage = se débrouiller seul.","— Tu veux un coup de main avec ces sacs ? — Merci, mais je vais y arriver."],"hi":["शुक्रिया, पर मैं कर लूँगा।","मदद की पेशकश पर विनम्र ना। Manage = ख़ुद कर लेना।","— इन थैलों में हाथ बँटाऊँ? — शुक्रिया, पर मैं कर लूँगा।"],"vi":["Cảm ơn, nhưng mình tự làm được.","Lời từ chối lịch sự khi có người ngỏ ý giúp. Manage = tự mình xoay xở.","— Cần mình xách giúp mấy cái túi không? — Cảm ơn, nhưng mình tự làm được."]}],["That's kind of you, but…","စေတနာကို ကျေးဇူးပါ၊ ဒါပေမဲ့…","Thanks the person first, then says no with a reason. Good for bigger offers.","That's kind of you, but my friend is coming to get me.","သဘောကောင်းလို့ပါ၊ ဒါပေမဲ့ သူငယ်ချင်း လာကြိုမှာပါ။",{"es":["Qué amable, pero…","Primero agradece a la persona y luego dice que no con un motivo. Bueno para ofrecimientos más grandes.","Qué amable, pero mi amigo viene por mí."],"fr":["C'est gentil, mais…","Remercie d'abord, puis dit non avec une raison. Bien pour les offres plus importantes.","C'est gentil, mais mon ami vient me chercher."],"hi":["आपकी मेहरबानी है, पर…","पहले व्यक्ति को धन्यवाद देता है, फिर वजह के साथ ना कहता है। बड़ी पेशकशों के लिए अच्छा।","आपकी मेहरबानी है, पर मेरा दोस्त मुझे लेने आ रहा है।"],"vi":["Bạn tốt quá, nhưng…","Cảm ơn người kia trước, rồi từ chối kèm lý do. Hợp với những lời mời lớn hơn.","Bạn tốt quá, nhưng bạn mình sắp đến đón rồi."]}],["Really, I'm fine.","တကယ် ရပါတယ်။","A firm, friendly no after a second offer. Smile when you say it.","Really, I'm fine. Thank you.","တကယ် ရပါတယ်။ ကျေးဇူးပါ။",{"es":["De verdad, estoy bien.","Un no firme y amistoso después de un segundo ofrecimiento. Sonríe al decirlo.","De verdad, estoy bien. Gracias."],"fr":["Vraiment, ça va.","Un non ferme et amical après une deuxième offre. Souriez en le disant.","Vraiment, ça va. Merci."],"hi":["सच में, रहने दीजिए।","दूसरी बार पूछे जाने पर पक्की पर दोस्ताना ना। मुस्कुराकर कहिए।","सच में, रहने दीजिए। धन्यवाद।"],"vi":["Thật mà, mình không cần đâu.","Lời từ chối dứt khoát mà thân thiện sau khi được mời lần thứ hai. Hãy mỉm cười khi nói.","Thật mà, mình không cần đâu. Cảm ơn bạn."]}]],"tr":{"es":["Decir que no con amabilidad","Rechazar sin sonar frío. Recuerda: los angloparlantes creen tu primer no."],"fr":["Dire non gentiment","Refuser sans paraître froid. À retenir : les anglophones prennent votre premier non au sérieux."],"hi":["अच्छे ढंग से ना कहना","रूखे लगे बिना मना करना। याद रखिए: अंग्रेज़ी बोलने वाले आपकी पहली ना को सच मान लेते हैं।"],"vi":["Từ chối cho khéo","Từ chối mà không nghe lạnh lùng. Nhớ rằng: người nói tiếng Anh tin lời từ chối đầu tiên của bạn."]}},{"en":"Insisting and giving in","my":"ထပ်ခါ တိုက်တွန်းခြင်းနဲ့ လက်ခံလိုက်ခြင်း","desc":"Offering a second time, and changing your mind. In English, one more try is usually enough.","cards":[["Are you sure?","သေချာလား။","English-speaking hosts usually ask this once. If you answer Yes, I'm sure, they will stop offering.","— No, thanks. — Are you sure? There's plenty.","— ရပါတယ်။ — သေချာလား။ အများကြီး ရှိတယ်နော်။",{"es":["¿Seguro?","Los anfitriones angloparlantes suelen preguntarlo una vez. Si respondes Yes, I'm sure, dejan de ofrecer.","— No, gracias. — ¿Seguro? Hay de sobra."],"fr":["Tu es sûr ?","Les hôtes anglophones le demandent en général une fois. Si vous répondez Yes, I'm sure, ils cessent de proposer.","— Non, merci. — Tu es sûr ? Il y en a plein."],"hi":["पक्का?","अंग्रेज़ी बोलने वाले मेज़बान अक्सर एक बार यह पूछते हैं। अगर आप Yes, I'm sure कह दें, तो वे पूछना बंद कर देते हैं।","— नहीं, शुक्रिया। — पक्का? बहुत है।"],"vi":["Bạn chắc chứ?","Chủ nhà nói tiếng Anh thường hỏi câu này một lần. Nếu bạn trả lời Yes, I'm sure, họ sẽ thôi không mời nữa.","— Không, cảm ơn. — Bạn chắc chứ? Còn nhiều lắm."]}],["Go on, have some more!","စားပါဦး၊ နောက်ထပ် နည်းနည်းလောက်။","Friendly insisting, once or twice. When you are the host, don't push many times: in English, that can feel like pressure.","Go on, have a little more. You hardly ate anything!","စားပါဦး၊ နည်းနည်းလေး။ ဘာမှ မစားရသေးဘူး။",{"es":["¡Ándale, sírvete más!","Insistir con amabilidad, una o dos veces. Cuando eres el anfitrión, no insistas muchas veces: en inglés puede sentirse como presión.","Ándale, sírvete un poco más. ¡Casi no comiste nada!"],"fr":["Allez, reprends-en !","Insister gentiment, une ou deux fois. Quand vous recevez, n'insistez pas trop : en anglais, cela peut être ressenti comme une pression.","Allez, reprends-en un peu. Tu n'as presque rien mangé !"],"hi":["अरे, थोड़ा और लो न!","प्यार से ज़ोर देना, एक-दो बार। जब आप मेज़बान हों, तो बार-बार ज़ोर मत दीजिए: अंग्रेज़ी में यह दबाव जैसा लग सकता है।","अरे, थोड़ा और लो न। तुमने तो कुछ खाया ही नहीं!"],"vi":["Nào, ăn thêm đi!","Nài một cách thân tình, một hai lần. Khi bạn là chủ nhà, đừng nài nhiều lần: trong tiếng Anh, việc đó có thể bị coi là ép.","Nào, ăn thêm chút nữa đi. Bạn gần như chưa ăn gì!"]}],["Well, if you insist!","ကဲ၊ ဒီလောက် ပြောမှတော့…","A playful yes after someone offers again. Said with a smile.","— Please, take the last piece. — Well, if you insist!","— နောက်ဆုံး တစ်ဖတ် ယူလိုက်ပါ။ — ကဲ၊ ဒီလောက် ပြောမှတော့…",{"es":["Bueno, ¡si insistes!","Un sí juguetón después de que alguien ofrece otra vez. Se dice con una sonrisa.","— Por favor, toma el último pedazo. — Bueno, ¡si insistes!"],"fr":["Bon, si tu insistes !","Un oui amusé après une nouvelle offre. Se dit avec le sourire.","— Je t'en prie, prends la dernière part. — Bon, si tu insistes !"],"hi":["अच्छा, आप इतना कह रहे हैं तो!","जब कोई दोबारा पेशकश करे, तब चुलबुली हाँ। मुस्कुराकर कही जाती है।","— लीजिए न, आख़िरी टुकड़ा ले लीजिए। — अच्छा, आप इतना कह रहे हैं तो!"],"vi":["Thôi được, bạn đã nói vậy thì!","Lời đồng ý vui đùa sau khi được mời thêm lần nữa. Nói kèm một nụ cười.","— Nào, lấy miếng cuối cùng đi. — Thôi được, bạn đã nói vậy thì!"]}],["Don't be shy!","အားမနာနဲ့။","Said to guests to make them feel free to take things. The English for အားမနာနဲ့.","Don't be shy! Take as much as you like.","အားမနာနဲ့။ ကြိုက်သလောက် ယူပါ။",{"es":["¡No te dé pena!","Se les dice a los invitados para que se sientan libres de tomar lo que quieran.","¡No te dé pena! Toma todo lo que quieras."],"fr":["Ne sois pas timide !","Se dit aux invités pour qu'ils se sentent libres de se servir.","Ne sois pas timide ! Prends-en autant que tu veux."],"hi":["संकोच मत कीजिए!","मेहमानों से कहा जाता है, ताकि वे जो चाहें बेझिझक लें।","संकोच मत कीजिए! जितना चाहें ले लीजिए।"],"vi":["Đừng ngại!","Nói với khách để họ thoải mái lấy thứ mình muốn.","Đừng ngại! Cứ lấy bao nhiêu tùy thích."]}]],"tr":{"es":["Insistir y ceder","Ofrecer por segunda vez, y cambiar de opinión. En inglés, un intento más suele bastar."],"fr":["Insister et céder","Proposer une seconde fois, et changer d'avis. En anglais, une tentative de plus suffit en général."],"hi":["ज़ोर देना और मान जाना","दोबारा पेशकश करना, और अपना मन बदल लेना। अंग्रेज़ी में आम तौर पर एक बार और पूछना काफ़ी है।"],"vi":["Mời thêm và xiêu lòng","Mời lần thứ hai, và đổi ý. Trong tiếng Anh, thường chỉ cần mời thêm một lần là đủ."]}},{"en":"Offering to pay","my":"ငွေရှင်းဖို့ ကမ်းလှမ်းခြင်း","desc":"Who pays? Treating, sharing and paying back.","cards":[["It's on me.","ငါ ဒကာခံမယ်။","I'll pay for everyone. Also: My treat! Casual and friendly.","Put your money away. It's on me.","ပိုက်ဆံ ပြန်သိမ်းထား။ ငါ ဒကာခံမယ်။",{"es":["Yo invito.","Yo pago lo de todos. También: My treat! Informal y amistoso.","Guarda tu dinero. Yo invito."],"fr":["C'est pour moi.","Je paie pour tout le monde. On dit aussi : My treat! Familier et amical.","Range ton argent. C'est pour moi."],"hi":["आज मेरी तरफ़ से।","सबके पैसे मैं दूँगा। यह भी: My treat! अनौपचारिक और दोस्ताना।","पैसे अंदर रखो। आज मेरी तरफ़ से।"],"vi":["Để mình mời.","Mình trả cho tất cả. Cũng có: My treat! Thân mật và thân thiện.","Cất tiền đi. Để mình mời."]}],["Let me get this.","ဒါ ကျွန်တော် ရှင်းပါရစေ။","A polite offer to pay, often said as the bill arrives. Softer than It's on me.","No, no, let me get this. You paid last time.","မဟုတ်ဘူး၊ ဒါ ကျွန်တော် ရှင်းပါရစေ။ ပြီးခဲ့တဲ့တစ်ခါ ခင်ဗျား ရှင်းခဲ့တာလေ။",{"es":["Déjame pagar a mí.","Un ofrecimiento cortés de pagar, a menudo cuando llega la cuenta. Más suave que It's on me.","No, no, déjame pagar a mí. Tú pagaste la vez pasada."],"fr":["Laisse, c'est moi qui paie.","Une offre polie de payer, souvent dite quand l'addition arrive. Plus doux que It's on me.","Non, non, laisse, c'est moi qui paie. Tu as payé la dernière fois."],"hi":["यह मैं देता हूँ।","पैसे देने की विनम्र पेशकश, अक्सर बिल आने पर। It's on me से नरम।","नहीं, नहीं, यह मैं देता हूँ। पिछली बार तुमने दिए थे।"],"vi":["Để mình trả lần này.","Lời ngỏ ý trả tiền lịch sự, thường là lúc hóa đơn được mang ra. Nhẹ nhàng hơn It's on me.","Không, không, để mình trả lần này. Lần trước bạn trả rồi."]}],["Let's split it.","ခွဲရှင်းကြမယ်။","Everyone pays their part. Among friends and coworkers in English-speaking countries, this is normal, not rude.","That's 40 dollars. Let's split it: 20 each.","စုစုပေါင်း ဒေါ်လာ ၄၀။ ခွဲရှင်းကြမယ်၊ တစ်ယောက် ၂၀ စီ။",{"es":["Vamos a mitades.","Cada quien paga su parte. Entre amigos y compañeros de trabajo en los países de habla inglesa es normal, no grosero.","Son 40 dólares. Vamos a mitades: 20 cada uno."],"fr":["On partage.","Chacun paie sa part. Entre amis et collègues dans les pays anglophones, c'est normal, pas impoli.","Ça fait 40 dollars. On partage : 20 chacun."],"hi":["आधा-आधा कर लेते हैं।","हर कोई अपना हिस्सा देता है। अंग्रेज़ी-भाषी देशों में दोस्तों और सहकर्मियों के बीच यह सामान्य है, बुरा नहीं माना जाता।","40 डॉलर हुए। आधा-आधा कर लेते हैं: 20-20।"],"vi":["Mình chia đôi nhé.","Mỗi người trả phần của mình. Giữa bạn bè và đồng nghiệp ở các nước nói tiếng Anh, đây là chuyện bình thường, không hề bất lịch sự.","Hết 40 đô. Mình chia đôi nhé: mỗi người 20."]}],["I'll get the next one.","နောက်တစ်ခါ ကျွန်တော် ရှင်းမယ်။","Accepts a treat and promises to pay next time. Friendly and fair.","Thanks for lunch! I'll get the next one.","နေ့လယ်စာအတွက် ကျေးဇူးပါ။ နောက်တစ်ခါ ကျွန်တော် ရှင်းမယ်။",{"es":["La próxima invito yo.","Acepta una invitación y promete pagar la próxima vez. Amistoso y justo.","¡Gracias por la comida! La próxima invito yo."],"fr":["La prochaine fois, c'est pour moi.","Accepte une invitation et promet de payer la fois suivante. Amical et équitable.","Merci pour le déjeuner ! La prochaine fois, c'est pour moi."],"hi":["अगली बार मैं दूँगा।","किसी की दावत स्वीकार करता है और अगली बार पैसे देने का वादा करता है। दोस्ताना और बराबरी का।","लंच के लिए शुक्रिया! अगली बार मैं दूँगा।"],"vi":["Lần sau mình trả.","Nhận lời mời và hứa lần sau sẽ trả. Thân thiện và sòng phẳng.","Cảm ơn vì bữa trưa! Lần sau mình trả."]}]],"tr":{"es":["Ofrecer pagar","¿Quién paga? Invitar, dividir la cuenta y corresponder."],"fr":["Proposer de payer","Qui paie ? Inviter, partager et rendre la pareille."],"hi":["पैसे देने की पेशकश","पैसे कौन देगा? खिलाना-पिलाना, बाँटना और अगली बार चुकाना।"],"vi":["Ngỏ ý trả tiền","Ai trả tiền? Mời, chia nhau và mời lại."]}}];const langs=["my","es","fr","hi","vi"];const COURSE="eng";</script>
