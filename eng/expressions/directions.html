<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/directions/";const AUD_EXT="mp3?v=2611200514";const categories=[{"en":"Asking the way","my":"လမ်း မေးခြင်း","desc":"Start with Excuse me, then ask your question.","cards":[["Excuse me, where's <span class=gray>the bank<\/span>?","တဆိတ်လောက်၊ ဘဏ် ဘယ်မှာလဲ။","Excuse me first gets a stranger's attention politely. Where's = where is.","Excuse me, where's the bus station?","တဆိတ်လောက်၊ ဘတ်စ်ကားဂိတ် ဘယ်မှာလဲ။",{"es":["Disculpe, ¿dónde está el banco?","Excuse me, al principio, llama la atención de un desconocido con cortesía. Where's = where is.","Disculpe, ¿dónde está la terminal de autobuses?"],"fr":["Excusez-moi, où est la banque ?","Excuse me, en premier, attire poliment l'attention d'un inconnu. Where's = where is.","Excusez-moi, où est la gare routière ?"],"hi":["सुनिए, <span class=gray>बैंक<\/span> कहाँ है?","शुरू का Excuse me किसी अजनबी का ध्यान विनम्रता से खींचता है। Where's = where is.","सुनिए, बस अड्डा कहाँ है?"],"vi":["Xin lỗi, <span class=gray>ngân hàng<\/span> ở đâu ạ?","Excuse me ở đầu câu để gây chú ý với người lạ một cách lịch sự. Where's = where is.","Xin lỗi, bến xe buýt ở đâu ạ?"]}],["How do I get to <span class=gray>the station<\/span>?","ဘူတာကို ဘယ်လို သွားရမလဲ။","Asks for the way, not just the place. Get to = arrive at.","Excuse me, how do I get to the hospital?","တဆိတ်လောက်၊ ဆေးရုံကို ဘယ်လို သွားရမလဲ။",{"es":["¿Cómo llego a la estación?","Pregunta por el camino, no solo por el lugar. Get to = llegar a.","Disculpe, ¿cómo llego al hospital?"],"fr":["Comment je vais à la gare ?","Demande le chemin, pas seulement l'endroit. Get to = arriver à.","Excusez-moi, comment je vais à l'hôpital ?"],"hi":["<span class=gray>स्टेशन<\/span> कैसे पहुँचूँ?","सिर्फ़ जगह नहीं, रास्ता पूछता है। Get to = पहुँचना।","सुनिए, अस्पताल कैसे पहुँचूँ?"],"vi":["Đi đến <span class=gray>nhà ga<\/span> thế nào ạ?","Hỏi đường đi, không chỉ hỏi địa điểm. Get to = đi đến.","Xin lỗi, đi đến bệnh viện thế nào ạ?"]}],["Is there <span class=gray>a pharmacy<\/span> near here?","ဒီနားမှာ ဆေးဆိုင် ရှိလား။","When you need any shop of that kind, not one in particular.","Is there a toilet near here?","ဒီနားမှာ အိမ်သာ ရှိလား။",{"es":["¿Hay una farmacia cerca de aquí?","Cuando necesitas cualquier tienda de ese tipo, no una en particular.","¿Hay un baño cerca de aquí?"],"fr":["Il y a une pharmacie près d'ici ?","Quand on cherche n'importe quel commerce de ce genre, pas un en particulier.","Il y a des toilettes près d'ici ?"],"hi":["क्या यहाँ पास में कोई <span class=gray>दवा की दुकान<\/span> है?","जब आपको उस तरह की कोई भी दुकान चाहिए, कोई ख़ास दुकान नहीं।","क्या यहाँ पास में कोई शौचालय है?"],"vi":["Gần đây có <span class=gray>hiệu thuốc<\/span> nào không?","Khi bạn cần bất cứ cửa hàng nào thuộc loại đó, không phải một cửa hàng cụ thể.","Gần đây có nhà vệ sinh nào không?"]}],["Is it far?","ဝေးလား။","Asks about the distance. Also: How far is it?","— The temple is up the hill. — Is it far?","— ဘုရားက တောင်ပေါ်မှာ။ — ဝေးလား။",{"es":["¿Está lejos?","Pregunta por la distancia. También: How far is it?","— El templo está en lo alto de la colina. — ¿Está lejos?"],"fr":["C'est loin ?","Demande la distance. On dit aussi : How far is it?","— Le temple est en haut de la colline. — C'est loin ?"],"hi":["क्या वह दूर है?","दूरी पूछता है। यह भी: How far is it?","— मंदिर पहाड़ी के ऊपर है। — क्या वह दूर है?"],"vi":["Có xa không?","Hỏi về khoảng cách. Cũng có: How far is it?","— Ngôi chùa ở trên đồi. — Có xa không?"]}],["Can you show me on the map?","မြေပုံပေါ်မှာ ပြပေးလို့ ရမလား။","Useful when the directions are hard to follow. Hold out your phone or map.","Sorry, I don't understand. Can you show me on the map?","ဆောရီး၊ နားမလည်ဘူး။ မြေပုံပေါ်မှာ ပြပေးလို့ ရမလား။",{"es":["¿Me lo puede mostrar en el mapa?","Útil cuando las indicaciones son difíciles de seguir. Muestra tu teléfono o tu mapa.","Perdón, no entiendo. ¿Me lo puede mostrar en el mapa?"],"fr":["Vous pouvez me montrer sur la carte ?","Utile quand les indications sont difficiles à suivre. Tendez votre téléphone ou votre plan.","Désolé, je ne comprends pas. Vous pouvez me montrer sur la carte ?"],"hi":["क्या आप मुझे नक़्शे पर दिखा सकते हैं?","तब काम का, जब रास्ता समझना मुश्किल हो। अपना फ़ोन या नक़्शा दिखाइए।","माफ़ कीजिए, मुझे समझ नहीं आया। क्या आप मुझे नक़्शे पर दिखा सकते हैं?"],"vi":["Bạn chỉ cho tôi trên bản đồ được không?","Hữu ích khi lời chỉ đường khó theo. Hãy đưa điện thoại hoặc bản đồ của bạn ra.","Xin lỗi, tôi không hiểu. Bạn chỉ cho tôi trên bản đồ được không?"]}]],"tr":{"es":["Preguntar el camino","Empieza con Excuse me y luego haz tu pregunta."],"fr":["Demander son chemin","Commencez par Excuse me, puis posez votre question."],"hi":["रास्ता पूछना","Excuse me से शुरू कीजिए, फिर अपना सवाल पूछिए।"],"vi":["Hỏi đường","Mở đầu bằng Excuse me, rồi hỏi."]}},{"en":"Giving directions","my":"လမ်း ညွှန်ခြင်း","desc":"Short commands that tell someone which way to go.","cards":[["Go straight on.","တည့်တည့် သွားပါ။","Keep going forward. American English: Go straight ahead.","Go straight on for about two hundred metres.","မီတာ နှစ်ရာလောက် တည့်တည့် သွားပါ။",{"es":["Siga derecho.","Sigue hacia adelante. En inglés americano: Go straight ahead.","Siga derecho unos doscientos metros."],"fr":["Allez tout droit.","Continuez devant vous. En anglais américain : Go straight ahead.","Allez tout droit sur deux cents mètres environ."],"hi":["सीधे चलते जाइए।","आगे की ओर चलते रहिए। अमेरिकी अंग्रेज़ी में: Go straight ahead.","क़रीब दो सौ मीटर सीधे चलते जाइए।"],"vi":["Đi thẳng.","Cứ đi về phía trước. Trong tiếng Anh Mỹ: Go straight ahead.","Đi thẳng khoảng hai trăm mét."]}],["Turn left.","ဘယ်ဘက် ကွေ့ပါ။","Left and right are from the walker's side, not yours. Point to help.","Turn left after the bridge.","တံတားကျော်ရင် ဘယ်ဘက် ကွေ့ပါ။",{"es":["Gire a la izquierda.","Left y right son desde el lado de quien camina, no del tuyo. Señala para ayudar.","Gire a la izquierda después del puente."],"fr":["Tournez à gauche.","Left et right se comptent du point de vue de celui qui marche, pas du vôtre. Montrez du doigt pour aider.","Tournez à gauche après le pont."],"hi":["बाएँ मुड़िए।","Left और right चलने वाले के हिसाब से होते हैं, आपके हिसाब से नहीं। मदद के लिए इशारा कीजिए।","पुल के बाद बाएँ मुड़िए।"],"vi":["Rẽ trái.","Left và right tính theo phía người đang đi, không theo phía bạn. Hãy chỉ tay để giúp họ.","Qua cầu thì rẽ trái."]}],["Turn right at <span class=gray>the traffic lights<\/span>.","မီးပွိုင့်ကနေ ညာဘက် ကွေ့ပါ။","At + a landmark tells them where to turn.","Turn right at the big tree.","သစ်ပင်ကြီးကနေ ညာဘက် ကွေ့ပါ။",{"es":["Gire a la derecha en el semáforo.","At + un punto de referencia indica dónde girar.","Gire a la derecha en el árbol grande."],"fr":["Tournez à droite aux feux.","At + un point de repère indique où tourner.","Tournez à droite au grand arbre."],"hi":["<span class=gray>ट्रैफ़िक लाइट<\/span> से दाएँ मुड़िए।","At + कोई पहचान की जगह बताता है कि कहाँ मुड़ना है।","बड़े पेड़ के पास से दाएँ मुड़िए।"],"vi":["Rẽ phải ở <span class=gray>đèn giao thông<\/span>.","At + một điểm mốc cho biết rẽ ở đâu.","Rẽ phải ở chỗ cái cây to."]}],["Take the second street on the left.","ဘယ်ဘက် ဒုတိယ လမ်းထဲ ဝင်ပါ။","Count the streets: first, second, third.","Take the first street on the right. The shop is there.","ညာဘက် ပထမ လမ်းထဲ ဝင်ပါ။ ဆိုင်က အဲဒီမှာပါ။",{"es":["Tome la segunda calle a la izquierda.","Cuenta las calles: first, second, third.","Tome la primera calle a la derecha. La tienda está ahí."],"fr":["Prenez la deuxième rue à gauche.","Comptez les rues : first, second, third.","Prenez la première rue à droite. Le magasin est là."],"hi":["बाईं ओर की दूसरी गली में जाइए।","गलियाँ गिनिए: first, second, third.","दाईं ओर की पहली गली में जाइए। दुकान वहीं है।"],"vi":["Rẽ vào đường thứ hai bên trái.","Đếm các con đường: first, second, third.","Rẽ vào đường thứ nhất bên phải. Cửa hàng ở đó."]}],["Cross the road.","လမ်း ကူးပါ။","Go to the other side. Look both ways first!","Cross the road at the zebra crossing.","လူကူးမျဉ်းကြားမှာ လမ်း ကူးပါ။",{"es":["Cruce la calle.","Pasa al otro lado. ¡Mira primero a los dos lados!","Cruce la calle por el paso de peatones."],"fr":["Traversez la rue.","Passez de l'autre côté. Regardez d'abord des deux côtés !","Traversez la rue au passage piéton."],"hi":["सड़क पार कीजिए।","दूसरी तरफ़ जाइए। पहले दोनों ओर देख लीजिए!","ज़ेब्रा क्रॉसिंग से सड़क पार कीजिए।"],"vi":["Băng qua đường.","Sang phía bên kia. Nhớ nhìn cả hai phía trước đã!","Băng qua đường ở vạch dành cho người đi bộ."]}],["Go past <span class=gray>the school<\/span>.","ကျောင်းကို ကျော်သွားပါ။","Walk by it without stopping.","Go past the market and turn left.","ဈေးကို ကျော်ပြီး ဘယ်ဘက် ကွေ့ပါ။",{"es":["Pase la escuela.","Pasar por delante sin detenerse.","Pase el mercado y gire a la izquierda."],"fr":["Passez devant l'école.","Passer à côté sans s'arrêter.","Passez devant le marché et tournez à gauche."],"hi":["<span class=gray>स्कूल<\/span> के आगे निकल जाइए।","बिना रुके सामने से गुज़र जाना।","बाज़ार के आगे निकल जाइए और बाएँ मुड़िए।"],"vi":["Đi qua <span class=gray>trường học<\/span>.","Đi ngang qua mà không dừng lại.","Đi qua chợ rồi rẽ trái."]}]],"tr":{"es":["Dar indicaciones","Órdenes cortas que le dicen a alguien por dónde ir."],"fr":["Indiquer le chemin","De courtes consignes qui indiquent la direction à prendre."],"hi":["रास्ता बताना","छोटे-छोटे निर्देश, जो बताते हैं कि किस ओर जाना है।"],"vi":["Chỉ đường","Những câu lệnh ngắn cho người khác biết đi hướng nào."]}},{"en":"Where it is","my":"ဘယ်နေရာမှာ ရှိလဲ","desc":"Describing the place when they get close.","cards":[["It's on your right.","ညာဘက်မှာ ရှိတယ်။","On your left / on your right: which side they will see it.","Walk for two minutes. The library is on your right.","နှစ်မိနစ်လောက် လျှောက်ပါ။ စာကြည့်တိုက်က ညာဘက်မှာ ရှိတယ်။",{"es":["Está a su derecha.","On your left / on your right: de qué lado lo van a ver.","Camine dos minutos. La biblioteca está a su derecha."],"fr":["C'est sur votre droite.","On your left / on your right : de quel côté on le verra.","Marchez deux minutes. La bibliothèque est sur votre droite."],"hi":["वह आपके दाईं ओर है।","On your left / on your right: वह किस तरफ़ दिखेगा।","दो मिनट चलिए। पुस्तकालय आपके दाईं ओर है।"],"vi":["Nó ở bên phải của bạn.","On your left / on your right: họ sẽ thấy nó ở phía nào.","Đi bộ hai phút. Thư viện ở bên phải của bạn."]}],["It's next to <span class=gray>the post office<\/span>.","စာတိုက်ဘေးမှာ ရှိတယ်။","Next to = beside, right by.","The bakery is next to the bank.","မုန့်ဆိုင်က ဘဏ်ဘေးမှာ ရှိတယ်။",{"es":["Está al lado del correo.","Next to = junto a, pegado a.","La panadería está al lado del banco."],"fr":["C'est à côté de la poste.","Next to = à côté de, tout près de.","La boulangerie est à côté de la banque."],"hi":["वह <span class=gray>डाकघर<\/span> के बग़ल में है।","Next to = बग़ल में, सटा हुआ।","बेकरी बैंक के बग़ल में है।"],"vi":["Nó ở cạnh <span class=gray>bưu điện<\/span>.","Next to = bên cạnh, sát bên.","Tiệm bánh ở cạnh ngân hàng."]}],["It's opposite <span class=gray>the market<\/span>.","ဈေးရဲ့ မျက်နှာချင်းဆိုင်မှာ ရှိတယ်။","On the other side of the road, facing it. American English also says across from.","The clinic is opposite the school.","ဆေးခန်းက ကျောင်းရဲ့ မျက်နှာချင်းဆိုင်မှာ ရှိတယ်။",{"es":["Está enfrente del mercado.","Al otro lado de la calle, de frente. En inglés americano también se dice across from.","La clínica está enfrente de la escuela."],"fr":["C'est en face du marché.","De l'autre côté de la rue, en vis-à-vis. L'anglais américain dit aussi across from.","Le dispensaire est en face de l'école."],"hi":["वह <span class=gray>बाज़ार<\/span> के सामने है।","सड़क के उस पार, ठीक सामने। अमेरिकी अंग्रेज़ी में across from भी कहते हैं।","क्लिनिक स्कूल के सामने है।"],"vi":["Nó ở đối diện <span class=gray>chợ<\/span>.","Ở bên kia đường, ngay trước mặt. Trong tiếng Anh Mỹ còn nói across from.","Phòng khám ở đối diện trường học."]}],["It's between <span class=gray>the bank and the café<\/span>.","ဘဏ်နဲ့ ကော်ဖီဆိုင် ကြားမှာ ရှိတယ်။","Between + two places, joined with and.","The shoe shop is between the pharmacy and the bookshop.","ဖိနပ်ဆိုင်က ဆေးဆိုင်နဲ့ စာအုပ်ဆိုင် ကြားမှာ ရှိတယ်။",{"es":["Está entre el banco y el café.","Between + dos lugares, unidos con and.","La zapatería está entre la farmacia y la librería."],"fr":["C'est entre la banque et le café.","Between + deux lieux, reliés par and.","Le magasin de chaussures est entre la pharmacie et la librairie."],"hi":["वह <span class=gray>बैंक और कैफ़े<\/span> के बीच में है।","Between + दो जगहें, and से जुड़ी हुई।","जूतों की दुकान दवा की दुकान और किताबों की दुकान के बीच में है।"],"vi":["Nó ở giữa <span class=gray>ngân hàng và quán cà phê<\/span>.","Between + hai địa điểm, nối bằng and.","Cửa hàng giày ở giữa hiệu thuốc và hiệu sách."]}],["It's at the end of the street.","လမ်းအဆုံးမှာ ရှိတယ်။","Where the street stops.","Our house is at the end of the street, with a red gate.","ကျွန်တော်တို့ အိမ်က လမ်းအဆုံးမှာ၊ တံခါးနီနဲ့ပါ။",{"es":["Está al final de la calle.","Donde termina la calle.","Nuestra casa está al final de la calle, con un portón rojo."],"fr":["C'est au bout de la rue.","Là où la rue s'arrête.","Notre maison est au bout de la rue, avec un portail rouge."],"hi":["वह गली के आख़िर में है।","जहाँ गली ख़त्म होती है।","हमारा घर गली के आख़िर में है, लाल गेट वाला।"],"vi":["Nó ở cuối đường.","Chỗ con đường kết thúc.","Nhà bọn mình ở cuối đường, có cổng màu đỏ."]}],["You can't miss it.","သေချာပေါက် တွေ့မှာပါ။","It's very easy to see. Friendly, at the end of directions.","It's a big yellow building. You can't miss it.","အဝါရောင် အဆောက်အအုံ ကြီးပါ။ သေချာပေါက် တွေ့မှာပါ။",{"es":["No tiene pérdida.","Es muy fácil de ver. Una frase amable al final de las indicaciones.","Es un edificio grande y amarillo. No tiene pérdida."],"fr":["Vous ne pouvez pas le manquer.","C'est très facile à voir. Une formule aimable à la fin des explications.","C'est un grand bâtiment jaune. Vous ne pouvez pas le manquer."],"hi":["वह आपसे छूट ही नहीं सकता।","वह बहुत आसानी से दिख जाता है। रास्ता बताने के अंत में कहा जाने वाला भला वाक्य।","वह एक बड़ी पीली इमारत है। आपसे छूट ही नहीं सकती।"],"vi":["Bạn không thể không thấy đâu.","Rất dễ nhìn thấy. Một câu dễ thương để kết thúc lời chỉ đường.","Đó là một tòa nhà lớn màu vàng. Bạn không thể không thấy đâu."]}]],"tr":{"es":["Dónde está","Describir el lugar cuando ya están cerca."],"fr":["Où c'est","Décrire l'endroit quand on s'en approche."],"hi":["वह कहाँ है","जब वे पास पहुँच जाएँ, तब जगह का बयान करना।"],"vi":["Nó ở đâu","Tả địa điểm khi họ đã đến gần."]}},{"en":"How far","my":"ဘယ်လောက် ဝေးလဲ","desc":"Saying how near or far, and how long it takes.","cards":[["It's just around the corner.","ဒီနားလေးတင်ပါ။","Very close, maybe just after the next turn.","— Is the shop far? — No, it's just around the corner.","— ဆိုင်က ဝေးလား။ — မဝေးပါဘူး၊ ဒီနားလေးတင်ပါ။",{"es":["Está a la vuelta de la esquina.","Muy cerca, quizá justo después de la próxima vuelta.","— ¿La tienda está lejos? — No, está a la vuelta de la esquina."],"fr":["C'est juste au coin de la rue.","Tout près, peut-être juste après le prochain tournant.","— Le magasin est loin ? — Non, c'est juste au coin de la rue."],"hi":["वह बस मोड़ पर ही है।","बहुत पास, शायद अगले मोड़ के ठीक बाद।","— क्या दुकान दूर है? — नहीं, बस मोड़ पर ही है।"],"vi":["Nó ở ngay góc đường thôi.","Rất gần, có thể ngay sau chỗ rẽ tiếp theo.","— Cửa hàng có xa không? — Không, ở ngay góc đường thôi."]}],["It's about five minutes on foot.","လမ်းလျှောက်ရင် ငါးမိနစ်လောက်ပဲ။","On foot = walking. By car, by bus, by bike for other ways.","The beach is about ten minutes by bike.","ကမ်းခြေက စက်ဘီးနဲ့ဆို ဆယ်မိနစ်လောက်ပဲ။",{"es":["Está a unos cinco minutos a pie.","On foot = caminando. By car, by bus, by bike para los otros medios.","La playa está a unos diez minutos en bicicleta."],"fr":["C'est à environ cinq minutes à pied.","On foot = en marchant. By car, by bus, by bike pour les autres moyens.","La plage est à environ dix minutes à vélo."],"hi":["पैदल क़रीब पाँच मिनट लगते हैं।","On foot = पैदल। दूसरे साधनों के लिए by car, by bus, by bike.","समुद्र-तट साइकिल से क़रीब दस मिनट दूर है।"],"vi":["Đi bộ mất khoảng năm phút.","On foot = đi bộ. Với các phương tiện khác thì dùng by car, by bus, by bike.","Bãi biển cách khoảng mười phút đạp xe."]}],["It's a long way.","တော်တော် ဝေးတယ်။","Too far to walk easily.","It's a long way. You should take a bus.","တော်တော် ဝေးတယ်။ ဘတ်စ်ကား စီးသင့်တယ်။",{"es":["Está lejos.","Demasiado lejos para ir caminando con comodidad.","Está lejos. Mejor tome un autobús."],"fr":["C'est loin.","Trop loin pour y aller facilement à pied.","C'est loin. Vous devriez prendre un bus."],"hi":["वह काफ़ी दूर है।","इतना दूर कि आराम से पैदल नहीं जाया जा सकता।","वह काफ़ी दूर है। आपको बस ले लेनी चाहिए।"],"vi":["Xa lắm đấy.","Quá xa để đi bộ cho thoải mái.","Xa lắm đấy. Bạn nên đi xe buýt."]}],["You can walk there.","လမ်းလျှောက်ပြီး သွားလို့ ရတယ်။","It's close enough to walk.","The museum is near. You can walk there.","ပြတိုက်က နီးပါတယ်။ လမ်းလျှောက်ပြီး သွားလို့ ရတယ်။",{"es":["Puede ir caminando.","Está lo bastante cerca para ir a pie.","El museo está cerca. Puede ir caminando."],"fr":["Vous pouvez y aller à pied.","C'est assez près pour marcher.","Le musée est tout près. Vous pouvez y aller à pied."],"hi":["आप वहाँ पैदल जा सकते हैं।","इतना पास है कि पैदल पहुँचा जा सकता है।","संग्रहालय पास ही है। आप वहाँ पैदल जा सकते हैं।"],"vi":["Bạn đi bộ đến đó được.","Đủ gần để đi bộ.","Bảo tàng gần đây thôi. Bạn đi bộ đến đó được."]}]],"tr":{"es":["A qué distancia","Decir qué tan cerca o lejos está, y cuánto se tarda."],"fr":["À quelle distance","Dire si c'est près ou loin, et combien de temps il faut."],"hi":["कितनी दूर","बताना कि कितना पास या दूर है, और कितना समय लगता है।"],"vi":["Bao xa","Nói gần hay xa, và đi mất bao lâu."]}},{"en":"Lost or not sure","my":"လမ်းပျောက်ခြင်း","desc":"When you are lost, or when you can't help.","cards":[["I'm lost.","လမ်း ပျောက်နေတယ်။","You don't know where you are. Ask for help: I'm lost. Can you help me?","Excuse me, I'm lost. Where is the main road?","တဆိတ်လောက်၊ လမ်း ပျောက်နေလို့။ လမ်းမကြီး ဘယ်မှာလဲ။",{"es":["Estoy perdido.","No sabes dónde estás. Pide ayuda: I'm lost. Can you help me?","Disculpe, estoy perdido. ¿Dónde está la avenida principal?"],"fr":["Je suis perdu.","Vous ne savez pas où vous êtes. Demandez de l'aide : I'm lost. Can you help me?","Excusez-moi, je suis perdu. Où est la rue principale ?"],"hi":["मैं रास्ता भटक गया हूँ।","आपको नहीं पता कि आप कहाँ हैं। मदद माँगिए: I'm lost. Can you help me?","सुनिए, मैं रास्ता भटक गया हूँ। मुख्य सड़क किधर है?"],"vi":["Tôi bị lạc.","Bạn không biết mình đang ở đâu. Hãy nhờ giúp: I'm lost. Can you help me?","Xin lỗi, tôi bị lạc. Đường lớn ở phía nào ạ?"]}],["I'm not from around here.","ကျွန်တော်/ကျွန်မ ဒီနားက မဟုတ်ဘူး။","Explains why you don't know the way, or why you're asking.","Sorry, I'm not from around here. Try asking at the shop.","ဆောရီး၊ ဒီနားက မဟုတ်ဘူး။ ဆိုင်မှာ မေးကြည့်ပါ။",{"es":["No soy de por aquí.","Explica por qué no conoces el camino, o por qué preguntas.","Perdón, no soy de por aquí. Pregunte en la tienda."],"fr":["Je ne suis pas d'ici.","Explique pourquoi vous ne connaissez pas le chemin, ou pourquoi vous demandez.","Désolé, je ne suis pas d'ici. Demandez plutôt au magasin."],"hi":["मैं यहाँ का नहीं हूँ।","बताता है कि आपको रास्ता क्यों नहीं पता, या आप क्यों पूछ रहे हैं।","माफ़ कीजिए, मैं यहाँ का नहीं हूँ। उस दुकान पर पूछकर देखिए।"],"vi":["Tôi không phải người ở đây.","Giải thích vì sao bạn không biết đường, hoặc vì sao bạn hỏi.","Xin lỗi, tôi không phải người ở đây. Bạn thử hỏi ở cửa hàng xem."]}],["Sorry, I don't know.","ဆောရီး၊ မသိဘူး။","Honest and polite when someone asks you the way and you can't help.","— Where's the post office? — Sorry, I don't know.","— စာတိုက် ဘယ်မှာလဲ။ — ဆောရီး၊ မသိဘူး။",{"es":["Lo siento, no sé.","Sincero y cortés cuando alguien te pregunta el camino y no puedes ayudar.","— ¿Dónde está el correo? — Lo siento, no sé."],"fr":["Désolé, je ne sais pas.","Honnête et poli quand on vous demande le chemin et que vous ne pouvez pas aider.","— Où est la poste ? — Désolé, je ne sais pas."],"hi":["माफ़ कीजिए, मुझे नहीं पता।","ईमानदार और विनम्र, जब कोई आपसे रास्ता पूछे और आप मदद न कर सकें।","— डाकघर कहाँ है? — माफ़ कीजिए, मुझे नहीं पता।"],"vi":["Xin lỗi, tôi không biết.","Thật lòng và lịch sự khi có người hỏi đường mà bạn không giúp được.","— Bưu điện ở đâu ạ? — Xin lỗi, tôi không biết."]}]],"tr":{"es":["Perdido o sin saber","Cuando estás perdido, o cuando no puedes ayudar."],"fr":["Perdu ou pas sûr","Quand on est perdu, ou quand on ne peut pas aider."],"hi":["भटक गए या पक्का नहीं पता","जब आप रास्ता भटक गए हों, या जब आप मदद न कर सकें।"],"vi":["Lạc đường hoặc không chắc","Khi bạn bị lạc, hoặc khi bạn không giúp được."]}}];const langs=["my","es","fr","hi","vi"];const COURSE="eng";</script>
