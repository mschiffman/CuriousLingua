<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/directions/";const AUD_EXT="mp3?v=2611200514";const categories=[{"en":"Asking the way","my":"လမ်း မေးခြင်း","desc":"Start with Excuse me, then ask your question.","cards":[["Excuse me, where's <span class=gray>the bank<\/span>?","တဆိတ်လောက်၊ ဘဏ် ဘယ်မှာလဲ။","Excuse me first gets a stranger's attention politely. Where's = where is.","Excuse me, where's the bus station?","တဆိတ်လောက်၊ ဘတ်စ်ကားဂိတ် ဘယ်မှာလဲ။",{"es":["Disculpe, ¿dónde está el banco?","Excuse me, al principio, llama la atención de un desconocido con cortesía. Where's = where is.","Disculpe, ¿dónde está la terminal de autobuses?"],"fr":["Excusez-moi, où est la banque ?","Excuse me, en premier, attire poliment l'attention d'un inconnu. Where's = where is.","Excusez-moi, où est la gare routière ?"]}],["How do I get to <span class=gray>the station<\/span>?","ဘူတာကို ဘယ်လို သွားရမလဲ။","Asks for the way, not just the place. Get to = arrive at.","Excuse me, how do I get to the hospital?","တဆိတ်လောက်၊ ဆေးရုံကို ဘယ်လို သွားရမလဲ။",{"es":["¿Cómo llego a la estación?","Pregunta por el camino, no solo por el lugar. Get to = llegar a.","Disculpe, ¿cómo llego al hospital?"],"fr":["Comment je vais à la gare ?","Demande le chemin, pas seulement l'endroit. Get to = arriver à.","Excusez-moi, comment je vais à l'hôpital ?"]}],["Is there <span class=gray>a pharmacy<\/span> near here?","ဒီနားမှာ ဆေးဆိုင် ရှိလား။","When you need any shop of that kind, not one in particular.","Is there a toilet near here?","ဒီနားမှာ အိမ်သာ ရှိလား။",{"es":["¿Hay una farmacia cerca de aquí?","Cuando necesitas cualquier tienda de ese tipo, no una en particular.","¿Hay un baño cerca de aquí?"],"fr":["Il y a une pharmacie près d'ici ?","Quand on cherche n'importe quel commerce de ce genre, pas un en particulier.","Il y a des toilettes près d'ici ?"]}],["Is it far?","ဝေးလား။","Asks about the distance. Also: How far is it?","— The temple is up the hill. — Is it far?","— ဘုရားက တောင်ပေါ်မှာ။ — ဝေးလား။",{"es":["¿Está lejos?","Pregunta por la distancia. También: How far is it?","— El templo está en lo alto de la colina. — ¿Está lejos?"],"fr":["C'est loin ?","Demande la distance. On dit aussi : How far is it?","— Le temple est en haut de la colline. — C'est loin ?"]}],["Can you show me on the map?","မြေပုံပေါ်မှာ ပြပေးလို့ ရမလား။","Useful when the directions are hard to follow. Hold out your phone or map.","Sorry, I don't understand. Can you show me on the map?","ဆောရီး၊ နားမလည်ဘူး။ မြေပုံပေါ်မှာ ပြပေးလို့ ရမလား။",{"es":["¿Me lo puede mostrar en el mapa?","Útil cuando las indicaciones son difíciles de seguir. Muestra tu teléfono o tu mapa.","Perdón, no entiendo. ¿Me lo puede mostrar en el mapa?"],"fr":["Vous pouvez me montrer sur la carte ?","Utile quand les indications sont difficiles à suivre. Tendez votre téléphone ou votre plan.","Désolé, je ne comprends pas. Vous pouvez me montrer sur la carte ?"]}]],"tr":{"es":["Preguntar el camino","Empieza con Excuse me y luego haz tu pregunta."],"fr":["Demander son chemin","Commencez par Excuse me, puis posez votre question."]}},{"en":"Giving directions","my":"လမ်း ညွှန်ခြင်း","desc":"Short commands that tell someone which way to go.","cards":[["Go straight on.","တည့်တည့် သွားပါ။","Keep going forward. American English: Go straight ahead.","Go straight on for about two hundred metres.","မီတာ နှစ်ရာလောက် တည့်တည့် သွားပါ။",{"es":["Siga derecho.","Sigue hacia adelante. En inglés americano: Go straight ahead.","Siga derecho unos doscientos metros."],"fr":["Allez tout droit.","Continuez devant vous. En anglais américain : Go straight ahead.","Allez tout droit sur deux cents mètres environ."]}],["Turn left.","ဘယ်ဘက် ကွေ့ပါ။","Left and right are from the walker's side, not yours. Point to help.","Turn left after the bridge.","တံတားကျော်ရင် ဘယ်ဘက် ကွေ့ပါ။",{"es":["Gire a la izquierda.","Left y right son desde el lado de quien camina, no del tuyo. Señala para ayudar.","Gire a la izquierda después del puente."],"fr":["Tournez à gauche.","Left et right se comptent du point de vue de celui qui marche, pas du vôtre. Montrez du doigt pour aider.","Tournez à gauche après le pont."]}],["Turn right at <span class=gray>the traffic lights<\/span>.","မီးပွိုင့်ကနေ ညာဘက် ကွေ့ပါ။","At + a landmark tells them where to turn.","Turn right at the big tree.","သစ်ပင်ကြီးကနေ ညာဘက် ကွေ့ပါ။",{"es":["Gire a la derecha en el semáforo.","At + un punto de referencia indica dónde girar.","Gire a la derecha en el árbol grande."],"fr":["Tournez à droite aux feux.","At + un point de repère indique où tourner.","Tournez à droite au grand arbre."]}],["Take the second street on the left.","ဘယ်ဘက် ဒုတိယ လမ်းထဲ ဝင်ပါ။","Count the streets: first, second, third.","Take the first street on the right. The shop is there.","ညာဘက် ပထမ လမ်းထဲ ဝင်ပါ။ ဆိုင်က အဲဒီမှာပါ။",{"es":["Tome la segunda calle a la izquierda.","Cuenta las calles: first, second, third.","Tome la primera calle a la derecha. La tienda está ahí."],"fr":["Prenez la deuxième rue à gauche.","Comptez les rues : first, second, third.","Prenez la première rue à droite. Le magasin est là."]}],["Cross the road.","လမ်း ကူးပါ။","Go to the other side. Look both ways first!","Cross the road at the zebra crossing.","လူကူးမျဉ်းကြားမှာ လမ်း ကူးပါ။",{"es":["Cruce la calle.","Pasa al otro lado. ¡Mira primero a los dos lados!","Cruce la calle por el paso de peatones."],"fr":["Traversez la rue.","Passez de l'autre côté. Regardez d'abord des deux côtés !","Traversez la rue au passage piéton."]}],["Go past <span class=gray>the school<\/span>.","ကျောင်းကို ကျော်သွားပါ။","Walk by it without stopping.","Go past the market and turn left.","ဈေးကို ကျော်ပြီး ဘယ်ဘက် ကွေ့ပါ။",{"es":["Pase la escuela.","Pasar por delante sin detenerse.","Pase el mercado y gire a la izquierda."],"fr":["Passez devant l'école.","Passer à côté sans s'arrêter.","Passez devant le marché et tournez à gauche."]}]],"tr":{"es":["Dar indicaciones","Órdenes cortas que le dicen a alguien por dónde ir."],"fr":["Indiquer le chemin","De courtes consignes qui indiquent la direction à prendre."]}},{"en":"Where it is","my":"ဘယ်နေရာမှာ ရှိလဲ","desc":"Describing the place when they get close.","cards":[["It's on your right.","ညာဘက်မှာ ရှိတယ်။","On your left / on your right: which side they will see it.","Walk for two minutes. The library is on your right.","နှစ်မိနစ်လောက် လျှောက်ပါ။ စာကြည့်တိုက်က ညာဘက်မှာ ရှိတယ်။",{"es":["Está a su derecha.","On your left / on your right: de qué lado lo van a ver.","Camine dos minutos. La biblioteca está a su derecha."],"fr":["C'est sur votre droite.","On your left / on your right : de quel côté on le verra.","Marchez deux minutes. La bibliothèque est sur votre droite."]}],["It's next to <span class=gray>the post office<\/span>.","စာတိုက်ဘေးမှာ ရှိတယ်။","Next to = beside, right by.","The bakery is next to the bank.","မုန့်ဆိုင်က ဘဏ်ဘေးမှာ ရှိတယ်။",{"es":["Está al lado del correo.","Next to = junto a, pegado a.","La panadería está al lado del banco."],"fr":["C'est à côté de la poste.","Next to = à côté de, tout près de.","La boulangerie est à côté de la banque."]}],["It's opposite <span class=gray>the market<\/span>.","ဈေးရဲ့ မျက်နှာချင်းဆိုင်မှာ ရှိတယ်။","On the other side of the road, facing it. American English also says across from.","The clinic is opposite the school.","ဆေးခန်းက ကျောင်းရဲ့ မျက်နှာချင်းဆိုင်မှာ ရှိတယ်။",{"es":["Está enfrente del mercado.","Al otro lado de la calle, de frente. En inglés americano también se dice across from.","La clínica está enfrente de la escuela."],"fr":["C'est en face du marché.","De l'autre côté de la rue, en vis-à-vis. L'anglais américain dit aussi across from.","Le dispensaire est en face de l'école."]}],["It's between <span class=gray>the bank and the café<\/span>.","ဘဏ်နဲ့ ကော်ဖီဆိုင် ကြားမှာ ရှိတယ်။","Between + two places, joined with and.","The shoe shop is between the pharmacy and the bookshop.","ဖိနပ်ဆိုင်က ဆေးဆိုင်နဲ့ စာအုပ်ဆိုင် ကြားမှာ ရှိတယ်။",{"es":["Está entre el banco y el café.","Between + dos lugares, unidos con and.","La zapatería está entre la farmacia y la librería."],"fr":["C'est entre la banque et le café.","Between + deux lieux, reliés par and.","Le magasin de chaussures est entre la pharmacie et la librairie."]}],["It's at the end of the street.","လမ်းအဆုံးမှာ ရှိတယ်။","Where the street stops.","Our house is at the end of the street, with a red gate.","ကျွန်တော်တို့ အိမ်က လမ်းအဆုံးမှာ၊ တံခါးနီနဲ့ပါ။",{"es":["Está al final de la calle.","Donde termina la calle.","Nuestra casa está al final de la calle, con un portón rojo."],"fr":["C'est au bout de la rue.","Là où la rue s'arrête.","Notre maison est au bout de la rue, avec un portail rouge."]}],["You can't miss it.","သေချာပေါက် တွေ့မှာပါ။","It's very easy to see. Friendly, at the end of directions.","It's a big yellow building. You can't miss it.","အဝါရောင် အဆောက်အအုံ ကြီးပါ။ သေချာပေါက် တွေ့မှာပါ။",{"es":["No tiene pérdida.","Es muy fácil de ver. Una frase amable al final de las indicaciones.","Es un edificio grande y amarillo. No tiene pérdida."],"fr":["Vous ne pouvez pas le manquer.","C'est très facile à voir. Une formule aimable à la fin des explications.","C'est un grand bâtiment jaune. Vous ne pouvez pas le manquer."]}]],"tr":{"es":["Dónde está","Describir el lugar cuando ya están cerca."],"fr":["Où c'est","Décrire l'endroit quand on s'en approche."]}},{"en":"How far","my":"ဘယ်လောက် ဝေးလဲ","desc":"Saying how near or far, and how long it takes.","cards":[["It's just around the corner.","ဒီနားလေးတင်ပါ။","Very close, maybe just after the next turn.","— Is the shop far? — No, it's just around the corner.","— ဆိုင်က ဝေးလား။ — မဝေးပါဘူး၊ ဒီနားလေးတင်ပါ။",{"es":["Está a la vuelta de la esquina.","Muy cerca, quizá justo después de la próxima vuelta.","— ¿La tienda está lejos? — No, está a la vuelta de la esquina."],"fr":["C'est juste au coin de la rue.","Tout près, peut-être juste après le prochain tournant.","— Le magasin est loin ? — Non, c'est juste au coin de la rue."]}],["It's about five minutes on foot.","လမ်းလျှောက်ရင် ငါးမိနစ်လောက်ပဲ။","On foot = walking. By car, by bus, by bike for other ways.","The beach is about ten minutes by bike.","ကမ်းခြေက စက်ဘီးနဲ့ဆို ဆယ်မိနစ်လောက်ပဲ။",{"es":["Está a unos cinco minutos a pie.","On foot = caminando. By car, by bus, by bike para los otros medios.","La playa está a unos diez minutos en bicicleta."],"fr":["C'est à environ cinq minutes à pied.","On foot = en marchant. By car, by bus, by bike pour les autres moyens.","La plage est à environ dix minutes à vélo."]}],["It's a long way.","တော်တော် ဝေးတယ်။","Too far to walk easily.","It's a long way. You should take a bus.","တော်တော် ဝေးတယ်။ ဘတ်စ်ကား စီးသင့်တယ်။",{"es":["Está lejos.","Demasiado lejos para ir caminando con comodidad.","Está lejos. Mejor tome un autobús."],"fr":["C'est loin.","Trop loin pour y aller facilement à pied.","C'est loin. Vous devriez prendre un bus."]}],["You can walk there.","လမ်းလျှောက်ပြီး သွားလို့ ရတယ်။","It's close enough to walk.","The museum is near. You can walk there.","ပြတိုက်က နီးပါတယ်။ လမ်းလျှောက်ပြီး သွားလို့ ရတယ်။",{"es":["Puede ir caminando.","Está lo bastante cerca para ir a pie.","El museo está cerca. Puede ir caminando."],"fr":["Vous pouvez y aller à pied.","C'est assez près pour marcher.","Le musée est tout près. Vous pouvez y aller à pied."]}]],"tr":{"es":["A qué distancia","Decir qué tan cerca o lejos está, y cuánto se tarda."],"fr":["À quelle distance","Dire si c'est près ou loin, et combien de temps il faut."]}},{"en":"Lost or not sure","my":"လမ်းပျောက်ခြင်း","desc":"When you are lost, or when you can't help.","cards":[["I'm lost.","လမ်း ပျောက်နေတယ်။","You don't know where you are. Ask for help: I'm lost. Can you help me?","Excuse me, I'm lost. Where is the main road?","တဆိတ်လောက်၊ လမ်း ပျောက်နေလို့။ လမ်းမကြီး ဘယ်မှာလဲ။",{"es":["Estoy perdido.","No sabes dónde estás. Pide ayuda: I'm lost. Can you help me?","Disculpe, estoy perdido. ¿Dónde está la avenida principal?"],"fr":["Je suis perdu.","Vous ne savez pas où vous êtes. Demandez de l'aide : I'm lost. Can you help me?","Excusez-moi, je suis perdu. Où est la rue principale ?"]}],["I'm not from around here.","ကျွန်တော်/ကျွန်မ ဒီနားက မဟုတ်ဘူး။","Explains why you don't know the way, or why you're asking.","Sorry, I'm not from around here. Try asking at the shop.","ဆောရီး၊ ဒီနားက မဟုတ်ဘူး။ ဆိုင်မှာ မေးကြည့်ပါ။",{"es":["No soy de por aquí.","Explica por qué no conoces el camino, o por qué preguntas.","Perdón, no soy de por aquí. Pregunte en la tienda."],"fr":["Je ne suis pas d'ici.","Explique pourquoi vous ne connaissez pas le chemin, ou pourquoi vous demandez.","Désolé, je ne suis pas d'ici. Demandez plutôt au magasin."]}],["Sorry, I don't know.","ဆောရီး၊ မသိဘူး။","Honest and polite when someone asks you the way and you can't help.","— Where's the post office? — Sorry, I don't know.","— စာတိုက် ဘယ်မှာလဲ။ — ဆောရီး၊ မသိဘူး။",{"es":["Lo siento, no sé.","Sincero y cortés cuando alguien te pregunta el camino y no puedes ayudar.","— ¿Dónde está el correo? — Lo siento, no sé."],"fr":["Désolé, je ne sais pas.","Honnête et poli quand on vous demande le chemin et que vous ne pouvez pas aider.","— Où est la poste ? — Désolé, je ne sais pas."]}]],"tr":{"es":["Perdido o sin saber","Cuando estás perdido, o cuando no puedes ayudar."],"fr":["Perdu ou pas sûr","Quand on est perdu, ou quand on ne peut pas aider."]}}];const langs=["my","es","fr"];const COURSE="eng";</script>
