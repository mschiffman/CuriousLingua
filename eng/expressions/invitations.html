<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/invitations/";const AUD_EXT="mp3?v=2611170808";const categories=[{"en":"Inviting","my":"ဖိတ်ခေါ်ခြင်း","desc":"Asking someone to come along or do something with you.","cards":[["Are you free on <span class=gray>Saturday<\/span>?","စနေနေ့ အားလား။","A friendly first step before you invite someone. It gives them an easy way to say no.","Are you free on Saturday? We're having a picnic.","စနေနေ့ အားလား။ ပျော်ပွဲစား သွားမလို့။",{"es":["¿Estás libre el sábado?","Un primer paso amistoso antes de invitar a alguien. Le da una salida fácil para decir que no.","¿Estás libre el sábado? Vamos a hacer un picnic."],"fr":["Tu es libre samedi ?","Une première étape amicale avant d'inviter. Cela laisse à l'autre une façon facile de dire non.","Tu es libre samedi ? On fait un pique-nique."],"hi":["क्या आप <span class=gray>शनिवार<\/span> को ख़ाली हैं?","किसी को बुलाने से पहले का दोस्ताना पहला क़दम। उसे ना कहने का आसान रास्ता दे देता है।","क्या तुम शनिवार को ख़ाली हो? हम पिकनिक कर रहे हैं।"],"vi":["<span class=gray>Thứ Bảy<\/span> bạn rảnh không?","Bước đầu thân thiện trước khi mời ai đó. Cho họ một lối dễ dàng để từ chối.","Thứ Bảy bạn rảnh không? Bọn mình đi dã ngoại."]}],["Would you like to come to <span class=gray>my party<\/span>?","ကျွန်တော့်/ကျွန်မ ပါတီကို လာချင်လား။","The polite way to invite: good with anyone. Would you like to + verb.","Would you like to come to my birthday party on Sunday?","တနင်္ဂနွေနေ့ ကျွန်မ မွေးနေ့ပါတီကို လာချင်လား။",{"es":["¿Te gustaría venir a mi fiesta?","La manera cortés de invitar: buena con cualquiera. Would you like to + verbo.","¿Te gustaría venir a mi fiesta de cumpleaños el domingo?"],"fr":["Voudrais-tu venir à ma fête ?","La façon polie d'inviter : convient à tout le monde. Would you like to + verbe.","Voudrais-tu venir à ma fête d'anniversaire dimanche ?"],"hi":["क्या आप <span class=gray>मेरी पार्टी<\/span> में आना चाहेंगे?","न्योता देने का विनम्र तरीक़ा: किसी के भी साथ ठीक। Would you like to + क्रिया।","क्या आप रविवार को मेरी जन्मदिन की पार्टी में आना चाहेंगे?"],"vi":["Bạn có muốn đến <span class=gray>bữa tiệc của mình<\/span> không?","Cách mời lịch sự: dùng với ai cũng được. Would you like to + động từ.","Chủ nhật bạn có muốn đến dự tiệc sinh nhật của mình không?"]}],["Do you want to <span class=gray>see a movie<\/span>?","ရုပ်ရှင် သွားကြည့်ချင်လား။","More casual: with friends and family.","Do you want to play football after school?","ကျောင်းဆင်းရင် ဘောလုံး ကန်ချင်လား။",{"es":["¿Quieres ver una película?","Más informal: con amigos y familia.","¿Quieres jugar fútbol después de la escuela?"],"fr":["Tu veux voir un film ?","Plus familier : entre amis et en famille.","Tu veux jouer au foot après l'école ?"],"hi":["<span class=gray>फ़िल्म देखने<\/span> चलोगे?","ज़्यादा अनौपचारिक: दोस्तों और परिवार के साथ।","स्कूल के बाद फ़ुटबॉल खेलोगे?"],"vi":["Bạn muốn <span class=gray>đi xem phim<\/span> không?","Thân mật hơn: với bạn bè và gia đình.","Tan học bạn muốn chơi bóng đá không?"]}],["Let's <span class=gray>go to the market<\/span>!","ဈေး သွားကြရအောင်။","A suggestion for you and the other person together. Let's + verb, with no to.","It's a sunny day. Let's go to the beach!","နေသာတယ်။ ကမ်းခြေ သွားကြရအောင်။",{"es":["¡Vamos al mercado!","Una propuesta para ti y la otra persona juntos. Let's + verbo, sin to.","Hace sol. ¡Vamos a la playa!"],"fr":["Allons au marché !","Une proposition pour vous et l'autre ensemble. Let's + verbe, sans to.","Il fait beau. Allons à la plage !"],"hi":["चलो <span class=gray>बाज़ार चलते हैं<\/span>!","आप दोनों के साथ मिलकर कुछ करने का सुझाव। Let's + क्रिया, बिना to के।","धूप निकली है। चलो समुद्र-तट चलते हैं!"],"vi":["Mình <span class=gray>đi chợ<\/span> đi!","Một lời rủ cho bạn và người kia cùng làm. Let's + động từ, không có to.","Trời nắng đẹp. Mình đi biển đi!"]}],["Why don't you come over?","အိမ်ကို လာလည်ပါလား။","A warm invitation to your home. Come over means come to my house.","I'm making noodles tonight. Why don't you come over?","ဒီည ခေါက်ဆွဲ ချက်မလို့။ အိမ်ကို လာလည်ပါလား။",{"es":["¿Por qué no vienes a la casa?","Una invitación cálida a tu casa. Come over significa ven a mi casa.","Hoy en la noche voy a hacer fideos. ¿Por qué no vienes a la casa?"],"fr":["Pourquoi tu ne passes pas à la maison ?","Une invitation chaleureuse chez vous. Come over veut dire viens chez moi.","Je fais des nouilles ce soir. Pourquoi tu ne passes pas à la maison ?"],"hi":["घर क्यों नहीं आ जाते?","अपने घर आने का अपनेपन भरा न्योता। Come over का मतलब है मेरे घर आओ।","आज रात मैं नूडल्स बना रहा हूँ। घर क्यों नहीं आ जाते?"],"vi":["Sao bạn không qua nhà mình chơi?","Lời mời thân tình đến nhà bạn. Come over nghĩa là đến nhà mình.","Tối nay mình nấu mì. Sao bạn không qua nhà mình chơi?"]}],["You're welcome to join us.","ကျွန်တော်တို့နဲ့ လိုက်ခဲ့ချင်ရင် ရပါတယ်။","An open, polite invitation with no pressure.","We're going for lunch. You're welcome to join us.","ထမင်း သွားစားမလို့။ လိုက်ခဲ့ချင်ရင် ရပါတယ်။",{"es":["Si quieres, acompáñanos.","Una invitación abierta y cortés, sin presión.","Vamos a comer. Si quieres, acompáñanos."],"fr":["Tu es le bienvenu si tu veux te joindre à nous.","Une invitation ouverte et polie, sans pression.","On va déjeuner. Tu es le bienvenu si tu veux te joindre à nous."],"hi":["आप भी हमारे साथ आ सकते हैं।","खुला और विनम्र न्योता, बिना किसी दबाव के।","हम लंच के लिए जा रहे हैं। आप भी हमारे साथ आ सकते हैं।"],"vi":["Bạn cứ đi cùng bọn mình nhé.","Lời mời cởi mở và lịch sự, không gây áp lực.","Bọn mình đi ăn trưa. Bạn cứ đi cùng bọn mình nhé."]}]],"tr":{"es":["Invitar","Pedirle a alguien que venga o que haga algo contigo."],"fr":["Inviter","Proposer à quelqu'un de venir ou de faire quelque chose avec vous."],"hi":["न्योता देना","किसी से साथ चलने या साथ कुछ करने को कहना।"],"vi":["Mời","Rủ ai đó đi cùng hoặc cùng làm việc gì."]}},{"en":"Saying yes","my":"လက်ခံခြင်း","desc":"Happy ways to accept an invitation.","cards":[["I'd love to!","သိပ်လာချင်တာပေါ့။","The warmest yes. I'd love to = I would love to.","— Would you like to come to the festival? — I'd love to!","— ပွဲတော်ကို လာချင်လား။ — သိပ်လာချင်တာပေါ့။",{"es":["¡Me encantaría!","El sí más cálido. I'd love to = I would love to.","— ¿Te gustaría venir al festival? — ¡Me encantaría!"],"fr":["Avec grand plaisir !","Le oui le plus chaleureux. I'd love to = I would love to.","— Voudrais-tu venir au festival ? — Avec grand plaisir !"],"hi":["ज़रूर, बड़ी ख़ुशी से!","सबसे आत्मीय हाँ। I'd love to = I would love to.","— क्या आप उत्सव में आना चाहेंगे? — ज़रूर, बड़ी ख़ुशी से!"],"vi":["Mình rất muốn!","Lời nhận lời ấm áp nhất. I'd love to = I would love to.","— Bạn có muốn đi lễ hội không? — Mình rất muốn!"]}],["Sounds great!","ကောင်းသားပဲ။","Casual and happy. Also: Sounds good!","— Let's have dinner at my place. — Sounds great!","— ငါ့အိမ်မှာ ညစာ စားကြရအောင်။ — ကောင်းသားပဲ။",{"es":["¡Suena genial!","Informal y alegre. También: Sounds good!","— Cenemos en mi casa. — ¡Suena genial!"],"fr":["Super idée !","Familier et joyeux. On dit aussi : Sounds good!","— Dînons chez moi. — Super idée !"],"hi":["बढ़िया रहेगा!","अनौपचारिक और ख़ुशी भरा। यह भी: Sounds good!","— चलो मेरे घर डिनर करते हैं। — बढ़िया रहेगा!"],"vi":["Nghe tuyệt đấy!","Thân mật và vui vẻ. Cũng có: Sounds good!","— Mình ăn tối ở nhà mình nhé. — Nghe tuyệt đấy!"]}],["Count me in!","ကျွန်တော်/ကျွန်မလည်း ပါမယ်။","Casual: add me to the group. The opposite is Count me out.","— We're playing football on Sunday. — Count me in!","— တနင်္ဂနွေ ဘောလုံး ကန်မလို့။ — ငါလည်း ပါမယ်။",{"es":["¡Cuenta conmigo!","Informal: súmame al grupo. Lo contrario es Count me out.","— Jugamos fútbol el domingo. — ¡Cuenta conmigo!"],"fr":["J'en suis !","Familier : ajoutez-moi au groupe. Le contraire est Count me out.","— On joue au foot dimanche. — J'en suis !"],"hi":["मुझे भी गिन लो!","अनौपचारिक: मुझे भी टोली में शामिल कर लो। उलटा है Count me out.","— हम रविवार को फ़ुटबॉल खेल रहे हैं। — मुझे भी गिन लो!"],"vi":["Tính cả mình nữa nhé!","Thân mật: cho mình tham gia với. Trái nghĩa là Count me out.","— Chủ nhật bọn mình đá bóng. — Tính cả mình nữa nhé!"]}],["Sure, what time?","ရတာပေါ့၊ ဘယ်အချိန်လဲ။","Says yes and moves straight to the plan.","— Do you want to study together? — Sure, what time?","— အတူတူ စာကျက်ချင်လား။ — ရတာပေါ့၊ ဘယ်အချိန်လဲ။",{"es":["Claro, ¿a qué hora?","Dice que sí y pasa directo al plan.","— ¿Quieres que estudiemos juntos? — Claro, ¿a qué hora?"],"fr":["Bien sûr, à quelle heure ?","Dit oui et passe directement à l'organisation.","— Tu veux qu'on révise ensemble ? — Bien sûr, à quelle heure ?"],"hi":["ज़रूर, कितने बजे?","हाँ कहता है और सीधे योजना पर आ जाता है।","— साथ में पढ़ाई करोगे? — ज़रूर, कितने बजे?"],"vi":["Được, mấy giờ?","Đồng ý rồi vào thẳng kế hoạch.","— Bạn muốn học chung không? — Được, mấy giờ?"]}],["I'll be there.","ရောက်အောင် လာခဲ့မယ်။","A promise that you will come.","— The party starts at seven. — Great, I'll be there.","— ပါတီက ခုနစ်နာရီ စမယ်။ — ကောင်းပြီ၊ ရောက်အောင် လာခဲ့မယ်။",{"es":["Ahí estaré.","Una promesa de que vas a ir.","— La fiesta empieza a las siete. — Perfecto, ahí estaré."],"fr":["J'y serai.","Une promesse de venir.","— La fête commence à sept heures. — Parfait, j'y serai."],"hi":["मैं पहुँच जाऊँगा।","वादा कि आप आएँगे।","— पार्टी सात बजे शुरू होगी। — बढ़िया, मैं पहुँच जाऊँगा।"],"vi":["Mình sẽ đến.","Lời hứa rằng bạn sẽ có mặt.","— Bữa tiệc bắt đầu lúc bảy giờ. — Tuyệt, mình sẽ đến."]}]],"tr":{"es":["Decir que sí","Maneras alegres de aceptar una invitación."],"fr":["Dire oui","Des façons joyeuses d'accepter une invitation."],"hi":["हाँ कहना","न्योता स्वीकार करने के ख़ुशी भरे तरीक़े।"],"vi":["Nhận lời","Những cách vui vẻ để nhận lời mời."]}},{"en":"Making the plan","my":"ချိန်းဆိုခြင်း","desc":"Agreeing on the time and the place.","cards":[["What time is good for you?","ဘယ်အချိန် အဆင်ပြေလဲ။","Lets the other person choose. Polite and friendly.","Let's meet tomorrow. What time is good for you?","မနက်ဖြန် တွေ့ကြရအောင်။ ဘယ်အချိန် အဆင်ပြေလဲ။",{"es":["¿A qué hora te queda bien?","Deja que la otra persona elija. Cortés y amistoso.","Nos vemos mañana. ¿A qué hora te queda bien?"],"fr":["Quelle heure t'arrange ?","Laisse l'autre choisir. Poli et amical.","Voyons-nous demain. Quelle heure t'arrange ?"],"hi":["आपके लिए कौन-सा समय ठीक रहेगा?","सामने वाले को चुनने देता है। विनम्र और दोस्ताना।","चलो कल मिलते हैं। तुम्हारे लिए कौन-सा समय ठीक रहेगा?"],"vi":["Mấy giờ thì tiện cho bạn?","Để người kia chọn. Lịch sự và thân thiện.","Mai mình gặp nhau nhé. Mấy giờ thì tiện cho bạn?"]}],["Where shall we meet?","ဘယ်မှာ တွေ့ကြမလဲ။","Asks about the place. Also: Where should we meet?","— Let's go to the cinema. — OK. Where shall we meet?","— ရုပ်ရှင် သွားကြည့်ကြရအောင်။ — အိုကေ။ ဘယ်မှာ တွေ့ကြမလဲ။",{"es":["¿Dónde nos vemos?","Pregunta por el lugar. También: Where should we meet?","— Vamos al cine. — Bueno. ¿Dónde nos vemos?"],"fr":["On se retrouve où ?","Demande le lieu. On dit aussi : Where should we meet?","— Allons au cinéma. — D'accord. On se retrouve où ?"],"hi":["हम कहाँ मिलें?","जगह पूछता है। यह भी: Where should we meet?","— चलो सिनेमा चलते हैं। — ठीक है। हम कहाँ मिलें?"],"vi":["Mình gặp nhau ở đâu?","Hỏi địa điểm. Cũng có: Where should we meet?","— Mình đi xem phim đi. — Được. Mình gặp nhau ở đâu?"]}],["How about <span class=gray>6 o'clock<\/span>?","ခြောက်နာရီ ဆိုရင်ကော။","Suggests a time or a place. How about + time, place or -ing.","— When shall we go? — How about after lunch?","— ဘယ်အချိန် သွားကြမလဲ။ — နေ့လယ်စာ စားပြီးရင်ကော။",{"es":["¿Qué tal a las 6?","Propone una hora o un lugar. How about + hora, lugar o -ing.","— ¿Cuándo vamos? — ¿Qué tal después de comer?"],"fr":["Et si on disait 6 heures ?","Propose une heure ou un lieu. How about + heure, lieu ou -ing.","— On y va quand ? — Et si on disait après le déjeuner ?"],"hi":["<span class=gray>6 बजे<\/span> कैसा रहेगा?","कोई समय या जगह सुझाता है। How about + समय, जगह या -ing.","— हम कब चलें? — लंच के बाद कैसा रहेगा?"],"vi":["<span class=gray>6 giờ<\/span> được không?","Đề nghị một giờ hoặc một địa điểm. How about + giờ, địa điểm hoặc -ing.","— Khi nào mình đi? — Sau bữa trưa được không?"]}],["Let's meet at <span class=gray>the bus stop<\/span>.","ဘတ်စ်ကားမှတ်တိုင်မှာ တွေ့ကြရအောင်။","Fixes the place. At + place: at the gate, at the market, at my house.","Let's meet at the school gate at four.","လေးနာရီ ကျောင်းဂိတ်မှာ တွေ့ကြရအောင်။",{"es":["Nos vemos en la parada del autobús.","Fija el lugar. At + lugar: at the gate, at the market, at my house.","Nos vemos a las cuatro en la entrada de la escuela."],"fr":["Retrouvons-nous à l'arrêt de bus.","Fixe le lieu. At + lieu : at the gate, at the market, at my house.","Retrouvons-nous à quatre heures devant le portail de l'école."],"hi":["चलो <span class=gray>बस स्टॉप<\/span> पर मिलते हैं।","जगह पक्की करता है। At + जगह: at the gate, at the market, at my house.","चलो चार बजे स्कूल के गेट पर मिलते हैं।"],"vi":["Mình gặp nhau ở <span class=gray>trạm xe buýt<\/span> nhé.","Chốt địa điểm. At + địa điểm: at the gate, at the market, at my house.","Bốn giờ mình gặp nhau ở cổng trường nhé."]}],["Does <span class=gray>Friday<\/span> work for you?","သောကြာနေ့ အဆင်ပြေလား။","Asks if a day or time is OK. Work for you means suit you.","Does Friday work for you, or is Saturday better?","သောကြာနေ့ အဆင်ပြေလား၊ စနေနေ့က ပိုအဆင်ပြေလား။",{"es":["¿Te queda bien el viernes?","Pregunta si un día o una hora está bien. Work for you significa convenirte.","¿Te queda bien el viernes, o es mejor el sábado?"],"fr":["Vendredi, ça te va ?","Demande si un jour ou une heure convient. Work for you veut dire te convenir.","Vendredi, ça te va, ou samedi c'est mieux ?"],"hi":["क्या <span class=gray>शुक्रवार<\/span> आपके लिए ठीक रहेगा?","पूछता है कि कोई दिन या समय ठीक है या नहीं। Work for you का मतलब है आपके लिए सुविधाजनक होना।","क्या शुक्रवार तुम्हारे लिए ठीक रहेगा, या शनिवार बेहतर है?"],"vi":["<span class=gray>Thứ Sáu<\/span> có tiện cho bạn không?","Hỏi xem một ngày hay một giờ nào đó có được không. Work for you nghĩa là tiện cho bạn.","Thứ Sáu có tiện cho bạn không, hay thứ Bảy thì hơn?"]}],["Shall I pick you up?","လာကြိုရမလား။","Offers to come and get someone, by car, motorbike or bicycle.","It's a long way. Shall I pick you up at six?","ဝေးတယ်။ ခြောက်နာရီ လာကြိုရမလား။",{"es":["¿Paso por ti?","Ofrece ir a buscar a alguien, en coche, moto o bicicleta.","Está lejos. ¿Paso por ti a las seis?"],"fr":["Je passe te prendre ?","Propose de venir chercher quelqu'un, en voiture, à moto ou à vélo.","C'est loin. Je passe te prendre à six heures ?"],"hi":["मैं आपको लेने आ जाऊँ?","किसी को लेने जाने की पेशकश, कार, बाइक या साइकिल से।","रास्ता लंबा है। मैं छह बजे तुम्हें लेने आ जाऊँ?"],"vi":["Mình qua đón bạn nhé?","Ngỏ ý đến đón ai đó, bằng ô tô, xe máy hoặc xe đạp.","Đường xa đấy. Sáu giờ mình qua đón bạn nhé?"]}]],"tr":{"es":["Hacer el plan","Ponerse de acuerdo en la hora y el lugar."],"fr":["Organiser","Se mettre d'accord sur l'heure et le lieu."],"hi":["योजना बनाना","समय और जगह तय करना।"],"vi":["Lên kế hoạch","Thống nhất giờ và địa điểm."]}},{"en":"Not sure yet","my":"မသေချာသေးတဲ့အခါ","desc":"When you can't say yes or no right away.","cards":[["Can I let you know later?","နောက်မှ ပြောလို့ ရမလား။","Polite: you need time before you answer.","— Are you coming to the wedding? — Can I let you know later?","— မင်္ဂလာဆောင် လာမလား။ — နောက်မှ ပြောလို့ ရမလား။",{"es":["¿Te puedo avisar después?","Cortés: necesitas tiempo antes de responder.","— ¿Vas a venir a la boda? — ¿Te puedo avisar después?"],"fr":["Je peux te dire ça plus tard ?","Poli : il vous faut du temps avant de répondre.","— Tu viens au mariage ? — Je peux te dire ça plus tard ?"],"hi":["क्या मैं आपको बाद में बता सकता हूँ?","विनम्र: जवाब देने से पहले आपको समय चाहिए।","— क्या तुम शादी में आ रहे हो? — क्या मैं तुम्हें बाद में बता सकता हूँ?"],"vi":["Mình báo lại bạn sau được không?","Lịch sự: bạn cần thời gian trước khi trả lời.","— Bạn có đi đám cưới không? — Mình báo lại bạn sau được không?"]}],["I'll get back to you.","နောက်မှ ပြန်ပြောမယ်။","A promise to answer soon. Common at work too.","I'll check with my family and get back to you.","မိသားစုကို မေးပြီး နောက်မှ ပြန်ပြောမယ်။",{"es":["Yo te aviso.","Una promesa de responder pronto. Común también en el trabajo.","Lo veo con mi familia y te aviso."],"fr":["Je te redis ça.","Une promesse de répondre bientôt. Courant aussi au travail.","Je vois avec ma famille et je te redis ça."],"hi":["मैं आपको बताता हूँ।","जल्द जवाब देने का वादा। काम पर भी आम।","मैं घरवालों से पूछकर तुम्हें बताता हूँ।"],"vi":["Mình sẽ báo lại cho bạn.","Lời hứa sẽ sớm trả lời. Ở chỗ làm cũng hay dùng.","Để mình hỏi gia đình rồi báo lại cho bạn."]}],["I need to ask my parents.","မိဘကို အရင် မေးရမယ်။","What children and young people say before they agree to a plan.","— Can you come to the zoo with us? — I need to ask my parents.","— ငါတို့နဲ့ တိရစ္ဆာန်ရုံ လိုက်ခဲ့မလား။ — မိဘကို အရင် မေးရမယ်။",{"es":["Tengo que preguntarles a mis papás.","Lo que dicen los niños y los jóvenes antes de aceptar un plan.","— ¿Puedes venir al zoológico con nosotros? — Tengo que preguntarles a mis papás."],"fr":["Je dois demander à mes parents.","Ce que disent les enfants et les jeunes avant d'accepter un projet.","— Tu peux venir au zoo avec nous ? — Je dois demander à mes parents."],"hi":["मुझे अपने माता-पिता से पूछना होगा।","बच्चे और किशोर किसी योजना के लिए हाँ कहने से पहले यह कहते हैं।","— क्या तुम हमारे साथ चिड़ियाघर चल सकते हो? — मुझे अपने माता-पिता से पूछना होगा।"],"vi":["Mình phải hỏi bố mẹ đã.","Câu trẻ em và thanh thiếu niên nói trước khi nhận lời.","— Bạn đi sở thú với bọn mình được không? — Mình phải hỏi bố mẹ đã."]}],["Let me check my calendar.","ကျွန်တော့်/ကျွန်မ အချိန်ဇယား ကြည့်လိုက်ဦးမယ်။","Checking if you're free that day. People often look at their phone.","Next Tuesday? Let me check my calendar.","နောက်အင်္ဂါနေ့လား။ အချိန်ဇယား ကြည့်လိုက်ဦးမယ်။",{"es":["Déjame revisar mi agenda.","Para ver si estás libre ese día. La gente suele mirar su teléfono.","¿El próximo martes? Déjame revisar mi agenda."],"fr":["Je regarde mon agenda.","Pour voir si vous êtes libre ce jour-là. Les gens regardent souvent leur téléphone.","Mardi prochain ? Je regarde mon agenda."],"hi":["ज़रा अपना कैलेंडर देख लूँ।","यह देखने के लिए कि आप उस दिन ख़ाली हैं या नहीं। लोग अक्सर अपना फ़ोन देखते हैं।","अगले मंगलवार? ज़रा अपना कैलेंडर देख लूँ।"],"vi":["Để mình xem lịch đã.","Để xem hôm đó bạn có rảnh không. Người ta thường xem điện thoại.","Thứ Ba tuần sau à? Để mình xem lịch đã."]}]],"tr":{"es":["Todavía no sé","Cuando no puedes decir que sí o que no de inmediato."],"fr":["Pas encore sûr","Quand on ne peut pas dire oui ou non tout de suite."],"hi":["अभी पक्का नहीं","जब आप तुरंत हाँ या ना न कह सकें।"],"vi":["Chưa chắc","Khi bạn chưa thể trả lời có hay không ngay."]}},{"en":"Changing plans","my":"အစီအစဉ် ပြောင်းခြင်း","desc":"Checking, running late, or cancelling.","cards":[["Are we still on for <span class=gray>tonight<\/span>?","ဒီည ချိန်းထားတာ ဖြစ်တုန်းပဲလား။","Checks that the plan hasn't changed.","Hi! Are we still on for tonight?","ဟိုင်း၊ ဒီည ချိန်းထားတာ ဖြစ်တုန်းပဲလား။",{"es":["¿Sigue en pie lo de hoy en la noche?","Comprueba que el plan no haya cambiado.","¡Hola! ¿Sigue en pie lo de hoy en la noche?"],"fr":["Ça tient toujours pour ce soir ?","Vérifie que le programme n'a pas changé.","Salut ! Ça tient toujours pour ce soir ?"],"hi":["<span class=gray>आज रात<\/span> का प्रोग्राम पक्का है न?","जाँचता है कि योजना बदली तो नहीं।","हाय! आज रात का प्रोग्राम पक्का है न?"],"vi":["<span class=gray>Tối nay<\/span> mình vẫn gặp chứ?","Kiểm tra xem kế hoạch có thay đổi không.","Chào bạn! Tối nay mình vẫn gặp chứ?"]}],["I'm running a bit late.","နည်းနည်း နောက်ကျနေတယ်။","Tells the other person before they start waiting. Say how late: I'll be ten minutes late.","Sorry, I'm running a bit late. See you at ten past.","ဆောရီး၊ နည်းနည်း နောက်ကျနေတယ်။ ဆယ်မိနစ်လောက်ကျရင် တွေ့မယ်။",{"es":["Voy un poco tarde.","Avisa a la otra persona antes de que empiece a esperar. Di cuánto: I'll be ten minutes late.","Perdón, voy un poco tarde. Nos vemos a y diez."],"fr":["J'ai un peu de retard.","Prévient l'autre avant qu'il commence à attendre. Dites de combien : I'll be ten minutes late.","Désolé, j'ai un peu de retard. À dix, alors."],"hi":["मुझे थोड़ी देर हो रही है।","सामने वाले को इंतज़ार शुरू करने से पहले ही बता देता है। कितनी देर, यह भी बताइए: I'll be ten minutes late.","माफ़ करना, मुझे थोड़ी देर हो रही है। दस मिनट में मिलता हूँ।"],"vi":["Mình đến muộn một chút.","Báo cho người kia trước khi họ bắt đầu chờ. Nói rõ muộn bao lâu: I'll be ten minutes late.","Xin lỗi, mình đến muộn một chút. Mười phút nữa gặp nhé."]}],["Something's come up.","အရေးကြီးတာ တစ်ခု ပေါ်လာလို့။","Something unexpected happened, so you can't come. You don't have to explain.","I'm so sorry, something's come up. Can we meet next week?","တကယ် ဆောရီး၊ အရေးကြီးတာ တစ်ခု ပေါ်လာလို့။ နောက်အပတ် တွေ့လို့ ရမလား။",{"es":["Me surgió algo.","Pasó algo inesperado, así que no puedes ir. No tienes que explicar.","Lo siento mucho, me surgió algo. ¿Nos vemos la próxima semana?"],"fr":["J'ai un imprévu.","Il s'est passé quelque chose d'inattendu, donc vous ne pouvez pas venir. Inutile d'expliquer.","Je suis vraiment désolé, j'ai un imprévu. On se voit la semaine prochaine ?"],"hi":["अचानक कुछ काम आ गया है।","कुछ ऐसा हो गया जिसकी उम्मीद नहीं थी, इसलिए आप नहीं आ सकते। समझाना ज़रूरी नहीं।","बहुत माफ़ी चाहता हूँ, अचानक कुछ काम आ गया है। क्या हम अगले हफ़्ते मिल सकते हैं?"],"vi":["Mình có việc đột xuất.","Có chuyện bất ngờ xảy ra nên bạn không đi được. Không cần giải thích.","Xin lỗi nhiều, mình có việc đột xuất. Tuần sau mình gặp được không?"]}],["Sorry, I have to cancel.","ဆောရီး၊ ဖျက်ရတော့မယ်။","Direct but polite. Give a short reason, and suggest another day.","Sorry, I have to cancel. My little brother is sick.","ဆောရီး၊ ဖျက်ရတော့မယ်။ ညီလေး နေမကောင်းဖြစ်နေလို့။",{"es":["Perdón, tengo que cancelar.","Directo pero cortés. Da un motivo corto y propón otro día.","Perdón, tengo que cancelar. Mi hermanito está enfermo."],"fr":["Désolé, je dois annuler.","Direct mais poli. Donnez une raison courte et proposez un autre jour.","Désolé, je dois annuler. Mon petit frère est malade."],"hi":["माफ़ कीजिए, मुझे रद्द करना पड़ेगा।","सीधा पर विनम्र। छोटी-सी वजह बताइए और कोई और दिन सुझाइए।","माफ़ करना, मुझे रद्द करना पड़ेगा। मेरा छोटा भाई बीमार है।"],"vi":["Xin lỗi, mình phải hủy hẹn.","Thẳng nhưng lịch sự. Nêu một lý do ngắn và đề nghị ngày khác.","Xin lỗi, mình phải hủy hẹn. Em trai mình bị ốm."]}],["Can we make it a bit later?","နည်းနည်း နောက်ဆုတ်လို့ ရမလား။","Moves the time, not the day. The opposite: Can we make it earlier?","Can we make it a bit later? Seven instead of six?","နည်းနည်း နောက်ဆုတ်လို့ ရမလား။ ခြောက်နာရီအစား ခုနစ်နာရီ ဆိုရင်ကော။",{"es":["¿Lo podemos dejar un poco más tarde?","Cambia la hora, no el día. Lo contrario: Can we make it earlier?","¿Lo podemos dejar un poco más tarde? ¿A las siete en vez de a las seis?"],"fr":["On peut faire ça un peu plus tard ?","Déplace l'heure, pas le jour. Le contraire : Can we make it earlier?","On peut faire ça un peu plus tard ? Sept heures au lieu de six ?"],"hi":["क्या हम थोड़ा बाद का समय रख सकते हैं?","समय बदलता है, दिन नहीं। उलटा: Can we make it earlier?","क्या हम थोड़ा बाद का समय रख सकते हैं? छह की जगह सात?"],"vi":["Mình lùi lại muộn hơn một chút được không?","Đổi giờ, không đổi ngày. Trái nghĩa: Can we make it earlier?","Mình lùi lại muộn hơn một chút được không? Bảy giờ thay vì sáu giờ?"]}]],"tr":{"es":["Cambiar de planes","Confirmar, llegar tarde o cancelar."],"fr":["Changer de programme","Vérifier, être en retard ou annuler."],"hi":["योजना बदलना","पक्का करना, देर होना, या रद्द करना।"],"vi":["Đổi kế hoạch","Hỏi lại, đến muộn, hoặc hủy."]}},{"en":"Before and after","my":"မတွေ့ခင်နဲ့ တွေ့ပြီးနောက်","desc":"Finishing the plan, and thanking afterwards.","cards":[["See you there!","အဲဒီမှာ တွေ့မယ်နော်။","When you will meet at the place, not before.","OK, the park at four. See you there!","အိုကေ၊ လေးနာရီ ပန်းခြံမှာ။ အဲဒီမှာ တွေ့မယ်နော်။",{"es":["¡Nos vemos allá!","Cuando se van a encontrar en el lugar, no antes.","Bueno, en el parque a las cuatro. ¡Nos vemos allá!"],"fr":["On se voit là-bas !","Quand vous vous retrouverez sur place, pas avant.","D'accord, au parc à quatre heures. On se voit là-bas !"],"hi":["वहीं मिलते हैं!","जब आप उसी जगह मिलने वाले हों, उससे पहले नहीं।","ठीक है, चार बजे पार्क में। वहीं मिलते हैं!"],"vi":["Hẹn gặp ở đó nhé!","Khi hai người sẽ gặp nhau tại chỗ, không gặp trước.","Được, bốn giờ ở công viên. Hẹn gặp ở đó nhé!"]}],["Don't be late!","နောက်မကျနဲ့နော်။","Friendly with friends and family. With adults you don't know well, it can sound bossy.","The bus leaves at eight. Don't be late!","ဘတ်စ်ကားက ရှစ်နာရီ ထွက်မယ်။ နောက်မကျနဲ့နော်။",{"es":["¡No llegues tarde!","Amistoso con amigos y familia. Con adultos que no conoces bien, puede sonar mandón.","El autobús sale a las ocho. ¡No llegues tarde!"],"fr":["Ne sois pas en retard !","Amical entre amis et en famille. Avec des adultes que vous connaissez peu, cela peut sembler autoritaire.","Le bus part à huit heures. Ne sois pas en retard !"],"hi":["देर मत करना!","दोस्तों और परिवार के साथ दोस्ताना। जिन बड़ों को आप ठीक से नहीं जानते, उनके साथ हुक्म जैसा लग सकता है।","बस आठ बजे निकलती है। देर मत करना!"],"vi":["Đừng đến muộn nhé!","Thân thiện với bạn bè và gia đình. Với người lớn bạn chưa quen thân, câu này có thể nghe như ra lệnh.","Xe buýt chạy lúc tám giờ. Đừng đến muộn nhé!"]}],["Thanks for inviting me.","ဖိတ်တဲ့အတွက် ကျေးဇူးပါ။","Said when you accept, and again when you leave.","Thanks for inviting me. I had a lovely time.","ဖိတ်တဲ့အတွက် ကျေးဇူးပါ။ အရမ်း ပျော်ခဲ့တယ်။",{"es":["Gracias por invitarme.","Se dice al aceptar, y otra vez al irse.","Gracias por invitarme. La pasé muy bien."],"fr":["Merci de m'avoir invité.","Se dit en acceptant, puis à nouveau en partant.","Merci de m'avoir invité. J'ai passé un très bon moment."],"hi":["बुलाने के लिए शुक्रिया।","न्योता स्वीकार करते समय कहा जाता है, और जाते समय फिर।","बुलाने के लिए शुक्रिया। मुझे बहुत अच्छा लगा।"],"vi":["Cảm ơn bạn đã mời mình.","Nói khi nhận lời, và nói lần nữa lúc ra về.","Cảm ơn bạn đã mời mình. Mình đã rất vui."]}],["I had a great time!","အရမ်း ပျော်ခဲ့တယ်။","Said at the end, or in a message the next day. Had, because it is finished.","Thank you for the party. I had a great time!","ပါတီအတွက် ကျေးဇူးပါ။ အရမ်း ပျော်ခဲ့တယ်။",{"es":["¡La pasé muy bien!","Se dice al final, o en un mensaje al día siguiente. Had, porque ya terminó.","Gracias por la fiesta. ¡La pasé muy bien!"],"fr":["J'ai passé un super moment !","Se dit à la fin, ou dans un message le lendemain. Had, parce que c'est terminé.","Merci pour la fête. J'ai passé un super moment !"],"hi":["मुझे बहुत मज़ा आया!","अंत में कहा जाता है, या अगले दिन संदेश में। Had, क्योंकि बात हो चुकी है।","पार्टी के लिए शुक्रिया। मुझे बहुत मज़ा आया!"],"vi":["Mình đã rất vui!","Nói lúc cuối buổi, hoặc trong tin nhắn ngày hôm sau. Dùng had vì chuyện đã qua.","Cảm ơn vì bữa tiệc. Mình đã rất vui!"]}],["We should do this again!","နောက်လည်း ဒီလို ထပ်လုပ်ကြရအောင်။","A warm way to end: you'd like to meet again.","That was so much fun. We should do this again!","အရမ်း ပျော်ဖို့ ကောင်းတယ်။ နောက်လည်း ဒီလို ထပ်လုပ်ကြရအောင်။",{"es":["¡Hay que repetirlo!","Una manera cálida de terminar: te gustaría volver a verse.","Estuvo muy divertido. ¡Hay que repetirlo!"],"fr":["Il faut qu'on refasse ça !","Une façon chaleureuse de conclure : vous aimeriez vous revoir.","C'était vraiment sympa. Il faut qu'on refasse ça !"],"hi":["हमें यह फिर करना चाहिए!","बात ख़त्म करने का आत्मीय तरीक़ा: आप फिर मिलना चाहेंगे।","बहुत मज़ा आया। हमें यह फिर करना चाहिए!"],"vi":["Hôm nào mình làm lại nhé!","Một cách kết thúc ấm áp: bạn muốn gặp lại nhau.","Vui quá. Hôm nào mình làm lại nhé!"]}]],"tr":{"es":["Antes y después","Cerrar el plan y dar las gracias después."],"fr":["Avant et après","Conclure l'organisation, et remercier ensuite."],"hi":["पहले और बाद में","योजना पूरी करना, और बाद में धन्यवाद कहना।"],"vi":["Trước và sau","Chốt kế hoạch, và cảm ơn sau đó."]}}];const langs=["my","es","fr","hi","vi"];const COURSE="eng";<
