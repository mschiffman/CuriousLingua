<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/not_understanding/";const AUD_EXT="mp3?v=2611101416";const categories=[{"en":"Asking someone to repeat","my":"ထပ်ပြောခိုင်းခြင်း","desc":"When you didn't hear or didn't catch the words.","cards":[["Sorry?","ဗျာ။ / ရှင်။","The quickest polite way to ask someone to repeat. Let your voice go up. Just What? can sound rude.","— The meeting is at three. — Sorry? — The meeting is at three o'clock.","— အစည်းအဝေးက သုံးနာရီမှာ။ — ဗျာ။ — အစည်းအဝေးက သုံးနာရီထိုးမှာပါ။",{"es":["¿Perdón?","La manera cortés más rápida de pedir que repitan. Deja que la voz suba. Decir solo What? puede sonar grosero.","— La reunión es a las tres. — ¿Perdón? — La reunión es a las tres en punto."],"fr":["Pardon ?","La façon polie la plus rapide de faire répéter. Laissez la voix monter. What? tout seul peut sembler impoli.","— La réunion est à trois heures. — Pardon ? — La réunion est à trois heures pile."],"hi":["माफ़ कीजिए?","दोबारा कहलवाने का सबसे छोटा विनम्र तरीक़ा। आवाज़ ऊपर उठने दीजिए। सिर्फ़ What? कहना रूखा लग सकता है।","— मीटिंग तीन बजे है। — माफ़ कीजिए? — मीटिंग तीन बजे है।"],"vi":["Xin lỗi?","Cách lịch sự và nhanh nhất để nhờ nhắc lại. Để giọng lên cao. Chỉ nói What? có thể nghe thô lỗ.","— Cuộc họp lúc ba giờ. — Xin lỗi? — Cuộc họp lúc ba giờ."]}],["Pardon?","ဗျာ။ / ရှင်။","Polite and a little formal. Americans also say Pardon me?","— Your number, please? — Pardon? — Your phone number, please.","— နံပါတ်လေး ပေးပါ။ — ရှင်။ — ဖုန်းနံပါတ်လေး ပေးပါ။",{"es":["¿Cómo dice?","Cortés y un poco formal. Los estadounidenses también dicen Pardon me?","— ¿Su número, por favor? — ¿Cómo dice? — Su número de teléfono, por favor."],"fr":["Comment ?","Poli et un peu formel. Les Américains disent aussi Pardon me?","— Votre numéro, s'il vous plaît ? — Comment ? — Votre numéro de téléphone, s'il vous plaît."],"hi":["जी?","विनम्र और थोड़ा औपचारिक। अमेरिकी Pardon me? भी कहते हैं।","— आपका नंबर बताइए? — जी? — आपका फ़ोन नंबर बताइए।"],"vi":["Dạ, sao ạ?","Lịch sự và hơi trang trọng. Người Mỹ cũng nói Pardon me?","— Xin cho biết số của anh? — Dạ, sao ạ? — Số điện thoại của anh ạ."]}],["Can you say that again?","ထပ်ပြောပေးပါဦး။","Clear and polite. More polite: Could you say that again, please? Also: Can you repeat that?","Sorry, can you say that again? The train is very loud.","ဆောရီး၊ ထပ်ပြောပေးပါဦး။ ရထားသံ အရမ်းကျယ်နေလို့။",{"es":["¿Puedes repetirlo?","Claro y cortés. Más cortés: Could you say that again, please? También: Can you repeat that?","Perdón, ¿puedes repetirlo? El tren hace mucho ruido."],"fr":["Tu peux répéter ?","Clair et poli. Plus poli : Could you say that again, please? On dit aussi : Can you repeat that?","Pardon, tu peux répéter ? Le train fait beaucoup de bruit."],"hi":["क्या आप फिर से कह सकते हैं?","साफ़ और विनम्र। ज़्यादा विनम्र: Could you say that again, please? यह भी: Can you repeat that?","माफ़ कीजिए, क्या आप फिर से कह सकते हैं? ट्रेन का शोर बहुत है।"],"vi":["Bạn nói lại được không?","Rõ ràng và lịch sự. Lịch sự hơn: Could you say that again, please? Cũng có: Can you repeat that?","Xin lỗi, bạn nói lại được không? Tàu ồn quá."]}],["Sorry, I didn't catch that.","ဆောရီး၊ မကြားလိုက်ဘူး။","Catch here means hear clearly. Natural and polite, and very common on the phone.","Sorry, I didn't catch your name.","ဆောရီး၊ နာမည် မကြားလိုက်ဘူး။",{"es":["Perdón, no alcancé a oír.","Catch aquí significa oír con claridad. Natural y cortés, y muy común por teléfono.","Perdón, no alcancé a oír su nombre."],"fr":["Pardon, je n'ai pas bien saisi.","Catch veut dire ici entendre clairement. Naturel et poli, et très courant au téléphone.","Pardon, je n'ai pas bien saisi votre nom."],"hi":["माफ़ कीजिए, मैं सुन नहीं पाया।","यहाँ catch का मतलब है साफ़ सुन पाना। सहज और विनम्र, और फ़ोन पर बहुत आम।","माफ़ कीजिए, मैं आपका नाम सुन नहीं पाया।"],"vi":["Xin lỗi, mình nghe không kịp.","Catch ở đây nghĩa là nghe rõ. Tự nhiên và lịch sự, rất hay dùng khi nói điện thoại.","Xin lỗi, tôi nghe không kịp tên anh."]}],["What did you say?","ဘာပြောလိုက်တာလဲ။","Fine with friends. With strangers, start with Sorry: Sorry, what did you say? Said sharply, it can sound angry.","Sorry, what did you say? The music is too loud.","ဆောရီး၊ ဘာပြောလိုက်တာလဲ။ သီချင်းသံ ကျယ်လွန်းလို့။",{"es":["¿Qué dijiste?","Está bien con amigos. Con desconocidos, empieza con Sorry: Sorry, what did you say? Dicho con brusquedad, puede sonar enojado.","Perdón, ¿qué dijiste? La música está muy fuerte."],"fr":["Qu'est-ce que tu as dit ?","Bien entre amis. Avec des inconnus, commencez par Sorry : Sorry, what did you say? Dit sèchement, cela peut sembler fâché.","Pardon, qu'est-ce que tu as dit ? La musique est trop forte."],"hi":["आपने क्या कहा?","दोस्तों के साथ ठीक है। अजनबियों के साथ Sorry से शुरू कीजिए: Sorry, what did you say? तीखे लहजे में कहने पर ग़ुस्से जैसा लग सकता है।","माफ़ कीजिए, आपने क्या कहा? संगीत बहुत तेज़ है।"],"vi":["Bạn vừa nói gì?","Dùng với bạn bè thì được. Với người lạ, hãy mở đầu bằng Sorry: Sorry, what did you say? Nói cộc lốc thì có thể nghe như đang giận.","Xin lỗi, bạn vừa nói gì? Nhạc to quá."]}]],"tr":{"es":["Pedir que repitan","Cuando no oíste o no alcanzaste a captar las palabras."],"fr":["Faire répéter","Quand on n'a pas entendu ou pas saisi les mots."],"hi":["दोबारा कहने को कहना","जब आपने सुना नहीं या शब्द पकड़ में नहीं आए।"],"vi":["Nhờ nhắc lại","Khi bạn không nghe thấy hoặc không nghe kịp."]}},{"en":"Slower, louder, clearer","my":"ဖြည်းဖြည်း၊ ကျယ်ကျယ်၊ ရှင်းရှင်း","desc":"Asking people to help you understand them.","cards":[["Can you speak more slowly, please?","ဖြည်းဖြည်း ပြောပေးပါ။","Native speakers often forget to slow down. It is normal to ask, and most people are happy to help. Short: Slowly, please.","Sorry, can you speak more slowly, please?","ဆောရီး၊ ဖြည်းဖြည်း ပြောပေးပါ။",{"es":["¿Puede hablar más despacio, por favor?","Los hablantes nativos suelen olvidar hablar más despacio. Es normal pedirlo, y casi todos ayudan con gusto. Corto: Slowly, please.","Perdón, ¿puede hablar más despacio, por favor?"],"fr":["Pouvez-vous parler plus lentement, s'il vous plaît ?","Les locuteurs natifs oublient souvent de ralentir. Il est normal de le demander, et la plupart des gens aident volontiers. En bref : Slowly, please.","Pardon, pouvez-vous parler plus lentement, s'il vous plaît ?"],"hi":["क्या आप ज़रा धीरे बोल सकते हैं?","जिनकी मातृभाषा अंग्रेज़ी है, वे अक्सर धीरे बोलना भूल जाते हैं। यह कहना सामान्य है, और लगभग सभी ख़ुशी से मदद करते हैं। छोटा रूप: Slowly, please.","माफ़ कीजिए, क्या आप ज़रा धीरे बोल सकते हैं?"],"vi":["Bạn nói chậm hơn được không?","Người bản ngữ hay quên nói chậm lại. Nhờ như vậy là bình thường, và hầu như ai cũng vui lòng giúp. Ngắn gọn: Slowly, please.","Xin lỗi, bạn nói chậm hơn được không?"]}],["Can you speak up a little?","နည်းနည်း ကျယ်ကျယ် ပြောပေးပါ။","Speak up means speak louder. Also: Can you speak a little louder?","Sorry, can you speak up a little? I can't hear you.","ဆောရီး၊ နည်းနည်း ကျယ်ကျယ် ပြောပေးပါ။ မကြားရဘူး။",{"es":["¿Puede hablar un poco más fuerte?","Speak up significa hablar más fuerte. También: Can you speak a little louder?","Perdón, ¿puede hablar un poco más fuerte? No lo oigo."],"fr":["Pouvez-vous parler un peu plus fort ?","Speak up veut dire parler plus fort. On dit aussi : Can you speak a little louder?","Pardon, pouvez-vous parler un peu plus fort ? Je ne vous entends pas."],"hi":["क्या आप थोड़ा ज़ोर से बोल सकते हैं?","Speak up का मतलब है ज़ोर से बोलना। यह भी: Can you speak a little louder?","माफ़ कीजिए, क्या आप थोड़ा ज़ोर से बोल सकते हैं? मुझे सुनाई नहीं दे रहा।"],"vi":["Bạn nói to hơn một chút được không?","Speak up nghĩa là nói to hơn. Cũng có: Can you speak a little louder?","Xin lỗi, bạn nói to hơn một chút được không? Mình không nghe thấy."]}],["Can you spell that, please?","စာလုံးပေါင်း ပြောပြပေးပါ။","For names, streets and email addresses. Knowing the letter names in English really helps here.","— My last name is Kowalski. — Can you spell that, please?","— ကျွန်တော့် မျိုးရိုးအမည်က ကိုဝါလ်စကီးပါ။ — စာလုံးပေါင်း ပြောပြပေးပါ။",{"es":["¿Lo puede deletrear, por favor?","Para nombres, calles y correos electrónicos. Saber los nombres de las letras en inglés ayuda mucho aquí.","— Mi apellido es Kowalski. — ¿Lo puede deletrear, por favor?"],"fr":["Pouvez-vous l'épeler, s'il vous plaît ?","Pour les noms, les rues et les adresses électroniques. Connaître le nom des lettres en anglais aide beaucoup ici.","— Mon nom de famille est Kowalski. — Pouvez-vous l'épeler, s'il vous plaît ?"],"hi":["क्या आप इसकी स्पेलिंग बता सकते हैं?","नामों, सड़कों और ईमेल पतों के लिए। यहाँ अंग्रेज़ी अक्षरों के नाम जानना बहुत काम आता है।","— मेरा उपनाम Kowalski है। — क्या आप इसकी स्पेलिंग बता सकते हैं?"],"vi":["Bạn đánh vần giúp được không?","Dùng cho tên người, tên đường và địa chỉ email. Biết tên các chữ cái tiếng Anh sẽ giúp ích rất nhiều ở đây.","— Họ của tôi là Kowalski. — Anh đánh vần giúp được không?"]}],["Can you write it down, please?","ချရေးပေးပါ။","When a word or number is hard to hear: addresses, prices, times. Also: Can you type it for me?","This address is hard for me. Can you write it down, please?","ဒီလိပ်စာက ကျွန်တော့်အတွက် ခက်တယ်။ ချရေးပေးပါ။",{"es":["¿Lo puede escribir, por favor?","Cuando una palabra o un número es difícil de oír: direcciones, precios, horas. También: Can you type it for me?","Esta dirección es difícil para mí. ¿La puede escribir, por favor?"],"fr":["Pouvez-vous l'écrire, s'il vous plaît ?","Quand un mot ou un nombre est difficile à entendre : adresses, prix, heures. On dit aussi : Can you type it for me?","Cette adresse est difficile pour moi. Pouvez-vous l'écrire, s'il vous plaît ?"],"hi":["क्या आप इसे लिखकर दे सकते हैं?","जब कोई शब्द या संख्या सुनने में मुश्किल हो: पते, दाम, समय। यह भी: Can you type it for me?","यह पता मेरे लिए मुश्किल है। क्या आप इसे लिखकर दे सकते हैं?"],"vi":["Bạn viết ra giúp được không?","Khi một từ hay con số khó nghe: địa chỉ, giá tiền, giờ giấc. Cũng có: Can you type it for me?","Địa chỉ này khó với tôi quá. Bạn viết ra giúp được không?"]}],["Can you show me?","ပြပေးပါ။","When showing is easier than words: on a map, on a phone, on a menu.","I don't know that street. Can you show me on the map?","အဲဒီလမ်း မသိဘူး။ မြေပုံမှာ ပြပေးပါ။",{"es":["¿Me lo puede mostrar?","Cuando mostrar es más fácil que explicar: en un mapa, en un teléfono, en un menú.","No conozco esa calle. ¿Me la puede mostrar en el mapa?"],"fr":["Pouvez-vous me montrer ?","Quand montrer est plus simple que parler : sur une carte, un téléphone, un menu.","Je ne connais pas cette rue. Pouvez-vous me la montrer sur la carte ?"],"hi":["क्या आप मुझे दिखा सकते हैं?","जब समझाने से दिखाना आसान हो: नक़्शे पर, फ़ोन पर, मेन्यू में।","मैं वह सड़क नहीं जानता। क्या आप मुझे नक़्शे पर दिखा सकते हैं?"],"vi":["Bạn chỉ cho mình được không?","Khi chỉ thì dễ hơn giải thích: trên bản đồ, trên điện thoại, trong thực đơn.","Mình không biết đường đó. Bạn chỉ cho mình trên bản đồ được không?"]}]],"tr":{"es":["Más despacio, más fuerte, más claro","Pedirle a la gente que te ayude a entenderla."],"fr":["Plus lentement, plus fort, plus clairement","Demander aux gens de vous aider à les comprendre."],"hi":["धीरे, ज़ोर से, साफ़","लोगों से कहना कि वे आपको समझने में मदद करें।"],"vi":["Chậm hơn, to hơn, rõ hơn","Nhờ người khác giúp bạn hiểu họ."]}},{"en":"I don't understand","my":"နားမလည်တဲ့အခါ","desc":"When you hear the words but don't get the meaning.","cards":[["Sorry, I don't understand.","ဆောရီး၊ နားမလည်ဘူး။","Say it! Nodding when you don't understand causes bigger problems later. In English, saying it is normal, not rude. Not the same as I don't know, which is about facts.","Sorry, I don't understand. Can you explain again?","ဆောရီး၊ နားမလည်ဘူး။ ထပ်ရှင်းပြပေးပါ။",{"es":["Perdón, no entiendo.","¡Dilo! Asentir cuando no entiendes causa problemas más grandes después. En inglés, decirlo es normal, no grosero. No es lo mismo que I don't know, que se refiere a hechos.","Perdón, no entiendo. ¿Me lo puede explicar otra vez?"],"fr":["Pardon, je ne comprends pas.","Dites-le ! Hocher la tête sans comprendre crée de plus gros problèmes ensuite. En anglais, le dire est normal, pas impoli. Ce n'est pas la même chose que I don't know, qui concerne les faits.","Pardon, je ne comprends pas. Pouvez-vous réexpliquer ?"],"hi":["माफ़ कीजिए, मुझे समझ नहीं आया।","कह दीजिए! बिना समझे सिर हिलाने से बाद में बड़ी दिक़्क़तें होती हैं। अंग्रेज़ी में यह कहना सामान्य है, बदतमीज़ी नहीं। यह I don't know से अलग है, जो जानकारी के बारे में है।","माफ़ कीजिए, मुझे समझ नहीं आया। क्या आप फिर से समझा सकते हैं?"],"vi":["Xin lỗi, mình không hiểu.","Hãy nói ra! Gật đầu khi không hiểu sẽ gây rắc rối lớn hơn về sau. Trong tiếng Anh, nói vậy là bình thường, không hề thô lỗ. Câu này khác I don't know, vốn dùng để nói về thông tin, sự việc.","Xin lỗi, mình không hiểu. Bạn giải thích lại được không?"]}],["I don't get it.","သဘောမပေါက်ဘူး။","Casual and very common. Get here means understand. Use it for an idea, a rule or a joke, not for words you didn't hear. The opposite of Got it.","I don't get it. It doesn't make sense.","သဘောမပေါက်ဘူး။ ယုတ္တိမရှိဘူး။","Sorry, I don't get the joke.","ဆောရီး၊ ဟာသကို သဘောမပေါက်ဘူး။",{"es":["No lo capto.","Informal y muy común. Get aquí significa entender. Úsalo para una idea, una regla o un chiste, no para palabras que no oíste. Lo contrario de Got it.","No lo capto. No tiene sentido.","Perdón, no entiendo el chiste."],"fr":["Je ne pige pas.","Familier et très courant. Get veut dire ici comprendre. À employer pour une idée, une règle ou une blague, pas pour des mots que vous n'avez pas entendus. Le contraire de Got it.","Je ne pige pas. Ça n'a pas de sens.","Désolé, je ne comprends pas la blague."],"hi":["मेरे पल्ले नहीं पड़ा।","अनौपचारिक और बहुत आम। यहाँ get का मतलब है समझना। किसी विचार, नियम या चुटकुले के लिए, उन शब्दों के लिए नहीं जो सुनाई नहीं दिए। Got it. का उलटा।","मेरे पल्ले नहीं पड़ा। इसका कोई तुक नहीं बनता।","माफ़ करना, चुटकुला मेरे पल्ले नहीं पड़ा।"],"vi":["Mình chịu, không hiểu.","Thân mật và rất phổ biến. Get ở đây nghĩa là hiểu. Dùng cho một ý, một quy tắc hay một câu đùa, không dùng cho những từ bạn không nghe thấy. Trái nghĩa với Got it.","Mình không hiểu. Chẳng hợp lý gì cả.","Xin lỗi, mình không hiểu câu đùa đó."]}],["What does <span class=gray>it<\/span> mean?","အဲဒါ ဘာအဓိပ္ပာယ်လဲ။","Ask about one word. Not: What is mean ___? Correct: What does it mean?","What does deadline mean?","deadline ဆိုတာ ဘာအဓိပ္ပာယ်လဲ။",{"es":["¿Qué significa?","Para preguntar por una palabra. No: What is mean ___? Lo correcto: What does it mean?","¿Qué significa deadline?"],"fr":["Qu'est-ce que ça veut dire ?","Pour demander le sens d'un mot. Pas : What is mean ___? Correct : What does it mean?","Que veut dire deadline ?"],"hi":["<span class=gray>इस<\/span>का क्या मतलब है?","किसी शब्द के बारे में पूछने के लिए। ग़लत: What is mean ___? सही: What does it mean?","deadline का क्या मतलब है?"],"vi":["<span class=gray>Nó<\/span> nghĩa là gì?","Để hỏi về một từ. Không nói: What is mean ___? Câu đúng: What does it mean?","Deadline nghĩa là gì?"]}],["What do you mean?","ဘာကိုဆိုလိုတာလဲ။","You know the words, but not the idea. Careful with your voice: said sharply, it sounds like an argument.","— Bring something for the party. — What do you mean? Food or drinks?","— ပါတီအတွက် တစ်ခုခု ယူလာခဲ့။ — ဘာကိုဆိုလိုတာလဲ။ စားစရာလား၊ သောက်စရာလား။",{"es":["¿Qué quieres decir?","Conoces las palabras, pero no la idea. Cuidado con la voz: dicho con brusquedad, suena a discusión.","— Trae algo para la fiesta. — ¿Qué quieres decir? ¿Comida o bebidas?"],"fr":["Qu'est-ce que tu veux dire ?","Vous connaissez les mots, mais pas l'idée. Attention au ton : dit sèchement, on croirait une dispute.","— Apporte quelque chose pour la fête. — Qu'est-ce que tu veux dire ? À manger ou à boire ?"],"hi":["आपका क्या मतलब है?","शब्द आप जानते हैं, पर बात समझ नहीं आई। आवाज़ का ध्यान रखिए: तीखे लहजे में यह बहस जैसा लगता है।","— पार्टी के लिए कुछ ले आना। — क्या मतलब? खाना या पीने की चीज़ें?"],"vi":["Ý bạn là sao?","Bạn hiểu từng từ, nhưng không hiểu ý. Chú ý giọng nói: nói cộc lốc thì nghe như cãi nhau.","— Mang gì đó đến bữa tiệc nhé. — Ý bạn là sao? Đồ ăn hay đồ uống?"]}],["I'm not sure what you mean.","ဘာကိုဆိုလိုမှန်း သေချာ မသိဘူး။","A softer, more polite What do you mean? Good at work.","Sorry, I'm not sure what you mean. Do you need it today or tomorrow?","ဆောရီး၊ ဘာကိုဆိုလိုမှန်း သေချာမသိဘူး။ ဒီနေ့ လိုတာလား၊ မနက်ဖြန်လား။",{"es":["No estoy seguro de entenderle.","Un What do you mean? más suave y más cortés. Bueno en el trabajo.","Perdón, no estoy seguro de entenderle. ¿Lo necesita hoy o mañana?"],"fr":["Je ne suis pas sûr de comprendre.","Un What do you mean? plus doux et plus poli. Bien au travail.","Pardon, je ne suis pas sûr de comprendre. Vous en avez besoin aujourd'hui ou demain ?"],"hi":["मैं ठीक से समझा नहीं कि आपका मतलब क्या है।","What do you mean? का नरम और ज़्यादा विनम्र रूप। काम पर अच्छा है।","माफ़ कीजिए, मैं ठीक से समझा नहीं। आपको यह आज चाहिए या कल?"],"vi":["Mình chưa rõ ý bạn lắm.","Một câu What do you mean? nhẹ nhàng và lịch sự hơn. Hợp với nơi làm việc.","Xin lỗi, tôi chưa rõ ý anh lắm. Anh cần hôm nay hay ngày mai?"]}],["Can you explain that?","အဲဒါ ရှင်းပြပေးပါ။","For a longer idea or instructions. Softer: Could you explain that another way?","Can you explain that? I've never used this machine before.","အဲဒါ ရှင်းပြပေးပါ။ ဒီစက်ကို တစ်ခါမှ မသုံးဖူးလို့ပါ။",{"es":["¿Me lo puede explicar?","Para una idea más larga o unas instrucciones. Más suave: Could you explain that another way?","¿Me lo puede explicar? Nunca he usado esta máquina."],"fr":["Pouvez-vous m'expliquer ?","Pour une idée plus longue ou des consignes. Plus doux : Could you explain that another way?","Pouvez-vous m'expliquer ? Je n'ai jamais utilisé cette machine."],"hi":["क्या आप यह समझा सकते हैं?","किसी लंबी बात या निर्देशों के लिए। ज़्यादा नरम: Could you explain that another way?","क्या आप यह समझा सकते हैं? मैंने यह मशीन पहले कभी नहीं चलाई।"],"vi":["Bạn giải thích giúp được không?","Dùng cho một ý dài hơn hoặc một lời hướng dẫn. Nhẹ nhàng hơn: Could you explain that another way?","Bạn giải thích giúp được không? Mình chưa dùng máy này bao giờ."]}]],"tr":{"es":["No entiendo","Cuando oyes las palabras pero no captas el significado."],"fr":["Je ne comprends pas","Quand on entend les mots sans en saisir le sens."],"hi":["मुझे समझ नहीं आया","जब शब्द तो सुनाई दें, पर मतलब समझ न आए।"],"vi":["Mình không hiểu","Khi bạn nghe được từ nhưng không hiểu nghĩa."]}},{"en":"Checking you understood","my":"မှန်မမှန် စစ်ကြည့်ခြင်း","desc":"Saying back what you heard, so you know you got it right.","cards":[["Do you mean <span class=gray>oranges<\/span>?","လိမ်မော်သီး ကို ပြောတာလား။","Check one detail by saying what you think. Much safer than guessing.","— Meet me at the gate. — Do you mean the front gate?","— ဂိတ်မှာ စောင့်နေမယ်။ — ရှေ့ဂိတ်ကို ပြောတာလား။",{"es":["¿Quiere decir naranjas?","Comprueba un detalle diciendo lo que crees. Mucho más seguro que adivinar.","— Nos vemos en la puerta. — ¿Quiere decir la puerta principal?"],"fr":["Vous voulez dire des oranges ?","Vérifiez un détail en disant ce que vous pensez. Bien plus sûr que de deviner.","— Retrouvez-moi au portail. — Vous voulez dire le portail principal ?"],"hi":["आपका मतलब <span class=gray>संतरे<\/span> है?","जो आप समझे, उसे कहकर किसी ब्योरे की जाँच कर लेता है। अंदाज़ा लगाने से कहीं ज़्यादा सुरक्षित।","— मुझे गेट पर मिलना। — आपका मतलब सामने वाला गेट?"],"vi":["Ý bạn là <span class=gray>cam<\/span> à?","Kiểm tra một chi tiết bằng cách nói ra điều bạn nghĩ. An toàn hơn đoán mò rất nhiều.","— Gặp mình ở cổng nhé. — Ý bạn là cổng trước à?"]}],["So, <span class=gray>2 o'clock<\/span>. Is that right?","ဆိုတော့ နှစ်နာရီပေါ့ ။ ဟုတ်လား။","Repeat the important part: times, numbers, places. People like this, because it stops mistakes.","So, Gate 12 at 9:30. Is that right?","ဆိုတော့ ဂိတ် ၁၂၊ ကိုးနာရီခွဲ။ ဟုတ်လား။",{"es":["Entonces, a las 2. ¿Es correcto?","Repite la parte importante: horas, números, lugares. A la gente le gusta, porque evita errores.","Entonces, puerta 12 a las 9:30. ¿Es correcto?"],"fr":["Donc, 2 heures. C'est bien ça ?","Répétez l'essentiel : heures, nombres, lieux. Les gens apprécient, car cela évite les erreurs.","Donc, porte 12 à 9 h 30. C'est bien ça ?"],"hi":["तो, <span class=gray>2 बजे<\/span>। ठीक है न?","ज़रूरी हिस्सा दोहराइए: समय, संख्याएँ, जगहें। लोगों को यह अच्छा लगता है, क्योंकि इससे ग़लतियाँ नहीं होतीं।","तो, गेट 12, साढ़े नौ बजे। ठीक है न?"],"vi":["Vậy là <span class=gray>2 giờ<\/span>. Đúng không?","Nhắc lại phần quan trọng: giờ giấc, con số, địa điểm. Mọi người thích vậy, vì tránh được nhầm lẫn.","Vậy là Cổng 12 lúc 9 giờ 30. Đúng không?"]}],["Did you say <span class=gray>Tuesday<\/span> or <span class=gray>Thursday<\/span>?","အင်္ဂါနေ့လား၊ ကြာသပတေးနေ့ကိုပြောတာလား။","For numbers and words that sound almost the same. Fifteen or fifty? is the classic one.","Sorry, did you say fifteen or fifty?","ဆောရီး၊ ဆယ့်ငါးလို့ ပြောတာလား၊ ငါးဆယ်လို့ ပြောတာလား။",{"es":["¿Dijo martes o jueves?","Para números y palabras que suenan casi igual. Fifteen or fifty? es el caso clásico.","Perdón, ¿dijo quince o cincuenta?"],"fr":["Vous avez dit mardi ou jeudi ?","Pour les nombres et les mots qui se ressemblent à l'oreille. Fifteen or fifty? est le grand classique.","Pardon, vous avez dit quinze ou cinquante ?"],"hi":["आपने <span class=gray>मंगलवार<\/span> कहा या <span class=gray>गुरुवार<\/span>?","उन संख्याओं और शब्दों के लिए जो लगभग एक जैसे सुनाई देते हैं। Fifteen or fifty? इसका जाना-माना उदाहरण है।","माफ़ कीजिए, आपने fifteen कहा या fifty?"],"vi":["Bạn nói <span class=gray>thứ Ba<\/span> hay <span class=gray>thứ Năm<\/span>?","Dùng cho những con số và từ nghe gần giống nhau. Fifteen or fifty? là trường hợp kinh điển.","Xin lỗi, bạn nói fifteen hay fifty?"]}],["Let me check I understand.","နားလည်တာ မှန်မမှန် စစ်ကြည့်ပါရစေ။","Before you repeat longer instructions back: at the doctor, at work, at the bank.","Let me check I understand. Two pills a day, after meals?","နားလည်တာ မှန်မမှန် စစ်ကြည့်ပါရစေ။ တစ်နေ့ နှစ်လုံး၊ ထမင်းစားပြီးမှ သောက်ရမှာလား။",{"es":["Déjeme ver si entendí bien.","Antes de repetir unas instrucciones largas: con el médico, en el trabajo, en el banco.","Déjeme ver si entendí bien. ¿Dos pastillas al día, después de comer?"],"fr":["Laissez-moi vérifier que j'ai compris.","Avant de répéter des consignes plus longues : chez le médecin, au travail, à la banque.","Laissez-moi vérifier que j'ai compris. Deux comprimés par jour, après les repas ?"],"hi":["ज़रा देख लूँ कि मैंने ठीक समझा।","लंबे निर्देश दोहराने से पहले: डॉक्टर के यहाँ, काम पर, बैंक में।","ज़रा देख लूँ कि मैंने ठीक समझा। दिन में दो गोलियाँ, खाने के बाद?"],"vi":["Để mình xem mình hiểu đúng chưa.","Trước khi nhắc lại một lời dặn dài: ở phòng khám, ở chỗ làm, ở ngân hàng.","Để tôi xem tôi hiểu đúng chưa. Hai viên một ngày, sau bữa ăn?"]}]],"tr":{"es":["Comprobar que entendiste","Repetir lo que oíste, para saber que entendiste bien."],"fr":["Vérifier que l'on a compris","Redire ce que l'on a entendu, pour être sûr d'avoir bien compris."],"hi":["जाँचना कि आप समझ गए","जो सुना उसे दोहराना, ताकि पक्का हो कि आपने सही समझा।"],"vi":["Kiểm tra xem mình hiểu đúng chưa","Nhắc lại điều bạn nghe được, để biết chắc mình hiểu đúng."]}},{"en":"Asking for words","my":"စကားလုံး မေးခြင်း","desc":"Learning new words from the people around you.","cards":[["How do you say <span class=gray>လ<\/span> in English?","လကို အင်္ဂလိပ်လို ဘယ်လိုပြောလဲ။","The most useful question for learners. Ask the full question. Not: How to say ___?","— How do you say ထမင်းချိုင့် in English? — Lunch box.","— ထမင်းချိုင့်ကို အင်္ဂလိပ်လို ဘယ်လိုပြောလဲ။ — Lunch box တဲ့။",{"es":["¿Cómo se dice လ en inglés?","La pregunta más útil para quien aprende. Haz la pregunta completa. No: How to say ___?","— ¿Cómo se dice ထမင်းချိုင့် en inglés? — Lunch box."],"fr":["Comment dit-on လ en anglais ?","La question la plus utile pour un apprenant. Posez la question complète. Pas : How to say ___?","— Comment dit-on ထမင်းချိုင့် en anglais ? — Lunch box."],"hi":["<span class=gray>…<\/span> को अंग्रेज़ी में क्या कहते हैं?","सीखने वाले के लिए सबसे काम का सवाल। पूरा सवाल पूछिए। ग़लत: How to say ___?","— ထမင်းချိုင့် को अंग्रेज़ी में क्या कहते हैं? — Lunch box."],"vi":["<span class=gray>…<\/span> tiếng Anh nói thế nào?","Câu hỏi hữu ích nhất cho người học. Hãy hỏi cả câu. Không nói: How to say ___?","— ထမင်းချိုင့် tiếng Anh nói thế nào? — Lunch box."]}],["What's <span class=gray>this<\/span> called?","ဒါကို ဘာခေါ်လဲ။","Point at something when you don't know its name. For more than one: What are these called?","— What's this called? — It's a ladle.","— ဒါကို ဘာခေါ်လဲ။ — ဟင်းခပ်ယောက်မပါ။",{"es":["¿Cómo se llama esto?","Señala algo cuando no sabes su nombre. Para más de una cosa: What are these called?","— ¿Cómo se llama esto? — Es un cucharón."],"fr":["Comment ça s'appelle ?","Montrez un objet dont vous ignorez le nom. Pour plusieurs : What are these called?","— Comment ça s'appelle ? — C'est une louche."],"hi":["<span class=gray>इसे<\/span> क्या कहते हैं?","जब किसी चीज़ का नाम न पता हो, तो उसकी ओर इशारा कीजिए। एक से ज़्यादा चीज़ों के लिए: What are these called?","— इसे क्या कहते हैं? — यह ladle (करछुल) है।"],"vi":["<span class=gray>Cái này<\/span> gọi là gì?","Chỉ vào một vật khi bạn không biết tên của nó. Với nhiều vật: What are these called?","— Cái này gọi là gì? — Đó là ladle (cái muôi)."]}],["How do you spell <span class=gray>rainbow<\/span>?","သက်တံ့ ကို ဘယ်လို စာလုံးပေါင်းလဲ။","For writing a word you heard. English spelling is hard for everyone, even native speakers!","How do you spell Wednesday?","Wednesday ကို ဘယ်လို စာလုံးပေါင်းလဲ။",{"es":["¿Cómo se escribe rainbow?","Para escribir una palabra que oíste. ¡La ortografía del inglés es difícil para todos, hasta para los nativos!","¿Cómo se escribe Wednesday?"],"fr":["Comment s'écrit rainbow ?","Pour écrire un mot que vous avez entendu. L'orthographe anglaise est difficile pour tout le monde, même pour les natifs !","Comment s'écrit Wednesday ?"],"hi":["<span class=gray>rainbow<\/span> की स्पेलिंग क्या है?","सुने हुए शब्द को लिखने के लिए। अंग्रेज़ी की स्पेलिंग सबके लिए मुश्किल है, उनके लिए भी जिनकी यह मातृभाषा है!","Wednesday की स्पेलिंग क्या है?"],"vi":["<span class=gray>Rainbow<\/span> đánh vần thế nào?","Để viết ra một từ bạn nghe được. Chính tả tiếng Anh khó với tất cả mọi người, kể cả người bản ngữ!","Wednesday đánh vần thế nào?"]}],["How do you pronounce <span class=gray>this<\/span>?","ဒါကို ဘယ်လို အသံထွက်လဲ။","For a word you can read but can't say. Point at the word.","How do you pronounce this word? R-E-C-I-P-E.","ဒီစကားလုံးကို ဘယ်လို အသံထွက်လဲ။ R-E-C-I-P-E။",{"es":["¿Cómo se pronuncia esto?","Para una palabra que puedes leer pero no decir. Señala la palabra.","¿Cómo se pronuncia esta palabra? R-E-C-I-P-E."],"fr":["Comment ça se prononce ?","Pour un mot que vous savez lire mais pas dire. Montrez le mot.","Comment se prononce ce mot ? R-E-C-I-P-E."],"hi":["<span class=gray>इसे<\/span> कैसे बोलते हैं?","उस शब्द के लिए जिसे आप पढ़ सकते हैं पर बोल नहीं पाते। शब्द की ओर इशारा कीजिए।","इस शब्द को कैसे बोलते हैं? R-E-C-I-P-E."],"vi":["<span class=gray>Từ này<\/span> phát âm thế nào?","Dùng cho một từ bạn đọc được nhưng không biết nói. Hãy chỉ vào từ đó.","Từ này phát âm thế nào? R-E-C-I-P-E."]}]],"tr":{"es":["Preguntar por palabras","Aprender palabras nuevas de la gente que te rodea."],"fr":["Demander des mots","Apprendre de nouveaux mots auprès des gens qui vous entourent."],"hi":["शब्द पूछना","अपने आसपास के लोगों से नए शब्द सीखना।"],"vi":["Hỏi từ","Học từ mới từ những người xung quanh."]}},{"en":"Buying time","my":"အချိန်ယူခြင်း","desc":"When you need a moment, or can't find the word.","cards":[["Just a moment.","ခဏလေးနော်။","When you need a little time to think or find something. Also: Just a second. or Hang on.","Just a moment, I'll find the paper.","ခဏလေးနော်၊ စာရွက် ရှာလိုက်ဦးမယ်။",{"es":["Un momento.","Cuando necesitas un poco de tiempo para pensar o buscar algo. También: Just a second. o Hang on.","Un momento, voy a buscar el papel."],"fr":["Un instant.","Quand il vous faut un peu de temps pour réfléchir ou chercher quelque chose. On dit aussi : Just a second. ou Hang on.","Un instant, je vais retrouver le papier."],"hi":["एक मिनट।","जब सोचने या कुछ ढूँढने के लिए थोड़ा समय चाहिए। यह भी: Just a second. या Hang on.","एक मिनट, मैं वह काग़ज़ ढूँढता हूँ।"],"vi":["Chờ một chút.","Khi bạn cần chút thời gian để nghĩ hoặc tìm thứ gì đó. Cũng có: Just a second. hoặc Hang on.","Chờ một chút, để mình tìm tờ giấy."]}],["Let me think.","စဉ်းစားပါရစေ။","Shows you are working on an answer, not ignoring the question. Also: Hmm, let me see.","— Which day is best for you? — Let me think… Friday.","— ဘယ်နေ့ အဆင်ပြေလဲ။ — စဉ်းစားပါရစေ… သောကြာနေ့။",{"es":["Déjame pensar.","Muestra que estás buscando una respuesta, no ignorando la pregunta. También: Hmm, let me see.","— ¿Qué día te conviene más? — Déjame pensar… el viernes."],"fr":["Laisse-moi réfléchir.","Montre que vous cherchez une réponse, que vous n'ignorez pas la question. On dit aussi : Hmm, let me see.","— Quel jour t'arrange le mieux ? — Laisse-moi réfléchir… vendredi."],"hi":["सोचने दीजिए।","दिखाता है कि आप जवाब ढूँढ रहे हैं, सवाल को अनसुना नहीं कर रहे। यह भी: Hmm, let me see.","— आपके लिए कौन-सा दिन सबसे ठीक है? — सोचने दीजिए… शुक्रवार।"],"vi":["Để mình nghĩ đã.","Cho thấy bạn đang tìm câu trả lời chứ không phải lờ câu hỏi đi. Cũng có: Hmm, let me see.","— Ngày nào tiện cho bạn nhất? — Để mình nghĩ đã… Thứ Sáu."]}],["What's the word…?","ဘယ်လို ပြောရမလဲ…","Saying this out loud when you can't find a word is normal. Describe the thing, and the other person will often help you.","It's a… what's the word… a thing for opening bottles.","အဲဒါက… ဘယ်လိုပြောရမလဲ… ပုလင်းဖောက်တဲ့ ပစ္စည်း။",{"es":["¿Cómo se dice…?","Decir esto en voz alta cuando no encuentras una palabra es normal. Describe la cosa, y la otra persona muchas veces te ayuda.","Es un… cómo se dice… una cosa para abrir botellas."],"fr":["Comment dit-on, déjà… ?","Le dire à voix haute quand un mot vous échappe est normal. Décrivez la chose, et l'autre vous aidera souvent.","C'est un… comment dit-on, déjà… un truc pour ouvrir les bouteilles."],"hi":["वह क्या कहते हैं…?","शब्द न सूझने पर इसे ज़ोर से कह देना सामान्य है। चीज़ का वर्णन कीजिए; सामने वाला अक्सर मदद कर देता है।","वह एक… क्या कहते हैं… बोतल खोलने वाली चीज़ है।"],"vi":["Từ đó là gì nhỉ…?","Nói to câu này khi không tìm ra từ là chuyện bình thường. Hãy tả vật đó, người kia thường sẽ giúp bạn.","Đó là cái… gọi là gì nhỉ… cái để mở chai ấy."]}],["I'm still learning English.","အင်္ဂလိပ်စကား သင်နေတုန်းပါ။","Asks people to be patient and speak simply. No need to say Sorry for my bad English: people are usually kind.","I'm still learning English, so please speak slowly.","အင်္ဂလိပ်စကား သင်နေတုန်းမို့ ဖြည်းဖြည်း ပြောပေးပါ။",{"es":["Todavía estoy aprendiendo inglés.","Pide paciencia y que te hablen con sencillez. No hace falta decir Sorry for my bad English: la gente suele ser amable.","Todavía estoy aprendiendo inglés, así que hable despacio, por favor."],"fr":["J'apprends encore l'anglais.","Invite les gens à être patients et à parler simplement. Inutile de dire Sorry for my bad English : les gens sont en général bienveillants.","J'apprends encore l'anglais, alors parlez lentement, s'il vous plaît."],"hi":["मैं अभी अंग्रेज़ी सीख रहा हूँ।","धैर्य माँगता है और यह भी कि आपसे सरल ढंग से बात की जाए। Sorry for my bad English कहने की ज़रूरत नहीं: लोग आम तौर पर अच्छे से पेश आते हैं।","मैं अभी अंग्रेज़ी सीख रहा हूँ, इसलिए कृपया धीरे बोलिए।"],"vi":["Mình vẫn đang học tiếng Anh.","Xin người kia kiên nhẫn và nói đơn giản với bạn. Không cần nói Sorry for my bad English: mọi người thường rất tử tế.","Mình vẫn đang học tiếng Anh, nên bạn nói chậm giúp nhé."]}]],"tr":{"es":["Ganar tiempo","Cuando necesitas un momento, o no encuentras la palabra."],"fr":["Gagner du temps","Quand il vous faut un instant, ou que le mot vous échappe."],"hi":["थोड़ा समय लेना","जब आपको एक पल चाहिए, या शब्द नहीं सूझ रहा।"],"vi":["Câu giờ","Khi bạn cần một chút thời gian, hoặc chưa tìm ra từ."]}},{"en":"When you understand","my":"နားလည်သွားတဲ့အခါ","desc":"Showing that the message got through.","cards":[["I see.","ဪ၊ ဟုတ်ကဲ့။","Shows you understand and are listening. In Burmese, ဟုတ်ကဲ့ can just mean I'm listening. In English, Yes can sound like I understand or I agree, so only say it if it's true.","— Turn left after the bank. — I see. Thank you.","— ဘဏ်ကို ကျော်ရင် ဘယ်ဘက်ကွေ့ပါ။ — ဪ၊ ဟုတ်ကဲ့။ ကျေးဇူးပါ။",{"es":["Ya veo.","Muestra que entiendes y que estás escuchando. En inglés, Yes puede sonar a Entiendo o a Estoy de acuerdo, así que dilo solo si es verdad.","— Gire a la izquierda después del banco. — Ya veo. Gracias."],"fr":["Je vois.","Montre que vous comprenez et que vous écoutez. En anglais, Yes peut vouloir dire Je comprends ou Je suis d'accord : ne le dites que si c'est vrai.","— Tournez à gauche après la banque. — Je vois. Merci."],"hi":["अच्छा, समझा।","दिखाता है कि आप समझ रहे हैं और सुन रहे हैं। अंग्रेज़ी में Yes का मतलब “समझ गया” भी लग सकता है और “सहमत हूँ” भी, इसलिए तभी कहिए जब यह सच हो।","— बैंक के बाद बाएँ मुड़िए। — अच्छा, समझा। धन्यवाद।"],"vi":["À, ra vậy.","Cho thấy bạn hiểu và đang lắng nghe. Trong tiếng Anh, Yes có thể được hiểu là “Tôi hiểu” hoặc “Tôi đồng ý”, nên chỉ nói khi đúng là như vậy.","— Rẽ trái sau ngân hàng. — À, ra vậy. Cảm ơn."]}],["Got it.","နားလည်ပြီ။","Casual: I understand. Very common at work. Also: Got it, thanks!","— Press the green button, then wait. — Got it.","— အစိမ်းရောင်ခလုတ်ကို နှိပ်ပြီး စောင့်ပါ။ — နားလည်ပြီ။",{"es":["Entendido.","Informal: entiendo. Muy común en el trabajo. También: Got it, thanks!","— Presiona el botón verde y espera. — Entendido."],"fr":["Compris.","Familier : je comprends. Très courant au travail. On dit aussi : Got it, thanks!","— Appuie sur le bouton vert, puis attends. — Compris."],"hi":["समझ गया।","अनौपचारिक: मैं समझ गया। काम पर बहुत आम। यह भी: Got it, thanks!","— हरा बटन दबाइए, फिर रुकिए। — समझ गया।"],"vi":["Hiểu rồi.","Thân mật: mình hiểu rồi. Rất phổ biến ở chỗ làm. Cũng có: Got it, thanks!","— Bấm nút xanh, rồi chờ. — Hiểu rồi."]}],["Oh, now I understand.","ဪ၊ အခုမှ နားလည်တော့တယ်။","After an explanation worked. It tells the person their help was useful.","Oh, now I understand. Thank you for explaining.","ဪ၊ အခုမှ နားလည်တော့တယ်။ ရှင်းပြပေးလို့ ကျေးဇူးပါ။",{"es":["Ah, ahora entiendo.","Cuando una explicación funcionó. Le dice a la persona que su ayuda sirvió.","Ah, ahora entiendo. Gracias por explicarme."],"fr":["Ah, maintenant je comprends.","Après une explication réussie. Cela dit à la personne que son aide a été utile.","Ah, maintenant je comprends. Merci de m'avoir expliqué."],"hi":["अच्छा, अब समझ आया।","जब समझाना काम कर गया। सामने वाले को बताता है कि उसकी मदद काम आई।","अच्छा, अब समझ आया। समझाने के लिए धन्यवाद।"],"vi":["À, giờ thì mình hiểu rồi.","Khi lời giải thích có tác dụng. Cho người kia biết họ đã giúp được bạn.","À, giờ thì mình hiểu rồi. Cảm ơn bạn đã giải thích."]}],["That makes sense.","အဲဒါ ယုတ္တိရှိတယ်။","I understand, and it sounds right and logical.","— We start early because it's cooler. — Ah, that makes sense.","— အေးတဲ့အချိန်မို့ စောစော စတာ။ — အာ၊ ဟုတ်သားပဲ။",{"es":["Tiene sentido.","Entiendo, y me parece correcto y lógico.","— Empezamos temprano porque hace menos calor. — Ah, tiene sentido."],"fr":["C'est logique.","Je comprends, et cela me paraît juste et logique.","— On commence tôt parce qu'il fait plus frais. — Ah, c'est logique."],"hi":["यह बात ठीक लगती है।","मैं समझ गया, और मुझे यह सही और तर्कसंगत लगता है।","— हम जल्दी शुरू करते हैं क्योंकि तब ठंडक रहती है। — अच्छा, यह बात ठीक लगती है।"],"vi":["Nghe hợp lý đấy.","Mình hiểu, và thấy điều đó đúng, hợp lý.","— Bọn mình bắt đầu sớm vì lúc đó mát hơn. — À, nghe hợp lý đấy."]}]],"tr":{"es":["Cuando entiendes","Mostrar que el mensaje llegó."],"fr":["Quand on comprend","Montrer que le message est passé."],"hi":["जब समझ आ जाए","दिखाना कि बात आप तक पहुँच गई।"],"vi":["Khi bạn đã hiểu","Cho thấy bạn đã nắm được ý."]}}];const langs=["my","es","fr","hi","vi"];const COURSE="eng";</script>
