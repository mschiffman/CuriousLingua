<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/shopping/";const AUD_EXT="mp3?v=2611170809";const categories=[{"en":"Looking and asking","my":"ကြည့်ခြင်းနှင့် မေးခြင်း","desc":"Looking around, and asking for what you want.","cards":[["I'm just looking, thanks.","ကြည့်ရုံ ကြည့်နေတာပါ၊ ကျေးဇူးပါ။","The polite answer when a shop assistant asks Can I help you? and you don't need help yet.","— Can I help you? — I'm just looking, thanks.","— ဘာကူညီရမလဲ။ — ကြည့်ရုံ ကြည့်နေတာပါ၊ ကျေးဇူးပါ။",{"es":["Solo estoy mirando, gracias.","La respuesta cortés cuando un vendedor pregunta Can I help you? y todavía no necesitas ayuda.","— ¿Puedo ayudarle? — Solo estoy mirando, gracias."],"fr":["Je regarde seulement, merci.","La réponse polie quand un vendeur demande Can I help you? et que vous n'avez pas encore besoin d'aide.","— Je peux vous aider ? — Je regarde seulement, merci."]}],["Do you have <span class=gray>this in blue<\/span>?","ဒါ အပြာရောင် ရှိလား။","Asks for another colour or size of the same thing.","I like this shirt. Do you have it in green?","ဒီရှပ်အင်္ကျီ ကြိုက်တယ်။ အစိမ်းရောင် ရှိလား။",{"es":["¿Tiene esto en azul?","Para pedir otro color u otra talla de lo mismo.","Me gusta esta camisa. ¿La tiene en verde?"],"fr":["Vous avez ça en bleu ?","Pour demander une autre couleur ou une autre taille du même article.","J'aime bien cette chemise. Vous l'avez en vert ?"]}],["Where can I find <span class=gray>rice<\/span>?","ဆန် ဘယ်မှာ ရှိလဲ။","In a big shop or supermarket.","Excuse me, where can I find the eggs?","တဆိတ်လောက်၊ ကြက်ဥ ဘယ်မှာ ရှိလဲ။",{"es":["¿Dónde encuentro el arroz?","En una tienda grande o en un supermercado.","Disculpe, ¿dónde encuentro los huevos?"],"fr":["Où puis-je trouver le riz ?","Dans un grand magasin ou un supermarché.","Excusez-moi, où puis-je trouver les œufs ?"]}],["Do you sell <span class=gray>batteries<\/span>?","ဓာတ်ခဲ ရောင်းလား။","When you aren't sure the shop has it at all.","Do you sell phone chargers?","ဖုန်းအားသွင်းကြိုး ရောင်းလား။",{"es":["¿Venden pilas?","Cuando no estás seguro de que la tienda lo tenga.","¿Venden cargadores de teléfono?"],"fr":["Vous vendez des piles ?","Quand on n'est pas sûr que le magasin en ait.","Vous vendez des chargeurs de téléphone ?"]}],["Can I try it on?","ဝတ်ကြည့်လို့ ရမလား။","For clothes and shoes. Try on = put on to see if it fits.","I like these trousers. Can I try them on?","ဒီဘောင်းဘီ ကြိုက်တယ်။ ဝတ်ကြည့်လို့ ရမလား။",{"es":["¿Me lo puedo probar?","Para ropa y zapatos. Try on = ponerse algo para ver si queda bien.","Me gustan estos pantalones. ¿Me los puedo probar?"],"fr":["Je peux l'essayer ?","Pour les vêtements et les chaussures. Try on = mettre pour voir si la taille convient.","J'aime bien ce pantalon. Je peux l'essayer ?"]}]],"tr":{"es":["Mirar y preguntar","Mirar con calma y pedir lo que quieres."],"fr":["Regarder et demander","Faire le tour du magasin et demander ce que l'on veut."]}},{"en":"Prices","my":"ဈေးနှုန်း","desc":"Asking how much, and talking about the price.","cards":[["How much is this?","ဒါ ဘယ်လောက်လဲ။","For one thing. Point to it as you ask.","Excuse me, how much is this bag?","တဆိတ်လောက်၊ ဒီအိတ် ဘယ်လောက်လဲ။",{"es":["¿Cuánto cuesta esto?","Para una sola cosa. Señálala al preguntar.","Disculpe, ¿cuánto cuesta esta bolsa?"],"fr":["Combien ça coûte ?","Pour un seul article. Montrez-le en posant la question.","Excusez-moi, combien coûte ce sac ?"]}],["How much are these?","ဒါတွေ ဘယ်လောက်လဲ။","For more than one thing: these, those, the apples.","How much are the mangoes?","သရက်သီးတွေ ဘယ်လောက်လဲ။",{"es":["¿Cuánto cuestan estos?","Para más de una cosa: these, those, the apples.","¿Cuánto cuestan los mangos?"],"fr":["Combien coûtent ceux-ci ?","Pour plusieurs articles : these, those, the apples.","Combien coûtent les mangues ?"]}],["That's too expensive.","ဈေးကြီးလွန်းတယ်။","Polite enough, but softer: It's a bit expensive for me.","Ten thousand? That's too expensive.","တစ်သောင်းလား။ ဈေးကြီးလွန်းတယ်။",{"es":["Es demasiado caro.","Es bastante cortés, pero más suave: It's a bit expensive for me.","¿Diez mil? Es demasiado caro."],"fr":["C'est trop cher.","Assez poli, mais plus doux : It's a bit expensive for me.","Dix mille ? C'est trop cher."]}],["Is there a discount?","လျှော့ဈေး ရှိလား။","Asks if the price is lower today, or for students, or for buying two.","Is there a discount if I buy three?","သုံးခု ဝယ်ရင် လျှော့ဈေး ရှိလား။",{"es":["¿Hay descuento?","Pregunta si el precio es más bajo hoy, para estudiantes o al comprar dos.","¿Hay descuento si compro tres?"],"fr":["Il y a une réduction ?","Demande si le prix est plus bas aujourd'hui, pour les étudiants ou si l'on en achète deux.","Il y a une réduction si j'en prends trois ?"]}],["Can you give me a better price?","ဈေး လျှော့ပေးလို့ ရမလား။","Bargaining, as in a market. In shops in Britain or America, prices are usually fixed.","It's nice, but can you give me a better price?","ကောင်းတော့ ကောင်းတယ်၊ ဒါပေမဲ့ ဈေး လျှော့ပေးလို့ ရမလား။",{"es":["¿Me puede dar un mejor precio?","Para regatear, como en un mercado. En las tiendas de Gran Bretaña o Estados Unidos los precios suelen ser fijos.","Está bonito, pero ¿me puede dar un mejor precio?"],"fr":["Vous pouvez me faire un meilleur prix ?","Pour marchander, comme au marché. Dans les magasins britanniques ou américains, les prix sont en général fixes.","C'est joli, mais vous pouvez me faire un meilleur prix ?"]}]],"tr":{"es":["Los precios","Preguntar cuánto cuesta y hablar del precio."],"fr":["Les prix","Demander combien ça coûte et parler du prix."]}},{"en":"Sizes and choosing","my":"ဆိုဒ်နှင့် ရွေးချယ်ခြင်း","desc":"Checking it fits, then deciding.","cards":[["Do you have a smaller size?","ဆိုဒ် အသေး ရှိလား။","Or a bigger size, a larger size.","These shoes are too big. Do you have a smaller size?","ဒီဖိနပ်က ကြီးလွန်းတယ်။ ဆိုဒ် အသေး ရှိလား။",{"es":["¿Tiene una talla más pequeña?","O bien a bigger size, a larger size.","Estos zapatos me quedan grandes. ¿Tiene una talla más pequeña?"],"fr":["Vous avez une taille plus petite ?","Ou bien a bigger size, a larger size.","Ces chaussures sont trop grandes. Vous avez une taille plus petite ?"]}],["It's too big.","ကြီးလွန်းတယ်။","Too + adjective: too small, too long, too tight.","The jacket is too big for me.","ဂျာကင်က ကျွန်မအတွက် ကြီးလွန်းတယ်။",{"es":["Es demasiado grande.","Too + adjetivo: too small, too long, too tight.","La chaqueta me queda demasiado grande."],"fr":["C'est trop grand.","Too + adjectif : too small, too long, too tight.","La veste est trop grande pour moi."]}],["It fits perfectly.","အတိအကျ တော်တယ်။","Fit is about size. Suit is about style or colour.","I'll buy this dress. It fits perfectly.","ဒီဝတ်စုံ ဝယ်မယ်။ အတိအကျ တော်တယ်။",{"es":["Me queda perfecto.","Fit se refiere a la talla. Suit, al estilo o al color.","Me llevo este vestido. Me queda perfecto."],"fr":["C'est exactement ma taille.","Fit concerne la taille. Suit concerne le style ou la couleur.","Je prends cette robe. C'est exactement ma taille."]}],["I'll take it.","ဒါ ယူမယ်။","You've decided to buy it. For more than one: I'll take them.","OK, I'll take it. And this one too.","အိုကေ၊ ဒါ ယူမယ်။ ဒါလည်း ယူမယ်။",{"es":["Me lo llevo.","Ya decidiste comprarlo. Para varias cosas: I'll take them.","Bien, me lo llevo. Y este también."],"fr":["Je le prends.","Vous avez décidé d'acheter. Pour plusieurs articles : I'll take them.","D'accord, je le prends. Et celui-ci aussi."]}],["I'll leave it, thanks.","မယူတော့ဘူး၊ ကျေးဇူးပါ။","A polite way to say you won't buy it.","Hmm, I'll leave it, thanks. Maybe next time.","အင်း၊ မယူတော့ဘူး၊ ကျေးဇူးပါ။ နောက်မှ ဝယ်မယ်။",{"es":["Lo dejo, gracias.","Una manera cortés de decir que no lo vas a comprar.","Mmm, lo dejo, gracias. Quizá la próxima vez."],"fr":["Je vais laisser, merci.","Une façon polie de dire que vous n'achetez pas.","Hmm, je vais laisser, merci. Une prochaine fois, peut-être."]}]],"tr":{"es":["Tallas y elección","Comprobar que te queda y luego decidir."],"fr":["Tailles et choix","Vérifier que c'est la bonne taille, puis décider."]}},{"en":"Paying","my":"ငွေပေးချေခြင်း","desc":"At the till: card or cash, a bag, the receipt.","cards":[["Do you take cards?","ကတ်နဲ့ ပေးလို့ ရလား။","Asks if you can pay by card. Also: Can I pay by card?","Do you take cards, or only cash?","ကတ်နဲ့ ပေးလို့ ရလား၊ ဒါမှမဟုတ် ငွေသားပဲလား။",{"es":["¿Aceptan tarjeta?","Pregunta si se puede pagar con tarjeta. También: Can I pay by card?","¿Aceptan tarjeta o solo efectivo?"],"fr":["Vous prenez la carte ?","Demande si l'on peut payer par carte. On dit aussi : Can I pay by card?","Vous prenez la carte, ou seulement les espèces ?"]}],["Can I pay in cash?","ငွေသားနဲ့ ပေးလို့ ရလား။","In cash, by card. Or with a phone: Can I pay with KBZPay?","Can I pay in cash? I don't have a card.","ငွေသားနဲ့ ပေးလို့ ရလား။ ကတ် မရှိဘူး။",{"es":["¿Puedo pagar en efectivo?","In cash, by card. O con el teléfono: Can I pay with KBZPay?","¿Puedo pagar en efectivo? No tengo tarjeta."],"fr":["Je peux payer en espèces ?","In cash, by card. Ou avec le téléphone : Can I pay with KBZPay?","Je peux payer en espèces ? Je n'ai pas de carte."]}],["Can I have a bag, please?","အိတ် တစ်လုံး ရနိုင်မလား။","Some shops charge for bags or don't give them unless you ask.","Can I have a bag, please? I have a lot of things.","အိတ် တစ်လုံး ရနိုင်မလား။ ပစ္စည်း အများကြီး ပါလို့။",{"es":["¿Me da una bolsa, por favor?","Algunas tiendas cobran las bolsas o no las dan si no las pides.","¿Me da una bolsa, por favor? Llevo muchas cosas."],"fr":["Je peux avoir un sac, s'il vous plaît ?","Certains magasins font payer les sacs ou n'en donnent que si on le demande.","Je peux avoir un sac, s'il vous plaît ? J'ai beaucoup de choses."]}],["Can I have the receipt?","ဘောက်ချာ ရနိုင်မလား။","Keep the receipt if you might bring something back.","Can I have the receipt, please?","ဘောက်ချာ ရနိုင်မလား။",{"es":["¿Me da el recibo?","Guarda el recibo por si tienes que devolver algo.","¿Me da el recibo, por favor?"],"fr":["Je peux avoir le ticket de caisse ?","Gardez le ticket au cas où vous devriez rapporter l'article.","Je peux avoir le ticket de caisse, s'il vous plaît ?"]}],["Keep the change.","အကြွေ ယူထားလိုက်ပါ။","You don't want the extra money back. Common with taxi drivers.","Here's ten dollars. Keep the change.","ဒေါ်လာ ဆယ် ပါ။ အကြွေ ယူထားလိုက်ပါ။",{"es":["Quédese con el cambio.","No quieres que te devuelvan el dinero sobrante. Es común con los taxistas.","Aquí tiene diez dólares. Quédese con el cambio."],"fr":["Gardez la monnaie.","Vous ne voulez pas récupérer la différence. Courant avec les chauffeurs de taxi.","Voici dix dollars. Gardez la monnaie."]}]],"tr":{"es":["Pagar","En la caja: tarjeta o efectivo, una bolsa, el recibo."],"fr":["Payer","À la caisse : carte ou espèces, un sac, le ticket."]}},{"en":"What the shop assistant says","my":"ဆိုင်ဝန်ထမ်း ပြောတတ်တာများ","desc":"Phrases you will hear at the till, so you can answer.","cards":[["Anything else?","တခြား ဘာလိုသေးလဲ။","Answer: No, that's all, thanks. Or name the next thing.","— Anything else? — No, that's all, thanks.","— တခြား ဘာလိုသေးလဲ။ — မလိုတော့ဘူး၊ ကျေးဇူးပါ။",{"es":["¿Algo más?","Se responde: No, that's all, thanks. O se dice lo siguiente que quieres.","— ¿Algo más? — No, es todo, gracias."],"fr":["Autre chose ?","On répond : No, that's all, thanks. Ou l'on nomme l'article suivant.","— Autre chose ? — Non, c'est tout, merci."]}],["That's five thousand kyats.","ငါးထောင်ကျပ် ကျပါတယ်။","Tells you the total. Also: That'll be five thousand kyats.","Two coffees? That's five thousand kyats, please.","ကော်ဖီ နှစ်ခွက်လား။ ငါးထောင်ကျပ် ကျပါတယ်။",{"es":["Son cinco mil kyats.","Te dice el total. También: That'll be five thousand kyats.","¿Dos cafés? Son cinco mil kyats, por favor."],"fr":["Ça fait cinq mille kyats.","Annonce le total. On dit aussi : That'll be five thousand kyats.","Deux cafés ? Ça fait cinq mille kyats, s'il vous plaît."]}],["Cash or card?","ငွေသားလား၊ ကတ်လား။","Asks how you want to pay. Answer: Cash, please. / Card, please.","— Cash or card? — Card, please.","— ငွေသားလား၊ ကတ်လား။ — ကတ်နဲ့ပါ။",{"es":["¿Efectivo o tarjeta?","Pregunta cómo quieres pagar. Se responde: Cash, please. / Card, please.","— ¿Efectivo o tarjeta? — Tarjeta, por favor."],"fr":["Espèces ou carte ?","Demande comment vous voulez payer. On répond : Cash, please. / Card, please.","— Espèces ou carte ? — Carte, s'il vous plaît."]}],["Would you like a bag?","အိတ် ယူမလား။","Answer: Yes, please. / No, thanks, I have one.","— Would you like a bag? — No, thanks. I have one.","— အိတ် ယူမလား။ — မယူတော့ဘူး၊ ကျေးဇူးပါ။ ပါလာပါတယ်။",{"es":["¿Quiere una bolsa?","Se responde: Yes, please. / No, thanks, I have one.","— ¿Quiere una bolsa? — No, gracias. Traigo una."],"fr":["Vous voulez un sac ?","On répond : Yes, please. / No, thanks, I have one.","— Vous voulez un sac ? — Non, merci. J'en ai un."]}],["Here's your change.","ပြန်အမ်းငွေ ပါ။","The money you get back. Count it and say Thank you.","Here's your change, and your receipt.","ပြန်အမ်းငွေနဲ့ ဘောက်ချာ ပါ။",{"es":["Aquí tiene su cambio.","El dinero que te devuelven. Cuéntalo y di Thank you.","Aquí tiene su cambio, y su recibo."],"fr":["Voici votre monnaie.","L'argent que l'on vous rend. Comptez-le et dites Thank you.","Voici votre monnaie, et votre ticket."]}]],"tr":{"es":["Lo que dice el vendedor","Frases que vas a oír en la caja, para que puedas responder."],"fr":["Ce que dit le vendeur","Des phrases que vous entendrez à la caisse, pour pouvoir répondre."]}}];const langs=["my","es","fr"];const COURSE="eng";</script>
