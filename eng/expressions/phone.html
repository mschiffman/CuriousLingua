<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/phone/";const AUD_EXT="mp3?v=2611200515";const categories=[{"en":"Starting a call","my":"ဖုန်းခေါ်ဆိုမှု စတင်ခြင်း","desc":"Answering, saying who you are, and asking for someone.","cards":[["Hello?","ဟယ်လို။","On the phone, Hello? with a rising voice means: I'm here, who is it?","— (ring ring) — Hello? — Hi, Mum!","— (ဖုန်းမြည်) — ဟယ်လို။ — ဟိုင်း၊ မေမေ။"],["Hi, it's <span class=gray>May<\/span>.","ဟိုင်း၊ မေ ပါ။","On the phone, say It's…, not I am… Also: This is May.","Hi, Grandma, it's Aung!","ဟိုင်း အဖွား၊ အောင် ပါ။"],["Who's calling, please?","ဘယ်သူ ပြောနေတာပါလဲ။","Polite: asks the caller's name.","— Can I speak to Mr Tun? — Who's calling, please?","— ဦးထွန်းနဲ့ ပြောလို့ ရမလား။ — ဘယ်သူ ပြောနေတာပါလဲ။"],["Can I speak to <span class=gray>Aung<\/span>, please?","အောင်နဲ့ စကား ပြောလို့ ရမလား။","When someone else answers the phone.","Hello, can I speak to your mother, please?","ဟယ်လို၊ မေမေနဲ့ စကား ပြောလို့ ရမလား။"],["Is this a good time?","အခု ပြောလို့ အဆင်ပြေလား။","Polite: checks the other person isn't busy.","Hi, it's Lin. Is this a good time?","ဟိုင်း၊ လင်း ပါ။ အခု ပြောလို့ အဆင်ပြေလား။"]]},{"en":"Waiting and messages","my":"စောင့်ခြင်းနှင့် မှာထားခြင်း","desc":"When the person isn't there, or needs a moment.","cards":[["Hold on, please.","ခဏ စောင့်ပါ။","Wait and don't hang up. Casual: Hang on a sec.","Hold on, please. I'll check.","ခဏ စောင့်ပါ။ စစ်ကြည့်လိုက်မယ်။"],["I'll get him for you.","သူ့ကို ခေါ်ပေးမယ်။","You go and find the person they asked for. For a woman: I'll get her.","— Is your dad there? — Yes, I'll get him for you.","— အဖေ ရှိလား။ — ရှိတယ်၊ ခေါ်ပေးမယ်။"],["He's not here right now.","သူ အခု မရှိဘူး။","The person can't come to the phone. Also: She's out.","Sorry, he's not here right now. He'll be back at six.","ဆောရီး၊ သူ အခု မရှိဘူး။ ခြောက်နာရီ ပြန်ရောက်မယ်။"],["Can I take a message?","မှာစရာ ရှိရင် မှာထားခဲ့မလား။","You offer to tell the person what the caller said.","She's at school. Can I take a message?","သူ ကျောင်းသွားနေတယ်။ မှာစရာ ရှိရင် မှာထားခဲ့မလား။"],["Can you ask her to call me back?","ကျွန်တော့်/ကျွန်မ ဆီ ဖုန်းပြန်ဆက်ဖို့ ပြောပေးလို့ ရမလား။","Leaves a message. Call back = phone again later.","Can you ask her to call me back? It's Mia.","ကျွန်မဆီ ဖုန်းပြန်ဆက်ဖို့ ပြောပေးလို့ ရမလား။ မီယာ ပါ။"]]},{"en":"Problems on the line","my":"လိုင်း အခက်အခဲများ","desc":"Bad signal, wrong number, low battery.","cards":[["Sorry, wrong number.","ဆောရီး၊ နံပါတ် မှားနေတယ်။","When someone calls the wrong person, or you do. Also: I think you have the wrong number.","— Is this the pizza shop? — Sorry, wrong number.","— ဒါ ပီဇာဆိုင်လား။ — ဆောရီး၊ နံပါတ် မှားနေတယ်။"],["You're breaking up.","အသံ ပြတ်ပြတ်နေတယ်။","The signal is bad and the voice keeps cutting out.","Sorry, you're breaking up. Can you say that again?","ဆောရီး၊ အသံ ပြတ်ပြတ်နေတယ်။ ပြန်ပြောပေးလို့ ရမလား။"],["I can't hear you very well.","အသံ သိပ် မကြားရဘူး။","It's too quiet or too noisy where you are.","I can't hear you very well. I'm on the bus.","အသံ သိပ် မကြားရဘူး။ ဘတ်စ်ကားပေါ်မှာ ရောက်နေလို့။"],["My battery is low.","ဖုန်း အားကုန်ခါနီးပြီ။","Warns that the call may end suddenly.","Quick, my battery is low!","မြန်မြန်ပြော၊ ဖုန်း အားကုန်ခါနီးပြီ။"],["Can I call you back?","ဖုန်း ပြန်ဆက်လို့ ရမလား။","When you can't talk now. Add when: in ten minutes, after dinner.","I'm in class. Can I call you back later?","စာသင်ခန်းထဲမှာ ရှိနေတယ်။ နောက်မှ ဖုန်း ပြန်ဆက်လို့ ရမလား။"]]},{"en":"Ending a call","my":"ဖုန်းခေါ်ဆိုမှု အဆုံးသတ်ခြင်း","desc":"Finishing the call in a friendly way.","cards":[["Thanks for calling.","ဖုန်းဆက်တဲ့အတွက် ကျေးဇူးပါ။","Polite, near the end of a call.","Thanks for calling, Grandpa. Love you!","ဖုန်းဆက်တဲ့အတွက် ကျေးဇူးပါ အဖိုး။ ချစ်တယ်။"],["Call me when you get home.","အိမ်ရောက်ရင် ဖုန်းဆက်နော်။","Parents and friends say this to know you are safe.","Have a safe trip. Call me when you get home.","ခရီး ချောမောပါစေ။ အိမ်ရောက်ရင် ဖုန်းဆက်နော်။"],["Bye, speak soon!","တာ့တာ၊ မကြာခင် ပြန်ပြောမယ်။","A friendly goodbye on the phone. British English often says speak to you soon.","OK, bye, speak soon!","အိုကေ၊ တာ့တာ၊ မကြာခင် ပြန်ပြောမယ်။"],["I'll text you.","မက်ဆေ့ချ် ပို့လိုက်မယ်။","Text = send a written message on the phone. Also: I'll message you.","I'll text you the time later.","အချိန်ကို နောက်မှ မက်ဆေ့ချ် ပို့လိုက်မယ်။"]]},{"en":"Messages and video calls","my":"မက်ဆေ့ချ်နှင့် ဗီဒီယိုကော","desc":"Phrases for chat apps and video calls.","cards":[["Did you get my message?","ကျွန်တော့်/ကျွန်မ မက်ဆေ့ချ် ရလား။","Checks that a message arrived.","Did you get my message about tomorrow?","မနက်ဖြန်အကြောင်း ပို့ထားတဲ့ မက်ဆေ့ချ် ရလား။"],["Can you see me?","ကျွန်တော့်/ကျွန်မ ကို မြင်ရလား။","At the start of a video call.","Can you see me? Is the camera on?","ကျွန်မကို မြင်ရလား။ ကင်မရာ ဖွင့်ထားလား။"],["You're on mute.","အသံ ပိတ်ထားတယ်။","The other person's microphone is off, so you can't hear them.","I can't hear you. You're on mute!","အသံ မကြားရဘူး။ အသံ ပိတ်ထားတယ်။"],["Send me a voice message.","အသံ မက်ဆေ့ချ် ပို့ပေး။","A recorded spoken message in a chat app.","I'm driving. Send me a voice message.","ကား မောင်းနေတယ်။ အသံ မက်ဆေ့ချ် ပို့ပေး။"],["I'll send you the address.","လိပ်စာ ပို့ပေးမယ်။","Promises to send written details: the address, the time, a photo.","I'll send you the address after this call.","ဖုန်းချပြီးရင် လိပ်စာ ပို့ပေးမယ်။"]]}];</script>
