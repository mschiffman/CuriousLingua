<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/greet_goodbye/";const AUD_EXT="mp3?v=2611090647";const categories=[{"en":"Saying hello","my":"တွေ့တွေ့ချင်း နှုတ်ဆက်ခြင်း","desc":"The first words: for friends, for strangers, at any time of day.","cards":[["Hello.","မင်္ဂလာပါ။","လူတကာနဲ့ သုံးလို့ရတယ်။ ဖုန်းထူးရင်လဲ Hello? လို့ထူးတယ်။","Hello? Who's calling, please?","ဟယ်လို။ ဘယ်သူ ဆက်တာလဲ ခင်ဗျာ။",{"es":["Hola.","Se puede usar con todo el mundo. También se contesta el teléfono con Hello?","¿Hola? ¿Quién habla, por favor?"],"fr":["Bonjour.","S'emploie avec tout le monde. On répond aussi au téléphone par Hello?","Allô ? Qui est à l'appareil, s'il vous plaît ?"]}],["Hi!","ဟိုင်း။","ရင်းရင်းနှီးနှီးရှိတယ်။ သူငယ်ချင်းတွေ ၊ အတန်ဖော်တွေ ၊ လုပ်ဖော်ကိုင်ဖက်တွေနဲ့ နေ့တိုင်းသုံးလို့ရတယ်။","Hi, Thida! I didn't see you there.","ဟိုင်း သီတာ။ သီတာ့ကို မမြင်လိုက်ဘူး။",{"es":["¡Hola!","Es amistoso. Se usa todos los días con amigos, compañeros de clase y de trabajo.","¡Hola, Thida! No te había visto."],"fr":["Salut !","Amical. S'emploie tous les jours avec les amis, les camarades de classe et les collègues.","Salut, Thida ! Je ne t'avais pas vue."]}],["Good morning.","မင်္ဂလာနံနက်ခင်းပါ။","၁၂ နာရီအထိသုံးလို့ရတယ်။ hi ထက်ယဥ်ကျေးတယ်။ ဆရာ(မ)တွေ ၊ အလုပ်ရှင်တွေ နဲ့ စျေးဝယ်လာသူတွေကို သုံးတယ်။ သူငယ်ချင်း အချင်းချင်းတော့ Morning! လို့ဘဲပြောတယ်။","Good morning, everyone. Please sit down.","မင်္ဂလာနံနက်ခင်းပါ အားလုံးပဲ။ ထိုင်ကြပါ။",{"es":["Buenos días.","Hasta las 12. Es más cortés que hi: se usa con profesores, jefes y clientes. Entre amigos se dice solo Morning!","Buenos días a todos. Siéntense, por favor."],"fr":["Bonjour. (le matin)","Jusqu'à midi. Plus poli que hi : avec les professeurs, les patrons et les clients. Entre amis, on dit simplement Morning!","Bonjour à tous. Asseyez-vous, je vous prie."]}],["Good afternoon.","မင်္ဂလာနေ့လယ်ခင်းပါ။","၁၂ နာရီက ၆ နာရီအထိ သုံးတယ်။ ယဥ်ကျေးတယ်။ သူငယ်ချင်းအချင်းချင်းကြားထဲမှာ မသုံးဘူး။","Good afternoon. Can I help you?","မင်္ဂလာနေ့လယ်ခင်းပါ။ ဘာကူညီပေးရမလဲ ခင်ဗျာ။",{"es":["Buenas tardes.","De las 12 a las 6. Es cortés; entre amigos no se usa.","Buenas tardes. ¿En qué puedo ayudarle?"],"fr":["Bonjour. (l'après-midi)","De midi à 18 heures. Poli ; ne s'emploie pas entre amis.","Bonjour. Je peux vous aider ?"]}],["Good evening.","မင်္ဂလာညနေခင်းပါ။","၆ နာရီကျော်မှာ စစချင်းရောက်လာရင် ဒီလိုနှုတ်ဆက်ပါ။. hello ပေါ့နော် ၊ goodbye မဟုတ်ဘူး။ ညမှာ goodbye ပြောချင်ရင် Good night လို့ပြောပါ။","Good evening. A table for two, please.","မင်္ဂလာညနေခင်းပါ။ နှစ်ယောက်စာ စားပွဲတစ်လုံး ပေးပါ။",{"es":["Buenas noches. (al llegar)","Después de las 6, para saludar al llegar. Es un hola, no un adiós: para despedirse de noche se dice Good night.","Buenas noches. Una mesa para dos, por favor."],"fr":["Bonsoir.","Après 18 heures, pour saluer en arrivant. C'est un bonjour, pas un au revoir : pour prendre congé le soir, on dit Good night.","Bonsoir. Une table pour deux, s'il vous plaît."]}],["Hey!","ဟေး။","သိပ်ရင်းနှီးတဲ့ သူငယ်ချင်းတွေနဲ့ သုံးတယ်။ တစိမ်းကို Hey! လို့အော်ပြောတာက ရိုင်းတယ်။ တစိမ်းဆိုရင် Excuse me လို့သုံးပါ။","Hey, Aung! Wait for me!","ဟေး အောင်။ စောင့်ဦး။",{"es":["¡Oye! / ¡Hola!","Con amigos muy cercanos. Gritarle Hey! a un desconocido es de mala educación: con desconocidos se dice Excuse me.","¡Oye, Aung! ¡Espérame!"],"fr":["Hé ! / Salut !","Avec des amis très proches. Crier Hey! à un inconnu est impoli : à un inconnu, on dit Excuse me.","Hé, Aung ! Attends-moi !"]}]],"tr":{"es":["Saludar","Las primeras palabras: para amigos, para desconocidos, a cualquier hora del día."],"fr":["Saluer","Les premiers mots : pour les amis, pour les inconnus, à toute heure de la journée."]}},{"en":"How are you?","my":"နေကောင်းလား","desc":"The question after hello. Most of the time it is part of the greeting, not a real question.","cards":[["How are you?","နေကောင်းလား။","တွေ့တွေ့ချင်း နှုတ်ဆက်စကားပါ။ တိုတိုဘဲပြန်ဖြေပါ။","Hi, Tom. How are you?","ဟိုင်း တွမ်။ နေကောင်းလား။",{"es":["¿Cómo estás?","Es un saludo al encontrarse. Se responde en pocas palabras.","Hola, Tom. ¿Cómo estás?"],"fr":["Comment ça va ?","C'est une salutation. On y répond en quelques mots.","Salut, Tom. Comment ça va ?"]}],["Good, thanks. And you?","နေကောင်းပါတယ်၊ ကျေးဇူးပါ။ ခင်ဗျား/ရှင်ရော။","သာမန်ပြန်ဖြေတဲ့ စကားပါ။ I'm fine, thank you. ကမှန်ပေမယ့် စာအုပ်ကြီးအတိုင်း ပြောတဲ့အသံပေါက်ပါတယ်။ အမြဲ  And you? ဒါမှမဟုတ် You? လို့ပြန်မေးပါ။ မမေးရင် အေးဆက်ဆက်နိုင်ရာကျပါတယ်။","— How are you? — Good, thanks. And you?","— နေကောင်းလား။ — နေကောင်းပါတယ်၊ ကျေးဇူးပါ။ ခင်ဗျားရော။",{"es":["Bien, gracias. ¿Y tú?","Es la respuesta habitual. I'm fine, thank you. es correcto, pero suena a libro de texto. Siempre se devuelve la pregunta con And you? o You?; no hacerlo resulta frío.","— ¿Cómo estás? — Bien, gracias. ¿Y tú?"],"fr":["Bien, merci. Et toi ?","C'est la réponse habituelle. I'm fine, thank you. est correct, mais fait très manuel scolaire. On renvoie toujours la question avec And you? ou You? ; sinon, cela paraît froid.","— Comment ça va ? — Bien, merci. Et toi ?"]}],["How's it going?","ဘယ်လိုလဲ၊ အဆင်ပြေလား။","နေကောင်းလား” လို့ ရင်းရင်းနှီးနှီး ၊ ပေါ့ပေါ့ပါးပါး မေးတဲ့ စကားပါ။ Good, thanks. ဒါမှမဟုတ် Not bad. လို့ပြန်ဖြေပါ။","Hey, Sarah! How's it going?","ဟေး ဆယ်ရာ။ ဘယ်လိုလဲ၊ အဆင်ပြေလား။",{"es":["¿Qué tal? / ¿Cómo te va?","Una manera amistosa e informal de preguntar cómo estás. Se responde Good, thanks. o Not bad.","¡Hola, Sarah! ¿Qué tal?"],"fr":["Ça va ? / Comment ça se passe ?","Une façon amicale et décontractée de demander comment ça va. On répond Good, thanks. ou Not bad.","Salut, Sarah ! Ça va ?"]}],["What's up?","ဘာထူးလဲ။","သူငယ်ချင်း အချင်းချင်းကြား မေးတဲ့စကားပါ။ အဓိပ္ပာယ်က What's new? ဘာထူးသေးလဲ လို့မေးတာပါ။ Not much. You? လို့ပြန်ဖြေပါ။","— What's up? — Not much. You?","— ဘာထူးလဲ။ — ဘာမှမထူးပါဘူး။ မင်းရော။",{"es":["¿Qué hay de nuevo?","Entre amigos. Quiere decir What's new?, ¿qué hay de nuevo? Se responde Not much. You?","— ¿Qué hay de nuevo? — No mucho. ¿Y tú?"],"fr":["Quoi de neuf ?","Entre amis. Cela veut dire What's new?, quoi de neuf ? On répond Not much. You?","— Quoi de neuf ? — Pas grand-chose. Et toi ?"]}],["Not bad.","မဆိုးပါဘူး။","ကောင်းပါတယ်လို့ ဆိုလိုတာပါ။ Pretty good. လို့ပြောလဲ ရပါတယ်။","— How was your weekend? — Not bad, thanks.","— ပိတ်ရက်က ဘယ်လိုလဲ။ — မဆိုးပါဘူး၊ ကျေးဇူးပါ။",{"es":["Nada mal.","Quiere decir que todo va bien. También se puede decir Pretty good.","— ¿Qué tal tu fin de semana? — Nada mal, gracias."],"fr":["Pas mal.","Cela veut dire que ça va bien. On peut dire aussi Pretty good.","— C'était comment, ton week-end ? — Pas mal, merci."]}],["Not so good.","သိပ်မကောင်းဘူး။","သူငယ်ချင်း ၊ မိသားစု တွေကို ပွင့်ပွင့်လင်းလင်း ပြန်ဖြေတာပါ။ သူတို့က် What's wrong? ဘာဖြစ်တာလဲလို့ ဆက်မေးပါလိမ့်မယ်။ တစိမ်းတွေနဲ့တော့ Fine. လို့ဘဲပြောပါ။","— How are you? — Not so good. I have a cold.","— နေကောင်းလား။ — သိပ်မကောင်းဘူး။ အအေးမိနေတယ်။",{"es":["No muy bien.","Una respuesta sincera, para amigos y familia; enseguida te preguntarán What's wrong?, ¿qué te pasa? Con desconocidos se dice simplemente Fine.","— ¿Cómo estás? — No muy bien. Estoy resfriado."],"fr":["Pas très bien.","Une réponse franche, pour les amis et la famille ; ils demanderont aussitôt What's wrong?, qu'est-ce qui ne va pas ? Avec des inconnus, on dit simplement Fine.","— Comment ça va ? — Pas très bien. J'ai un rhume."]}]],"tr":{"es":["¿Cómo estás?","La pregunta después del hola. Casi siempre es parte del saludo, no una pregunta de verdad."],"fr":["Comment ça va ?","La question après bonjour. La plupart du temps, elle fait partie de la salutation ; ce n'est pas une vraie question."]}},{"en":"Meeting people","my":"တွေ့ဆုံခြင်း","desc":"Meeting someone for the first time, or seeing them again.","cards":[["Nice to meet you.","တွေ့ရတာ ဝမ်းသာပါတယ်။","တစ်ယောက်ယောက်နဲ့ ပထမဆုံးအကြိမ် တွေ့တဲ့အခါမှာပဲ သုံးတယ်။ လက်ဆွဲနှုတ်ဆက်ရင်း ပြောလေ့ရှိတယ်။ ပိုပြီး တရားဝင်ဆန်ချင်ရင် Pleased to meet you. လို့ ပြောနိုင်တယ်။","Hi, I'm Thida. Nice to meet you.","ဟိုင်း၊ ကျွန်မ သီတာပါ။ တွေ့ရတာ ဝမ်းသာပါတယ်။",{"es":["Mucho gusto.","Solo la primera vez que conoces a alguien, a menudo al dar la mano. Más formal: Pleased to meet you.","Hola, soy Thida. Mucho gusto."],"fr":["Enchanté(e).","Seulement la première fois que l'on rencontre quelqu'un, souvent en serrant la main. Plus formel : Pleased to meet you.","Bonjour, je m'appelle Thida. Enchantée."]}],["Nice to meet you too.","ကျွန်တော်/ကျွန်မလည်း တွေ့ရတာ ဝမ်းသာပါတယ်။","တစ်ဖက်လူက Nice to meet you. လို့ ပြောတဲ့အခါ ပြန်ဖြေတဲ့ စကားပါ။ အတိုချုံးပြီး You too. လို့လည်း ပြောနိုင်တယ်။ Nice to meet YOU too. လို့ ပြောတဲ့အခါ YOU ကို အသံဖိပြီး ပြောရတယ်။","— Nice to meet you. — Nice to meet you too.","— တွေ့ရတာ ဝမ်းသာပါတယ်။ — ကျွန်တော်လည်း တွေ့ရတာ ဝမ်းသာပါတယ်။",{"es":["Igualmente. / El gusto es mío.","La respuesta a Nice to meet you. Más corto: You too. Se acentúa YOU: Nice to meet YOU too.","— Mucho gusto. — Igualmente."],"fr":["Moi de même. / Enchanté(e) également.","La réponse à Nice to meet you. Plus court : You too. On accentue YOU : Nice to meet YOU too.","— Enchanté. — Moi de même."]}],["Good to see you.","ပြန်တွေ့ရတာ ဝမ်းသာပါတယ်။","အရင်ကတည်းက သိပြီးသားသူတွေနဲ့ ပြန်တွေ့တဲ့အခါ သုံးတယ်။ မြန်မာလိုမှာ လူသစ်တစ်ယောက်နဲ့ ပထမဆုံး တွေ့တာရော၊ သိပြီးသားသူနဲ့ ပြန်တွေ့တာရော ဆင်တူတဲ့ စကားလုံးတွေ သုံးနိုင်ပေမဲ့ အင်္ဂလိပ်လိုမှာ မတူဘူး။ မိတ်ဆွေဟောင်းတစ်ယောက်ကို Nice to meet you. လို့ ပြောရင် သူ့ကို မမှတ်မိတော့သလို ဖြစ်သွားနိုင်တယ်။","Hello, Aung! Good to see you again.","မင်္ဂလာပါ အောင်။ ပြန်တွေ့ရတာ ဝမ်းသာပါတယ်။",{"es":["Qué gusto verte.","Para alguien que ya conoces. El inglés distingue conocer (meet) y volver a ver (see): decirle Nice to meet you a un viejo amigo suena como si no lo recordaras.","¡Hola, Aung! Qué gusto verte de nuevo."],"fr":["Content(e) de te voir.","Pour quelqu'un que l'on connaît déjà. L'anglais distingue rencontrer (meet) et revoir (see) : dire Nice to meet you à un vieil ami donne l'impression qu'on ne le reconnaît pas.","Bonjour, Aung ! Content de te revoir."]}],["Long time no see!","မတွေ့တာ ကြာပြီနော်။","လပေါင်းများစွာ၊ ဒါမှမဟုတ် နှစ်ပေါင်းများစွာ မတွေ့ဖြစ်တဲ့ သူငယ်ချင်းနဲ့ ပြန်တွေ့တဲ့အခါ ရင်းရင်းနှီးနှီး၊ နွေးနွေးထွေးထွေး ပြောတဲ့ စကားပါ။ သဒ္ဒါပုံစံက ထူးဆန်းပေမဲ့ လူတိုင်းလိုလို သုံးကြတယ်။","Thida! Long time no see!","သီတာ။ မတွေ့တာ ကြာပြီနော်။",{"es":["¡Cuánto tiempo sin verte!","Cálido y familiar, para un amigo al que no ves desde hace meses o años. La gramática es rara, pero casi todo el mundo lo dice.","¡Thida! ¡Cuánto tiempo sin verte!"],"fr":["Ça fait longtemps !","Chaleureux et familier, pour un ami que l'on n'a pas vu depuis des mois ou des années. La grammaire est bizarre, mais presque tout le monde le dit.","Thida ! Ça fait longtemps !"]}],["How have you been?","အခုတလော နေကောင်းရဲ့လား။","မတွေ့တာ အတော်ကြာတဲ့သူကို How are you? ဆိုတဲ့ သဘောမျိုး မေးတဲ့ စကားပါ။ စကားပြောတဲ့အခါ How've you been? လို့ အတိုချုံးပြီး ပြောလေ့ရှိတယ်။ ပြန်ဖြေတဲ့အခါ Good! Busy, but good. (ကောင်းပါတယ်။ အလုပ်တော့ များတယ်၊ ဒါပေမဲ့ အဆင်ပြေပါတယ်။) လို့ ပြောနိုင်တယ်။","— How have you been? — Busy, but good. You?","— အခုတလော နေကောင်းရဲ့လား။ — အလုပ်များနေတယ်၊ ဒါပေမဲ့ အဆင်ပြေပါတယ်။ မင်းရော။",{"es":["¿Cómo has estado?","Es el How are you? para alguien a quien no ves desde hace tiempo. Al hablar se acorta: How've you been? Se puede responder Good! Busy, but good.","— ¿Cómo has estado? — Con mucho trabajo, pero bien. ¿Y tú?"],"fr":["Comment vas-tu depuis le temps ?","C'est le How are you? pour quelqu'un que l'on n'a pas vu depuis longtemps. À l'oral, on abrège : How've you been? On peut répondre Good! Busy, but good.","— Comment vas-tu depuis le temps ? — Débordé, mais ça va. Et toi ?"]}]],"tr":{"es":["Conocer a alguien","Conocer a alguien por primera vez, o volver a verlo."],"fr":["Faire connaissance","Rencontrer quelqu'un pour la première fois, ou le revoir."]}},{"en":"Saying goodbye","my":"ပြန်ခါနီး နှုတ်ဆက်ခြင်း","desc":"Leaving: from a quick bye to a warm take care.","cards":[["Goodbye.","နှုတ်ဆက်ပါတယ်။","ဒီလိုပြောတာ မှန်ပေမဲ့ နည်းနည်း အေးဆက်ဆက်နဲ့ နောက်တစ်ခါ မတွေ့တော့သလို ခံစားရစေတယ်။ နေ့စဉ်သုံးမှာတော့ Bye! ဒါမှမဟုတ် See you! လို့ပဲ ပြောလေ့ရှိကြတယ်။","Goodbye, and thank you for coming.","နှုတ်ဆက်ပါတယ်၊ လာတဲ့အတွက် ကျေးဇူးတင်ပါတယ်။",{"es":["Adiós.","Es correcto, pero algo frío, como si no fueran a verse más. En el día a día se dice Bye! o See you!","Adiós, y gracias por venir."],"fr":["Au revoir.","Correct, mais un peu froid, comme si l'on n'allait plus se revoir. Au quotidien, on dit plutôt Bye! ou See you!","Au revoir, et merci d'être venu."]}],["Bye!","ဘိုင်ဘိုင်။","နေ့စဉ်သုံး နှုတ်ဆက်စကားပါ။ သူငယ်ချင်းတွေနဲ့ ခွဲခွာတဲ့အခါ၊ ဆိုင်က ထွက်တဲ့အခါ၊ ဖုန်းချတဲ့အခါတွေမှာ သုံးတယ်။ Bye-bye! က ပိုနူးညံ့ပြီး ဖော်ရွေတယ်။ ကလေးတွေကို နှုတ်ဆက်တဲ့အခါမှာလည်း သုံးတယ်။","OK, bye! See you on Monday.","အိုကေ၊ ဘိုင်ဘိုင်။ တနင်္လာနေ့ တွေ့မယ်။",{"es":["¡Chao! / ¡Adiós!","La despedida de todos los días: al dejar a los amigos, al salir de una tienda, al colgar el teléfono. Bye-bye! es más suave y cariñoso; también se les dice a los niños.","Bueno, ¡chao! Nos vemos el lunes."],"fr":["Salut ! / Ciao !","L'au revoir de tous les jours : en quittant des amis, en sortant d'un magasin, en raccrochant. Bye-bye! est plus doux et plus affectueux ; on le dit aussi aux enfants.","OK, salut ! À lundi."]}],["See you later.","နောက်မှ တွေ့မယ်။","နောက်တစ်ခါ တွေ့ဖို့ အစီအစဉ် မရှိသေးရင်တောင် ဖော်ဖော်ရွေရွေ နှုတ်ဆက်တဲ့ စကားပါ။ အတိုချုံးပြီး See you! လို့လည်း ပြောနိုင်တယ်။ ရင်းနှီးတဲ့သူတွေနဲ့ စာတိုပို့တဲ့အခါ See ya! လို့လည်း ရေးကြတယ်။","I'm going home now. See you later!","အိမ်ပြန်တော့မယ်။ နောက်မှ တွေ့မယ်နော်။",{"es":["Hasta luego.","Una despedida amistosa, aunque no haya planes de volver a verse. Más corto: See you! En mensajes entre amigos también se escribe See ya!","Ya me voy a casa. ¡Hasta luego!"],"fr":["À plus tard.","Un au revoir amical, même sans projet de se revoir. Plus court : See you! Dans les textos entre amis, on écrit aussi See ya!","Je rentre chez moi. À plus tard !"]}],["See you tomorrow.","မနက်ဖြန် တွေ့မယ်။","တွေ့မယ့်အချိန်ကို ပြောင်းပြီး ပြောနိုင်တယ်။ ဥပမာ See you on Friday. (သောကြာနေ့ တွေ့မယ်။)၊ See you next week. (နောက်အပတ် တွေ့မယ်။)၊ See you soon. (မကြာခင် ပြန်တွေ့မယ်။) လို့ ပြောနိုင်တယ်။","Thanks for today. See you tomorrow!","ဒီနေ့အတွက် ကျေးဇူးပါ။ မနက်ဖြန် တွေ့မယ်။",{"es":["Hasta mañana.","Se puede cambiar el momento: See you on Friday. (Hasta el viernes.) See you next week. (Hasta la próxima semana.) See you soon. (Hasta pronto.)","Gracias por lo de hoy. ¡Hasta mañana!"],"fr":["À demain.","On peut changer le moment : See you on Friday. (À vendredi.) See you next week. (À la semaine prochaine.) See you soon. (À bientôt.)","Merci pour aujourd'hui. À demain !"]}],["Have a nice day.","ကောင်းသောနေ့လေး ဖြစ်ပါစေ။","ဆိုင်ဝန်ထမ်းတွေနဲ့ စားပွဲထိုးတွေ မကြာခဏ ပြောလေ့ရှိတဲ့ စကားပါ။ ပြန်ဖြေတဲ့အခါ Thanks, you too! (ကျေးဇူးပါ၊ ခင်ဗျားလည်း ဒီလိုပဲ ဖြစ်ပါစေ။) လို့ ပြောနိုင်တယ်။ Have a good weekend. (စနေ၊ တနင်္ဂနွေ ပိတ်ရက်လေးမှာ ပျော်ရွှင်ပါစေ။) လို့လည်း ပြောနိုင်တယ်။","— Here's your change. Have a nice day! — Thanks, you too!","— ပြန်အမ်းငွေပါ။ ကောင်းသောနေ့လေး ဖြစ်ပါစေ။ — ကျေးဇူးပါ၊ ခင်ဗျားလည်း ဒီလိုပဲ ဖြစ်ပါစေ။",{"es":["Que tenga un buen día.","Lo dicen a menudo los empleados de las tiendas y los meseros. Se responde Thanks, you too! (Gracias, igualmente.) También: Have a good weekend. (Buen fin de semana.)","— Aquí tiene su cambio. ¡Que tenga un buen día! — ¡Gracias, igualmente!"],"fr":["Bonne journée.","Souvent dit par les vendeurs et les serveurs. On répond Thanks, you too! (Merci, vous aussi !) Autre formule : Have a good weekend. (Bon week-end.)","— Voici votre monnaie. Bonne journée ! — Merci, vous aussi !"]}],["Take care.","ဂရုစိုက်နော်။","မိသားစုဝင်တွေ၊ သူငယ်ချင်းတွေ၊ နေမကောင်းတဲ့သူတွေ၊ ခရီးသွားမယ့်သူတွေကို နွေးနွေးထွေးထွေး နှုတ်ဆက်တဲ့ စကားပါ။ ပြန်ဖြေတဲ့အခါ You too! (နင်လည်း ဂရုစိုက်နော်။) လို့ ပြောနိုင်တယ်။","Have a safe trip. Take care!","ခရီးသွားတာ ချောချောမောမော ဖြစ်ပါစေ။ ဂရုစိုက်နော်။",{"es":["Cuídate.","Una despedida cálida para la familia, los amigos, alguien que está enfermo o que sale de viaje. Se responde You too! (Tú también.)","Buen viaje. ¡Cuídate!"],"fr":["Prends soin de toi.","Un au revoir chaleureux pour la famille, les amis, une personne malade ou qui part en voyage. On répond You too! (Toi aussi !)","Bon voyage. Prends soin de toi !"]}],["Good night.","ကောင်းသောညပါ။","ညဘက် ခွဲခွာတဲ့အခါ၊ ဒါမှမဟုတ် အိပ်ရာဝင်ခါနီးမှာပဲ နှုတ်ဆက်ဖို့ သုံးတယ်။ တွေ့တဲ့အခါ နှုတ်ဆက်ဖို့ မသုံးဘူး။ ညနေဘက် တစ်ယောက်ယောက်နဲ့ တွေ့တဲ့အခါ Good evening. လို့ ပြောရတယ်။","It's late. Good night, everyone!","နောက်ကျပြီ။ အားလုံးပဲ ကောင်းသောညပါ။",{"es":["Buenas noches. (al despedirse)","Solo para despedirse de noche o al irse a dormir; no sirve para saludar. Al encontrarte con alguien por la noche se dice Good evening.","Ya es tarde. ¡Buenas noches a todos!"],"fr":["Bonne nuit.","Seulement pour se quitter le soir ou au moment d'aller se coucher ; pas pour saluer. Quand on retrouve quelqu'un le soir, on dit Good evening.","Il est tard. Bonne nuit, tout le monde !"]}]],"tr":{"es":["Despedirse","Irse: desde un bye rápido hasta un take care cálido."],"fr":["Dire au revoir","Partir : d'un bye rapide à un take care chaleureux."]}},{"en":"Ending a conversation","my":"စကားပြောတာ အဆုံးသတ်ခြင်း","desc":"Leaving politely, so the goodbye doesn't feel sudden.","cards":[["I have to go.","သွားရတော့မယ်။","စကားပြောတာ အဆုံးသတ်လိုက်တာပါ။ ပိုပြီးယဥ်ကျေးချင်ရင် Sorry, I have to go. ဒါမှမဟုတ် I'd better go. လို့ပြောပါ။","Oh, it's three o'clock! I have to go.","အိုး၊ သုံးနာရီ ထိုးပြီ။ သွားရတော့မယ်။",{"es":["Me tengo que ir.","Pone fin a la conversación. Más cortés: Sorry, I have to go. o I'd better go.","¡Ay, son las tres! Me tengo que ir."],"fr":["Je dois y aller.","Met fin à la conversation. Plus poli : Sorry, I have to go. ou I'd better go.","Oh, il est trois heures ! Je dois y aller."]}],["It was nice meeting you.","တွေ့ရတာ ဝမ်းသာပါတယ်။","ပထမဆုံးတွေ့တဲ့သူကို ပြန်ခါနီး ပြောတဲ့စကားပါ။ စစတွေ့ချင်းတော့ Nice to meet you လို့ပြောပါ။","Well, it was nice meeting you. Bye!","ကဲ၊ တွေ့ရတာ ဝမ်းသာပါတယ်။ ဘိုင်ဘိုင်။",{"es":["Fue un gusto conocerte.","Se dice al despedirse de alguien que acabas de conocer. Al principio del encuentro se dice Nice to meet you.","Bueno, fue un gusto conocerte. ¡Chao!"],"fr":["Ravi(e) d'avoir fait votre connaissance.","Se dit en quittant une personne rencontrée pour la première fois. Au début de la rencontre, on dit Nice to meet you.","Eh bien, ravi d'avoir fait votre connaissance. Au revoir !"]}],["It was nice talking to you.","စကားပြောရတာ ဝမ်းသာပါတယ်။","သူငယ်ချင်း အချင်းချင်း ဒါမှမဟုတ် ပထမဆုံးတွေ့ဆုံတဲ့သူကို မပြန်ခင်ပြောတဲ့စကား။","It was nice talking to you. Take care!","စကားပြောရတာ ဝမ်းသာပါတယ်။ ဂရုစိုက်နော်။",{"es":["Fue un gusto hablar contigo.","Se dice antes de irse, entre amigos o a alguien que acabas de conocer.","Fue un gusto hablar contigo. ¡Cuídate!"],"fr":["Ça m'a fait plaisir de discuter avec toi.","Se dit avant de partir, entre amis ou à quelqu'un que l'on vient de rencontrer.","Ça m'a fait plaisir de discuter avec toi. Prends soin de toi !"]}],["Talk to you later.","နောက်မှ ပြောမယ်နော်။","စကားပြောပြီး ၊ ဖုန်းပြောပြီး တဲ့အခါပြောတဲ့စကားပါ။ အတိုချုပ်ကိုတော့ TTYL လို့ ဖုန်းမှာရေးပါတယ်။","My bus is here. Talk to you later!","ဘတ်စ်ကား ရောက်လာပြီ။ နောက်မှ ပြောမယ်နော်။",{"es":["Hablamos luego.","Al terminar una conversación o una llamada. En los mensajes se abrevia TTYL.","Ya llegó mi autobús. ¡Hablamos luego!"],"fr":["On se reparle plus tard.","À la fin d'une conversation ou d'un appel. Dans les textos, on abrège en TTYL.","Mon bus arrive. On se reparle plus tard !"]}],["Say hello to Aung for me.","အောင် ကို ကျွန်တော့်/ကျွန်မ ကိုယ်စား နှုတ်ဆက်ပေးပါ။","အယောက်ယောက်ရဲ့ မိသားစု ၊ သူငယ်ချင်းတွေကို နှုတ်ဆက်ပေးခိုင်းတာပါ။ Say hi to ___ for me လို့လဲပြောလို့ရပါတယ်။","Say hello to your parents for me.","မိဘတွေကို ကျွန်တော့်ကိုယ်စား နှုတ်ဆက်ပေးပါ။",{"es":["Salúdame a Aung.","Para pedirle a alguien que salude de tu parte a su familia o a sus amigos. También: Say hi to ___ for me.","Salúdame a tus papás."],"fr":["Passe le bonjour à Aung de ma part.","Pour demander à quelqu'un de saluer sa famille ou ses amis de votre part. On dit aussi : Say hi to ___ for me.","Passe le bonjour à tes parents de ma part."]}]],"tr":{"es":["Terminar una conversación","Irse con cortesía, para que la despedida no se sienta repentina."],"fr":["Mettre fin à une conversation","Partir poliment, pour que l'au revoir ne paraisse pas brusque."]}}];const langs=["my","es","fr"];const COURSE="eng";const quiz=[{"type":"match","cards":["How are you?","Not bad.","What's up?","Long time no see!","Nice to meet you."]},{"type":"match","cards":["See you later.","See you tomorrow.","Take care.","I have to go.","Have a nice day."]},{"type":"match","pairs":{"How are you?":"Good, thanks. And you?","Nice to meet you.":"Nice to meet you too.","What's up?":"Not much. You?","Have a nice day.":"Thanks, you too!","How have you been?":"Good! Busy, but good."}},{"type":"say","scene":"👩‍🏫 Your teacher · ☀️ 9 am · You arrive at class.","my":"မနက် ၉ နာရီ။ စာသင်ခန်းကို ရောက်လာပြီး ဆရာမကို နှုတ်ဆက်မယ်။","answer":"Good morning.","wrong":{"What's up?":["register","သိပ်ရင်းရင်းနှီးနှီးဆန်တယ်။ သူငယ်ချင်းတွေကြားထဲမှာဘဲ သုံးပါ။ ဆရာ(မ) တွေနဲ့မသုံးပါနဲ့။"],"Good evening.":["time","Good evening က ၆ နာရီ ကျော်မှသုံးပါ။ နေ့လည် ၁၂ နာရီမတိုင်ခင်တော့ Good morning လို့ဘဲပြောပါ။"],"Good night.":["moment","Good night က ည ၊ အိပ်ယာဝင်ခါနီး goodbye လို့ပြောတာ။ မင်းကအခုမှရောက်လာတာ။"]},"tr":{"es":{"my":"9 de la mañana. Llegas al salón y saludas a tu maestra.","wrong":{"What's up?":"Demasiado informal. Úsalo solo entre amigos, no con maestros.","Good evening.":"Good evening se usa después de las 6 de la tarde. Antes del mediodía se dice Good morning.","Good night.":"Good night es una despedida, de noche o antes de dormir. Tú apenas vas llegando."}},"fr":{"my":"9 heures du matin. Vous arrivez en classe et saluez votre professeure.","wrong":{"What's up?":"Trop familier. À employer seulement entre amis, pas avec les professeurs.","Good evening.":"Good evening s'emploie après 18 heures. Avant midi, on dit Good morning.","Good night.":"Good night est un au revoir, le soir ou avant d'aller dormir. Vous venez seulement d'arriver."}}}},{"type":"judge","scene":"🛒 2 pm · A customer walks into your shop.","my":"နေ့လယ် ၂ နာရီ။ ဆိုင်ထဲကို ဈေးဝယ်သူတစ်ယောက် ဝင်လာတယ်။","phrase":"Good afternoon.","ok":true,"tag":"time","tr":{"es":{"my":"2 de la tarde. Un cliente entra a tu tienda."},"fr":{"my":"14 heures. Un client entre dans votre magasin."}}},{"type":"say","scene":"🌙 8 pm · 🍽️ At a restaurant · You walk in.","my":"ည ၈ နာရီ။ စားသောက်ဆိုင်ထဲ ဝင်လာတယ်။","answer":"Good evening.","wrong":{"Good night.":"moment","Good afternoon.":["time","Good afternoon က နေ့လည် ၁၂ နာရီကနေ ၆ နာရီအထိ။ ၈ နာရီမှာတော့ Good evening လို့ပြောပါ။"],"Hey!":["register","စားပွဲထိုးကို သိပ်ရင်းနှီးလွန်းတယ်။ Hey! ကသိပ်ရင်းနှီးတဲ့ သူငယ်ချင်းတွေအတွက်ဘဲသုံးပါ။"]},"tr":{"es":{"my":"8 de la noche. Entras a un restaurante.","wrong":{"Good afternoon.":"Good afternoon va del mediodía a las 6 de la tarde. A las 8 se dice Good evening.","Hey!":"Demasiado informal para un mesero. Hey! es solo para amigos cercanos."}},"fr":{"my":"20 heures. Vous entrez dans un restaurant.","wrong":{"Good afternoon.":"Good afternoon va de midi à 18 heures. À 20 heures, on dit Good evening.","Hey!":"Trop familier pour un serveur. Hey! est réservé aux amis proches."}}}},{"type":"reply","prompt":"Nice to meet you.","answer":"Nice to meet you too.","wrong":{"Good to see you.":["moment","Good to see you ကကိုယ်သိတဲ့ သူတွေအတွက်ပါ။ အခုက တစိမ်းကြီး။ ခုမှစတွေ့တာ။"],"Long time no see!":["moment","ဒါက မတွေ့တာကြာပြီဖြစ်တဲ့ သူငယ်ချင်းတွေအတွက်သုံးတာ။ ဒီလူကတော့ အခုမှတွေ့ဘူးတာ။"],"Good, thanks. And you?":["reply","ဒါက How are you? ကိုပြန်ဖြေတဲ့စကား။"]},"tr":{"es":{"wrong":{"Good to see you.":"Good to see you es para gente que ya conoces. Esta persona es un desconocido: la acabas de conocer.","Long time no see!":"Es para amigos que no ves desde hace mucho. A esta persona la acabas de conocer.","Good, thanks. And you?":"Esa es la respuesta a How are you?"}},"fr":{"wrong":{"Good to see you.":"Good to see you s'adresse aux gens que l'on connaît. Ici, c'est e you?","Where are you going?":"Dans certaines langues, on salue en demandant où l'on va. En anglais, cette question paraît indiscrète. Dites How are you?"}}}},{"type":"build","answer":"Have a nice day.","cue":"🛍️ စျေးဝယ်သူက ပြန်တော့မယ်။","decoys":{"be":["literal","မြန်မာစကားမှာ တာ့တာလို့ ပြောတယ်။ အင်္ဂလိပ်စကားမှာတော့ Have a nice day. လို့ပြောတယ်။"]},"tr":{"es":{"cue":"🛍️ El cliente ya se va.","decoys":{"be":"En inglés esta despedida se dice con have: Have a nice day."}},"fr":{"cue":"🛍️ Le client s'en va.","decoys":{"be":"En anglais, cet au revoir se dit avec have : Have a nice day."}}}},{"type":"judge","scene":"🏢 7 pm · You're leaving the office. You say goodbye to your boss.","my":"ည ၇ နာရီ။ ရုံးက ပြန်တော့မယ်။ သူဌေးကို နှုတ်ဆက်တယ်။","phrase":"Good evening.","ok":false,"tag":"moment","note":"Good evening ကရောက်ရောက်ချင်းနှုတ်ဆက်စကားပါ။ ည(နေ)ပိုင်း ပြန်တော့မယ်ဆိုရင် Good night ဒါမှမဟုတ် Have a nice evening ကိုသုံးပါ။","tr":{"es":{"my":"7 de la noche. Te vas de la oficina y te despides de tu jefe.","note":"Good evening es un saludo de llegada. Si te vas por la tarde o la noche, di Good night o Have a nice evening."},"fr":{"my":"19 heures. Vous quittez le bureau et dites au revoir à votre supérieur.","note":"Good evening est une salutation d'arrivée. En partant le soir, dites Good night ou Have a nice evening."}}},{"type":"say","scene":"🏠 At a friend's home · 👴 You met her father today, for the first time · You're leaving.","my":"သူငယ်ချင်းအိမ်မှာ သူ့အဖေနဲ့ ဒီနေ့ ပထမဆုံး တွေ့ခဲ့တယ်။ အခု ပြန်တော့မယ်။","answer":"It was nice meeting you.","wrong":{"Nice to meet you.":["moment","စစချင်းတွေ့ရင် ပြောတဲ့စကားပါ။ It was nice meeting you ကပြန်ခါနီးပြောတဲ့စကားပါ။"],"Long time no see!":["moment","ဒါက မတွေ့ရတာ ကြာပြီဖြစ်တဲ့ သူငယ်ချင်းတွေကို နှုတ်ဆက်တဲ့ စကားပါ။"],"Talk to you later.":["register","သူငယ်ချင်းနဲ့ ဖုန်ပြောပြီး ၊ စကားပြောပြီး အဆုံးမှာပြောတဲ့စကားပါ။"]},"tr":{"es":{"my":"En casa de una amiga conociste hoy a su papá. Ahora ya te vas.","wrong":{"Nice to meet you.":"Se dice
