<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/agree_disagree/";const AUD_EXT="mp3?v=2611170807";const categories=[{"en":"Agreeing","my":"သဘောတူခြင်း","desc":"Everyday ways to say you think the same.","cards":[["I agree.","ကျွန်တော်/ကျွန်မ သဘောတူပါတယ်။","Agree is a verb, so there is no am: I agree, I don't agree. Not: I am agree.","— This street needs more lights. — I agree.","— ဒီလမ်းမှာ မီးတိုင် ပိုလိုတယ်။ — သဘောတူပါတယ်။",{"es":["Estoy de acuerdo.","Agree es un verbo, así que no lleva am: I agree, I don't agree. No: I am agree.","— Esta calle necesita más luces. — Estoy de acuerdo."],"fr":["Je suis d'accord.","Agree est un verbe, donc pas de am : I agree, I don't agree. Pas : I am agree.","— Cette rue a besoin de plus d'éclairage. — Je suis d'accord."]}],["You're right.","ပြောတာ မှန်ပါတယ်။","Says the other person is correct. Warm and simple.","— We should leave early. The traffic is bad on Fridays. — You're right.","— စောစော ထွက်သင့်တယ်။ သောကြာနေ့ဆို ကားကြပ်တယ်။ — ပြောတာ မှန်ပါတယ်။",{"es":["Tienes razón.","Dice que la otra persona está en lo correcto. Cálido y sencillo.","— Deberíamos salir temprano. Los viernes hay mucho tráfico. — Tienes razón."],"fr":["Tu as raison.","Dit que l'autre a raison. Chaleureux et simple.","— On devrait partir tôt. Ça roule mal le vendredi. — Tu as raison."]}],["That's true.","ဟုတ်တယ်။","Agrees with a fact more than an opinion.","— Vegetables are cheaper at the market. — That's true.","— ဈေးမှာ ဟင်းသီးဟင်းရွက်တွေ ပိုဈေးသက်သာတယ်။ — ဟုတ်တယ်။",{"es":["Es cierto.","Aprueba un hecho más que una opinión.","— Las verduras son más baratas en el mercado. — Es cierto."],"fr":["C'est vrai.","Approuve un fait plus qu'une opinion.","— Les légumes sont moins chers au marché. — C'est vrai."]}],["Exactly!","အဲဒါပဲ။","Strong: that's exactly what I mean. Also: Exactly right!","— So we need more time, not more money? — Exactly!","— ဒါဆို ငွေ ပိုလိုတာ မဟုတ်ဘဲ အချိန် ပိုလိုတာပေါ့။ — အဲဒါပဲ။",{"es":["¡Exacto!","Fuerte: eso es justo lo que quiero decir. También: Exactly right!","— Entonces, ¿necesitamos más tiempo, no más dinero? — ¡Exacto!"],"fr":["Exactement !","Fort : c'est exactement ce que je veux dire. On dit aussi : Exactly right!","— Donc il nous faut plus de temps, pas plus d'argent ? — Exactement !"]}],["Good point.","ကောင်းတဲ့ အချက်ပဲ။","When someone says something useful that you hadn't thought of.","— If we go on Sunday, the shops will be closed. — Good point.","— တနင်္ဂနွေ သွားရင် ဆိုင်တွေ ပိတ်နေမယ်။ — ကောင်းတဲ့ အချက်ပဲ။",{"es":["Buen punto.","Cuando alguien dice algo útil que no se te había ocurrido.","— Si vamos el domingo, las tiendas van a estar cerradas. — Buen punto."],"fr":["Bien vu.","Quand quelqu'un dit quelque chose d'utile auquel vous n'aviez pas pensé.","— Si on y va dimanche, les magasins seront fermés. — Bien vu."]}],["So do I.","ကျွန်တော်/ကျွန်မလည်း အဲဒီလိုပဲ။","Agrees with a positive sentence. It copies the helping verb: I can swim → So can I. I'm tired → So am I. Me too is more casual.","— I think the new teacher is great. — So do I.","— ဆရာမ အသစ်က အရမ်းတော်တယ်လို့ ထင်တယ်။ — ကျွန်မလည်း အဲလိုပဲ ထင်တယ်။",{"es":["Yo también.","Coincide con una oración afirmativa. Copia el verbo auxiliar: I can swim → So can I. I'm tired → So am I. Me too es más informal.","— Creo que la maestra nueva es muy buena. — Yo también."],"fr":["Moi aussi.","Approuve une phrase affirmative. On reprend l'auxiliaire : I can swim → So can I. I'm tired → So am I. Me too est plus familier.","— Je trouve que la nouvelle professeure est super. — Moi aussi."]}],["Neither do I.","ကျွန်တော်/ကျွန်မလည်း အဲလို မထင်ဘူး။","Agrees with a negative sentence. Not: So do I or Me too after a no. I can't swim → Neither can I. Me neither is more casual.","— I don't think it's a good idea. — Neither do I.","— အဲဒါ ကောင်းတဲ့ အကြံလို့ မထင်ဘူး။ — ကျွန်မလည်း မထင်ဘူး။",{"es":["Yo tampoco.","Coincide con una oración negativa. No: So do I ni Me too después de un no. I can't swim → Neither can I. Me neither es más informal.","— No creo que sea buena idea. — Yo tampoco."],"fr":["Moi non plus.","Approuve une phrase négative. Pas : So do I ni Me too après une négation. I can't swim → Neither can I. Me neither est plus familier.","— Je ne pense pas que ce soit une bonne idée. — Moi non plus."]}]],"tr":{"es":["Estar de acuerdo","Maneras cotidianas de decir que piensas lo mismo."],"fr":["Être d'accord","Des façons courantes de dire que l'on pense la même chose."]}},{"en":"Strong agreement","my":"အပြည့်အဝ သဘောတူခြင်း","desc":"When you agree completely, or share the same feeling.","cards":[["I totally agree.","လုံးဝ သဘောတူပါတယ်။","Stronger than I agree. Also: I completely agree.","— Children need more time to play outside. — I totally agree.","— ကလေးတွေ အပြင်မှာ ကစားချိန် ပိုလိုတယ်။ — လုံးဝ သဘောတူပါတယ်။",{"es":["Estoy totalmente de acuerdo.","Más fuerte que I agree. También: I completely agree.","— Los niños necesitan más tiempo para jugar afuera. — Estoy totalmente de acuerdo."],"fr":["Je suis tout à fait d'accord.","Plus fort que I agree. On dit aussi : I completely agree.","— Les enfants ont besoin de jouer dehors plus longtemps. — Je suis tout à fait d'accord."]}],["I couldn't agree more.","အပြည့်အဝ သဘောတူပါတယ်။","It sounds negative, but it is the strongest yes: I agree so much that I couldn't agree any more.","— That was the best trip ever. — I couldn't agree more!","— အဲဒီခရီးက အကောင်းဆုံးပဲ။ — အပြည့်အဝ သဘောတူပါတယ်။",{"es":["No podría estar más de acuerdo.","Suena negativo, pero es el sí más fuerte: estoy tan de acuerdo que no podría estarlo más.","— Fue el mejor viaje de todos. — ¡No podría estar más de acuerdo!"],"fr":["Je ne pourrais pas être plus d'accord.","La phrase paraît négative, mais c'est le oui le plus fort : je suis tellement d'accord que je ne pourrais pas l'être davantage.","— C'était le meilleur voyage de tous. — Je ne pourrais pas être plus d'accord !"]}],["You can say that again!","ဟုတ်လိုက်တာ။","Casual and friendly. It doesn't ask you to repeat anything: it means you're so right.","— It's so hot today! — You can say that again!","— ဒီနေ့ အရမ်း ပူတယ်။ — ဟုတ်လိုက်တာ။",{"es":["¡Y que lo digas!","Informal y amistoso. No te pide que repitas nada: significa que tienes toda la razón.","— ¡Qué calor hace hoy! — ¡Y que lo digas!"],"fr":["Ça, tu peux le dire !","Familier et amical. On ne vous demande pas de répéter : cela veut dire que vous avez tellement raison.","— Qu'est-ce qu'il fait chaud aujourd'hui ! — Ça, tu peux le dire !"]}],["Tell me about it!","ပြောမနေနဲ့တော့၊ ကိုယ်တိုင်လည်း ကြုံနေရတာ။","Casual. It doesn't ask for more details: it means I know exactly, the same happened to me. Mostly for shared problems.","— The traffic this morning was terrible. — Tell me about it! I was an hour late.","— ဒီမနက် ကားကြပ်တာ ဆိုးလိုက်တာ။ — ပြောမနေနဲ့တော့။ ကျွန်မ တစ်နာရီ နောက်ကျသွားတယ်။",{"es":["¡Ni me digas!","Informal. No pide más detalles: significa lo sé muy bien, a mí me pasó lo mismo. Sobre todo para problemas compartidos.","— El tráfico de esta mañana estuvo terrible. — ¡Ni me digas! Llegué una hora tarde."],"fr":["À qui le dis-tu !","Familier. On ne demande pas de détails : cela veut dire je sais très bien, il m'est arrivé la même chose. Surtout pour les problèmes partagés.","— La circulation ce matin était épouvantable. — À qui le dis-tu ! J'ai eu une heure de retard."]}],["That's exactly what I think.","ကျွန်တော်/ကျွန်မ ထင်တာလည်း အဲဒါပဲ။","You had the same idea before they said it.","— We should ask the teacher first. — That's exactly what I think.","— ဆရာ့ကို အရင် မေးသင့်တယ်။ — ကျွန်မ ထင်တာလည်း အဲဒါပဲ။",{"es":["Es justo lo que yo pienso.","Tuviste la misma idea antes de que la dijeran.","— Primero deberíamos preguntarle al maestro. — Es justo lo que yo pienso."],"fr":["C'est exactement ce que je pense.","Vous aviez la même idée avant qu'on la dise.","— On devrait d'abord demander au professeur. — C'est exactement ce que je pense."]}]],"tr":{"es":["Totalmente de acuerdo","Cuando estás completamente de acuerdo, o sientes lo mismo."],"fr":["Tout à fait d'accord","Quand on est entièrement d'accord, ou que l'on ressent la même chose."]}},{"en":"Partly agreeing","my":"တစ်စိတ်တစ်ပိုင်း သဘောတူခြင်း","desc":"Yes, but… Agreeing with one part before you add your own view.","cards":[["That's true, but…","ဟုတ်တော့ ဟုတ်တယ်၊ ဒါပေမဲ့…","The most common way to disagree kindly: agree first, then give the other side.","— The big phone has a better camera. — That's true, but it's very expensive.","— ဖုန်းအကြီးက ကင်မရာ ပိုကောင်းတယ်။ — ဟုတ်တော့ ဟုတ်တယ်၊ ဒါပေမဲ့ အရမ်း ဈေးကြီးတယ်။",{"es":["Es cierto, pero…","La manera más común de discrepar con amabilidad: primero das la razón y luego dices el otro lado.","— El teléfono grande tiene mejor cámara. — Es cierto, pero es muy caro."],"fr":["C'est vrai, mais…","La façon la plus courante d'exprimer gentiment un désaccord : approuver d'abord, puis donner l'autre point de vue.","— Le grand téléphone a un meilleur appareil photo. — C'est vrai, mais il est très cher."]}],["I see what you mean, but…","ဆိုလိုတာကို နားလည်ပါတယ်၊ ဒါပေမဲ့…","Shows you listened before you disagree. Also: I see your point, but…","I see what you mean, but I still think we should wait.","ဆိုလိုတာကို နားလည်ပါတယ်၊ ဒါပေမဲ့ စောင့်သင့်တယ်လို့ပဲ ထင်နေတုန်းပါ။",{"es":["Entiendo lo que dices, pero…","Muestra que escuchaste antes de discrepar. También: I see your point, but…","Entiendo lo que dices, pero sigo pensando que deberíamos esperar."],"fr":["Je vois ce que tu veux dire, mais…","Montre que vous avez écouté avant de vous opposer. On dit aussi : I see your point, but…","Je vois ce que tu veux dire, mais je pense toujours qu'on devrait attendre."]}],["I agree up to a point.","တစ်စိတ်တစ်ပိုင်းတော့ သဘောတူပါတယ်။","You agree with some of it, not all. A little formal: good for class and meetings. Follow it with but…","— Money makes people happy. — I agree up to a point, but health is more important.","— ငွေက လူတွေကို ပျော်စေတယ်။ — တစ်စိတ်တစ်ပိုင်းတော့ သဘောတူပါတယ်၊ ဒါပေမဲ့ ကျန်းမာရေးက ပိုအရေးကြီးတယ်။",{"es":["Estoy de acuerdo hasta cierto punto.","Estás de acuerdo con una parte, no con todo. Un poco formal: bueno para la clase y las reuniones. Síguelo con but…","— El dinero hace feliz a la gente. — Estoy de acuerdo hasta cierto punto, pero la salud es más importante."],"fr":["Je suis d'accord jusqu'à un certain point.","Vous approuvez une partie, pas tout. Un peu formel : bien en classe et en réunion. Faites suivre de but…","— L'argent rend les gens heureux. — Je suis d'accord jusqu'à un certain point, mais la santé compte davantage."]}],["Maybe, but…","ဖြစ်ချင် ဖြစ်မယ်၊ ဒါပေမဲ့…","Accepts the idea as possible, then adds a different view.","— The bus is faster. — Maybe, but the train is more comfortable.","— ဘတ်စ်ကားက ပိုမြန်တယ်။ — ဖြစ်ချင် ဖြစ်မယ်၊ ဒါပေမဲ့ ရထားက ပိုသက်သောင့်သက်သာ ရှိတယ်။",{"es":["Puede ser, pero…","Acepta la idea como posible y luego agrega otro punto de vista.","— El autobús es más rápido. — Puede ser, pero el tren es más cómodo."],"fr":["Peut-être, mais…","Admet que l'idée est possible, puis ajoute un autre point de vue.","— Le bus est plus rapide. — Peut-être, mais le train est plus confortable."]}],["Fair enough.","ဒါဆိုလည်း ဟုတ်ပါတယ်။","You accept someone's reason, even if you didn't agree at first.","— I can't come tonight. I have an exam tomorrow. — Fair enough.","— ဒီည လာလို့ မရဘူး။ မနက်ဖြန် စာမေးပွဲ ရှိတယ်။ — ဒါဆိုလည်း ဟုတ်ပါတယ်။",{"es":["Me parece justo.","Aceptas el motivo de alguien, aunque al principio no estabas de acuerdo.","— Hoy en la noche no puedo ir. Mañana tengo examen. — Me parece justo."],"fr":["Ça se comprend.","Vous acceptez la raison de quelqu'un, même si vous n'étiez pas d'accord au départ.","— Je ne peux pas venir ce soir. J'ai un examen demain. — Ça se comprend."]}],["I suppose you're right.","မှန်မယ် ထင်ပါတယ်။","Agreeing slowly, or a little unwillingly.","— We can't buy a new car this year. — I suppose you're right.","— ဒီနှစ် ကားအသစ် မဝယ်နိုင်ဘူး။ — မှန်မယ် ထင်ပါတယ်။",{"es":["Supongo que tienes razón.","Dar la razón poco a poco, o con algo de desgana.","— Este año no podemos comprar un coche nuevo. — Supongo que tienes razón."],"fr":["Tu as sans doute raison.","Donner raison lentement, ou un peu à contrecœur.","— On ne peut pas acheter une nouvelle voiture cette année. — Tu as sans doute raison."]}]],"tr":{"es":["De acuerdo en parte","Sí, pero… Dar la razón en una parte antes de agregar tu punto de vista."],"fr":["D'accord en partie","Oui, mais… Approuver une partie avant d'ajouter son propre point de vue."]}},{"en":"Disagreeing politely","my":"ယဉ်ယဉ်ကျေးကျေး သဘောမတူခြင်း","desc":"Saying you think differently, without starting an argument.","cards":[["I'm not so sure.","ကျွန်တော်/ကျွန်မကတော့ သိပ်မသေချာဘူး။","The softest way to disagree. Then give your reason.","— This road is quicker. — I'm not so sure. It's very busy at this time.","— ဒီလမ်းက ပိုမြန်တယ်။ — သိပ်မသေချာဘူး။ ဒီအချိန်ဆို ကားအရမ်းများတယ်။",{"es":["No estoy tan seguro.","La manera más suave de discrepar. Luego da tu motivo.","— Por esta calle es más rápido. — No estoy tan seguro. A esta hora hay mucho tráfico."],"fr":["Je n'en suis pas si sûr.","La façon la plus douce d'exprimer un désaccord. Donnez ensuite votre raison.","— Cette route est plus rapide. — Je n'en suis pas si sûr. Elle est très chargée à cette heure-ci."]}],["I don't really agree.","သိပ်တော့ သဘောမတူဘူး။","Really makes it softer than I don't agree. Not: I'm not agree.","— Homework is a waste of time. — I don't really agree. It helps you practise.","— အိမ်စာက အချိန်ဖြုန်းတာပဲ။ — သိပ်တော့ သဘောမတူဘူး။ လေ့ကျင့်ဖို့ အထောက်အကူ ဖြစ်တယ်။",{"es":["No estoy muy de acuerdo.","Really lo hace más suave que I don't agree. No: I'm not agree.","— La tarea es una pérdida de tiempo. — No estoy muy de acuerdo. Te ayuda a practicar."],"fr":["Je ne suis pas vraiment d'accord.","Really rend la phrase plus douce que I don't agree. Pas : I'm not agree.","— Les devoirs sont une perte de temps. — Je ne suis pas vraiment d'accord. Ça aide à s'entraîner."]}],["I see it differently.","ကျွန်တော်/ကျွန်မကတော့ တခြားပုံ မြင်တယ်။","Calm and respectful: you have a different view, not a better one.","I see it differently. For me, the city is more exciting than the village.","ကျွန်မကတော့ တခြားပုံ မြင်တယ်။ ကျွန်မအတွက်ကတော့ ရွာထက် မြို့က ပိုစိတ်လှုပ်ရှားစရာ ကောင်းတယ်။",{"es":["Yo lo veo de otra manera.","Tranquilo y respetuoso: tienes otro punto de vista, no uno mejor.","Yo lo veo de otra manera. Para mí, la ciudad es más emocionante que el pueblo."],"fr":["Je vois les choses autrement.","Calme et respectueux : vous avez un autre point de vue, pas un meilleur.","Je vois les choses autrement. Pour moi, la ville est plus stimulante que le village."]}],["Actually, I think…","တကယ်တော့… လို့ ထင်တယ်။","Corrects someone gently. Actually means in fact here, not now.","— The shop opens at nine. — Actually, I think it opens at ten.","— ဆိုင်က ကိုးနာရီ ဖွင့်တယ်။ — တကယ်တော့ ဆယ်နာရီ ဖွင့်တယ် ထင်တယ်။",{"es":["De hecho, creo que…","Corrige a alguien con suavidad. Actually aquí significa de hecho, no actualmente.","— La tienda abre a las nueve. — De hecho, creo que abre a las diez."],"fr":["En fait, je crois que…","Corrige quelqu'un en douceur. Actually veut dire ici en fait, pas actuellement.","— Le magasin ouvre à neuf heures. — En fait, je crois qu'il ouvre à dix heures."]}],["Do you really think so?","တကယ် အဲလို ထင်လို့လား။","Gently shows you doubt it, and invites the other person to explain.","— This is the best restaurant in town. — Do you really think so? I thought it was just OK.","— ဒါ မြို့ထဲမှာ အကောင်းဆုံး စားသောက်ဆိုင်ပဲ။ — တကယ် အဲလို ထင်လို့လား။ ကျွန်မကတော့ သာမန်ပဲ ထင်တာ။",{"es":["¿De verdad lo crees?","Muestra con suavidad que lo dudas, e invita a la otra persona a explicarse.","— Este es el mejor restaurante de la ciudad. — ¿De verdad lo crees? A mí me pareció regular."],"fr":["Tu crois vraiment ?","Montre en douceur que vous en doutez, et invite l'autre à s'expliquer.","— C'est le meilleur restaurant de la ville. — Tu crois vraiment ? Je l'ai trouvé juste correct."]}],["I'm afraid I disagree.","စိတ်မရှိပါနဲ့၊ သဘောမတူပါဘူး။","Polite and a little formal: good at work and in meetings. I'm afraid softens it.","I'm afraid I disagree. The price is too high for us.","စိတ်မရှိပါနဲ့၊ သဘောမတူပါဘူး။ ဈေးနှုန်းက ကျွန်တော်တို့အတွက် မြင့်လွန်းတယ်။",{"es":["Me temo que no estoy de acuerdo.","Cortés y un poco formal: bueno en el trabajo y en reuniones. I'm afraid lo suaviza.","Me temo que no estoy de acuerdo. El precio es demasiado alto para nosotros."],"fr":["Je crains de ne pas être d'accord.","Poli et un peu formel : bien au travail et en réunion. I'm afraid adoucit.","Je crains de ne pas être d'accord. Le prix est trop élevé pour nous."]}]],"tr":{"es":["Discrepar con cortesía","Decir que piensas distinto, sin empezar una discusión."],"fr":["Exprimer poliment son désaccord","Dire que l'on pense autrement, sans déclencher une dispute."]}},{"en":"Strong disagreement","my":"ပြင်းပြင်းထန်ထန် သဘောမတူခြင်း","desc":"Direct and strong. Fine with friends or when it really matters; careful with older people and at work.","cards":[["I don't agree at all.","လုံးဝ သဘောမတူဘူး။","A clear, strong no. Use it when something matters to you.","— Girls don't need to go to university. — I don't agree at all!","— မိန်းကလေးတွေ တက္ကသိုလ် တက်ဖို့ မလိုဘူး။ — လုံးဝ သဘောမတူဘူး။",{"es":["No estoy nada de acuerdo.","Un no claro y fuerte. Úsalo cuando algo te importa.","— Las niñas no necesitan ir a la universidad. — ¡No estoy nada de acuerdo!"],"fr":["Je ne suis pas du tout d'accord.","Un non clair et fort. À employer quand le sujet vous tient à cœur.","— Les filles n'ont pas besoin d'aller à l'université. — Je ne suis pas du tout d'accord !"]}],["That's not true.","အဲဒါ မမှန်ဘူး။","Says a fact is wrong. Add a reason so it doesn't sound like an attack.","— You never help at home. — That's not true! I cooked dinner yesterday.","— မင်း အိမ်မှာ ဘယ်တော့မှ မကူဘူး။ — မမှန်ဘူး။ မနေ့က ညစာ ချက်ခဲ့တာလေ။",{"es":["Eso no es cierto.","Dice que un hecho es falso. Agrega un motivo para que no suene a ataque.","— Nunca ayudas en la casa. — ¡Eso no es cierto! Ayer hice la cena."],"fr":["Ce n'est pas vrai.","Dit qu'un fait est faux. Ajoutez une raison pour que cela ne ressemble pas à une attaque.","— Tu n'aides jamais à la maison. — Ce n'est pas vrai ! J'ai fait le dîner hier."]}],["You're wrong.","မှားနေတယ်။","Very direct: it can sound rude. Softer: I don't think that's right.","— Bangkok is the capital of Vietnam. — You're wrong. It's Hanoi.","— ဘန်ကောက်က ဗီယက်နမ်ရဲ့ မြို့တော်ပဲ။ — မှားနေတယ်။ ဟနွိုင်းပါ။",{"es":["Estás equivocado.","Muy directo: puede sonar grosero. Más suave: I don't think that's right.","— Bangkok es la capital de Vietnam. — Estás equivocado. Es Hanói."],"fr":["Tu te trompes.","Très direct : cela peut sembler impoli. Plus doux : I don't think that's right.","— Bangkok est la capitale du Vietnam. — Tu te trompes. C'est Hanoï."]}],["Of course not!","ဘယ်ဟုတ်မလဲ။","A strong no to a question. Often kind: it tells someone not to worry.","— Do you think I'm lazy? — Of course not!","— ကျွန်မကို ပျင်းတယ်လို့ ထင်လား။ — ဘယ်ဟုတ်မလဲ။",{"es":["¡Claro que no!","Un no fuerte a una pregunta. A menudo amable: le dice a alguien que no se preocupe.","— ¿Crees que soy flojo? — ¡Claro que no!"],"fr":["Bien sûr que non !","Un non fort à une question. Souvent gentil : il dit à quelqu'un de ne pas s'inquiéter.","— Tu trouves que je suis paresseux ? — Bien sûr que non !"]}]],"tr":{"es":["Desacuerdo fuerte","Directo y fuerte. Está bien con amigos o cuando de verdad importa; cuidado con las personas mayores y en el trabajo."],"fr":["Désaccord marqué","Direct et fort. Convient entre amis ou quand c'est vraiment important ; prudence avec les personnes âgées et au travail."]}},{"en":"Ending a disagreement","my":"သဘောကွဲလွဲမှုကို အဆုံးသတ်ခြင်း","desc":"Moving on calmly when you don't agree, or when you change your mind.","cards":[["Let's agree to disagree.","သဘောကွဲတာကို လက်ခံလိုက်ကြရအောင်။","We both keep our own opinion, and stay friends.","We like different football teams. Let's agree to disagree!","ကျွန်တော်တို့ မတူတဲ့ ဘောလုံးအသင်းတွေ ကြိုက်တယ်။ သဘောကွဲတာကို လက်ခံလိုက်ကြရအောင်။",{"es":["Quedemos en que no estamos de acuerdo.","Cada quien se queda con su opinión, y seguimos siendo amigos.","Le vamos a equipos de fútbol distintos. ¡Quedemos en que no estamos de acuerdo!"],"fr":["Restons-en là, chacun son avis.","Chacun garde son opinion, et l'on reste amis.","On soutient des équipes de foot différentes. Restons-en là, chacun son avis !"]}],["You may be right.","မှန်ကောင်း မှန်မှာပါ။","Accepts that the other person could be correct. Calm and polite.","— I think it will rain later. — You may be right. Let's take an umbrella.","— နောက်မှ မိုးရွာမယ် ထင်တယ်။ — မှန်ကောင်း မှန်မှာပါ။ ထီး ယူသွားကြရအောင်။",{"es":["Puede que tengas razón.","Acepta que la otra persona podría estar en lo correcto. Tranquilo y cortés.","— Creo que va a llover más tarde. — Puede que tengas razón. Llevemos un paraguas."],"fr":["Tu as peut-être raison.","Admet que l'autre pourrait avoir raison. Calme et poli.","— Je crois qu'il va pleuvoir plus tard. — Tu as peut-être raison. Prenons un parapluie."]}],["I hadn't thought of that.","အဲဒါကို မစဉ်းစားမိခဲ့ဘူး။","You hear a new idea and start to change your mind.","— If we leave at five, we'll miss the traffic. — Oh, I hadn't thought of that.","— ငါးနာရီ ထွက်ရင် ကားကြပ်ချိန်နဲ့ မကြုံရဘူး။ — အို၊ အဲဒါကို မစဉ်းစားမိခဲ့ဘူး။",{"es":["No lo había pensado.","Oyes una idea nueva y empiezas a cambiar de opinión.","— Si salimos a las cinco, nos evitamos el tráfico. — Ah, no lo había pensado."],"fr":["Je n'y avais pas pensé.","Vous entendez une idée nouvelle et commencez à changer d'avis.","— Si on part à cinq heures, on évite les bouchons. — Oh, je n'y avais pas pensé."]}],["OK, you win!","အိုကေ၊ မင်းပဲ နိုင်ပါတယ်။","Playful: giving in with a smile. Only with friends and family.","— Pizza or noodles? Come on, pizza! — OK, you win!","— ပီဇာလား ခေါက်ဆွဲလား။ လာပါ၊ ပီဇာ စားရအောင်။ — အိုကေ၊ မင်းပဲ နိုင်ပါတယ်။",{"es":["Está bien, ¡tú ganas!","Juguetón: ceder con una sonrisa. Solo con amigos y familia.","— ¿Pizza o fideos? ¡Ándale, pizza! — Está bien, ¡tú ganas!"],"fr":["D'accord, tu as gagné !","Amusé : céder avec le sourire. Seulement entre amis et en famille.","— Pizza ou nouilles ? Allez, pizza ! — D'accord, tu as gagné !"]}],["Let's talk about it later.","နောက်မှ ဆက်ပြောကြရအောင်။","Stops an argument before it gets worse.","We're both tired. Let's talk about it later.","နှစ်ယောက်လုံး ပင်ပန်းနေကြပြီ။ နောက်မှ ဆက်ပြောကြရအောင်။",{"es":["Lo hablamos después.","Detiene una discusión antes de que empeore.","Los dos estamos cansados. Lo hablamos después."],"fr":["On en reparle plus tard.","Arrête une dispute avant qu'elle n'empire.","On est fatigués tous les deux. On en reparle plus tard."]}]],"tr":{"es":["Terminar un desacuerdo","Seguir adelante con calma cuando no están de acuerdo, o cuando cambias de opinión."],"fr":["Clore un désaccord","Passer à autre chose calmement quand on n'est pas d'accord, ou quand on change d'avis."]}}];const langs=["my","es","fr"];const COURSE="eng";</script>
