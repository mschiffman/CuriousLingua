<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/agree_disagree/";const AUD_EXT="mp3?v=2611170807";const categories=[{"en":"Agreeing","my":"သဘောတူခြင်း","desc":"Everyday ways to say you think the same.","cards":[["I agree.","ကျွန်တော်/ကျွန်မ သဘောတူပါတယ်။","Agree is a verb, so there is no am: I agree, I don't agree. Not: I am agree.","— This street needs more lights. — I agree.","— ဒီလမ်းမှာ မီးတိုင် ပိုလိုတယ်။ — သဘောတူပါတယ်။",{"es":["Estoy de acuerdo.","Agree es un verbo, así que no lleva am: I agree, I don't agree. No: I am agree.","— Esta calle necesita más luces. — Estoy de acuerdo."],"fr":["Je suis d'accord.","Agree est un verbe, donc pas de am : I agree, I don't agree. Pas : I am agree.","— Cette rue a besoin de plus d'éclairage. — Je suis d'accord."],"hi":["मैं सहमत हूँ।","Agree क्रिया है, इसलिए am नहीं लगता: I agree, I don't agree. ग़लत: I am agree.","— इस सड़क पर और बत्तियों की ज़रूरत है। — मैं सहमत हूँ।"],"vi":["Mình đồng ý.","Agree là động từ, nên không có am: I agree, I don't agree. Không nói: I am agree.","— Con đường này cần thêm đèn. — Mình đồng ý."]}],["You're right.","ပြောတာ မှန်ပါတယ်။","Says the other person is correct. Warm and simple.","— We should leave early. The traffic is bad on Fridays. — You're right.","— စောစော ထွက်သင့်တယ်။ သောကြာနေ့ဆို ကားကြပ်တယ်။ — ပြောတာ မှန်ပါတယ်။",{"es":["Tienes razón.","Dice que la otra persona está en lo correcto. Cálido y sencillo.","— Deberíamos salir temprano. Los viernes hay mucho tráfico. — Tienes razón."],"fr":["Tu as raison.","Dit que l'autre a raison. Chaleureux et simple.","— On devrait partir tôt. Ça roule mal le vendredi. — Tu as raison."],"hi":["आप ठीक कह रहे हैं।","कहता है कि सामने वाला सही है। आत्मीय और सरल।","— हमें जल्दी निकलना चाहिए। शुक्रवार को ट्रैफ़िक बहुत होता है। — तुम ठीक कह रहे हो।"],"vi":["Bạn nói đúng.","Nói rằng người kia đúng. Ấm áp và đơn giản.","— Mình nên đi sớm. Thứ Sáu đường đông lắm. — Bạn nói đúng."]}],["That's true.","ဟုတ်တယ်။","Agrees with a fact more than an opinion.","— Vegetables are cheaper at the market. — That's true.","— ဈေးမှာ ဟင်းသီးဟင်းရွက်တွေ ပိုဈေးသက်သာတယ်။ — ဟုတ်တယ်။",{"es":["Es cierto.","Aprueba un hecho más que una opinión.","— Las verduras son más baratas en el mercado. — Es cierto."],"fr":["C'est vrai.","Approuve un fait plus qu'une opinion.","— Les légumes sont moins chers au marché. — C'est vrai."],"hi":["यह सच है।","राय से ज़्यादा किसी तथ्य को सही ठहराता है।","— बाज़ार में सब्ज़ियाँ सस्ती मिलती हैं। — यह सच है।"],"vi":["Đúng vậy.","Tán thành một sự thật hơn là một ý kiến.","— Rau ở chợ rẻ hơn. — Đúng vậy."]}],["Exactly!","အဲဒါပဲ။","Strong: that's exactly what I mean. Also: Exactly right!","— So we need more time, not more money? — Exactly!","— ဒါဆို ငွေ ပိုလိုတာ မဟုတ်ဘဲ အချိန် ပိုလိုတာပေါ့။ — အဲဒါပဲ။",{"es":["¡Exacto!","Fuerte: eso es justo lo que quiero decir. También: Exactly right!","— Entonces, ¿necesitamos más tiempo, no más dinero? — ¡Exacto!"],"fr":["Exactement !","Fort : c'est exactement ce que je veux dire. On dit aussi : Exactly right!","— Donc il nous faut plus de temps, pas plus d'argent ? — Exactement !"],"hi":["बिलकुल!","ज़ोरदार: मेरा मतलब ठीक यही है। यह भी: Exactly right!","— तो हमें ज़्यादा समय चाहिए, ज़्यादा पैसा नहीं? — बिलकुल!"],"vi":["Chính xác!","Mạnh: đó đúng là điều mình muốn nói. Cũng có: Exactly right!","— Vậy là mình cần thêm thời gian, không phải thêm tiền? — Chính xác!"]}],["Good point.","ကောင်းတဲ့ အချက်ပဲ။","When someone says something useful that you hadn't thought of.","— If we go on Sunday, the shops will be closed. — Good point.","— တနင်္ဂနွေ သွားရင် ဆိုင်တွေ ပိတ်နေမယ်။ — ကောင်းတဲ့ အချက်ပဲ။",{"es":["Buen punto.","Cuando alguien dice algo útil que no se te había ocurrido.","— Si vamos el domingo, las tiendas van a estar cerradas. — Buen punto."],"fr":["Bien vu.","Quand quelqu'un dit quelque chose d'utile auquel vous n'aviez pas pensé.","— Si on y va dimanche, les magasins seront fermés. — Bien vu."],"hi":["अच्छी बात कही।","जब कोई ऐसी काम की बात कहे जो आपको सूझी न हो।","— अगर हम रविवार को गए, तो दुकानें बंद मिलेंगी। — अच्छी बात कही।"],"vi":["Ý hay đấy.","Khi ai đó nói một điều hữu ích mà bạn chưa nghĩ tới.","— Nếu đi Chủ nhật thì các cửa hàng đóng cửa. — Ý hay đấy."]}],["So do I.","ကျွန်တော်/ကျွန်မလည်း အဲဒီလိုပဲ။","Agrees with a positive sentence. It copies the helping verb: I can swim → So can I. I'm tired → So am I. Me too is more casual.","— I think the new teacher is great. — So do I.","— ဆရာမ အသစ်က အရမ်းတော်တယ်လို့ ထင်တယ်။ — ကျွန်မလည်း အဲလိုပဲ ထင်တယ်။",{"es":["Yo también.","Coincide con una oración afirmativa. Copia el verbo auxiliar: I can swim → So can I. I'm tired → So am I. Me too es más informal.","— Creo que la maestra nueva es muy buena. — Yo también."],"fr":["Moi aussi.","Approuve une phrase affirmative. On reprend l'auxiliaire : I can swim → So can I. I'm tired → So am I. Me too est plus familier.","— Je trouve que la nouvelle professeure est super. — Moi aussi."],"hi":["मैं भी।","हाँ वाले वाक्य से सहमति। सहायक क्रिया वही दोहराइए: I can swim → So can I. I'm tired → So am I. Me too ज़्यादा अनौपचारिक है।","— मुझे लगता है नई शिक्षिका बहुत अच्छी हैं। — मुझे भी।"],"vi":["Mình cũng vậy.","Đồng tình với một câu khẳng định. Lặp lại trợ động từ: I can swim → So can I. I'm tired → So am I. Me too thì thân mật hơn.","— Mình thấy cô giáo mới rất tuyệt. — Mình cũng vậy."]}],["Neither do I.","ကျွန်တော်/ကျွန်မလည်း အဲလို မထင်ဘူး။","Agrees with a negative sentence. Not: So do I or Me too after a no. I can't swim → Neither can I. Me neither is more casual.","— I don't think it's a good idea. — Neither do I.","— အဲဒါ ကောင်းတဲ့ အကြံလို့ မထင်ဘူး။ — ကျွန်မလည်း မထင်ဘူး။",{"es":["Yo tampoco.","Coincide con una oración negativa. No: So do I ni Me too después de un no. I can't swim → Neither can I. Me neither es más informal.","— No creo que sea buena idea. — Yo tampoco."],"fr":["Moi non plus.","Approuve une phrase négative. Pas : So do I ni Me too après une négation. I can't swim → Neither can I. Me neither est plus familier.","— Je ne pense pas que ce soit une bonne idée. — Moi non plus."],"hi":["मैं भी नहीं।","ना वाले वाक्य से सहमति। ना के बाद So do I या Me too नहीं आता। I can't swim → Neither can I. Me neither ज़्यादा अनौपचारिक है।","— मुझे नहीं लगता कि यह अच्छा विचार है। — मुझे भी नहीं।"],"vi":["Mình cũng không.","Đồng tình với một câu phủ định. Sau câu phủ định không dùng So do I hay Me too. I can't swim → Neither can I. Me neither thì thân mật hơn.","— Mình không nghĩ đó là ý hay. — Mình cũng không."]}]],"tr":{"es":["Estar de acuerdo","Maneras cotidianas de decir que piensas lo mismo."],"fr":["Être d'accord","Des façons courantes de dire que l'on pense la même chose."],"hi":["सहमत होना","यह कहने के रोज़मर्रा के तरीक़े कि आप भी ऐसा ही सोचते हैं।"],"vi":["Đồng ý","Những cách hằng ngày để nói bạn cũng nghĩ như vậy."]}},{"en":"Strong agreement","my":"အပြည့်အဝ သဘောတူခြင်း","desc":"When you agree completely, or share the same feeling.","cards":[["I totally agree.","လုံးဝ သဘောတူပါတယ်။","Stronger than I agree. Also: I completely agree.","— Children need more time to play outside. — I totally agree.","— ကလေးတွေ အပြင်မှာ ကစားချိန် ပိုလိုတယ်။ — လုံးဝ သဘောတူပါတယ်။",{"es":["Estoy totalmente de acuerdo.","Más fuerte que I agree. También: I completely agree.","— Los niños necesitan más tiempo para jugar afuera. — Estoy totalmente de acuerdo."],"fr":["Je suis tout à fait d'accord.","Plus fort que I agree. On dit aussi : I completely agree.","— Les enfants ont besoin de jouer dehors plus longtemps. — Je suis tout à fait d'accord."],"hi":["मैं पूरी तरह सहमत हूँ।","I agree से ज़्यादा ज़ोरदार। यह भी: I completely agree.","— बच्चों को बाहर खेलने के लिए और समय चाहिए। — मैं पूरी तरह सहमत हूँ।"],"vi":["Mình hoàn toàn đồng ý.","Mạnh hơn I agree. Cũng có: I completely agree.","— Trẻ con cần thêm thời gian chơi ngoài trời. — Mình hoàn toàn đồng ý."]}],["I couldn't agree more.","အပြည့်အဝ သဘောတူပါတယ်။","It sounds negative, but it is the strongest yes: I agree so much that I couldn't agree any more.","— That was the best trip ever. — I couldn't agree more!","— အဲဒီခရီးက အကောင်းဆုံးပဲ။ — အပြည့်အဝ သဘောတူပါတယ်။",{"es":["No podría estar más de acuerdo.","Suena negativo, pero es el sí más fuerte: estoy tan de acuerdo que no podría estarlo más.","— Fue el mejor viaje de todos. — ¡No podría estar más de acuerdo!"],"fr":["Je ne pourrais pas être plus d'accord.","La phrase paraît négative, mais c'est le oui le plus fort : je suis tellement d'accord que je ne pourrais pas l'être davantage.","— C'était le meilleur voyage de tous. — Je ne pourrais pas être plus d'accord !"],"hi":["इससे ज़्यादा सहमत हो ही नहीं सकता।","सुनने में नकारात्मक लगता है, पर यह सबसे ज़ोरदार हाँ है: मैं इतना सहमत हूँ कि इससे ज़्यादा हो ही नहीं सकता।","— यह अब तक का सबसे अच्छा सफ़र था। — इससे ज़्यादा सहमत हो ही नहीं सकता!"],"vi":["Mình không thể đồng ý hơn được nữa.","Nghe như phủ định, nhưng là lời đồng ý mạnh nhất: mình đồng ý đến mức không thể hơn được nữa.","— Đó là chuyến đi tuyệt nhất từ trước tới giờ. — Mình không thể đồng ý hơn được nữa!"]}],["You can say that again!","ဟုတ်လိုက်တာ။","Casual and friendly. It doesn't ask you to repeat anything: it means you're so right.","— It's so hot today! — You can say that again!","— ဒီနေ့ အရမ်း ပူတယ်။ — ဟုတ်လိုက်တာ။",{"es":["¡Y que lo digas!","Informal y amistoso. No te pide que repitas nada: significa que tienes toda la razón.","— ¡Qué calor hace hoy! — ¡Y que lo digas!"],"fr":["Ça, tu peux le dire !","Familier et amical. On ne vous demande pas de répéter : cela veut dire que vous avez tellement raison.","— Qu'est-ce qu'il fait chaud aujourd'hui ! — Ça, tu peux le dire !"],"hi":["बिलकुल सही कहा!","अनौपचारिक और दोस्ताना। यह आपसे कुछ दोहराने को नहीं कह रहा: मतलब है कि आप बिलकुल सही हैं।","— आज कितनी गरमी है! — बिलकुल सही कहा!"],"vi":["Bạn nói quá đúng!","Thân mật và thân thiện. Không phải bảo bạn nhắc lại: nghĩa là bạn hoàn toàn đúng.","— Hôm nay nóng quá! — Bạn nói quá đúng!"]}],["Tell me about it!","ပြောမနေနဲ့တော့၊ ကိုယ်တိုင်လည်း ကြုံနေရတာ။","Casual. It doesn't ask for more details: it means I know exactly, the same happened to me. Mostly for shared problems.","— The traffic this morning was terrible. — Tell me about it! I was an hour late.","— ဒီမနက် ကားကြပ်တာ ဆိုးလိုက်တာ။ — ပြောမနေနဲ့တော့။ ကျွန်မ တစ်နာရီ နောက်ကျသွားတယ်။",{"es":["¡Ni me digas!","Informal. No pide más detalles: significa lo sé muy bien, a mí me pasó lo mismo. Sobre todo para problemas compartidos.","— El tráfico de esta mañana estuvo terrible. — ¡Ni me digas! Llegué una hora tarde."],"fr":["À qui le dis-tu !","Familier. On ne demande pas de détails : cela veut dire je sais très bien, il m'est arrivé la même chose. Surtout pour les problèmes partagés.","— La circulation ce matin était épouvantable. — À qui le dis-tu ! J'ai eu une heure de retard."],"hi":["अरे, मुझसे पूछो!","अनौपचारिक। यह और ब्योरा नहीं माँग रहा: मतलब है, मैं अच्छी तरह जानता हूँ, मेरे साथ भी यही हुआ। ख़ासकर साझा परेशानियों के लिए।","— आज सुबह ट्रैफ़िक बहुत बुरा था। — अरे, मुझसे पूछो! मैं एक घंटा देर से पहुँचा।"],"vi":["Còn phải nói!","Thân mật. Không phải hỏi thêm chi tiết: nghĩa là mình biết quá rõ, mình cũng bị y như vậy. Nhất là với những rắc rối chung.","— Sáng nay đường kẹt kinh khủng. — Còn phải nói! Mình trễ cả tiếng đồng hồ."]}],["That's exactly what I think.","ကျွန်တော်/ကျွန်မ ထင်တာလည်း အဲဒါပဲ။","You had the same idea before they said it.","— We should ask the teacher first. — That's exactly what I think.","— ဆရာ့ကို အရင် မေးသင့်တယ်။ — ကျွန်မ ထင်တာလည်း အဲဒါပဲ။",{"es":["Es justo lo que yo pienso.","Tuviste la misma idea antes de que la dijeran.","— Primero deberíamos preguntarle al maestro. — Es justo lo que yo pienso."],"fr":["C'est exactement ce que je pense.","Vous aviez la même idée avant qu'on la dise.","— On devrait d'abord demander au professeur. — C'est exactement ce que je pense."],"hi":["मैं भी ठीक यही सोचता हूँ।","उनके कहने से पहले ही आपके मन में वही बात थी।","— हमें पहले शिक्षक से पूछना चाहिए। — मैं भी ठीक यही सोचता हूँ।"],"vi":["Mình cũng nghĩ y như vậy.","Bạn đã có cùng ý đó trước khi người kia nói ra.","— Mình nên hỏi thầy trước. — Mình cũng nghĩ y như vậy."]}]],"tr":{"es":["Totalmente de acuerdo","Cuando estás completamente de acuerdo, o sientes lo mismo."],"fr":["Tout à fait d'accord","Quand on est entièrement d'accord, ou que l'on ressent la même chose."],"hi":["पूरी सहमति","जब आप पूरी तरह सहमत हों, या वही महसूस करते हों।"],"vi":["Hoàn toàn đồng ý","Khi bạn đồng ý hoàn toàn, hoặc có cùng cảm nhận."]}},{"en":"Partly agreeing","my":"တစ်စိတ်တစ်ပိုင်း သဘောတူခြင်း","desc":"Yes, but… Agreeing with one part before you add your own view.","cards":[["That's true, but…","ဟုတ်တော့ ဟုတ်တယ်၊ ဒါပေမဲ့…","The most common way to disagree kindly: agree first, then give the other side.","— The big phone has a better camera. — That's true, but it's very expensive.","— ဖုန်းအကြီးက ကင်မရာ ပိုကောင်းတယ်။ — ဟုတ်တော့ ဟုတ်တယ်၊ ဒါပေမဲ့ အရမ်း ဈေးကြီးတယ်။",{"es":["Es cierto, pero…","La manera más común de discrepar con amabilidad: primero das la razón y luego dices el otro lado.","— El teléfono grande tiene mejor cámara. — Es cierto, pero es muy caro."],"fr":["C'est vrai, mais…","La façon la plus courante d'exprimer gentiment un désaccord : approuver d'abord, puis donner l'autre point de vue.","— Le grand téléphone a un meilleur appareil photo. — C'est vrai, mais il est très cher."],"hi":["यह सच है, पर…","नरमी से असहमत होने का सबसे आम तरीक़ा: पहले बात मान लीजिए, फिर दूसरा पहलू कहिए।","— बड़े फ़ोन का कैमरा बेहतर है। — यह सच है, पर वह बहुत महँगा है।"],"vi":["Đúng vậy, nhưng…","Cách phản đối nhẹ nhàng phổ biến nhất: công nhận trước, rồi nói mặt còn lại.","— Điện thoại to có máy ảnh tốt hơn. — Đúng vậy, nhưng nó đắt lắm."]}],["I see what you mean, but…","ဆိုလိုတာကို နားလည်ပါတယ်၊ ဒါပေမဲ့…","Shows you listened before you disagree. Also: I see your point, but…","I see what you mean, but I still think we should wait.","ဆိုလိုတာကို နားလည်ပါတယ်၊ ဒါပေမဲ့ စောင့်သင့်တယ်လို့ပဲ ထင်နေတုန်းပါ။",{"es":["Entiendo lo que dices, pero…","Muestra que escuchaste antes de discrepar. También: I see your point, but…","Entiendo lo que dices, pero sigo pensando que deberíamos esperar."],"fr":["Je vois ce que tu veux dire, mais…","Montre que vous avez écouté avant de vous opposer. On dit aussi : I see your point, but…","Je vois ce que tu veux dire, mais je pense toujours qu'on devrait attendre."],"hi":["मैं आपकी बात समझता हूँ, पर…","दिखाता है कि असहमत होने से पहले आपने बात सुनी। यह भी: I see your point, but…","मैं तुम्हारी बात समझता हूँ, पर मुझे अब भी लगता है कि हमें रुकना चाहिए।"],"vi":["Mình hiểu ý bạn, nhưng…","Cho thấy bạn đã lắng nghe trước khi phản đối. Cũng có: I see your point, but…","Mình hiểu ý bạn, nhưng mình vẫn nghĩ là nên đợi."]}],["I agree up to a point.","တစ်စိတ်တစ်ပိုင်းတော့ သဘောတူပါတယ်။","You agree with some of it, not all. A little formal: good for class and meetings. Follow it with but…","— Money makes people happy. — I agree up to a point, but health is more important.","— ငွေက လူတွေကို ပျော်စေတယ်။ — တစ်စိတ်တစ်ပိုင်းတော့ သဘောတူပါတယ်၊ ဒါပေမဲ့ ကျန်းမာရေးက ပိုအရေးကြီးတယ်။",{"es":["Estoy de acuerdo hasta cierto punto.","Estás de acuerdo con una parte, no con todo. Un poco formal: bueno para la clase y las reuniones. Síguelo con but…","— El dinero hace feliz a la gente. — Estoy de acuerdo hasta cierto punto, pero la salud es más importante."],"fr":["Je suis d'accord jusqu'à un certain point.","Vous approuvez une partie, pas tout. Un peu formel : bien en classe et en réunion. Faites suivre de but…","— L'argent rend les gens heureux. — Je suis d'accord jusqu'à un certain point, mais la santé compte davantage."],"hi":["मैं एक हद तक सहमत हूँ।","आप एक हिस्से से सहमत हैं, पूरी बात से नहीं। थोड़ा औपचारिक: कक्षा और बैठकों के लिए अच्छा। इसके बाद but… लगाइए।","— पैसा लोगों को ख़ुश करता है। — मैं एक हद तक सहमत हूँ, पर सेहत ज़्यादा ज़रूरी है।"],"vi":["Mình đồng ý ở một mức nào đó.","Bạn đồng ý với một phần, không phải tất cả. Hơi trang trọng: hợp với lớp học và cuộc họp. Nối tiếp bằng but…","— Tiền làm con người hạnh phúc. — Mình đồng ý ở một mức nào đó, nhưng sức khỏe quan trọng hơn."]}],["Maybe, but…","ဖြစ်ချင် ဖြစ်မယ်၊ ဒါပေမဲ့…","Accepts the idea as possible, then adds a different view.","— The bus is faster. — Maybe, but the train is more comfortable.","— ဘတ်စ်ကားက ပိုမြန်တယ်။ — ဖြစ်ချင် ဖြစ်မယ်၊ ဒါပေမဲ့ ရထားက ပိုသက်သောင့်သက်သာ ရှိတယ်။",{"es":["Puede ser, pero…","Acepta la idea como posible y luego agrega otro punto de vista.","— El autobús es más rápido. — Puede ser, pero el tren es más cómodo."],"fr":["Peut-être, mais…","Admet que l'idée est possible, puis ajoute un autre point de vue.","— Le bus est plus rapide. — Peut-être, mais le train est plus confortable."],"hi":["हो सकता है, पर…","बात को संभव मान लेता है, फिर दूसरा नज़रिया जोड़ता है।","— बस ज़्यादा तेज़ है। — हो सकता है, पर ट्रेन ज़्यादा आरामदेह है।"],"vi":["Có thể, nhưng…","Chấp nhận ý đó là có thể đúng, rồi thêm một góc nhìn khác.","— Xe buýt nhanh hơn. — Có thể, nhưng tàu hỏa thoải mái hơn."]}],["Fair enough.","ဒါဆိုလည်း ဟုတ်ပါတယ်။","You accept someone's reason, even if you didn't agree at first.","— I can't come tonight. I have an exam tomorrow. — Fair enough.","— ဒီည လာလို့ မရဘူး။ မနက်ဖြန် စာမေးပွဲ ရှိတယ်။ — ဒါဆိုလည်း ဟုတ်ပါတယ်။",{"es":["Me parece justo.","Aceptas el motivo de alguien, aunque al principio no estabas de acuerdo.","— Hoy en la noche no puedo ir. Mañana tengo examen. — Me parece justo."],"fr":["Ça se comprend.","Vous acceptez la raison de quelqu'un, même si vous n'étiez pas d'accord au départ.","— Je ne peux pas venir ce soir. J'ai un examen demain. — Ça se comprend."],"hi":["चलो, ठीक है।","आप किसी की वजह मान लेते हैं, भले ही पहले सहमत न थे।","— मैं आज रात नहीं आ सकता। कल मेरी परीक्षा है। — चलो, ठीक है।"],"vi":["Cũng phải.","Bạn chấp nhận lý do của người kia, dù lúc đầu không đồng ý.","— Tối nay mình không đến được. Mai mình thi. — Cũng phải."]}],["I suppose you're right.","မှန်မယ် ထင်ပါတယ်။","Agreeing slowly, or a little unwillingly.","— We can't buy a new car this year. — I suppose you're right.","— ဒီနှစ် ကားအသစ် မဝယ်နိုင်ဘူး။ — မှန်မယ် ထင်ပါတယ်။",{"es":["Supongo que tienes razón.","Dar la razón poco a poco, o con algo de desgana.","— Este año no podemos comprar un coche nuevo. — Supongo que tienes razón."],"fr":["Tu as sans doute raison.","Donner raison lentement, ou un peu à contrecœur.","— On ne peut pas acheter une nouvelle voiture cette année. — Tu as sans doute raison."],"hi":["शायद आप ठीक कह रहे हैं।","धीरे-धीरे, या थोड़े बेमन से बात मान लेना।","— इस साल हम नई गाड़ी नहीं ख़रीद सकते। — शायद तुम ठीक कह रहे हो।"],"vi":["Chắc là bạn đúng.","Công nhận từ từ, hoặc hơi miễn cưỡng.","— Năm nay mình không mua xe mới được đâu. — Chắc là bạn đúng."]}]],"tr":{"es":["De acuerdo en parte","Sí, pero… Dar la razón en una parte antes de agregar tu punto de vista."],"fr":["D'accord en partie","Oui, mais… Approuver une partie avant d'ajouter son propre point de vue."],"hi":["कुछ हद तक सहमत होना","हाँ, पर… अपनी बात जोड़ने से पहले एक हिस्से से सहमत होना।"],"vi":["Đồng ý một phần","Đúng, nhưng… Đồng ý với một phần trước khi thêm quan điểm của mình."]}},{"en":"Disagreeing politely","my":"ယဉ်ယဉ်ကျေးကျေး သဘောမတူခြင်း","desc":"Saying you think differently, without starting an argument.","cards":[["I'm not so sure.","ကျွန်တော်/ကျွန်မကတော့ သိပ်မသေချာဘူး။","The softest way to disagree. Then give your reason.","— This road is quicker. — I'm not so sure. It's very busy at this time.","— ဒီလမ်းက ပိုမြန်တယ်။ — သိပ်မသေချာဘူး။ ဒီအချိန်ဆို ကားအရမ်းများတယ်။",{"es":["No estoy tan seguro.","La manera más suave de discrepar. Luego da tu motivo.","— Por esta calle es más rápido. — No estoy tan seguro. A esta hora hay mucho tráfico."],"fr":["Je n'en suis pas si sûr.","La façon la plus douce d'exprimer un désaccord. Donnez ensuite votre raison.","— Cette route est plus rapide. — Je n'en suis pas si sûr. Elle est très chargée à cette heure-ci."],"hi":["मुझे इतना यक़ीन नहीं।","असहमत होने का सबसे नरम तरीक़ा। फिर अपनी वजह बताइए।","— यह रास्ता जल्दी पहुँचाता है। — मुझे इतना यक़ीन नहीं। इस समय यहाँ बहुत भीड़ रहती है।"],"vi":["Mình không chắc lắm.","Cách phản đối nhẹ nhàng nhất. Sau đó nêu lý do của bạn.","— Đường này nhanh hơn. — Mình không chắc lắm. Giờ này đường đó đông lắm."]}],["I don't really agree.","သိပ်တော့ သဘောမတူဘူး။","Really makes it softer than I don't agree. Not: I'm not agree.","— Homework is a waste of time. — I don't really agree. It helps you practise.","— အိမ်စာက အချိန်ဖြုန်းတာပဲ။ — သိပ်တော့ သဘောမတူဘူး။ လေ့ကျင့်ဖို့ အထောက်အကူ ဖြစ်တယ်။",{"es":["No estoy muy de acuerdo.","Really lo hace más suave que I don't agree. No: I'm not agree.","— La tarea es una pérdida de tiempo. — No estoy muy de acuerdo. Te ayuda a practicar."],"fr":["Je ne suis pas vraiment d'accord.","Really rend la phrase plus douce que I don't agree. Pas : I'm not agree.","— Les devoirs sont une perte de temps. — Je ne suis pas vraiment d'accord. Ça aide à s'entraîner."],"hi":["मैं पूरी तरह सहमत नहीं हूँ।","Really इसे I don't agree से नरम बना देता है। ग़लत: I'm not agree.","— होमवर्क समय की बर्बादी है। — मैं पूरी तरह सहमत नहीं हूँ। उससे अभ्यास होता है।"],"vi":["Mình không hẳn đồng ý.","Really làm câu nhẹ hơn I don't agree. Không nói: I'm not agree.","— Bài tập về nhà chỉ phí thời gian. — Mình không hẳn đồng ý. Nó giúp mình luyện tập."]}],["I see it differently.","ကျွန်တော်/ကျွန်မကတော့ တခြားပုံ မြင်တယ်။","Calm and respectful: you have a different view, not a better one.","I see it differently. For me, the city is more exciting than the village.","ကျွန်မကတော့ တခြားပုံ မြင်တယ်။ ကျွန်မအတွက်ကတော့ ရွာထက် မြို့က ပိုစိတ်လှုပ်ရှားစရာ ကောင်းတယ်။",{"es":["Yo lo veo de otra manera.","Tranquilo y respetuoso: tienes otro punto de vista, no uno mejor.","Yo lo veo de otra manera. Para mí, la ciudad es más emocionante que el pueblo."],"fr":["Je vois les choses autrement.","Calme et respectueux : vous avez un autre point de vue, pas un meilleur.","Je vois les choses autrement. Pour moi, la ville est plus stimulante que le village."],"hi":["मेरा नज़रिया अलग है।","शांत और सम्मान भरा: आपका नज़रिया अलग है, बेहतर नहीं।","मेरा नज़रिया अलग है। मेरे लिए शहर गाँव से ज़्यादा रोमांचक है।"],"vi":["Mình nhìn nhận khác.","Bình tĩnh và tôn trọng: bạn có góc nhìn khác, không phải góc nhìn hay hơn.","Mình nhìn nhận khác. Với mình, thành phố thú vị hơn làng quê."]}],["Actually, I think…","တကယ်တော့… လို့ ထင်တယ်။","Corrects someone gently. Actually means in fact here, not now.","— The shop opens at nine. — Actually, I think it opens at ten.","— ဆိုင်က ကိုးနာရီ ဖွင့်တယ်။ — တကယ်တော့ ဆယ်နာရီ ဖွင့်တယ် ထင်တယ်။",{"es":["De hecho, creo que…","Corrige a alguien con suavidad. Actually aquí significa de hecho, no actualmente.","— La tienda abre a las nueve. — De hecho, creo que abre a las diez."],"fr":["En fait, je crois que…","Corrige quelqu'un en douceur. Actually veut dire ici en fait, pas actuellement.","— Le magasin ouvre à neuf heures. — En fait, je crois qu'il ouvre à dix heures."],"hi":["असल में, मुझे लगता है…","किसी को नरमी से सुधारता है। यहाँ actually का मतलब है “असल में”।","— दुकान नौ बजे खुलती है। — असल में, मुझे लगता है दस बजे खुलती है।"],"vi":["Thật ra, mình nghĩ…","Sửa lời ai đó một cách nhẹ nhàng. Actually ở đây nghĩa là “thật ra”.","— Cửa hàng mở lúc chín giờ. — Thật ra, mình nghĩ là mười giờ mới mở."]}],["Do you really think so?","တကယ် အဲလို ထင်လို့လား။","Gently shows you doubt it, and invites the other person to explain.","— This is the best restaurant in town. — Do you really think so? I thought it was just OK.","— ဒါ မြို့ထဲမှာ အကောင်းဆုံး စားသောက်ဆိုင်ပဲ။ — တကယ် အဲလို ထင်လို့လား။ ကျွန်မကတော့ သာမန်ပဲ ထင်တာ။",{"es":["¿De verdad lo crees?","Muestra con suavidad que lo dudas, e invita a la otra persona a explicarse.","— Este es el mejor restaurante de la ciudad. — ¿De verdad lo crees? A mí me pareció regular."],"fr":["Tu crois vraiment ?","Montre en douceur que vous en doutez, et invite l'autre à s'expliquer.","— C'est le meilleur restaurant de la ville. — Tu crois vraiment ? Je l'ai trouvé juste correct."],"hi":["क्या आपको सच में ऐसा लगता है?","नरमी से जताता है कि आपको शक है, और सामने वाले को अपनी बात समझाने का मौक़ा देता है।","— यह शहर का सबसे अच्छा रेस्तराँ है। — तुम्हें सच में ऐसा लगता है? मुझे तो बस ठीक-ठाक लगा।"],"vi":["Bạn thật sự nghĩ vậy à?","Nhẹ nhàng cho thấy bạn nghi ngờ, và mời người kia giải thích.","— Đây là nhà hàng ngon nhất thành phố. — Bạn thật sự nghĩ vậy à? Mình thấy chỉ tàm tạm thôi."]}],["I'm afraid I disagree.","စိတ်မရှိပါနဲ့၊ သဘောမတူပါဘူး။","Polite and a little formal: good at work and in meetings. I'm afraid softens it.","I'm afraid I disagree. The price is too high for us.","စိတ်မရှိပါနဲ့၊ သဘောမတူပါဘူး။ ဈေးနှုန်းက ကျွန်တော်တို့အတွက် မြင့်လွန်းတယ်။",{"es":["Me temo que no estoy de acuerdo.","Cortés y un poco formal: bueno en el trabajo y en reuniones. I'm afraid lo suaviza.","Me temo que no estoy de acuerdo. El precio es demasiado alto para nosotros."],"fr":["Je crains de ne pas être d'accord.","Poli et un peu formel : bien au travail et en réunion. I'm afraid adoucit.","Je crains de ne pas être d'accord. Le prix est trop élevé pour nous."],"hi":["माफ़ कीजिए, पर मैं असहमत हूँ।","विनम्र और थोड़ा औपचारिक: काम पर और बैठकों में अच्छा। I'm afraid इसे नरम बना देता है।","माफ़ कीजिए, पर मैं असहमत हूँ। यह दाम हमारे लिए बहुत ज़्यादा है।"],"vi":["Tôi e là tôi không đồng ý.","Lịch sự và hơi trang trọng: hợp ở chỗ làm và trong cuộc họp. I'm afraid làm câu nhẹ đi.","Tôi e là tôi không đồng ý. Giá đó quá cao với chúng tôi."]}]],"tr":{"es":["Discrepar con cortesía","Decir que piensas distinto, sin empezar una discusión."],"fr":["Exprimer poliment son désaccord","Dire que l'on pense autrement, sans déclencher une dispute."],"hi":["विनम्रता से असहमत होना","कहना कि आप अलग सोचते हैं, पर बहस छेड़े बिना।"],"vi":["Phản đối lịch sự","Nói rằng bạn nghĩ khác mà không gây tranh cãi."]}},{"en":"Strong disagreement","my":"ပြင်းပြင်းထန်ထန် သဘောမတူခြင်း","desc":"Direct and strong. Fine with friends or when it really matters; careful with older people and at work.","cards":[["I don't agree at all.","လုံးဝ သဘောမတူဘူး။","A clear, strong no. Use it when something matters to you.","— Girls don't need to go to university. — I don't agree at all!","— မိန်းကလေးတွေ တက္ကသိုလ် တက်ဖို့ မလိုဘူး။ — လုံးဝ သဘောမတူဘူး။",{"es":["No estoy nada de acuerdo.","Un no claro y fuerte. Úsalo cuando algo te importa.","— Las niñas no necesitan ir a la universidad. — ¡No estoy nada de acuerdo!"],"fr":["Je ne suis pas du tout d'accord.","Un non clair et fort. À employer quand le sujet vous tient à cœur.","— Les filles n'ont pas besoin d'aller à l'université. — Je ne suis pas du tout d'accord !"],"hi":["मैं बिलकुल सहमत नहीं हूँ।","साफ़ और ज़ोरदार ना। तब कहिए जब बात आपके लिए मायने रखती हो।","— लड़कियों को यूनिवर्सिटी जाने की ज़रूरत नहीं। — मैं बिलकुल सहमत नहीं हूँ!"],"vi":["Mình hoàn toàn không đồng ý.","Một lời “không” rõ ràng và mạnh. Dùng khi chuyện đó quan trọng với bạn.","— Con gái không cần học đại học. — Mình hoàn toàn không đồng ý!"]}],["That's not true.","အဲဒါ မမှန်ဘူး။","Says a fact is wrong. Add a reason so it doesn't sound like an attack.","— You never help at home. — That's not true! I cooked dinner yesterday.","— မင်း အိမ်မှာ ဘယ်တော့မှ မကူဘူး။ — မမှန်ဘူး။ မနေ့က ညစာ ချက်ခဲ့တာလေ။",{"es":["Eso no es cierto.","Dice que un hecho es falso. Agrega un motivo para que no suene a ataque.","— Nunca ayudas en la casa. — ¡Eso no es cierto! Ayer hice la cena."],"fr":["Ce n'est pas vrai.","Dit qu'un fait est faux. Ajoutez une raison pour que cela ne ressemble pas à une attaque.","— Tu n'aides jamais à la maison. — Ce n'est pas vrai ! J'ai fait le dîner hier."],"hi":["यह सच नहीं है।","कहता है कि कोई तथ्य ग़लत है। वजह जोड़िए ताकि हमला न लगे।","— तुम घर में कभी मदद नहीं करते। — यह सच नहीं है! कल खाना मैंने बनाया था।"],"vi":["Không đúng.","Nói rằng một sự việc là sai. Thêm lý do để không nghe như công kích.","— Bạn chẳng bao giờ giúp việc nhà. — Không đúng! Hôm qua mình nấu bữa tối mà."]}],["You're wrong.","မှားနေတယ်။","Very direct: it can sound rude. Softer: I don't think that's right.","— Bangkok is the capital of Vietnam. — You're wrong. It's Hanoi.","— ဘန်ကောက်က ဗီယက်နမ်ရဲ့ မြို့တော်ပဲ။ — မှားနေတယ်။ ဟနွိုင်းပါ။",{"es":["Estás equivocado.","Muy directo: puede sonar grosero. Más suave: I don't think that's right.","— Bangkok es la capital de Vietnam. — Estás equivocado. Es Hanói."],"fr":["Tu te trompes.","Très direct : cela peut sembler impoli. Plus doux : I don't think that's right.","— Bangkok est la capitale du Vietnam. — Tu te trompes. C'est Hanoï."],"hi":["आप ग़लत हैं।","बहुत सीधा: रूखा लग सकता है। ज़्यादा नरम: I don't think that's right.","— बैंकॉक वियतनाम की राजधानी है। — तुम ग़लत हो। वह हनोई है।"],"vi":["Bạn sai rồi.","Rất thẳng: có thể nghe thô lỗ. Nhẹ nhàng hơn: I don't think that's right.","— Bangkok là thủ đô của Việt Nam. — Bạn sai rồi. Là Hà Nội."]}],["Of course not!","ဘယ်ဟုတ်မလဲ။","A strong no to a question. Often kind: it tells someone not to worry.","— Do you think I'm lazy? — Of course not!","— ကျွန်မကို ပျင်းတယ်လို့ ထင်လား။ — ဘယ်ဟုတ်မလဲ။",{"es":["¡Claro que no!","Un no fuerte a una pregunta. A menudo amable: le dice a alguien que no se preocupe.","— ¿Crees que soy flojo? — ¡Claro que no!"],"fr":["Bien sûr que non !","Un non fort à une question. Souvent gentil : il dit à quelqu'un de ne pas s'inquiéter.","— Tu trouves que je suis paresseux ? — Bien sûr que non !"],"hi":["बिलकुल नहीं!","किसी सवाल पर ज़ोरदार ना। अक्सर भली होती है: सामने वाले को बताती है कि वह फ़िक्र न करे।","— क्या तुम्हें लगता है कि मैं आलसी हूँ? — बिलकुल नहीं!"],"vi":["Tất nhiên là không!","Một lời “không” mạnh cho một câu hỏi. Thường là tử tế: bảo người kia đừng lo.","— Bạn có nghĩ mình lười không? — Tất nhiên là không!"]}]],"tr":{"es":["Desacuerdo fuerte","Directo y fuerte. Está bien con amigos o cuando de verdad importa; cuidado con las personas mayores y en el trabajo."],"fr":["Désaccord marqué","Direct et fort. Convient entre amis ou quand c'est vraiment important ; prudence avec les personnes âgées et au travail."],"hi":["कड़ी असहमति","सीधी और ज़ोरदार। दोस्तों के साथ या जब बात सचमुच ज़रूरी हो तब ठीक; बड़ों के साथ और काम पर सँभलकर।"],"vi":["Phản đối mạnh","Thẳng và mạnh. Dùng với bạn bè hoặc khi chuyện thật sự quan trọng thì được; cẩn thận với người lớn tuổi và ở chỗ làm."]}},{"en":"Ending a disagreement","my":"သဘောကွဲလွဲမှုကို အဆုံးသတ်ခြင်း","desc":"Moving on calmly when you don't agree, or when you change your mind.","cards":[["Let's agree to disagree.","သဘောကွဲတာကို လက်ခံလိုက်ကြရအောင်။","We both keep our own opinion, and stay friends.","We like different football teams. Let's agree to disagree!","ကျွန်တော်တို့ မတူတဲ့ ဘောလုံးအသင်းတွေ ကြိုက်တယ်။ သဘောကွဲတာကို လက်ခံလိုက်ကြရအောင်။",{"es":["Quedemos en que no estamos de acuerdo.","Cada quien se queda con su opinión, y seguimos siendo amigos.","Le vamos a equipos de fútbol distintos. ¡Quedemos en que no estamos de acuerdo!"],"fr":["Restons-en là, chacun son avis.","Chacun garde son opinion, et l'on reste amis.","On soutient des équipes de foot différentes. Restons-en là, chacun son avis !"],"hi":["चलो मान लेते हैं कि हमारी राय अलग है।","हर कोई अपनी राय पर क़ायम रहता है, और हम दोस्त बने रहते हैं।","हमें अलग-अलग फ़ुटबॉल टीमें पसंद हैं। चलो मान लेते हैं कि हमारी राय अलग है!"],"vi":["Thôi, mỗi người một ý vậy.","Ai giữ ý người nấy, và chúng ta vẫn là bạn.","Bọn mình thích hai đội bóng khác nhau. Thôi, mỗi người một ý vậy!"]}],["You may be right.","မှန်ကောင်း မှန်မှာပါ။","Accepts that the other person could be correct. Calm and polite.","— I think it will rain later. — You may be right. Let's take an umbrella.","— နောက်မှ မိုးရွာမယ် ထင်တယ်။ — မှန်ကောင်း မှန်မှာပါ။ ထီး ယူသွားကြရအောင်။",{"es":["Puede que tengas razón.","Acepta que la otra persona podría estar en lo correcto. Tranquilo y cortés.","— Creo que va a llover más tarde. — Puede que tengas razón. Llevemos un paraguas."],"fr":["Tu as peut-être raison.","Admet que l'autre pourrait avoir raison. Calme et poli.","— Je crois qu'il va pleuvoir plus tard. — Tu as peut-être raison. Prenons un parapluie."],"hi":["हो सकता है आप सही हों।","मान लेता है कि सामने वाला सही हो सकता है। शांत और विनम्र।","— मुझे लगता है बाद में बारिश होगी। — हो सकता है तुम सही हो। छाता ले लेते हैं।"],"vi":["Có thể bạn đúng.","Chấp nhận rằng người kia có thể đúng. Bình tĩnh và lịch sự.","— Mình nghĩ lát nữa trời sẽ mưa. — Có thể bạn đúng. Mang ô đi nhé."]}],["I hadn't thought of that.","အဲဒါကို မစဉ်းစားမိခဲ့ဘူး။","You hear a new idea and start to change your mind.","— If we leave at five, we'll miss the traffic. — Oh, I hadn't thought of that.","— ငါးနာရီ ထွက်ရင် ကားကြပ်ချိန်နဲ့ မကြုံရဘူး။ — အို၊ အဲဒါကို မစဉ်းစားမိခဲ့ဘူး။",{"es":["No lo había pensado.","Oyes una idea nueva y empiezas a cambiar de opinión.","— Si salimos a las cinco, nos evitamos el tráfico. — Ah, no lo había pensado."],"fr":["Je n'y avais pas pensé.","Vous entendez une idée nouvelle et commencez à changer d'avis.","— Si on part à cinq heures, on évite les bouchons. — Oh, je n'y avais pas pensé."],"hi":["यह तो मैंने सोचा ही नहीं था।","आप कोई नई बात सुनते हैं और आपका मन बदलने लगता है।","— अगर हम पाँच बजे निकलें, तो ट्रैफ़िक से बच जाएँगे। — अरे, यह तो मैंने सोचा ही नहीं था।"],"vi":["Mình chưa nghĩ đến điều đó.","Bạn nghe một ý mới và bắt đầu đổi ý.","— Nếu đi lúc năm giờ thì mình tránh được kẹt xe. — Ồ, mình chưa nghĩ đến điều đó."]}],["OK, you win!","အိုကေ၊ မင်းပဲ နိုင်ပါတယ်။","Playful: giving in with a smile. Only with friends and family.","— Pizza or noodles? Come on, pizza! — OK, you win!","— ပီဇာလား ခေါက်ဆွဲလား။ လာပါ၊ ပီဇာ စားရအောင်။ — အိုကေ၊ မင်းပဲ နိုင်ပါတယ်။",{"es":["Está bien, ¡tú ganas!","Juguetón: ceder con una sonrisa. Solo con amigos y familia.","— ¿Pizza o fideos? ¡Ándale, pizza! — Está bien, ¡tú ganas!"],"fr":["D'accord, tu as gagné !","Amusé : céder avec le sourire. Seulement entre amis et en famille.","— Pizza ou nouilles ? Allez, pizza ! — D'accord, tu as gagné !"],"hi":["ठीक है, तुम जीते!","चुलबुला: मुस्कुराकर हार मान लेना। सिर्फ़ दोस्तों और परिवार के साथ।","— पिज़्ज़ा या नूडल्स? चलो न, पिज़्ज़ा! — ठीक है, तुम जीते!"],"vi":["Thôi được, bạn thắng!","Vui đùa: chịu thua với một nụ cười. Chỉ dùng với bạn bè và gia đình.","— Pizza hay mì? Nào, pizza đi! — Thôi được, bạn thắng!"]}],["Let's talk about it later.","နောက်မှ ဆက်ပြောကြရအောင်။","Stops an argument before it gets worse.","We're both tired. Let's talk about it later.","နှစ်ယောက်လုံး ပင်ပန်းနေကြပြီ။ နောက်မှ ဆက်ပြောကြရအောင်။",{"es":["Lo hablamos después.","Detiene una discusión antes de que empeore.","Los dos estamos cansados. Lo hablamos después."],"fr":["On en reparle plus tard.","Arrête une dispute avant qu'elle n'empire.","On est fatigués tous les deux. On en reparle plus tard."],"hi":["इस पर बाद में बात करते हैं।","बहस को बिगड़ने से पहले रोक देता है।","हम दोनों थके हुए हैं। इस पर बाद में बात करते हैं।"],"vi":["Để sau mình nói chuyện này nhé.","Dừng cuộc tranh cãi trước khi nó tệ hơn.","Cả hai đứa mình đều mệt rồi. Để sau mình nói chuyện này nhé."]}]],"tr":{"es":["Terminar un desacuerdo","Seguir adelante con calma cuando no están de acuerdo, o cuando cambias de opinión."],"fr":["Clore un désaccord","Passer à autre chose calmement quand on n'est pas d'accord, ou quand on change d'avis."],"hi":["असहमति ख़त्म करना","जब आप सहमत न हों या आपका मन बदल जाए, तब शांति से आगे बढ़ना।"],"vi":["Kết thúc bất đồng","Bình tĩnh cho qua khi không đồng ý, hoặc khi bạn đổi ý."]}}];const langs=["my","es","fr","hi","vi"];const COURSE="eng";</script>
