<script>const AUD_DIR="https://languages.rmlives.com/eng/expressions/comfort/";const AUD_EXT="mp3?v=2611200514";const categories=[{"en":"When someone is upset","my":"စိတ်မကောင်းဖြစ်နေတဲ့အခါ","desc":"Noticing that someone is sad or worried, and asking gently.","cards":[["Are you OK?","အဆင်ပြေရဲ့လား။","The simplest way to show you care. Also: Are you all right?","You're very quiet today. Are you OK?","ဒီနေ့ အရမ်း တိတ်နေတယ်။ အဆင်ပြေရဲ့လား။",{"es":["¿Estás bien?","La manera más sencilla de mostrar que te importa. También: Are you all right?","Hoy estás muy callado. ¿Estás bien?"],"fr":["Ça va ?","La façon la plus simple de montrer que l'on se soucie de l'autre. On dit aussi : Are you all right?","Tu es bien silencieux aujourd'hui. Ça va ?"]}],["What's wrong?","ဘာဖြစ်လို့လဲ။","Asks gently what the problem is. Kinder than What's your problem?, which sounds angry.","Why are you crying? What's wrong?","ဘာလို့ ငိုနေတာလဲ။ ဘာဖြစ်လို့လဲ။",{"es":["¿Qué te pasa?","Pregunta con suavidad cuál es el problema. Más amable que What's your problem?, que suena enojado.","¿Por qué lloras? ¿Qué te pasa?"],"fr":["Qu'est-ce qui ne va pas ?","Demande doucement quel est le problème. Plus gentil que What's your problem?, qui a l'air fâché.","Pourquoi tu pleures ? Qu'est-ce qui ne va pas ?"]}],["Do you want to talk about it?","ပြောပြချင်လား။","Offers to listen, but lets the other person decide.","You look sad. Do you want to talk about it?","စိတ်မကောင်း ဖြစ်နေပုံ ရတယ်။ ပြောပြချင်လား။",{"es":["¿Quieres platicarlo?","Ofrece escuchar, pero deja que la otra persona decida.","Te ves triste. ¿Quieres platicarlo?"],"fr":["Tu veux en parler ?","Propose d'écouter, mais laisse l'autre décider.","Tu as l'air triste. Tu veux en parler ?"]}],["You look worried.","စိတ်ပူနေပုံ ရတယ်။","Says what you notice, so the other person can explain.","You look worried. Is it the test?","စိတ်ပူနေပုံ ရတယ်။ စာမေးပွဲကြောင့်လား။",{"es":["Te ves preocupado.","Dice lo que notas, para que la otra persona pueda explicarse.","Te ves preocupado. ¿Es por el examen?"],"fr":["Tu as l'air inquiet.","Dit ce que vous remarquez, pour que l'autre puisse s'expliquer.","Tu as l'air inquiet. C'est le contrôle ?"]}]],"tr":{"es":["Cuando alguien está triste","Notar que alguien está triste o preocupado, y preguntar con suavidad."],"fr":["Quand quelqu'un ne va pas bien","Remarquer que quelqu'un est triste ou inquiet, et demander avec douceur."]}},{"en":"Comforting","my":"နှစ်သိမ့်ခြင်း","desc":"Kind words to help someone feel better.","cards":[["It's going to be OK.","အဆင်ပြေသွားမှာပါ။","The most common comforting words. Also: Everything will be fine.","Don't cry. It's going to be OK.","မငိုပါနဲ့။ အဆင်ပြေသွားမှာပါ။",{"es":["Todo va a estar bien.","Las palabras de consuelo más comunes. También: Everything will be fine.","No llores. Todo va a estar bien."],"fr":["Ça va aller.","Les mots de réconfort les plus courants. On dit aussi : Everything will be fine.","Ne pleure pas. Ça va aller."]}],["Don't be sad.","စိတ်မကောင်း မဖြစ်ပါနဲ့။","Simple and kind, often to a child or a close friend.","Don't be sad. We can play again tomorrow.","စိတ်မကောင်း မဖြစ်ပါနဲ့။ မနက်ဖြန် ထပ်ကစားလို့ ရပါတယ်။",{"es":["No estés triste.","Sencillo y amable, a menudo para un niño o un amigo cercano.","No estés triste. Mañana podemos jugar otra vez."],"fr":["Ne sois pas triste.","Simple et gentil, souvent pour un enfant ou un ami proche.","Ne sois pas triste. On pourra rejouer demain."]}],["I'm here for you.","ကျွန်တော်/ကျွန်မ အနားမှာ ရှိပါတယ်။","You will help and listen, whatever happens.","Call me any time. I'm here for you.","ဘယ်အချိန်ဖြစ်ဖြစ် ဖုန်းဆက်ပါ။ အနားမှာ ရှိပါတယ်။",{"es":["Aquí estoy para ti.","Vas a ayudar y a escuchar, pase lo que pase.","Llámame cuando quieras. Aquí estoy para ti."],"fr":["Je suis là pour toi.","Vous aiderez et écouterez, quoi qu'il arrive.","Appelle-moi quand tu veux. Je suis là pour toi."]}],["It's OK to cry.","ငိုချင်ရင် ငိုလို့ ရပါတယ်။","Tells someone their feelings are normal.","It's OK to cry. I miss her too.","ငိုချင်ရင် ငိုလို့ ရပါတယ်။ ကျွန်မလည်း သူ့ကို သတိရတယ်။",{"es":["Está bien llorar.","Le dice a alguien que lo que siente es normal.","Está bien llorar. Yo también la extraño."],"fr":["Tu as le droit de pleurer.","Dit à quelqu'un que ce qu'il ressent est normal.","Tu as le droit de pleurer. Elle me manque aussi."]}],["It could be worse.","ဒီထက် ဆိုးနိုင်သေးတာပဲ။","Helps someone see that a problem is small. Not for serious bad news.","— I lost my umbrella. — Oh well, it could be worse!","— ထီး ပျောက်သွားတယ်။ — ကိစ္စမရှိပါဘူး၊ ဒီထက် ဆိုးနိုင်သေးတာပဲ။",{"es":["Podría ser peor.","Ayuda a ver que un problema es pequeño. No para malas noticias serias.","— Perdí mi paraguas. — Bueno, ¡podría ser peor!"],"fr":["Ça pourrait être pire.","Aide à voir qu'un problème est petit. Pas pour les mauvaises nouvelles graves.","— J'ai perdu mon parapluie. — Bah, ça pourrait être pire !"]}],["These things happen.","ဒီလို ကိစ္စတွေ ဖြစ်တတ်ပါတယ်။","Says it's normal bad luck, not anyone's fault.","Your phone broke? These things happen.","ဖုန်း ပျက်သွားတာလား။ ဒီလို ကိစ္စတွေ ဖြစ်တတ်ပါတယ်။",{"es":["Son cosas que pasan.","Dice que es mala suerte normal, no culpa de nadie.","¿Se rompió tu teléfono? Son cosas que pasan."],"fr":["Ce sont des choses qui arrivent.","Dit que c'est de la malchance ordinaire, la faute de personne.","Ton téléphone s'est cassé ? Ce sont des choses qui arrivent."]}]],"tr":{"es":["Consolar","Palabras amables para ayudar a alguien a sentirse mejor."],"fr":["Réconforter","Des mots gentils pour aider quelqu'un à se sentir mieux."]}},{"en":"Encouraging","my":"အားပေးခြင်း","desc":"Before something hard: a test, a race, a performance.","cards":[["You can do it!","မင်း လုပ်နိုင်ပါတယ်။","The classic encouragement. Teachers and parents say it all the time.","The race is starting. You can do it!","ပြိုင်ပွဲ စတော့မယ်။ မင်း လုပ်နိုင်ပါတယ်။",{"es":["¡Tú puedes!","El ánimo clásico. Los maestros y los padres lo dicen todo el tiempo.","Ya empieza la carrera. ¡Tú puedes!"],"fr":["Tu peux le faire !","L'encouragement classique. Les professeurs et les parents le disent sans arrêt.","La course commence. Tu peux le faire !"]}],["Don't give up!","လက်မလျှော့နဲ့။","When something is difficult and someone wants to stop.","Maths is hard, but don't give up!","သင်္ချာက ခက်တယ်၊ ဒါပေမဲ့ လက်မလျှော့နဲ့။",{"es":["¡No te rindas!","Cuando algo es difícil y alguien quiere dejarlo.","Las matemáticas son difíciles, ¡pero no te rindas!"],"fr":["N'abandonne pas !","Quand quelque chose est difficile et que quelqu'un veut arrêter.","Les maths, c'est dur, mais n'abandonne pas !"]}],["Just do your best.","တတ်နိုင်သလောက် ကြိုးစားလိုက်ပါ။","Takes away pressure: trying hard is what matters.","Don't worry about winning. Just do your best.","နိုင်ဖို့ကို စိတ်မပူပါနဲ့။ တတ်နိုင်သလောက် ကြိုးစားလိုက်ပါ။",{"es":["Solo haz tu mejor esfuerzo.","Quita presión: lo que importa es esforzarse.","No te preocupes por ganar. Solo haz tu mejor esfuerzo."],"fr":["Fais simplement de ton mieux.","Enlève de la pression : ce qui compte, c'est de faire des efforts.","Ne t'inquiète pas de gagner. Fais simplement de ton mieux."]}],["Believe in yourself.","ကိုယ့်ကိုယ်ကို ယုံကြည်ပါ။","For someone who doesn't feel confident.","You know the answers. Believe in yourself.","အဖြေတွေ သိပါတယ်။ ကိုယ့်ကိုယ်ကို ယုံကြည်ပါ။",{"es":["Cree en ti.","Para alguien que no se siente seguro de sí mismo.","Te sabes las respuestas. Cree en ti."],"fr":["Crois en toi.","Pour quelqu'un qui manque de confiance.","Tu connais les réponses. Crois en toi."]}],["Take a deep breath.","အသက်ကို ဝဝ ရှူလိုက်ပါ။","Helps someone calm down when they are nervous.","Take a deep breath. Now, start again slowly.","အသက်ကို ဝဝ ရှူလိုက်ပါ။ အခု ဖြည်းဖြည်း ပြန်စပါ။",{"es":["Respira hondo.","Ayuda a alguien a calmarse cuando está nervioso.","Respira hondo. Ahora empieza otra vez, despacio."],"fr":["Respire un grand coup.","Aide quelqu'un à se calmer quand il est nerveux.","Respire un grand coup. Maintenant, recommence lentement."]}],["You've got this!","မင်း အဆင်ပြေမှာပါ။","Casual and friendly: I'm sure you will succeed.","Big day today! You've got this!","ဒီနေ့ အရေးကြီးတဲ့နေ့ပဲ။ မင်း အဆင်ပြေမှာပါ။",{"es":["¡Tú puedes con esto!","Informal y amistoso: estoy seguro de que lo vas a lograr.","¡Hoy es el gran día! ¡Tú puedes con esto!"],"fr":["Tu vas y arriver !","Familier et amical : je suis sûr que vous réussirez.","C'est le grand jour ! Tu vas y arriver !"]}]],"tr":{"es":["Animar","Antes de algo difícil: un examen, una carrera, una presentación."],"fr":["Encourager","Avant quelque chose de difficile : un contrôle, une course, un spectacle."]}},{"en":"After a mistake","my":"အမှား လုပ်မိတဲ့အခါ","desc":"Helping someone try again instead of feeling bad.","cards":[["Never mind.","ကိစ္စမရှိပါဘူး။","It doesn't matter, forget it.","— I dropped the cup! — Never mind. I'll get another one.","— ခွက် ပြုတ်ကျသွားတယ်။ — ကိစ္စမရှိပါဘူး။ နောက်တစ်လုံး ယူလိုက်မယ်။",{"es":["No importa.","No tiene importancia, olvídalo.","— ¡Se me cayó la taza! — No importa. Traigo otra."],"fr":["Ce n'est pas grave.","Cela n'a pas d'importance, oubliez ça.","— J'ai fait tomber la tasse ! — Ce n'est pas grave. J'en prends une autre."]}],["Try again!","ထပ်ကြိုးစားကြည့်။","Friendly and simple, often in class or games.","Almost! Try again!","နီးပါပြီ။ ထပ်ကြိုးစားကြည့်။",{"es":["¡Inténtalo otra vez!","Amistoso y sencillo, a menudo en clase o en juegos.","¡Casi! ¡Inténtalo otra vez!"],"fr":["Essaie encore !","Amical et simple, souvent en classe ou dans les jeux.","Presque ! Essaie encore !"]}],["Everyone makes mistakes.","လူတိုင်း အမှား လုပ်တတ်ပါတယ်။","Mistakes are normal. Not: Everyone does mistakes.","Don't worry. Everyone makes mistakes.","စိတ်မပူပါနဲ့။ လူတိုင်း အမှား လုပ်တတ်ပါတယ်။",{"es":["Todos cometemos errores.","Los errores son normales. No: Everyone does mistakes.","No te preocupes. Todos cometemos errores."],"fr":["Tout le monde fait des erreurs.","Les erreurs sont normales. Pas : Everyone does mistakes.","Ne t'inquiète pas. Tout le monde fait des erreurs."]}],["You'll do better next time.","နောက်တစ်ခါ ပိုကောင်းလာမှာပါ။","After a bad result: look forward, not back.","Your score was low, but you'll do better next time.","အမှတ် နည်းသွားပေမဲ့ နောက်တစ်ခါ ပိုကောင်းလာမှာပါ။",{"es":["La próxima vez te irá mejor.","Después de un mal resultado: mira hacia adelante, no hacia atrás.","Tu calificación fue baja, pero la próxima vez te irá mejor."],"fr":["Tu feras mieux la prochaine fois.","Après un mauvais résultat : regardez devant, pas derrière.","Ta note était basse, mais tu feras mieux la prochaine fois."]}],["Practice makes perfect.","လေ့ကျင့်ရင် တော်လာမှာပါ။","A saying: if you practise a lot, you will become very good.","Play it ten more times. Practice makes perfect!","နောက်ထပ် ဆယ်ခါ တီးကြည့်။ လေ့ကျင့်ရင် တော်လာမှာပါ။",{"es":["La práctica hace al maestro.","Un dicho: si practicas mucho, llegarás a ser muy bueno.","Tócala diez veces más. ¡La práctica hace al maestro!"],"fr":["C'est en forgeant qu'on devient forgeron.","Un proverbe : à force de s'exercer, on devient très bon.","Joue-le encore dix fois. C'est en forgeant qu'on devient forgeron !"]}]],"tr":{"es":["Después de un error","Ayudar a alguien a intentarlo otra vez en lugar de sentirse mal."],"fr":["Après une erreur","Aider quelqu'un à réessayer plutôt qu'à se sentir mal."]}},{"en":"Praising effort","my":"ကြိုးစားမှုကို ချီးကျူးခြင်း","desc":"Noticing hard work and progress, not only results.","cards":[["Keep it up!","ဒီအတိုင်း ဆက်လုပ်။","Continue doing this well.","Your writing is much better. Keep it up!","စာရေးတာ အများကြီး ပိုကောင်းလာပြီ။ ဒီအတိုင်း ဆက်လုပ်။",{"es":["¡Sigue así!","Sigue haciéndolo así de bien.","Tu letra está mucho mejor. ¡Sigue así!"],"fr":["Continue comme ça !","Continuez à faire aussi bien.","Ton écriture est bien meilleure. Continue comme ça !"]}],["You're getting better!","ပိုတော်လာပြီ။","Notices progress, even if it isn't perfect yet.","You're getting better at swimming!","ရေကူးတာ ပိုတော်လာပြီ။",{"es":["¡Vas mejorando!","Nota el progreso, aunque todavía no sea perfecto.","¡Vas mejorando en natación!"],"fr":["Tu fais des progrès !","Remarque les progrès, même si ce n'est pas encore parfait.","Tu fais des progrès en natation !"]}],["I'm proud of you.","မင်းအတွက် ဂုဏ်ယူတယ်။","Warm and personal. Parents and teachers say it to children.","You worked so hard. I'm proud of you.","အရမ်း ကြိုးစားခဲ့တယ်။ မင်းအတွက် ဂုဏ်ယူတယ်။",{"es":["Estoy orgulloso de ti.","Cálido y personal. Los padres y los maestros se lo dicen a los niños.","Trabajaste muy duro. Estoy orgulloso de ti."],"fr":["Je suis fier de toi.","Chaleureux et personnel. Les parents et les professeurs le disent aux enfants.","Tu as tellement travaillé. Je suis fier de toi."]}],["Look how far you've come!","ဘယ်လောက် တိုးတက်လာပြီလဲ ကြည့်စမ်း။","Compares now with before, to show the progress.","A year ago you couldn't read. Look how far you've come!","လွန်ခဲ့တဲ့ တစ်နှစ်က စာမဖတ်တတ်သေးဘူး။ ဘယ်လောက် တိုးတက်လာပြီလဲ ကြည့်စမ်း။",{"es":["¡Mira cuánto has avanzado!","Compara el ahora con el antes, para mostrar el progreso.","Hace un año no sabías leer. ¡Mira cuánto has avanzado!"],"fr":["Regarde le chemin parcouru !","Compare maintenant et avant, pour montrer les progrès.","Il y a un an, tu ne savais pas lire. Regarde le chemin parcouru !"]}],["That was a good try.","ကောင်းကောင်း ကြိုးစားခဲ့တာပဲ။","Praises the effort when the result wasn't right.","Not quite, but that was a good try!","မမှန်သေးဘူး၊ ဒါပေမဲ့ ကောင်းကောင်း ကြိုးစားခဲ့တာပဲ။",{"es":["Fue un buen intento.","Elogia el esfuerzo cuando el resultado no fue correcto.","No del todo, ¡pero fue un buen intento!"],"fr":["C'était bien essayé.","Félicite l'effort quand le résultat n'était pas le bon.","Pas tout à fait, mais c'était bien essayé !"]}]],"tr":{"es":["Elogiar el esfuerzo","Notar el trabajo duro y el progreso, no solo los resultados."],"fr":["Féliciter l'effort","Remarquer les efforts et les progrès, pas seulement les résultats."]}}];const langs=["my","es","fr"];const COURSE="eng";</script>
