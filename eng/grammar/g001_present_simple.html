:root{--bg:#f7f4ee;--card:#fff;--ink:#22252b;--mut:#667085;--line:#e6e0d6;--acc:#0f766e;--accbg:#e6f4f1;
--emma:#a21caf;--lucas:#1d4ed8;--ok:#15803d;--okbg:#e8f5ec;--bad:#b42318;--badbg:#fdecea;--hl:#fde68a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar","Noto Sans Devanagari",sans-serif}
body[data-l=my] .my{font-family:"Noto Sans Myanmar",system-ui,sans-serif;line-height:1.9}
body[data-l=hi] .my{font-family:"Noto Sans Devanagari",system-ui,sans-serif;line-height:1.75}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center}
header .back{color:#fff;text-decoration:none;font-size:26px;line-height:1;padding:0 6px 3px}
header .code{font-weight:700;background:rgba(255,255,255,.18);border-radius:6px;padding:2px 8px;font-size:14px}
header h1{font-size:17px;margin:0;flex:1;font-weight:650}
header select{font:inherit;font-size:14px;border:0;border-radius:6px;padding:5px 6px;background:#fff;color:var(--ink);max-width:42vw}
main{max-width:760px;margin:0 auto;padding:12px 12px 60px}
.sub{color:var(--mut);margin:6px 2px 12px;font-size:15px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accbg);color:var(--acc);font-size:14px;font-weight:700;flex:none}
h3{font-size:15px;margin:16px 0 8px;color:var(--acc)}
p{margin:6px 0}
.hint{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;min-height:40px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.55;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{padding:6px 10px;min-height:36px;font-size:14px}
.tabs button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.stage{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#d9efe9,#f6ead2);display:grid;place-items:center;text-align:center;color:#47605b;position:relative}
.stage img{width:100%;height:100%;object-fit:cover;display:block}
.stage .ph{padding:12px}
.stage .ph b{display:block;font-size:20px;margin-bottom:4px}
.stage .ph span{font-size:13px;opacity:.8}
.lines{margin:10px 0 4px;display:flex;flex-direction:column;gap:6px;min-height:60px}
.ln{border-radius:10px;padding:7px 10px;border:1px solid transparent;cursor:pointer;display:none}
.ln.show{display:block}
.ln.cur{background:#fbf7ea;border-color:var(--hl)}
.ln .who{font-weight:700;margin-right:6px;font-size:14px}
.ln.Emma .who{color:var(--emma)} .ln.Lucas .who{color:var(--lucas)}
.ln.Emma{border-left:3px solid var(--emma)} .ln.Lucas{border-left:3px solid var(--lucas)}
.ln .tr{display:block;color:var(--mut);font-size:14px}
.t{white-space:nowrap;background:var(--hl);border-radius:4px;padding:0 3px;font-weight:650}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
label.chk{font-size:14px;color:var(--mut);display:flex;align-items:center;gap:6px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
summary{cursor:pointer;font-weight:600}
details p{color:var(--acc);font-weight:600}
ul.pts{margin:6px 0;padding-left:20px} ul.pts li{margin:6px 0}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:15px}
caption{text-align:left;font-weight:700;color:var(--acc);padding-bottom:4px;font-size:14px}
td{border:1px solid var(--line);padding:7px 9px} td:first-child{background:#faf8f3;width:46%}
.snd{display:flex;gap:8px;flex-wrap:wrap}
.snd button{display:flex;flex-direction:column;align-items:center;min-width:86px}
.snd small{color:var(--mut)}
.mis{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
.mis .w{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.mis .r{color:var(--ok);font-weight:650}
.mis .note{color:var(--mut);font-size:14px}
.it{border-top:1px dashed var(--line);padding:10px 0}
.it:first-of-type{border-top:0}
.it .s{margin-bottom:6px}
.blank{display:inline-block;min-width:54px;border-bottom:2px solid var(--mut);text-align:center;font-weight:700;color:var(--ok)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button.good{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opts button.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
input[type=text]{font:inherit;border:1px solid #cfc8bb;border-radius:10px;padding:8px 10px;min-height:40px;width:100%;max-width:100%}
.inrow{display:flex;gap:6px} .inrow input{flex:1;min-width:0}
input.good{border-color:var(--ok);background:var(--okbg)} input.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{font-size:14px;margin-top:4px;min-height:20px} .fb.good{color:var(--ok)} .fb.wrong{color:var(--bad)}
.bad{color:var(--bad)}
.score{font-weight:700;font-size:18px;color:var(--acc)}
.spk{display:flex;gap:8px;align-items:center;padding:6px 0}
.spk button{flex:none;min-width:44px}
[hidden]{display:none!important}
.dl{display:inline-flex;gap:6px;align-items:center;margin:0 2px 12px;padding:8px 14px;border-radius:10px;border:1px solid var(--acc);color:var(--acc);background:#fff;text-decoration:none;font-weight:600;font-size:15px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:8px}
</style>
</head>

<main id="app"></main>

<script>
const L = {"subtitle": {"my": "နေ့တိုင်း၊ အမြဲ လုပ်လေ့ရှိသော အရာများ", "en": "Things we do every day", "es": "Cosas que hacemos todos los días", "vi": "Những việc ta làm hằng ngày", "hi": "जो काम हम रोज़ करते हैं"}, "langs": ["my", "en", "es", "hi", "vi"], "scenes": [{"title": "The Morning", "image_note": "Bedroom, early morning. Emma dressed and awake by the window; Lucas still in bed under the blanket, alarm clock showing 6:00.", "lines": [{"who": "Emma", "text": "I [[get up]] at six every day.", "tr": {"my": "ကျွန်မ နေ့တိုင်း ခြောက်နာရီ အိပ်ရာထတယ်။", "es": "Me levanto a las seis todos los días.", "vi": "Ngày nào em cũng dậy lúc sáu giờ.", "hi": "मैं रोज़ छह बजे उठती हूँ।"}}, {"who": "Lucas", "text": "I [[get up]] at six too.", "tr": {"my": "ကျွန်တော်လည်း ခြောက်နာရီ ထတယ်။", "es": "Yo también me levanto a las seis.", "vi": "Anh cũng dậy lúc sáu giờ.", "hi": "मैं भी छह बजे उठता हूँ।"}}, {"who": "Emma", "text": "No. You [[hear]] the alarm at six. You [[get up]] at eight.", "tr": {"my": "မဟုတ်ဘူး။ ရှင်က ခြောက်နာရီမှာ နှိုးစက်သံ ကြားတာ။ ရှစ်နာရီမှ ထတာ။", "es": "No. Tú oyes la alarma a las seis. Te levantas a las ocho.", "vi": "Không. Sáu giờ anh nghe chuông báo thức. Tám giờ anh mới dậy.", "hi": "नहीं। तुम छह बजे अलार्म सुनते हो। उठते आठ बजे हो।"}}, {"who": "Lucas", "text": "I [[think]] in bed. It is work.", "tr": {"my": "ကျွန်တော် အိပ်ရာထဲမှာ စဉ်းစားတာ။ အဲဒါ အလုပ်ပဲ။", "es": "Pienso en la cama. Es trabajo.", "vi": "Anh nằm trên giường suy nghĩ. Đó là làm việc.", "hi": "मैं बिस्तर में सोचता हूँ। वह काम है।"}}]}, {"title": "The Neighbour", "image_note": "Emma and Lucas at the window with coffee, watching a fit older neighbour jog past in the street.", "lines": [{"who": "Emma", "text": "Mr. Tan [[runs]] every morning.", "tr": {"my": "မစ္စတာတန်က မနက်တိုင်း ပြေးတယ်။", "es": "El señor Tan corre todas las mañanas.", "vi": "Sáng nào ông Tan cũng chạy bộ.", "hi": "मिस्टर टैन हर सुबह दौड़ते हैं।"}}, {"who": "Lucas", "text": "He [[runs]]? Every morning?", "tr": {"my": "သူ ပြေးတာလား။ မနက်တိုင်းလား။", "es": "¿Corre? ¿Todas las mañanas?", "vi": "Ông ấy chạy á? Sáng nào cũng chạy?", "hi": "दौड़ते हैं? हर सुबह?"}}, {"who": "Emma", "text": "Yes. He [[runs]], he [[swims]], and he [[cooks]] dinner.", "tr": {"my": "ဟုတ်တယ်။ သူ ပြေးတယ်၊ ရေကူးတယ်၊ ညစာလည်း ချက်တယ်။", "es": "Sí. Corre, nada y prepara la cena.", "vi": "Ừ. Ông ấy chạy bộ, bơi, rồi nấu bữa tối.", "hi": "हाँ। वे दौड़ते हैं, तैरते हैं और रात का खाना बनाते हैं।"}}, {"who": "Lucas", "text": "Hmm.", "tr": {"my": "အင်း။", "es": "Mmm.", "vi": "Hừm.", "hi": "हम्म।"}}, {"who": "Emma", "text": "And he [[washes]] the dishes.", "tr": {"my": "ပန်းကန်လည်း ဆေးတယ်။", "es": "Y lava los platos.", "vi": "Và ông ấy rửa bát nữa.", "hi": "और बर्तन भी धोते हैं।"}}, {"who": "Lucas", "text": "I [[don't like]] Mr. Tan.", "tr": {"my": "ကျွန်တော် မစ္စတာတန်ကို မကြိုက်ဘူး။", "es": "No me cae bien el señor Tan.", "vi": "Anh không thích ông Tan.", "hi": "मुझे मिस्टर टैन पसंद नहीं।"}}]}, {"title": "The Diet", "image_note": "Kitchen table. Emma with a salad, looking proud; Lucas pointing at her open handbag with a chocolate bar sticking out.", "lines": [{"who": "Emma", "text": "I [[don't eat]] sugar.", "tr": {"my": "ကျွန်မ သကြား မစားဘူး။", "es": "No como azúcar.", "vi": "Em không ăn đường.", "hi": "मैं चीनी नहीं खाती।"}}, {"who": "Lucas", "text": "You [[don't eat]] sugar?", "tr": {"my": "သကြား မစားဘူးလား။", "es": "¿No comes azúcar?", "vi": "Em không ăn đường à?", "hi": "तुम चीनी नहीं खातीं?"}}, {"who": "Emma", "text": "No. I [[don't eat]] cake. I [[don't drink]] cola.", "tr": {"my": "မစားဘူး။ ကိတ်မုန့် မစားဘူး။ ကိုလာ မသောက်ဘူး။", "es": "No. No como pastel. No tomo refresco.", "vi": "Không. Em không ăn bánh ngọt. Em không uống nước ngọt.", "hi": "नहीं। मैं केक नहीं खाती। मैं कोला नहीं पीती।"}}, {"who": "Lucas", "text": "And the chocolate in your bag?", "tr": {"my": "အိတ်ထဲက ချောကလက်ကရော။", "es": "¿Y el chocolate que traes en la bolsa?", "vi": "Thế thanh sô-cô-la trong túi em thì sao?", "hi": "और तुम्हारे बैग वाली चॉकलेट?"}}, {"who": "Emma", "text": "That chocolate [[doesn't count]].", "tr": {"my": "အဲဒီ ချောကလက်ကို ထည့်မတွက်ဘူး။", "es": "Ese chocolate no cuenta.", "vi": "Sô-cô-la đó không tính.", "hi": "वह चॉकलेट नहीं गिनी जाती।"}}]}, {"title": "The Questions", "image_note": "Sofa in the evening. Lucas asking earnestly; Emma reading; a cat asleep on the armchair that is clearly Lucas's.", "lines": [{"who": "Lucas", "text": "[[Do]] you [[love]] me?", "tr": {"my": "ကျွန်တော့်ကို ချစ်လား။", "es": "¿Me quieres?", "vi": "Em có yêu anh không?", "hi": "क्या तुम मुझसे प्यार करती हो?"}}, {"who": "Emma", "text": "Yes.", "tr": {"my": "ချစ်တယ်။", "es": "Sí.", "vi": "Có.", "hi": "हाँ।"}}, {"who": "Lucas", "text": "[[Does]] your mother [[love]] me?", "tr": {"my": "မင်းအမေကရော ကျွန်တော့်ကို ချစ်လား။", "es": "¿Tu mamá me quiere?", "vi": "Mẹ em có yêu quý anh không?", "hi": "क्या तुम्हारी माँ मुझसे प्यार करती हैं?"}}, {"who": "Emma", "text": "She [[likes]] you.", "tr": {"my": "အမေက ရှင့်ကို သဘောကျတယ်။", "es": "Le caes bien.", "vi": "Mẹ thấy anh cũng được.", "hi": "वे तुम्हें पसंद करती हैं।"}}, {"who": "Lucas", "text": "[[Does]] the cat [[like]] me?", "tr": {"my": "ကြောင်ကရော ကျွန်တော့်ကို သဘောကျလား။", "es": "¿Le caigo bien a la gata?", "vi": "Con mèo có thích anh không?", "hi": "क्या बिल्ली मुझे पसंद करती है?"}}, {"who": "Emma", "text": "The cat [[likes]] your chair.", "tr": {"my": "ကြောင်က ရှင့်ကုလားထိုင်ကို သဘောကျတယ်။", "es": "A la gata le gusta tu silla.", "vi": "Con mèo thích cái ghế của anh.", "hi": "बिल्ली को तुम्हारी कुर्सी पसंद है।"}}]}], "notice": [{"q": {"my": "ဇာတ်ကွက် ၁ တွင် I နှင့် you နောက်က ကြိယာ ပြောင်းသလား။", "en": "Scene 1: does the verb change after I and you?", "es": "Escena 1: ¿cambia el verbo después de I y you?", "vi": "Cảnh 1: sau I và you, động từ có thay đổi không?", "hi": "दृश्य 1: क्या I और you के बाद क्रिया बदलती है?"}, "a": {"my": "မပြောင်းပါ။ I [[get up]]၊ you [[get up]]။", "en": "No. I [[get up]], you [[get up]].", "es": "No. I [[get up]], you [[get up]].", "vi": "Không. I [[get up]], you [[get up]].", "hi": "नहीं। I [[get up]], you [[get up]]."}}, {"q": {"my": "ဇာတ်ကွက် ၂ တွင် he နောက်က ကြိယာ၌ ဘာစာလုံး ပိုလာသလဲ။", "en": "Scene 2: what letter is added to the verb after he?", "es": "Escena 2: ¿qué letra se añade al verbo después de he?", "vi": "Cảnh 2: sau he, động từ được thêm chữ gì?", "hi": "दृश्य 2: he के बाद क्रिया में कौन सा अक्षर जुड़ता है?"}, "a": {"my": "[[-s]] ပိုလာသည် (runs, swims, cooks)။ wash တွင်မူ [[-es]] (washes)။", "en": "[[-s]]: runs, swims, cooks. With wash it is [[-es]]: washes.", "es": "[[-s]]: runs, swims, cooks. Con wash es [[-es]]: washes.", "vi": "[[-s]]: runs, swims, cooks. Với wash thì thêm [[-es]]: washes.", "hi": "[[-s]]: runs, swims, cooks. wash में [[-es]] जुड़ता है: washes."}}, {"q": {"my": "ဇာတ်ကွက် ၃ တွင် doesn't နောက်က ကြိယာ၌ -s ပါသလား။", "en": "Scene 3: is there an -s on the verb after doesn't?", "es": "Escena 3: ¿lleva -s el verbo después de doesn't?", "vi": "Cảnh 3: sau doesn't, động từ có -s không?", "hi": "दृश्य 3: क्या doesn't के बाद क्रिया में -s है?"}, "a": {"my": "မပါပါ။ doesn't [[count]]။ -s သည် doe[[s]] ထဲသို့ ရောက်သွားပြီ။", "en": "No. doesn't [[count]]. The -s has moved into doe[[s]].", "es": "No. doesn't [[count]]. La -s ya está en doe[[s]].", "vi": "Không. doesn't [[count]]. Chữ -s đã nằm trong doe[[s]] rồi.", "hi": "नहीं। doesn't [[count]]. -s अब doe[[s]] में चला गया है।"}}, {"q": {"my": "ဇာတ်ကွက် ၄ တွင် မေးခွန်းများသည် ဘာစကားလုံးဖြင့် စသလဲ။", "en": "Scene 4: which word starts each question?", "es": "Escena 4: ¿con qué palabra empieza cada pregunta?", "vi": "Cảnh 4: mỗi câu hỏi bắt đầu bằng từ nào?", "hi": "दृश्य 4: हर सवाल किस शब्द से शुरू होता है?"}, "a": {"my": "you အတွက် [[Do]]၊ your mother / the cat အတွက် [[Does]]။", "en": "[[Do]] for you. [[Does]] for your mother and the cat.", "es": "[[Do]] con you. [[Does]] con your mother y the cat.", "vi": "[[Do]] đi với you. [[Does]] đi với your mother và the cat.", "hi": "you के साथ [[Do]]. your mother और the cat के साथ [[Does]]."}}], "rule": {"points": {"my": ["နေ့တိုင်း၊ အမြဲ၊ ပုံမှန် လုပ်လေ့ရှိသော အရာများအတွက် Present Simple ကို သုံးသည်။", "I / you / we / they နောက်တွင် ကြိယာ မပြောင်းပါ။ he / she / it နောက်တွင် ကြိယာ၌ [[-s]] (သို့) [[-es]] ထည့်ရသည်။", "မြန်မာစကားတွင် ကြိယာပုံစံ မပြောင်းပါ။ အင်္ဂလိပ်တွင် ပြောင်းသည်။ ထို့ကြောင့် [[-s]] ကို မမေ့ပါနှင့်။", "အငြင်းဝါကျ − [[don't]] / [[doesn't]] + ကြိယာ မူရင်းပုံစံ (-s မပါ)။", "မေးခွန်း − [[Do]] / [[Does]] ကို ရှေ့ဆုံးတွင် ထားပြီး ကြိယာ မူရင်းပုံစံကို သုံးသည်။"], "en": ["Use the present simple for things you do every day, always or usually.", "After I / you / we / they the verb does not change. After he / she / it add [[-s]] or [[-es]].", "In many languages the verb never changes. In English it does, so remember the [[-s]].", "Negative: [[don't]] / [[doesn't]] + the basic verb (no -s).", "Question: put [[Do]] / [[Does]] first, then use the basic verb."], "es": ["Usa el present simple para lo que haces todos los días, siempre o normalmente.", "Después de I / you / we / they el verbo no cambia. Después de he / she / it añade [[-s]] o [[-es]].", "En español cambia toda la terminación (corro, corre). En inglés solo cambia con he / she / it, y por eso la [[-s]] se olvida fácilmente.", "Negación: [[don't]] / [[doesn't]] + verbo base (sin -s). No basta con poner no.", "Pregunta: [[Do]] / [[Does]] al principio y luego el verbo base. Y el sujeto siempre se dice: [[He]] runs, no solo Runs."], "vi": ["Dùng thì hiện tại đơn cho việc bạn làm hằng ngày, luôn luôn hoặc thường xuyên.", "Sau I / you / we / they, động từ giữ nguyên. Sau he / she / it, thêm [[-s]] hoặc [[-es]].", "Trong tiếng Việt động từ không bao giờ đổi dạng. Trong tiếng Anh thì có, nên đừng quên [[-s]].", "Phủ định: [[don't]] / [[doesn't]] + động từ nguyên mẫu (không có -s).", "Câu hỏi: đặt [[Do]] / [[Does]] lên đầu câu, sau đó dùng động từ nguyên mẫu."], "hi": ["जो काम आप रोज़, हमेशा या आम तौर पर करते हैं, उनके लिए present simple का प्रयोग करें।", "I / you / we / they के बाद क्रिया नहीं बदलती। he / she / it के बाद क्रिया में [[-s]] या [[-es]] जोड़ें।", "हिंदी में 'मैं रोज़ जाता हूँ' कहते हैं, पर अंग्रेज़ी में यहाँ am / is + -ing नहीं लगता: I [[go]] every day, I am going नहीं।", "नकारात्मक: [[don't]] / [[doesn't]] + क्रिया का मूल रूप (बिना -s)।", "प्रश्न: [[Do]] / [[Does]] सबसे पहले, फिर क्रिया का मूल रूप।"]}, "tables": [{"title": "Positive", "rows": [["I / you / we / they", "get up · run · wash"], ["he / she / it", "get[[s]] up · run[[s]] · wash[[es]]"]]}, {"title": "Negative", "rows": [["I / you / we / they", "[[don't]] run"], ["he / she / it", "[[doesn't]] run"]]}, {"title": "Question", "rows": [["[[Do]] I / you / we / they", "run?"], ["[[Does]] he / she / it", "run?"]]}]}, "sounds": {"intro": {"my": "[[-s]] ကို အသံသုံးမျိုး ထွက်သည်။ နှိပ်၍ နားထောင်ပါ။ စကားလုံး၏ အဆုံးသံကို မဖြုတ်ပါနှင့်။", "en": "The [[-s]] ending has three sounds. Tap to listen, and do not drop the ending.", "es": "La terminación [[-s]] tiene tres sonidos. Toca para escuchar y no te comas el final.", "vi": "Đuôi [[-s]] có ba cách đọc. Chạm để nghe, và đừng bỏ âm cuối.", "hi": "[[-s]] की तीन ध्वनियाँ होती हैं। सुनने के लिए टैप करें, और अंत की ध्वनि न छोड़ें।"}, "items": [{"word": "cooks", "ipa": "/s/"}, {"word": "likes", "ipa": "/s/"}, {"word": "runs", "ipa": "/z/"}, {"word": "swims", "ipa": "/z/"}, {"word": "washes", "ipa": "/ɪz/"}, {"word": "watches", "ipa": "/ɪz/"}]}, "mistakes": [{"langs": ["es"], "wrong": "Runs every morning.", "right": "[[He]] runs every morning.", "note": {"es": "En inglés el sujeto siempre se dice."}}, {"langs": ["es"], "wrong": "She no like coffee.", "right": "She [[doesn't]] like coffee.", "note": {"es": "No + verbo no funciona. Usa don't / doesn't."}}, {"langs": ["hi"], "wrong": "I am getting up at six every day.", "right": "I [[get up]] at six every day.", "note": {"hi": "रोज़ की आदत के लिए present simple, am + -ing नहीं।"}}, {"langs": ["vi"], "wrong": "She very like coffee.", "right": "She [[likes]] coffee [[very much]].", "note": {"vi": "Không nói very like. Dùng like ... very much, và nhớ thêm -s."}}, {"wrong": "He run every day.", "right": "He run[[s]] every day.", "note": {"my": "he / she / it နောက်တွင် -s ထည့်ပါ။", "en": "Add -s after he / she / it.", "es": "Añade -s después de he / she / it.", "vi": "Thêm -s sau he / she / it.", "hi": "he / she / it के बाद -s जोड़ें।"}}, {"wrong": "She don't like coffee.", "right": "She [[doesn't]] like coffee.", "note": {"my": "he / she / it အတွက် doesn't ကို သုံးပါ။", "en": "Use doesn't with he / she / it.", "es": "Con he / she / it se usa doesn't.", "vi": "Với he / she / it, dùng doesn't.", "hi": "he / she / it के साथ doesn't लगाएँ।"}}, {"wrong": "He doesn't likes tea.", "right": "He doesn't [[like]] tea.", "note": {"my": "doesn't နောက်တွင် -s မထည့်ရ။", "en": "No -s after doesn't.", "es": "Sin -s después de doesn't.", "vi": "Sau doesn't không thêm -s.", "hi": "doesn't के बाद -s नहीं लगता।"}}, {"wrong": "Does she likes me?", "right": "Does she [[like]] me?", "note": {"my": "Does ပါပြီးလျှင် ကြိယာတွင် -s မထည့်ရ။", "en": "With Does, the verb has no -s.", "es": "Con Does, el verbo va sin -s.", "vi": "Có Does rồi thì động từ không thêm -s.", "hi": "Does के साथ क्रिया में -s नहीं लगता।"}}, {"wrong": "You like coffee?", "right": "[[Do]] you like coffee?", "note": {"my": "မေးခွန်းတွင် Do / Does လိုသည်။ အသံကို မြှင့်ရုံနှင့် မလုံလောက်ပါ။", "en": "A question needs Do / Does. A rising voice is not enough.", "es": "La pregunta necesita Do / Does. No basta con la entonación.", "vi": "Câu hỏi cần Do / Does. Lên giọng thôi thì chưa đủ.", "hi": "प्रश्न में Do / Does चाहिए। सिर्फ़ आवाज़ ऊँची करना काफ़ी नहीं।"}}], "practice": [{"type": "choose", "items": [{"s": "Emma ___ up at six.", "options": ["get", "gets"], "answer": 1}, {"s": "I ___ in bed.", "options": ["think", "thinks"], "answer": 0}, {"s": "Mr. Tan ___ the dishes.", "options": ["wash", "washs", "washes"], "answer": 2}, {"s": "Emma and Lucas ___ coffee.", "options": ["drink", "drinks"], "answer": 0}, {"s": "The cat ___ like Lucas.", "opt let LANG = (()=>{let q=new URLSearchParams(location.search).get("lang"),s=null;
  try{s=localStorage.getItem("cl_lang")}catch(e){}
  return [q,s,L.langs[0]].find(x=>x&&L.langs.includes(x))})();
const u=k=>(UI[LANG]||UI.en)[k]||UI.en[k];
const t=o=>o==null?"":typeof o=="string"?o:(o[LANG]??o.en??"");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const mark=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="t">$1</span>');
const plain=s=>s.replace(/\[\[|\]\]/g,"");
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
const norm=s=>s.toLowerCase().replace(/[‘’]/g,"'").replace(/[.?!,]/g,"").replace(/\s+/g," ").trim();
const lc=()=>LANG!="en"?' class="my"':"";
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

/* ---------- sound: recorded clip if present, else device voice, else a timer ---------- */
let curA=null,curDone=null;
function stopSound(){if(curA){curA.pause();curA=null}try{speechSynthesis.cancel()}catch(e){}if(curDone){const d=curDone;curDone=null;d()}}
function voice(text,who,fin){const ms=900+text.length*75;
  try{if(!("speechSynthesis" in window))throw 0;const x=new SpeechSynthesisUtterance(text);x.lang="en-US";x.rate=.88;x.pitch=who=="Lucas"?.8:who=="Emma"?1.25:1;
    const t0=Date.now(),soft=()=>{const e=Date.now()-t0;e<ms*.4?setTimeout(fin,ms-e):fin()};x.onend=soft;x.onerror=soft;speechSynthesis.speak(x);setTimeout(fin,ms*2+1500)}catch(e){setTimeout(fin,ms)}}
const RECORDED=()=>!!window.GAME_CLIPS||!/pending/.test(CLIPS.ext);
function say(key,text,who){return new Promise(res=>{stopSound();let done=false;const fin=()=>{if(!done){done=true;if(curDone===fin)curDone=null;res()}};curDone=fin;
  const n=KEY[key],inside=window.GAME_CLIPS&&window.GAME_CLIPS[n];
  if(n&&(inside||!/pending/.test(CLIPS.ext))){const nn=String(n).padStart(2,"0"),a=new Audio(inside||CLIPS.local+nn+".mp3");curA=a;
    let step=inside||document.body.hasAttribute("data-offline")?1:0;   // beside the page first, then online, then the device voice
    a.onended=fin;a.onerror=()=>{if(done)return;if(step==0){step=1;a.src=CLIPS.base+nn+"."+CLIPS.ext;a.play().catch(()=>{})}else{curA=null;voice(text,who,fin)}};
    a.play().catch(()=>{});return}
  voice(text,who,fin)})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 1 scenes ---------- */
function scenes(root){const sec=el("section");sec.innerHTML=`<h2><span class="n">1</span><span${lc()}>${u("scenes")}</span></h2>`;
  const tabs=el("div","tabs"),stage=el("div","stage"),lines=el("div","lines"),row=el("div","row");
  const bPlay=el("button","pri"),bAll=el("button",null,`<span${lc()}>${u("all")}</span>`);
  const hasTr=L.scenes.some(s=>s.lines.some(l=>l.tr&&l.tr[LANG]));
  const chk=el("label","chk",`<input type="checkbox"><span${lc()}>${u("tr")}</span>`);
  let si=0,cur=-1,tok=0,playing=false;
  function setBtn(){bPlay.innerHTML=`<span${lc()}>${playing?"❚❚ "+u("pause"):"▶ "+u("play")}</span>`}
  function load(i){tok++;stopSound();playing=false;si=i;cur=-1;const s=L.scenes[i];
    [...tabs.children].forEach((b,j)=>b.classList.toggle("on",j==i));
    const im=IMG["s"+(i+1)];
    stage.innerHTML=im?`<img alt="" src="${im}">`:`<div class="ph"><b>${esc(s.title)}</b><span${lc()}>${u("image")}</span></div>`;
    lines.innerHTML="";s.lines.forEach((l,j)=>{const d=el("div","ln "+l.who,`<span class="who">${l.who}</span>${mark(l.text)}`+
      (l.tr&&l.tr[LANG]?`<span class="tr my" hidden>${esc(l.tr[LANG])}</span>`:""));
      d.onclick=()=>{tok++;playing=false;setBtn();hi(j);say(`s${i+1}_${String(j+1).padStart(2,"0")}`,plain(l.text),l.who)};lines.append(d)});
    showTr();setBtn()}
  function hi(j){cur=j;[...lines.children].forEach((d,k)=>{if(k<=j)d.classList.add("show");d.classList.toggle("cur",k==j)});
    lines.children[j].scrollIntoView({block:"nearest",behavior:"smooth"})}
  function showTr(){const on=chk.querySelector("input").checked;lines.querySelectorAll(".tr").forEach(x=>x.hidden=!on)}
  async function play(){const s=L.scenes[si],my=++tok;playing=true;setBtn();
    for(let j=cur+1>=s.lines.length?0:cur+1;j<s.lines.length;j++){if(j==0)[...lines.children].forEach(d=>d.classList.remove("show","cur"));
      hi(j);await say(`s${si+1}_${String(j+1).padStart(2,"0")}`,plain(s.lines[j].text),s.lines[j].who);if(tok!=my)return;await wait(350);if(tok!=my)return}
    playing=false;setBtn()}
  L.scenes.forEach((s,i)=>{const b=el("button",null,`${i+1}. ${esc(s.title)}`);b.onclick=()=>load(i);tabs.append(b)});
  bPlay.onclick=()=>{if(playing){tok++;stopSound();playing=false;setBtn()}else play()};
  bAll.onclick=()=>{[...lines.children].forEach(d=>d.classList.add("show"))};
  chk.querySelector("input").onchange=showTr;
  row.append(bPlay,bAll);if(hasTr)row.append(chk);
  sec.append(tabs,stage,lines,row,el("p","hint"+(LANG!="en"?" my":""),u("tap")+(RECORDED()?"":" "+u("noaudio"))));
  root.append(sec);load(0)}

/* ---------- 2 notice, 3 rule, 4 mistakes ---------- */
function notice(root){const sec=el("section",null,`<h2><span class="n">2</span><span${lc()}>${u("notice")}</span></h2>`);
  L.notice.forEach(n=>{sec.append(el("details",null,`<summary${lc()}>${mark(t(n.q))}</summary><p${lc()}>${mark(t(n.a))}</p>`))});root.append(sec)}
function rule(root){const sec=el("section",null,`<h2><span class="n">3</span><span${lc()}>${u("rule")}</span></h2>`);
  sec.append(el("ul","pts"+(LANG!="en"?" my":""),t(L.rule.points).map(p=>`<li>${mark(p)}</li>`).join("")));
  (L.rule.tables||[]).forEach(tb=>{sec.append(el("table",null,`<caption>${esc(tb.title)}</caption>`+tb.rows.map(r=>`<tr>${r.map(c=>`<td>${mark(c)}</td>`).join("")}</tr>`).join("")))});
  if(L.sounds){sec.append(el("h3",LANG!="en"?"my":"",u("sounds")),el("p","hint"+(LANG!="en"?" my":""),mark(t(L.sounds.intro))));
    const box=el("div","snd");L.sounds.items.forEach(w=>{const b=el("button",null,`<b>${esc(w.word)}</b><small>${esc(w.ipa)}</small>`);b.onclick=()=>say("w_"+slug(w.word),w.word);box.append(b)});sec.append(box)}
  root.append(sec)}
function mistakes(root){const sec=el("section",null,`<h2><span class="n">4</span><span${lc()}>${u("mistakes")}</span></h2>`);
  L.mistakes.filter(m=>!m.langs||m.langs.includes(LANG)).forEach(m=>sec.append(el("div","mis",`<div class="w">✗ ${esc(m.wrong)}</div><div class="r">✓ ${mark(m.right)}</div><div class="note${LANG!="en"?" my":""}">${mark(t(m.note))}</div>`)));root.append(sec)}

/* ---------- 5 practice, 7 quiz ---------- */
function pick(box,items,options,onFirst){items.forEach((q,qi)=>{const it=el("div","it"),ops=el("div","opts");let tried=false;
  const s=el("div","s");
  if(q.say){const b=el("button",null,"▶ "+`<span${lc()}>${u("listen")}</span>`);b.onclick=()=>say("w_"+slug(q.say),q.say);s.append(b)}
  else s.innerHTML=`${qi+1}. `+esc(q.s).replace("___",'<span class="blank">&nbsp;</span>');
  (q.options||options).forEach((o,oi)=>{const b=el("button",null,esc(o));b.onclick=()=>{const good=oi==q.answer;if(!tried&&onFirst)onFirst(good);tried=true;
    if(good){b.classList.add("good");const bl=s.querySelector(".blank");if(bl&&q.options)bl.textContent=o;ops.querySelectorAll("button").forEach(x=>x.disabled=true)}
    else{b.classList.add("wrong");b.disabled=true;if(onFirst){ops.querySelectorAll("button").forEach((x,k)=>{x.disabled=true;if(k==q.answer)x.classList.add("good")})}}};ops.append(b)});
  it.append(s,ops);box.append(it)})}
function typed(box,items,fix){items.forEach((q,qi)=>{const it=el("div","it");
  it.innerHTML=`<div class="s">${qi+1}. ${fix?`<span class="bad">✗ ${esc(q.s)}</span>`:esc(q.s).replace("___",'<span class="blank">&nbsp;</span>')}</div>
   <div class="inrow"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="pri"><span${lc()}>${u("check")}</span></button></div><div class="fb${LANG!="en"?" my":""}"></div>`;
  const inp=it.querySelector("input"),fb=it.querySelector(".fb");let n=0;
  const go=()=>{if(!inp.value.trim())return;const good=q.answers.some(a=>norm(a)==norm(inp.value));n++;inp.className=good?"good":"wrong";
    fb.className="fb "+(good?"good":"wrong")+(LANG!="en"?" my":"");fb.textContent=good?u("ok"):u("no")+(n>=2?"  "+u("ans")+q.answers[0]:"")};
  it.querySelector("button").onclick=go;inp.onkeydown=e=>{if(e.key=="Enter")go()};box.append(it)})}
function practice(root){const sec=el("section",null,`<h2><span class="n">5</span><span${lc()}>${u("practice")}</span></h2>`);
  L.practice.forEach(p=>{sec.append(el("h3",LANG!="en"?"my":"",mark(p.prompt?t(p.prompt):u(p.type))));const box=el("div");
    if(p.type=="choose"||p.type=="hear")pick(box,p.items);else if(p.type=="sort")pick(box,p.items,p.labels);else typed(box,p.items,p.type=="fix");sec.append(box)});root.append(sec)}
function speak(root){const sec=el("section",null,`<h2><span class="n">6</span><span${lc()}>${u("speak")}</span></h2><p class="hint${LANG!="en"?" my":""}">${u("speakhint")}</p>`);
  L.speak.forEach((s,i)=>{const d=el("div","spk",`<button aria-label="play">▶</button><span>${mark(s)}</span>`);d.querySelector("button").onclick=()=>say("p_"+String(i+1).padStart(2,"0"),plain(s));sec.append(d)});root.append(sec)}
function quiz(root){const sec=el("section",null,`<h2><span class="n">7</span><span${lc()}>${u("quiz")}</span></h2>`);const box=el("div"),sc=el("p","score");let good=0,done=0;
  const show=()=>sc.innerHTML=`<span${lc()}>${u("score")}</span>: ${good} / ${L.quiz.length}`+(done==L.quiz.length?(good==L.quiz.length?" 🎉":""):"");
  const again=el("button",null,`<span${lc()}>${u("again")}</span>`);again.onclick=()=>{good=done=0;box.innerHTML="";pick(box,L.quiz,null,g=>{done++;if(g)good++;show()});show()};
  pick(box,L.quiz,null,g=>{done++;if(g)good++;show()});show();sec.append(box,sc,again);root.append(sec)}

function render(){stopSound();document.body.dataset.l=LANG;const app=document.getElementById("app");app.innerHTML="";
  document.getElementById("code").textContent=L.code.toUpperCase();document.getElementById("title").textContent=L.title;
  app.append(el("p","sub"+(LANG!="en"?" my":""),esc(t(L.subtitle))+" · "+esc(L.level)));
  const dl=el("a","dl"+(LANG!="en"?" my":""),"&#11015; "+esc(u("dl")));dl.href=CLIPS.single||"#";dl.download=CLIPS.file||"";dl.hidden=!HASDL;app.append(dl);
  scenes(app);notice(app);rule(app);mistakes(app);practice(app);speak(app);quiz(app);
  document.getElementById("foot").textContent=`${L.code.toUpperCase()} · ${L.title} · curiouslingua.com/${L.code.toLowerCase()}`}
/* Download button: shown only online, and only once the one-file copy is really there */
let HASDL=false;
if(CLIPS.single&&location.protocol!="file:"&&!document.body.hasAttribute("data-offline"))
  fetch(CLIPS.single,{method:"HEAD"}).then(r=>{if(r.ok){HASDL=true;document.querySelectorAll("a.dl").forEach(a=>a.hidden=false)}}).catch(()=>{});
const sel=document.getElementById("lang");L.langs.forEach(c=>{const o=el("option",null,LANGNAME[c]||c);o.value=c;sel.append(o)});sel.value=LANG;
sel.onchange=()=>{LANG=sel.value;try{localStorage.setItem("cl_lang",LANG)}catch(e){}render()};
render();
</script>
