<script>window.ROOT="../../";window.MEDIA_BASE="https://languages.rmlives.com/";window.LESSON={"title":"The Beavers: Nature's Engineers","level":"a2","level_provisional":true,"strand":"reading","topic":"Science and nature","type":"reader","img_dir":"img/ytstory/s1.9_beavers/","img_ext":"jpg","aud_dir":"eng/yt/s1.9_beavers/","aud_ext":"mp3","pages":[{"img":1,"sentences":[[["Deep in a beautiful forest,",1],["a family of beavers lives",2],["beside a little stream.",3]],[["Beavers have strong teeth,",4],["brown fur,",5],["and wide, flat tails.",6]],[["They are excellent swimmers!",7]],[["But beavers can do something",8],["even more amazing.",9]],[["They can build dams",10],["and change the flow of water!",11]]]},{"img":2,"sentences":[[["Look at that busy beaver!",12]],[["It is chewing a tree",13],["with its strong front teeth.",14]],[["Crunch! Crunch! Crunch!",15]],[["Beavers use their teeth",16],["to cut down small trees and branches.",17]],[["They carry the wood to the water.",18]],[["What hardworking animals!",19]]]},{"img":3,"sentences":[[["The beavers are building something",20],["across the stream.",21]],[["They put branches and sticks",22],["into the water.",23]],[["Then they add mud, stones,",24],["and more wood.",25]],[["Little by little,",26],["a strong dam begins to form.",27]],[["The dam slows the flowing water.",28]],[["What clever builders!",29]]]},{"img":4,"sentences":[[["Look! Something amazing is happening!",30]],[["The water behind the dam",31],["is getting deeper.",32]],[["Slowly,",33],["a pond begins to form.",34]],[["The beavers can swim safely",35],["around their new home.",36]],[["Deep water helps protect them",37],["from animals that might hurt them.",38]],[["The beavers have changed their little stream!",39]]]},{"img":5,"sentences":[[["Now the beavers need",40],["a safe place to live.",41]],[["They build a home called a lodge.",42]],[["The lodge is made of sticks,",43],["branches, and mud.",44]],[["But where is the door?",45]],[["Surprise! The entrance is underwater!",46]],[["Inside, the beavers have",47],["a warm, dry room",48],["above the water.",49]]]},{"img":6,"sentences":[[["Inside the lodge,",50],["the baby beavers are resting.",51]],[["Baby beavers are called kits.",52]],[["Their parents keep them safe and warm.",53]],[["When the kits grow bigger,",54],["they learn to swim",55],["and help their family.",56]],[["The beavers also collect branches",57],["and other plants to eat.",58]],[["Their home is a busy, happy place!",59]]]},{"img":7,"sentences":[[["The beavers have made a beautiful pond.",60]],[["But look!",61],["They are not the only animals enjoying it.",62]],[["Fish swim in the water.",63]],[["Frogs rest near the pond.",64]],[["Ducks and other birds visit too.",65]],[["The beavers have created a home",66],["for many living things!",67]]]},{"img":8,"sentences":[[["Now we know why beavers are special!",68]],[["They cut wood with their strong teeth.",69]],[["They build dams that slow the water.",70]],[["They make safe homes",71],["with underwater entrances.",72]],[["And their ponds help many other animals.",73]],[["These remarkable builders",74],["are called nature's engineers!",75]]]}],"course":"eng","slug":"s1.9_beavers"};</script>
