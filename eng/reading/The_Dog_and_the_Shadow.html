ုချင်တယ်!\""],"sentences":[[["The dog did not know that.",25]],[["\"That bone looks bigger",26],["than mine!\"",27],["he thought.",28]],[["\"I want that bone, too!\"",29]]]},{"img":6,"tr":["သူသည် အခြားခွေးကို ဟောင်ရန် ပါးစပ်ကို ဟလိုက်ပါသည်။","\"ဝုတ်!\"","ပလုံ! သူ့ပါးစပ်ထဲမှ အရိုးသည် ချောင်းထဲသို့ ပြုတ်ကျသွားပါသည်။"],"sentences":[[["He opened his mouth",30],["to bark at the other dog.",31]],[["\"WOOF!\"",32]],[["Plop!",33],["His own bone fell",34],["into the stream.",35]]]},{"img":7,"tr":["အရိုးသည် ရေအောက်သို့ နစ်မြုပ်သွားသည်ကို ခွေးလေးက ဝမ်းနည်းစွာ ကြည့်နေပါသည်။","သူသည် အခြားခွေးကို လိုက်ရှာကြည့်သော်လည်း ထိုခွေးလည်း ပျောက်ကွယ်သွားခဲ့ပါသည်။","ယခုတော့ သူ့ထံတွင် အရိုးတစ်ချောင်းမှ မကျန်တော့ပါ။"],"sentences":[[["The dog watched sadly",36],["as the bone sank",37],["beneath the water.",38]],[["He looked for the other dog,",39],["but it had disappeared, too.",40]],[["Now he had no bone at all.",41]]]},{"img":8,"tr":["နောက်ဆုံးတွင် ခွေးလေးသည် မိမိ၏ မိုက်မဲသောအမှားကို နားလည်သွားပါသည်။","အခြားအရိုးတစ်ချောင်းကို လိုချင်စိတ်ကြောင့် မိမိပိုင်အရိုးကိုပင် ဆုံးရှုံးခဲ့ရပါသည်။","သင်ခန်းစာ","သင့်မှာ ရှိပြီးသားအရာကို ကျေနပ်တတ်ပါ။"],"sentences":[[["At last,",42],["the dog understood",43],["his foolish mistake.",44]],[["He had lost his own bone",45],["because he wanted another.",46]],[["Moral:",47]],[["Be happy with what you have.",48]]]}],"course":"eng","slug":"The_Dog_and_the_Shadow"};</script>
